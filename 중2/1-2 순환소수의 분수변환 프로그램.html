<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>순환소수 분수 변환 실험실</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .text-emphasis-dot {
            -webkit-text-emphasis: dot;
            text-emphasis: dot;
        }
        /* 슬라이더 크기 조정 */
        input[type=range] {
            height: 12px;
        }
        input[type=range]::-webkit-slider-thumb {
            width: 24px;
            height: 24px;
        }
    </style>
</head>
<body class="min-h-screen bg-gray-50 p-2 lg:p-4 font-sans text-gray-800 flex items-center justify-center">
    <!-- max-w를 매우 크게 설정하고 화면의 대부분을 차지하도록 min-h 설정 -->
    <div class="max-w-[1800px] w-full mx-auto h-full min-h-[90vh]">
        
        <!-- 좌우 분할 그리드 (12등분하여 5:7 비율로 왼쪽을 줄이고 오른쪽을 늘림) -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 xl:gap-6 h-full min-h-[90vh] items-stretch">
            
            <!-- 왼쪽 영역 (1단계, 2단계) - 5칸 차지 -->
            <div class="lg:col-span-5 space-y-4 flex flex-col h-full min-w-0">
                <!-- 1단계: 순환소수 입력 영역 -->
                <div class="bg-white p-4 xl:p-6 rounded-3xl shadow-sm border border-gray-100 flex flex-col justify-center">
                    <h2 class="text-xl xl:text-2xl font-bold mb-4 flex items-center">
                        <span class="bg-blue-100 text-blue-600 w-10 h-10 flex items-center justify-center rounded-full mr-3 text-lg shrink-0">1</span>
                        순환소수 만들기 (x)
                    </h2>
                    <div class="flex flex-col md:flex-row items-center justify-center space-y-4 md:space-y-0 md:space-x-2 xl:space-x-4 bg-gray-50 p-4 xl:p-6 rounded-2xl border border-gray-100 min-w-0">
                        <div class="flex flex-col items-center">
                            <label class="text-sm xl:text-lg text-gray-500 mb-1 font-bold">정수 부분</label>
                            <input type="text" id="intPart" value="1" class="w-20 xl:w-28 text-center text-3xl xl:text-4xl p-2 xl:p-3 border-2 border-gray-200 rounded-xl focus:border-blue-400 focus:outline-none shadow-inner" placeholder="0">
                        </div>
                        <div class="text-4xl xl:text-5xl font-bold text-gray-400 mt-4 md:mt-8">.</div>
                        <div class="flex flex-col items-center">
                            <label class="text-sm xl:text-lg text-gray-500 mb-1 font-bold whitespace-nowrap">순환 안하는 곳</label>
                            <input type="text" id="nonRepPart" value="2" class="w-24 xl:w-36 text-center text-3xl xl:text-4xl p-2 xl:p-3 border-2 border-gray-200 rounded-xl focus:border-blue-400 focus:outline-none shadow-inner" placeholder="">
                        </div>
                        <div class="flex flex-col items-center">
                            <label class="text-sm xl:text-lg text-blue-600 mb-1 font-bold whitespace-nowrap">순환하는 곳</label>
                            <input type="text" id="repPart" value="34" class="w-24 xl:w-36 text-center text-3xl xl:text-4xl p-2 xl:p-3 border-2 border-blue-300 bg-blue-50 rounded-xl focus:border-blue-500 focus:outline-none shadow-inner" placeholder="0">
                        </div>
                    </div>
                    <div class="mt-4 text-center text-2xl xl:text-3xl font-mono truncate w-full">
                        <span class="text-gray-500">x = </span>
                        <span id="displayInt" class="font-bold">1</span><span class="font-bold">.</span><!--
                        --><span id="displayNonRep" class="font-bold">2</span><!--
                        --><span id="displayRep" class="text-blue-600 text-emphasis-dot font-bold">34</span>
                        <span class="text-gray-400 text-lg xl:text-xl ml-2 xl:ml-4 tracking-widest hidden sm:inline" id="displayFull">(1.23434...)</span>
                    </div>
                </div>

                <!-- 2단계: 거듭제곱 곱하기 영역 -->
                <div class="bg-white p-4 xl:p-6 rounded-3xl shadow-sm border border-gray-100 flex-1 flex flex-col justify-center min-w-0">
                    <h2 class="text-xl xl:text-2xl font-bold mb-4 flex items-center">
                        <span class="bg-green-100 text-green-600 w-10 h-10 flex items-center justify-center rounded-full mr-3 text-lg shrink-0">2</span>
                        10의 거듭제곱 곱해서 소수점 이동
                    </h2>
                    
                    <div class="grid grid-cols-1 gap-4 flex-1">
                        <!-- 식 1 -->
                        <div class="border-2 border-gray-100 rounded-2xl p-4 bg-gray-50 flex flex-col justify-center min-w-0">
                            <div class="flex justify-between items-center mb-3">
                                <span class="text-lg font-bold text-gray-700">식 ①</span>
                                <span class="text-base bg-white px-3 py-1 rounded-full border shadow-sm shrink-0">10의 <span id="power1Display" class="font-bold text-green-600 text-xl ml-1">3</span>제곱</span>
                            </div>
                            <input type="range" id="power1" min="0" max="8" value="3" class="w-full accent-green-500 mb-4 cursor-pointer">
                            <div class="flex font-mono text-lg xl:text-xl justify-center items-end bg-white p-3 xl:p-4 rounded-xl border border-gray-200 shadow-inner overflow-hidden w-full">
                                <div class="text-right whitespace-nowrap text-gray-500 mr-2 shrink-0">10<sup id="p1Sup" class="text-sm">3</sup> x</div>
                                <div class="text-right w-4 mr-2 shrink-0">=</div>
                                <div class="text-right font-bold text-gray-800 truncate max-w-[30%]" id="eq1Int">1234</div>
                                <div class="text-red-500 font-bold mx-1 shrink-0">.</div>
                                <div class="text-left text-blue-600 tracking-widest truncate flex-1">
                                    <span id="eq1Dec">343434343434343</span><span class="text-gray-400">...</span>
                                </div>
                            </div>
                        </div>

                        <!-- 식 2 -->
                        <div class="border-2 border-gray-100 rounded-2xl p-4 bg-gray-50 flex flex-col justify-center min-w-0">
                            <div class="flex justify-between items-center mb-3">
                                <span class="text-lg font-bold text-gray-700">식 ②</span>
                                <span class="text-base bg-white px-3 py-1 rounded-full border shadow-sm shrink-0">10의 <span id="power2Display" class="font-bold text-green-600 text-xl ml-1">1</span>제곱</span>
                            </div>
                            <input type="range" id="power2" min="0" max="8" value="1" class="w-full accent-green-500 mb-4 cursor-pointer">
                            <div class="flex font-mono text-lg xl:text-xl justify-center items-end bg-white p-3 xl:p-4 rounded-xl border border-gray-200 shadow-inner overflow-hidden w-full">
                                <div class="text-right whitespace-nowrap text-gray-500 mr-2 shrink-0">10<sup id="p2Sup" class="text-sm">1</sup> x</div>
                                <div class="text-right w-4 mr-2 shrink-0">=</div>
                                <div class="text-right font-bold text-gray-800 truncate max-w-[30%]" id="eq2Int">12</div>
                                <div class="text-red-500 font-bold mx-1 shrink-0">.</div>
                                <div class="text-left text-blue-600 tracking-widest truncate flex-1">
                                    <span id="eq2Dec">343434343434343</span><span class="text-gray-400">...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 오른쪽 영역 (3단계) - 7칸 차지 -->
            <div id="resultContainer" class="lg:col-span-7 p-4 xl:p-6 rounded-3xl shadow-sm border bg-white h-full flex flex-col min-w-0">
                <h2 class="text-xl xl:text-2xl font-bold mb-4 flex items-center shrink-0">
                    <span id="resultStepNumber" class="w-10 h-10 flex items-center justify-center rounded-full mr-3 text-lg text-white bg-blue-500 shrink-0">3</span>
                    두 식 빼기 (식 ① - 식 ②)
                </h2>
                <div id="resultContent" class="flex-1 flex flex-col justify-center min-w-0 w-full">
                    <!-- 결과가 여기에 동적으로 렌더링됩니다 -->
                </div>
            </div>

        </div>
    </div>

    <script>
        // DOM 요소 가져오기
        const els = {
            intPart: document.getElementById('intPart'),
            nonRepPart: document.getElementById('nonRepPart'),
            repPart: document.getElementById('repPart'),
            displayInt: document.getElementById('displayInt'),
            displayNonRep: document.getElementById('displayNonRep'),
            displayRep: document.getElementById('displayRep'),
            displayFull: document.getElementById('displayFull'),
            
            power1: document.getElementById('power1'),
            power1Display: document.getElementById('power1Display'),
            p1Sup: document.getElementById('p1Sup'),
            eq1Int: document.getElementById('eq1Int'),
            eq1Dec: document.getElementById('eq1Dec'),
            
            power2: document.getElementById('power2'),
            power2Display: document.getElementById('power2Display'),
            p2Sup: document.getElementById('p2Sup'),
            eq2Int: document.getElementById('eq2Int'),
            eq2Dec: document.getElementById('eq2Dec'),

            resultContainer: document.getElementById('resultContainer'),
            resultStepNumber: document.getElementById('resultStepNumber'),
            resultContent: document.getElementById('resultContent')
        };

        // 입력값 숫자만 허용 필터링
        function filterNumber(e) {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
            update();
        }
        els.intPart.addEventListener('input', filterNumber);
        els.nonRepPart.addEventListener('input', filterNumber);
        els.repPart.addEventListener('input', filterNumber);
        
        els.power1.addEventListener('input', update);
        els.power2.addEventListener('input', update);

        // 최대공약수 함수
        function getGcd(a, b) {
            let bigA = a < 0n ? -a : a;
            let bigB = b < 0n ? -b : b;
            while (bigB !== 0n) {
                let temp = bigB;
                bigB = bigA % bigB;
                bigA = temp;
            }
            return bigA;
        }

        // 부분 분리 계산
        function getMultipliedParts(intP, nonRepP, repP, power) {
            const safeInt = intP || '0';
            const safeNonRep = nonRepP || '';
            const safeRep = repP || '0';
            
            // 넉넉한 길이의 문자열 생성
            const infiniteString = safeInt + safeNonRep + safeRep.repeat(30);
            const pointIndex = safeInt.length + power;
            
            let newIntStr = infiniteString.substring(0, pointIndex);
            let newDecStr = infiniteString.substring(pointIndex, pointIndex + 15);

            newIntStr = newIntStr.replace(/^0+/, '');
            if (newIntStr === '') newIntStr = '0';

            return { newIntStr, newDecStr };
        }

        function update() {
            const intP = els.intPart.value;
            const nonRepP = els.nonRepPart.value;
            const repP = els.repPart.value;
            const p1 = parseInt(els.power1.value);
            const p2 = parseInt(els.power2.value);

            // 입력 디스플레이 업데이트
            els.displayInt.textContent = intP || '0';
            els.displayNonRep.textContent = nonRepP;
            els.displayRep.textContent = repP || '0';
            els.displayFull.textContent = `(${intP || '0'}.${nonRepP}${repP}${repP}...)`;

            // 식 1, 식 2 거듭제곱 텍스트 업데이트
            els.power1Display.textContent = p1;
            els.p1Sup.textContent = p1;
            els.power2Display.textContent = p2;
            els.p2Sup.textContent = p2;

            // 문자열 계산
            const eq1 = getMultipliedParts(intP, nonRepP, repP, p1);
            const eq2 = getMultipliedParts(intP, nonRepP, repP, p2);

            els.eq1Int.textContent = eq1.newIntStr;
            els.eq1Dec.textContent = eq1.newDecStr;
            els.eq2Int.textContent = eq2.newIntStr;
            els.eq2Dec.textContent = eq2.newDecStr;

            const isMatch = (eq1.newDecStr === eq2.newDecStr) && (repP !== '');

            // 컨테이너 색상 업데이트 (lg:col-span-7 클래스 유지)
            if (isMatch && repP !== '') {
                els.resultContainer.className = 'lg:col-span-7 h-full flex flex-col p-4 xl:p-6 rounded-3xl shadow-lg border-2 bg-blue-50 border-blue-200 transition-all min-w-0';
                els.resultStepNumber.className = 'w-10 h-10 flex items-center justify-center rounded-full mr-3 text-lg text-white bg-blue-500 shrink-0';
            } else {
                els.resultContainer.className = 'lg:col-span-7 h-full flex flex-col p-4 xl:p-6 rounded-3xl shadow-sm border-2 bg-red-50 border-red-200 transition-all min-w-0';
                els.resultStepNumber.className = 'w-10 h-10 flex items-center justify-center rounded-full mr-3 text-lg text-white bg-red-500 shrink-0';
            }

            // 결과 영역 렌더링
            renderResult(intP, nonRepP, repP, p1, p2, eq1, eq2, isMatch);
        }

        function renderResult(intP, nonRepP, repP, p1, p2, eq1, eq2, isMatch) {
            if (repP === '') {
                els.resultContent.innerHTML = `<div class="text-center p-6 text-xl text-gray-500 bg-white rounded-2xl w-full">순환하는 부분에 숫자를 입력해주세요.</div>`;
                return;
            }

            if (p1 === p2) {
                els.resultContent.innerHTML = `<div class="text-center p-6 text-xl text-gray-500 bg-white rounded-2xl border border-gray-100 shadow-sm leading-relaxed w-full">두 식의 거듭제곱이 똑같아서 빼면 0이 됩니다. <br/><br/>슬라이더를 움직여 다른 거듭제곱을 선택해주세요.</div>`;
                return;
            }

            // 뺄셈 실제 계산 로직 (소수점 아래 15자리 기준)
            const val1Str = eq1.newIntStr + eq1.newDecStr;
            const val2Str = eq2.newIntStr + eq2.newDecStr;
            
            const bigVal1 = BigInt(val1Str);
            const bigVal2 = BigInt(val2Str);
            const diff = bigVal1 - bigVal2;
            
            // 음수 처리
            const isNegative = diff < 0n;
            let diffStr = (isNegative ? -diff : diff).toString().padStart(16, '0');
            
            // 정수부분과 소수부분 나누기
            let diffInt = diffStr.slice(0, -15);
            let diffDec = diffStr.slice(-15);
            if (isNegative) diffInt = "-" + diffInt;

            const lhs = BigInt(BigInt(10) ** BigInt(p1)) - BigInt(BigInt(10) ** BigInt(p2));

            // 기본 수식 HTML (크기 조정 및 여백 축소)
            let mathHtml = `
                <div class="flex border-b-4 border-gray-800 pb-4 relative text-xl xl:text-3xl w-full min-w-0">
                   <div class="absolute -left-8 xl:-left-10 top-4 xl:top-6 text-2xl xl:text-3xl font-bold">- )</div>
                   <div class="w-full min-w-0">
                     <div class="flex justify-between w-full mb-2 min-w-0">
                       <div class="text-right w-1/4 shrink-0 truncate">10<sup class="text-lg xl:text-xl">${p1}</sup> x</div>
                       <div class="w-10 text-center shrink-0">=</div>
                       <div class="text-right w-1/3 pr-4 xl:pr-6 truncate" title="${eq1.newIntStr}">${eq1.newIntStr}</div>
                       <div class="text-left w-1/3 text-gray-400 tracking-widest truncate" title=".${eq1.newDecStr}...">.${eq1.newDecStr}...</div>
                     </div>
                     <div class="flex justify-between w-full min-w-0">
                       <div class="text-right w-1/4 shrink-0 truncate">10<sup class="text-lg xl:text-xl">${p2}</sup> x</div>
                       <div class="w-10 text-center shrink-0">=</div>
                       <div class="text-right w-1/3 pr-4 xl:pr-6 truncate" title="${eq2.newIntStr}">${eq2.newIntStr}</div>
                       <div class="text-left w-1/3 text-gray-400 tracking-widest truncate" title=".${eq2.newDecStr}...">.${eq2.newDecStr}...</div>
                     </div>
                   </div>
                </div>
                <div class="flex justify-between w-full pt-4 font-bold text-xl xl:text-3xl ${isMatch ? 'text-blue-700' : 'text-red-600'} min-w-0">
                   <div class="text-right w-1/4 shrink-0 truncate" title="${lhs} x">${lhs} x</div>
                   <div class="w-10 text-center shrink-0">=</div>
                   <div class="text-right w-1/3 pr-4 xl:pr-6 truncate" title="${diffInt}">${diffInt}</div>
                   <div class="text-left w-1/3 tracking-widest truncate ${isMatch ? 'text-green-500' : 'text-red-500'}" title=".${diffDec}...">.${diffDec}...</div>
                </div>
            `;

            if (!isMatch) {
                els.resultContent.innerHTML = `
                    <div class="bg-white p-6 xl:p-8 rounded-2xl border-2 border-red-100 shadow-sm h-full flex flex-col justify-center min-w-0">
                        <p class="text-red-500 font-bold text-xl xl:text-2xl text-center mb-6 shrink-0">🚫 소수점 아래가 달라 정수가 안 됩니다!</p>
                        <div class="max-w-3xl mx-auto font-mono mb-6 w-full min-w-0">
                            ${mathHtml}
                        </div>
                        <div class="text-center bg-red-50 p-4 xl:p-6 rounded-2xl text-red-700 font-bold text-lg xl:text-xl leading-relaxed shrink-0 max-w-full">
                            결과가 <span class="bg-white px-2 py-1 rounded-lg border-2 text-red-500 inline-block max-w-[80%] align-bottom truncate" title="${diffInt}.${diffDec}...">${diffInt}.${diffDec}...</span> 처럼 <br/>
                            소수점 아래가 0이 되지 않아 분수로 만들 수 없습니다.<br/>
                            <span class="text-gray-600 font-normal mt-3 inline-block text-base xl:text-lg">슬라이더를 움직여 두 식의 소수 부분이 똑같아지도록 맞춰보세요!</span>
                        </div>
                    </div>
                `;
            } else {
                // 일치할 경우 분수 약분 계산
                const gcdVal = getGcd(BigInt(diffInt), lhs);
                const simNum = BigInt(diffInt) / gcdVal;
                const simDen = lhs / gcdVal;

                els.resultContent.innerHTML = `
                    <div class="bg-white p-6 xl:p-8 rounded-2xl border-2 border-blue-100 shadow-sm h-full flex flex-col justify-center min-w-0">
                        <p class="text-blue-600 font-bold text-xl xl:text-2xl text-center mb-6 shrink-0">✨ 소수점 아래가 완벽히 일치합니다!</p>
                        <div class="max-w-3xl mx-auto space-y-6 font-mono w-full min-w-0">
                            ${mathHtml}
                            
                            <!-- 최종 분수 -->
                            <div class="flex items-center justify-center pt-6 text-3xl xl:text-4xl font-sans text-gray-800 w-full min-w-0">
                                <div class="mr-4 xl:mr-6 font-bold shrink-0">x =</div>
                                <div class="flex flex-col items-center min-w-0 max-w-[35%] flex-1">
                                    <div class="border-b-4 border-gray-800 px-4 xl:px-6 pb-2 font-bold w-full text-center truncate" title="${diffInt}">${diffInt}</div>
                                    <div class="px-4 xl:px-6 pt-2 font-bold w-full text-center truncate" title="${lhs}">${lhs}</div>
                                </div>
                                
                                ${ (lhs !== simDen || BigInt(diffInt) !== simNum) ? `
                                    <div class="mx-4 xl:mx-6 text-gray-400 shrink-0">=</div>
                                    <div class="flex flex-col items-center text-blue-600 font-bold min-w-0 max-w-[35%] flex-1">
                                        <div class="border-b-4 border-blue-600 px-4 xl:px-6 pb-2 w-full text-center truncate" title="${simNum}">${simNum}</div>
                                        <div class="px-4 xl:px-6 pt-2 w-full text-center truncate" title="${simDen}">${simDen}</div>
                                    </div>
                                    <div class="ml-4 xl:ml-6 text-base xl:text-xl text-gray-500 font-normal shrink-0">(약분)</div>
                                ` : '' }
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        // 초기화
        update();
    </script>
</body>
</html>
