<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초성 서바이벌 - 무제한 버전</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        body { font-family: 'Jua', sans-serif; background-color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .game-container { width: 100%; max-width: 800px; height: 90vh; background: white; border-radius: 1.5rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .eliminated { background-color: #4b5563 !important; opacity: 0.6; position: relative; }
        .eliminated::after { content: "OUT"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-15deg); color: #ef4444; font-size: 1.5rem; border: 3px solid #ef4444; padding: 2px 8px; border-radius: 6px; background: rgba(255,255,255,0.9); z-index: 20; }
        .active-team { background-color: #4338ca !important; border: 3px solid #facc15 !important; transform: scale(1.05); z-index: 10; }
        .chat-scroll::-webkit-scrollbar { width: 4px; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="p-4">
    <div class="game-container">
        <div class="bg-indigo-800 p-4 text-white">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-2">
                    <span id="round-tag" class="bg-yellow-400 text-indigo-900 px-3 py-0.5 rounded-full text-sm font-black">ROUND 1</span>
                    <h1 class="text-xl font-bold">초성 서바이벌</h1>
                </div>
                <div class="flex gap-2">
                    <button onclick="togglePause()" id="pause-btn" class="text-xs bg-orange-500 hover:bg-orange-600 px-3 py-1 rounded font-bold transition">일시정지</button>
                    <button onclick="resetGame()" class="text-xs bg-red-500 hover:bg-red-600 px-3 py-1 rounded font-bold transition">전체 리셋</button>
                </div>
            </div>
            <div id="team-grid" class="grid grid-cols-3 md:grid-cols-6 gap-2">
                <div id="team-A" class="bg-indigo-900 p-2 rounded-lg text-center border-2 border-transparent transition-all"><div class="text-[10px] opacity-60">TEAM A</div><div class="status-label text-sm font-bold text-green-400">ALIVE</div></div>
                <div id="team-B" class="bg-indigo-900 p-2 rounded-lg text-center border-2 border-transparent transition-all"><div class="text-[10px] opacity-60">TEAM B</div><div class="status-label text-sm font-bold text-green-400">ALIVE</div></div>
                <div id="team-C" class="bg-indigo-900 p-2 rounded-lg text-center border-2 border-transparent transition-all"><div class="text-[10px] opacity-60">TEAM C</div><div class="status-label text-sm font-bold text-green-400">ALIVE</div></div>
                <div id="team-D" class="bg-indigo-900 p-2 rounded-lg text-center border-2 border-transparent transition-all"><div class="text-[10px] opacity-60">TEAM D</div><div class="status-label text-sm font-bold text-green-400">ALIVE</div></div>
                <div id="team-E" class="bg-indigo-900 p-2 rounded-lg text-center border-2 border-transparent transition-all"><div class="text-[10px] opacity-60">TEAM E</div><div class="status-label text-sm font-bold text-green-400">ALIVE</div></div>
                <div id="team-F" class="bg-indigo-900 p-2 rounded-lg text-center border-2 border-transparent transition-all"><div class="text-[10px] opacity-60">TEAM F</div><div class="status-label text-sm font-bold text-green-400">ALIVE</div></div>
            </div>
        </div>

        <div class="flex-1 flex flex-col p-4 space-y-4 overflow-hidden bg-slate-50">
            <div class="bg-white rounded-2xl p-6 text-center shadow-sm border border-slate-200 relative overflow-hidden">
                <div id="timer-progress" class="absolute top-0 left-0 h-1.5 bg-red-500 transition-all duration-1000 ease-linear" style="width: 100%"></div>
                <p class="text-slate-400 text-xs mb-1">제시된 초성</p>
                <div id="display-chosung" class="text-6xl md:text-8xl font-black text-slate-800 tracking-tighter mb-2">??</div>
                <div id="display-timer" class="text-red-500 text-lg font-bold">10초 남음</div>
            </div>
            <div id="turn-info" class="bg-indigo-100 text-indigo-800 py-3 rounded-xl text-center text-xl font-black border-b-4 border-indigo-200">단어를 입력하세요!</div>
            <div id="log-box" class="chat-scroll flex-1 overflow-y-auto space-y-2 p-2 text-sm"></div>
        </div>

        <div class="p-4 bg-white border-t">
            <form id="input-form" class="flex gap-2">
                <input type="text" id="word-input" placeholder="초성에 맞는 단어 입력..." class="flex-1 bg-slate-100 border-2 border-transparent focus:border-indigo-500 focus:bg-white px-4 py-3 rounded-2xl outline-none text-lg transition-all" autocomplete="off">
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-2xl font-bold transition-all active:scale-95">확인</button>
            </form>
        </div>

        <div id="pause-overlay" class="hidden absolute inset-0 bg-black/60 z-40 flex items-center justify-center">
            <div class="text-center">
                <h2 class="text-white text-4xl font-black mb-4 italic">PAUSED</h2>
                <button onclick="togglePause()" class="bg-yellow-400 text-indigo-900 px-6 py-2 rounded-full font-bold shadow-lg">게임 재개</button>
            </div>
        </div>
    </div>

    <script>
        // 랜덤으로 나올 초성 목록만 정의
        const chosungList = ['ㄱㅇ', 'ㄴㄹ', 'ㄷㄱ', 'ㄹㅁ', 'ㅂㅅ', 'ㅅㅈ', 'ㅇㅇ', 'ㅈㄱ', 'ㅎㄴ', 'ㅋㅍ', 'ㅍㄷ', 'ㅌㅂ', 'ㅅㄱ', 'ㅁㅈ'];

        let teams = ['A', 'B', 'C', 'D', 'E', 'F'];
        let activeTeams = [...teams];
        let currentIdx = 0;
        let round = 0;
        let timeLeft = 10;
        let timer = null;
        let isPaused = false;
        let history = []; // 중복 단어 체크용
        let currentChosung = "";

        // 한국어 초성 추출 엔진
        function getChosung(str) {
            const base = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
            let res = "";
            for (let i = 0; i < str.length; i++) {
                let code = str.charCodeAt(i) - 44032;
                if (code >= 0 && code <= 11172) res += base[Math.floor(code / 588)];
                else res += str.charAt(i);
            }
            return res;
        }

        function togglePause() {
            if (activeTeams.length <= 1) return;
            isPaused = !isPaused;
            document.getElementById('pause-overlay').classList.toggle('hidden');
            document.getElementById('pause-btn').textContent = isPaused ? "계속하기" : "일시정지";
            if (isPaused) clearInterval(timer);
            else startTimer(false);
        }

        function updateDisplay() {
            const nowTeam = activeTeams[currentIdx];
            teams.forEach(t => {
                const el = document.getElementById(`team-${t}`);
                el.classList.remove('active-team', 'eliminated');
                const lbl = el.querySelector('.status-label');
                if (!activeTeams.includes(t)) {
                    el.classList.add('eliminated');
                    lbl.textContent = "OUT";
                } else {
                    lbl.textContent = "ALIVE";
                }
            });
            if (nowTeam) {
                document.getElementById(`team-${nowTeam}`).classList.add('active-team');
                document.getElementById('turn-info').textContent = `${nowTeam}팀 차례!`;
            }
        }

        function startRound() {
            if (activeTeams.length <= 1) { finishGame(); return; }
            round++;
            history = []; // 라운드마다 중복 리스트 초기화
            document.getElementById('round-tag').textContent = `ROUND ${round}`;
            currentChosung = chosungList[Math.floor(Math.random() * chosungList.length)];
            document.getElementById('display-chosung').textContent = currentChosung;
            addLog("시스템", `라운드 ${round} 시작! 초성: [${currentChosung}]`, "text-blue-600 font-bold");
            updateDisplay();
            startTimer(true);
        }

        function startTimer(isNew) {
            clearInterval(timer);
            if (isNew) timeLeft = 10;
            syncTimerUI();
            timer = setInterval(() => {
                if (!isPaused) {
                    timeLeft--;
                    syncTimerUI();
                    if (timeLeft <= 0) processOut();
                }
            }, 1000);
        }

        function syncTimerUI() {
            document.getElementById('display-timer').textContent = `${timeLeft}초 남음`;
            document.getElementById('timer-progress').style.width = `${(timeLeft / 10) * 100}%`;
        }

        function processOut() {
            clearInterval(timer);
            const loser = activeTeams[currentIdx];
            addLog("시스템", `${loser}팀 시간초과 탈락!`, "text-red-500 font-bold");
            activeTeams.splice(currentIdx, 1);
            if (activeTeams.length <= 1) finishGame();
            else {
                if (currentIdx >= activeTeams.length) currentIdx = 0;
                startRound();
            }
        }

        function addLog(who, msg, cls = "text-slate-700") {
            const box = document.getElementById('log-box');
            const div = document.createElement('div');
            div.className = "p-1 border-b border-slate-100";
            div.innerHTML = `<span class="${cls}">[${who}] ${msg}</span>`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function finishGame() {
            clearInterval(timer);
            const winner = activeTeams[0];
            document.getElementById('turn-info').textContent = `🏆 최종 승리: ${winner}팀 🏆`;
            document.getElementById('word-input').disabled = true;
            updateDisplay();
        }

        function resetGame() {
            clearInterval(timer);
            activeTeams = [...teams];
            currentIdx = 0;
            round = 0;
            isPaused = false;
            document.getElementById('word-input').disabled = false;
            document.getElementById('pause-overlay').classList.add('hidden');
            document.getElementById('log-box').innerHTML = "";
            startRound();
        }

        document.getElementById('input-form').onsubmit = (e) => {
            e.preventDefault();
            if (isPaused) return;
            const input = document.getElementById('word-input');
            const val = input.value.trim();
            if (!val) return;

            // 1. 초성 일치 여부 확인
            if (getChosung(val) === currentChosung) {
                // 2. 중복 단어 확인
                if (history.includes(val)) {
                    addLog("시스템", `이미 사용된 단어: ${val}`, "text-orange-500");
                } else {
                    history.push(val);
                    addLog(activeTeams[currentIdx], val, "font-bold text-indigo-700");
                    currentIdx = (currentIdx + 1) % activeTeams.length;
                    updateDisplay();
                    startTimer(true);
                }
            } else {
                addLog("시스템", "초성이 일치하지 않습니다.", "text-red-400 text-xs");
            }
            input.value = "";
        };

        window.onload = startRound;
    </script>
</body>
</html>
