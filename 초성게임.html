<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초성 서바이벌 - 홈페이지용</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        
        :root {
            --primary-color: #4338ca;
            --accent-color: #facc15;
        }

        body {
            font-family: 'Jua', sans-serif;
            background-color: #f8fafc;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            width: 100%;
            max-width: 800px;
            height: 95vh;
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .eliminated {
            background-color: #4b5563 !important;
            opacity: 0.6;
            position: relative;
        }

        .eliminated::after {
            content: attr(data-out-info);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg);
            color: #ef4444;
            font-size: 1.2rem;
            font-weight: 900;
            border: 3px solid #ef4444;
            padding: 2px 6px;
            border-radius: 6px;
            white-space: nowrap;
            background-color: rgba(255, 255, 255, 0.9);
            z-index: 20;
        }

        .active-team {
            background-color: var(--primary-color) !important;
            border: 3px solid var(--accent-color) !important;
            transform: scale(1.05);
            z-index: 10;
        }

        .chat-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        @keyframes pulse-custom {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .animate-pulse-soft {
            animation: pulse-custom 2s infinite;
        }
        
        /* 일시정지 오버레이 */
        #pause-overlay {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="p-4">

    <div class="game-container">
        <!-- 상단 헤더 및 팀 정보 -->
        <div class="bg-indigo-800 p-4 text-white shadow-md">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-2">
                    <span id="round-tag" class="bg-yellow-400 text-indigo-900 px-3 py-0.5 rounded-full text-sm font-black">ROUND 1</span>
                    <h1 class="text-xl font-bold tracking-tight">초성 서바이벌</h1>
                </div>
                <div class="flex gap-2">
                    <button id="pause-btn" onclick="togglePause()" class="text-xs bg-indigo-600 hover:bg-indigo-500 px-3 py-1 rounded font-bold transition-all flex items-center gap-1">
                        <span id="pause-icon">⏸</span> 일시정지
                    </button>
                    <button onclick="resetGame()" class="text-xs bg-red-500 hover:bg-red-600 px-3 py-1 rounded font-bold transition-all">전체 리셋</button>
                </div>
            </div>
            
            <div id="team-grid" class="grid grid-cols-3 md:grid-cols-6 gap-2">
                <div id="team-A" class="team-card bg-indigo-900 p-2 rounded-lg text-center border-2 border-transparent transition-all">
                    <div class="text-[10px] opacity-60">TEAM A</div>
                    <div class="status-label text-sm font-bold text-green-400">ALIVE</div>
                </div>
                <div id="team-B" class="team-card bg-indigo-900 p-2 rounded-lg text-center border-2 border-transparent transition-all">
                    <div class="text-[10px] opacity-60">TEAM B</div>
                    <div class="status-label text-sm font-bold text-green-400">ALIVE</div>
                </div>
                <div id="team-C" class="team-card bg-indigo-900 p-2 rounded-lg text-center border-2 border-transparent transition-all">
                    <div class="text-[10px] opacity-60">TEAM C</div>
                    <div class="status-label text-sm font-bold text-green-400">ALIVE</div>
                </div>
                <div id="team-D" class="team-card bg-indigo-900 p-2 rounded-lg text-center border-2 border-transparent transition-all">
                    <div class="text-[10px] opacity-60">TEAM D</div>
                    <div class="status-label text-sm font-bold text-green-400">ALIVE</div>
                </div>
                <div id="team-E" class="team-card bg-indigo-900 p-2 rounded-lg text-center border-2 border-transparent transition-all">
                    <div class="text-[10px] opacity-60">TEAM E</div>
                    <div class="status-label text-sm font-bold text-green-400">ALIVE</div>
                </div>
                <div id="team-F" class="team-card bg-indigo-900 p-2 rounded-lg text-center border-2 border-transparent transition-all">
                    <div class="text-[10px] opacity-60">TEAM F</div>
                    <div class="status-label text-sm font-bold text-green-400">ALIVE</div>
                </div>
            </div>
        </div>

        <!-- 메인 게임판 -->
        <div class="flex-1 flex flex-col p-4 space-y-4 overflow-hidden bg-slate-50">
            <!-- 문제 박스 -->
            <div class="bg-white rounded-2xl p-6 text-center shadow-sm border border-slate-200 relative overflow-hidden">
                <div id="timer-progress" class="absolute top-0 left-0 h-1.5 bg-red-500 transition-all duration-1000 ease-linear" style="width: 100%"></div>
                <p class="text-slate-400 text-xs mb-1">제시된 초성 (한국어 대사전 기준)</p>
                <div id="display-chosung" class="text-6xl md:text-8xl font-black text-slate-800 tracking-tighter mb-2">ㄱㅇ</div>
                <div id="display-timer" class="text-red-500 text-lg font-bold animate-pulse-soft">10초 남음</div>
            </div>

            <!-- 현재 상태 알림 -->
            <div id="turn-info" class="bg-indigo-100 text-indigo-800 py-3 rounded-xl text-center text-xl font-black border-b-4 border-indigo-200">
                A팀 차례입니다!
            </div>

            <!-- 채팅 로그 -->
            <div id="log-box" class="chat-scroll flex-1 overflow-y-auto space-y-2 p-2">
                <!-- 메시지들이 여기에 추가됨 -->
            </div>
        </div>

        <!-- 입력 영역 -->
        <div class="p-4 bg-white border-t border-slate-100">
            <form id="input-form" class="flex gap-2">
                <input 
                    type="text" 
                    id="word-input" 
                    placeholder="정답 입력..." 
                    class="flex-1 bg-slate-100 border-2 border-transparent focus:border-indigo-500 focus:bg-white px-4 py-3 rounded-2xl outline-none font-sans text-lg transition-all"
                    autocomplete="off"
                >
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-2xl font-bold transition-all active:scale-95">
                    확인
                </button>
            </form>
        </div>

        <!-- 일시정지 레이어 -->
        <div id="pause-overlay" class="hidden absolute inset-0 z-40 flex items-center justify-center">
            <div class="text-white text-center">
                <div class="text-6xl mb-4">⏸</div>
                <div class="text-3xl font-black">일시정지 중</div>
                <button onclick="togglePause()" class="mt-6 bg-yellow-400 text-indigo-900 px-8 py-3 rounded-full font-black text-xl shadow-lg">다시 시작하기</button>
            </div>
        </div>

        <!-- 라운드 전환 애니메이션 레이어 -->
        <div id="overlay" class="hidden absolute inset-0 bg-indigo-900/90 z-50 flex flex-col items-center justify-center text-white p-6">
            <h2 id="overlay-title" class="text-5xl font-black mb-2 italic">ROUND 2</h2>
            <p id="overlay-desc" class="text-yellow-400 text-xl font-bold">새로운 초성 준비!</p>
        </div>
    </div>

    <script>
        // 대사전급 데이터 확장
        const wordList = [
            { chosung: 'ㄱㅇ', words: ['가옥', '강의', '고용', '국왕', '기온', '공연', '교육', '강아지', '고양이', '거울', '게임', '과일', '겨울', '공원', '가요', '기억', '기안', '가을', '거위', '검역', '계약', '공유', '금원', '기어'] },
            { chosung: 'ㄴㄹ', words: ['나라', '노래', '노루', '나무', '내일', '능력', '날개', '논리', '노랑', '난로', '남로', '냉면', '너구리', '노력', '논란', '내륙', '남극', '노련', '난리', '낙뢰', '농로', '나래'] },
            { chosung: 'ㄷㄱ', words: ['당근', '딸기', '대기', '동굴', '도구', '단어', '대구', '동기', '독기', '다리', '독수리', '대궐', '도곡', '단가', '두뇌', '동고', '대강', '들개', '동경', '담구', '독감', '동구'] },
            { chosung: 'ㅅㅈ', words: ['사자', '사진', '상자', '시장', '수저', '시계', '숙제', '성장', '수정', '수집', '상점', '사정', '수주', '세종', '시저', '속보', '사장', '수직', '선전', '심장', '소주', '신전'] },
            { chosung: 'ㅇㅇ', words: ['우유', '아이', '오이', '여우', '이유', '언어', '음악', '영어', '오해', '요리', '어른', '연어', '우아', '유아', '육아', '예약', '일어', '우연', '오열', '우울', '유인', '용어', '유용'] },
            { chosung: 'ㅂㅅ', words: ['버스', '부산', '박사', '보석', '바다', '비상', '빙수', '반성', '부상', '백수', '비석', '복사', '밥상', '부서', '배수', '비소', '부속', '병실', '변수', '백성', '본색', '비서'] },
            { chosung: 'ㅈㄱ', words: ['지구', '축구', '조각', '중국', '장갑', '전공', '작가', '자기', '종교', '지각', '자격', '주공', '전국', '전기', '장기', '직격', '자유', '정거', '주관', '장관', '직구', '정곡'] },
            { chosung: 'ㅎㄴ', words: ['하늘', '하나', '해녀', '효녀', '화난', '호남', '흉내', '화분', '해남', '학원', '화로', '하녀', '한남', '효능', '학남', '항해', '화농', '환영', '훈남', '해안', '후납'] },
            { chosung: 'ㅁㄹ', words: ['머리', '모래', '미래', '무료', '마루', '미로', '모레', '미리', '몰래', '만루', '물레', '마력', '모략', '무력', '명령', '매립', '목록', '문학', '미립', '모함', '마루'] },
            { chosung: 'ㅋㅍ', words: ['커피', '카페', '캠핑', '쿠폰', '커플', '코풍', '키퍼', '카피', '코펜', '컴퓨터', '코팩', '커튼', '카페인', '커리어', '쿠팡'] },
            { chosung: 'ㅂㄱ', words: ['보관', '비결', '부결', '배경', '반격', '병가', '번개', '북극', '비공', '보고', '비교', '방구', '불고', '빙하', '본격', '분교', '불곡', '본관'] },
            { chosung: 'ㅎㅅ', words: ['학생', '학교', '회사', '회식', '효소', '항상', '후생', '화살', '호수', '행사', '햇살', '화성', '형상', '현상', '혈색', '확산', '화상', '해산'] }
        ];

        const teams = ['A', 'B', 'C', 'D', 'E', 'F'];
        let activeTeams = [...teams];
        let outRecords = { A:null, B:null, C:null, D:null, E:null, F:null };
        let currentIdx = 0;
        let round = 1;
        let timeLeft = 10;
        let timer = null;
        let history = [];
        let isPaused = false;
        const LIMIT = 10;

        function getChosung(str) {
            const base = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
            let res = "";
            for (let i = 0; i < str.length; i++) {
                let code = str.charCodeAt(i) - 44032;
                if (code >= 0 && code <= 11172) res += base[Math.floor(code / 588)];
                else res += str.charAt(i);
            }
            return res;
        }

        function updateDisplay() {
            const nowTeam = activeTeams[currentIdx];
            
            teams.forEach(t => {
                const el = document.getElementById(`team-${t}`);
                const lbl = el.querySelector('.status-label');
                el.classList.remove('active-team');
                
                if (!activeTeams.includes(t)) {
                    el.classList.add('eliminated');
                    el.setAttribute('data-out-info', `OUT (R${outRecords[t]})`);
                    lbl.textContent = 'OUT';
                    lbl.className = 'status-label text-sm font-bold text-red-500';
                } else {
                    el.classList.remove('eliminated');
                    el.removeAttribute('data-out-info');
                    lbl.textContent = 'ALIVE';
                    lbl.className = 'status-label text-sm font-bold text-green-400';
                }
            });

            if (nowTeam) {
                document.getElementById(`team-${nowTeam}`).classList.add('active-team');
                document.getElementById('turn-info').textContent = `${nowTeam}팀의 차례! 단어를 입력하세요.`;
            }
        }

        function togglePause() {
            if (activeTeams.length <= 1) return;
            isPaused = !isPaused;
            const overlay = document.getElementById('pause-overlay');
            const btn = document.getElementById('pause-btn');
            const icon = document.getElementById('pause-icon');
            
            if (isPaused) {
                clearInterval(timer);
                overlay.classList.remove('hidden');
                btn.classList.replace('bg-indigo-600', 'bg-yellow-500');
                btn.innerHTML = '▶ 다시시작';
                addLog("시스템", "게임을 일시정지했습니다.", "text-orange-500 font-bold");
            } else {
                overlay.classList.add('hidden');
                btn.classList.replace('bg-yellow-500', 'bg-indigo-600');
                btn.innerHTML = '⏸ 일시정지';
                addLog("시스템", "게임을 다시 시작합니다!", "text-green-600 font-bold");
                startTimer(true); // 기존 시간 유지하며 타이머 재개
            }
        }

        function startRound() {
            if (activeTeams.length <= 1) {
                finishGame();
                return;
            }

            round++;
            document.getElementById('round-tag').textContent = `ROUND ${round}`;
            history = [];
            
            const overlay = document.getElementById('overlay');
            document.getElementById('overlay-title').textContent = `ROUND ${round}`;
            overlay.classList.remove('hidden');

            const pick = wordList[Math.floor(Math.random() * wordList.length)];
            document.getElementById('display-chosung').textContent = pick.chosung;
            
            addLog("시스템", `라운드 ${round} 시작! 초성: [${pick.chosung}]`, "text-indigo-600 font-bold italic");

            setTimeout(() => {
                overlay.classList.add('hidden');
                updateDisplay();
                startTimer();
            }, 2000);
        }

        function startTimer(resume = false) {
            clearInterval(timer);
            if (!resume) timeLeft = LIMIT;
            syncTimerUI();
            
            timer = setInterval(() => {
                if (isPaused) return;
                timeLeft--;
                syncTimerUI();
                if (timeLeft <= 0) {
                    processOut();
                }
            }, 1000);
        }

        function syncTimerUI() {
            document.getElementById('display-timer').textContent = `${timeLeft}초 남음`;
            document.getElementById('timer-progress').style.width = `${(timeLeft / LIMIT) * 100}%`;
        }

        function processOut() {
            clearInterval(timer);
            const loser = activeTeams[currentIdx];
            outRecords[loser] = round;
            addLog("시스템", `${loser}팀 시간 초과 탈락! (Round ${round})`, "text-red-600 font-black text-lg");
            
            activeTeams.splice(currentIdx, 1);
            
            if (activeTeams.length <= 1) {
                finishGame();
            } else {
                if (currentIdx >= activeTeams.length) currentIdx = 0;
                setTimeout(startRound, 1000);
            }
        }

        function addLog(who, msg, cls = "text-slate-700") {
            const box = document.getElementById('log-box');
            const div = document.createElement('div');
            div.className = `text-sm p-2 rounded-lg ${who === '시스템' ? 'bg-slate-200 text-center' : 'bg-white border border-slate-100 shadow-sm'}`;
            div.innerHTML = `<span class="${cls}">${who === '시스템' ? '' : `[${who}] `}${msg}</span>`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function finishGame() {
            clearInterval(timer);
            const winner = activeTeams[0];
            const turnBox = document.getElementById('turn-info');
            turnBox.className = "bg-green-500 text-white py-4 rounded-xl text-center text-2xl font-black shadow-lg animate-bounce";
            turnBox.textContent = winner ? `🏆 최종 승리: ${winner}팀 🏆` : "게임 종료";
            document.getElementById('word-input').disabled = true;
            updateDisplay();
        }

        function resetGame() {
            clearInterval(timer);
            isPaused = false;
            document.getElementById('pause-overlay').classList.add('hidden');
            const btn = document.getElementById('pause-btn');
            btn.classList.replace('bg-yellow-500', 'bg-indigo-600');
            btn.innerHTML = '⏸ 일시정지';

            activeTeams = [...teams];
            teams.forEach(t => outRecords[t] = null);
            currentIdx = 0;
            round = 1;
            history = [];
            document.getElementById('word-input').disabled = false;
            document.getElementById('word-input').value = "";
            document.getElementById('round-tag').textContent = "ROUND 1";
            document.getElementById('turn-info').className = "bg-indigo-100 text-indigo-800 py-3 rounded-xl text-center text-xl font-black border-b-4 border-indigo-200";
            
            const first = wordList[Math.floor(Math.random() * wordList.length)];
            document.getElementById('display-chosung').textContent = first.chosung;
            document.getElementById('log-box').innerHTML = '<div class="text-center text-slate-400 text-xs italic">새 게임이 시작되었습니다.</div>';
            
            updateDisplay();
            startTimer();
        }

        document.getElementById('input-form').onsubmit = (e) => {
            e.preventDefault();
            if (isPaused) return;

            const input = document.getElementById('word-input');
            const val = input.value.trim();
            if (!val || activeTeams.length <= 1) return;

            const targetChosung = document.getElementById('display-chosung').textContent;
            
            // 데이터 사전에서 확인 (한국어 대사전급 시뮬레이션)
            const pickData = wordList.find(d => d.chosung === targetChosung);
            
            if (getChosung(val) === targetChosung) {
                // 초성은 맞지만 실제 존재하는 단어인지(데이터셋에 있는지) 확인
                if (pickData && pickData.words.includes(val)) {
                    if (history.includes(val)) {
                        addLog("시스템", "이미 사용된 단어입니다!", "text-orange-500");
                    } else {
                        history.push(val);
                        addLog(`${activeTeams[currentIdx]}팀`, val, "text-indigo-700 font-bold");
                        currentIdx = (currentIdx + 1) % activeTeams.length;
                        updateDisplay();
                        startTimer();
                    }
                } else {
                    addLog("시스템", "사전에 없는 단어이거나 유효하지 않습니다.", "text-red-400 text-xs italic");
                }
            } else {
                addLog("시스템", "초성이 일치하지 않습니다.", "text-red-500 text-xs");
            }
            input.value = "";
        };

        window.onload = resetGame;
    </script>
</body>
</html>
