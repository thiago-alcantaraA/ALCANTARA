<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학 수업 자료실</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8f9fa; }
        .file-list-container { max-height: 1000px; margin-top: 1rem; border-top: 1px solid #eee; padding-top: 1rem; }
    </style>
</head>
<body class="py-12 px-6">
    <div class="max-w-5xl mx-auto text-center mb-12">
        <h1 class="text-3xl font-bold text-gray-800 italic font-serif">Σ Thiago Math Portal</h1>
    </div>

    <div class="max-w-4xl mx-auto">
        <div class="bg-white p-8 rounded-3xl shadow-lg border border-gray-100">
            <h2 class="text-xl font-bold text-gray-800 mb-6 flex items-center">
                <i class="fa-solid fa-folder-open text-purple-600 mr-3"></i> 전체 수학교구 목록
            </h2>
            <div id="all-files" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <p class="text-gray-400 text-sm">파일 목록을 불러오는 중...</p>
            </div>
        </div>
    </div>

    <script>
        async function loadFiles() {
            const repo = "thiago-alcantaraA/ALCANTARA";
            const container = document.getElementById('all-files');
            
            try {
                // 저장소의 모든 파일을 재귀적으로(깊숙이) 가져옵니다.
                const response = await fetch(`https://api.github.com/repos/${repo}/git/trees/main?recursive=1`);
                const data = await response.json();
                container.innerHTML = '';

                data.tree.forEach(file => {
                    // index.html을 제외한 모든 html 파일 탐색
                    if (file.path.endsWith('.html') && !file.path.includes('index.html')) {
                        const a = document.createElement('a');
                        a.href = file.path;
                        a.className = "flex items-center justify-between p-4 bg-gray-50 rounded-xl hover:bg-purple-50 hover:text-purple-600 transition border border-transparent hover:border-purple-100 group";
                        
                        // 폴더 경로 제거하고 파일 이름만 추출
                        const fileName = file.path.split('/').pop().replace('.html', '');
                        
                        a.innerHTML = `
                            <span class="font-medium text-gray-700 group-hover:text-purple-700">${fileName}</span>
                            <i class="fa-solid fa-circle-play opacity-20 group-hover:opacity-100 transition"></i>
                        `;
                        container.appendChild(a);
                    }
                });

                if (container.innerHTML === '') {
                    container.innerHTML = '<p class="col-span-2 text-gray-400">등록된 교구가 없습니다.</p>';
                }
            } catch (e) {
                container.innerHTML = '<p class="col-span-2 text-red-400">목록을 불러오지 못했습니다.</p>';
            }
        }
        loadFiles();
    </script>
</body>
</html>
