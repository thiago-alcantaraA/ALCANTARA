<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학 수업 자료실</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8f9fa; }
        .card:hover { transform: translateY(-5px); transition: 0.3s; }
    </style>
</head>
<body class="py-12 px-6">
    <div class="max-w-5xl mx-auto">
        <div class="mb-12">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">
                <i class="fa-solid fa-book-open text-purple-600 mr-2"></i>학년별 교육과정
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="file-list">
                <div class="card bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
                    <div class="bg-purple-50 w-12 h-12 rounded-xl flex items-center justify-center mb-6 text-purple-600 font-bold text-xl">Σ</div>
                    <h3 class="text-xl font-bold mb-3 text-gray-800">중학교 3학년</h3>
                    <div class="space-y-3" id="math-files">
                        <p class="text-gray-400 text-sm italic">파일 목록을 불러오는 중...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 깃허브 API를 이용해 폴더 내 파일 목록을 자동으로 가져옵니다.
        async function loadFiles() {
            const repo = "thiago-alcantaraA/ALCANTARA";
            const response = await fetch(`https://api.github.com/repos/${repo}/contents/`);
            const files = await response.json();
            const container = document.getElementById('math-files');
            container.innerHTML = '';

            files.forEach(file => {
                if (file.name.endsWith('.html') && file.name !== 'index.html') {
                    const link = document.createElement('a');
                    link.href = file.name;
                    link.className = "flex items-center text-purple-600 font-medium hover:underline";
                    link.innerHTML = `${file.name.replace('.html', '')} <i class="fa-solid fa-arrow-right ml-2 text-xs"></i>`;
                    container.appendChild(link);
                }
            });
        }
        loadFiles();
    </script>
</body>
</html>
