<div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-16">
    <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 hover:shadow-md transition">
        <div class="bg-blue-50 w-12 h-12 rounded-2xl flex items-center justify-center mb-6 text-blue-600 font-bold text-xl">1</div>
        <h3 class="text-xl font-bold mb-6 text-gray-800">중학교 1학년</h3>
        <button onclick="showMenu(1)" class="w-full py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition">
            선택하기
        </button>
    </div>
    </div>

<div id="menuModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
    <div class="bg-white p-8 rounded-[2.5rem] max-w-sm w-full mx-4 shadow-2xl">
        <h2 id="modalTitle" class="text-2xl font-bold text-center mb-8">무엇을 보시겠습니까?</h2>
        <div class="space-y-4">
            <button onclick="goToPage('materials')" class="w-full py-5 bg-gray-50 rounded-2xl hover:bg-purple-50 group transition flex items-center px-6">
                <span class="text-2xl mr-4">📚</span>
                <span class="font-bold text-gray-700 group-hover:text-purple-600 text-lg">수업자료</span>
            </button>
            <button onclick="goToPage('programs')" class="w-full py-5 bg-gray-50 rounded-2xl hover:bg-orange-50 group transition flex items-center px-6">
                <span class="text-2xl mr-4">💻</span>
                <span class="font-bold text-gray-700 group-hover:text-orange-600 text-lg">프로그램</span>
            </button>
        </div>
        <button onclick="closeMenu()" class="mt-8 w-full text-gray-400 text-sm hover:underline">닫기</button>
    </div>
</div>

<script>
    let selectedGrade = 0;
    function showMenu(grade) {
        selectedGrade = grade;
        document.getElementById('modalTitle').innerText = `중학교 ${grade}학년`;
        document.getElementById('menuModal').classList.remove('hidden');
        document.getElementById('menuModal').classList.add('flex');
    }
    function closeMenu() {
        document.getElementById('menuModal').classList.add('hidden');
        document.getElementById('menuModal').classList.remove('flex');
    }
    function goToPage(type) {
        // 예: grade3_programs.html 또는 grade3_materials.html로 이동
        location.href = `grade${selectedGrade}_${type}.html`;
    }
</script>
