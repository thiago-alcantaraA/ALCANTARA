<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학 수업 자료실</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .menu-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; }
        .menu-content.open { max-height: 200px; margin-top: 1.5rem; }
    </style>
</head>
<body class="bg-gray-50 py-12 px-6">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-800 mb-12 flex items-center">
            <i class="fa-solid fa-graduation-cap text-purple-600 mr-3"></i> 학년별 교육과정
        </h1>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-16">
            <div class="bg-white p-8 rounded-[2rem] shadow-sm border border-gray-100">
                <div class="bg-blue-50 w-12 h-12 rounded-xl flex items-center justify-center mb-6 text-blue-600 font-bold text-xl">1</div>
                <h3 class="text-xl font-bold mb-4 text-gray-800">중학교 1학년</h3>
                <button onclick="toggleMenu(1)" class="text-blue-600 font-bold text-sm flex items-center">자료 보기 <i id="arrow-1" class="fa-solid fa-chevron-down ml-2 transition-transform"></i></button>
                <div id="menu-1" class="menu-content space-y-2">
                    <a href="grade1_materials.html" class="block p-3 bg-gray-50 rounded-xl hover:bg-blue-50 text-sm font-bold">📚 수업자료</a>
                    <a href="grade1_programs.html" class="block p-3 bg-gray-50 rounded-xl hover:bg-blue-50 text-sm font-bold">💻 프로그램</a>
                </div>
            </div>
            <div class="bg-white p-8 rounded-[2rem] shadow-sm border border-gray-100">
                <div class="bg-green-50 w-12 h-12 rounded-xl flex items-center justify-center mb-6 text-green-600 font-bold text-xl">2</div>
                <h3 class="text-xl font-bold mb-4 text-gray-800">중학교 2학년</h3>
                <button onclick="toggleMenu(2)" class="text-green-600 font-bold text-sm flex items-center">자료 보기 <i id="arrow-2" class="fa-solid fa-chevron-down ml-2 transition-transform"></i></button>
                <div id="menu-2" class="menu-content space-y-2">
                    <a href="grade2_materials.html" class="block p-3 bg-gray-50 rounded-xl hover:bg-green-50 text-sm font-bold">📚 수업자료</a>
                    <a href="grade2_programs.html" class="block p-3 bg-gray-50 rounded-xl hover:bg-green-50 text-sm font-bold">💻 프로그램</a>
                </div>
            </div>
            <div class="bg-white p-8 rounded-[2rem] shadow-sm border border-purple-100 ring-2 ring-purple-50">
                <div class="bg-purple-50 w-12 h-12 rounded-xl flex items-center justify-center mb-6 text-purple-600 font-bold text-xl">3</div>
                <h3 class="text-xl font-bold mb-4 text-gray-800">중학교 3학년</h3>
                <button onclick="toggleMenu(3)" class="text-purple-600 font-bold text-sm flex items-center">자료 보기 <i id="arrow-3" class="fa-solid fa-chevron-down ml-2 transition-transform"></i></button>
                <div id="menu-3" class="menu-content space-y-2">
                    <a href="grade3_materials.html" class="block p-3 bg-gray-50 rounded-xl hover:bg-purple-50 text-sm font-bold">📚 수업자료</a>
                    <a href="grade3_programs.html" class="block p-3 bg-gray-50 rounded-xl hover:bg-purple-50 text-sm font-bold">💻 프로그램</a>
                </div>
            </div>
        </div>
    </div>
    <script>
        function toggleMenu(n) {
            const m = document.getElementById(`menu-${n}`);
            const a = document.getElementById(`arrow-${n}`);
            m.classList.toggle('open');
            a.style.transform = m.classList.contains('open') ? "rotate(180deg)" : "rotate(0deg)";
        }
    </script>
</body>
</html>
