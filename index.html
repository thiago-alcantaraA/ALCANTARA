<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학 수업 자료실 & 릴레이 이어그리기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8f9fa; overflow-x: hidden; }
        
        /* 메뉴 애니메이션 */
        .menu-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; opacity: 0; }
        .menu-content.open { max-height: 250px; margin-top: 1.5rem; opacity: 1; }
        
        /* 이어그리기 캔버스 스타일 */
        .canvas-container {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            border-radius: 2rem;
            overflow: hidden;
            background-color: white;
            position: relative;
        }
        #drawing-canvas { cursor: crosshair; display: block; }
        .tool-btn { transition: all 0.2s; }
        .tool-btn:active { transform: scale(0.95); }
        .active-tool { background-color: #3b82f6 !important; color: white !important; }
        .active-option { outline: 3px solid #3b82f6; outline-offset: 2px; }
        
        #eraser-cursor {
            position: absolute;
            border: 1px solid #000;
            border-radius: 50%;
            pointer-events: none;
            display: none;
            transform: translate(-50%, -50%);
            z-index: 10;
            background-color: rgba(255, 255, 255, 0.3);
        }
        
        #game-overlay {
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            color: white;
            border-radius: 2rem;
            text-align: center;
            padding: 2rem;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body class="py-12 px-6">

    <!-- [1] 포털 메인 화면 -->
    <div id="portal-page" class="max-w-6xl mx-auto">
        <h1 class="text-4xl font-extrabold text-gray-800 mb-12 flex items-center">
            <i class="fa-solid fa-graduation-cap text-purple-600 mr-4"></i> 학년별 교육과정
        </h1>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-20">
            <!-- 중1 -->
            <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-gray-100">
                <div class="bg-blue-50 w-12 h-12 rounded-2xl flex items-center justify-center mb-6 text-blue-600 font-bold text-xl">1</div>
                <h3 class="text-2xl font-bold mb-4 text-gray-800">중학교 1학년</h3>
                <button onclick="toggleMenu(1)" class="text-blue-600 font-bold text-sm flex items-center group">
                    자료 보기 <i id="arrow-1" class="fa-solid fa-chevron-down ml-2 text-xs transition-transform"></i>
                </button>
                <div id="menu-1" class="menu-content space-y-3">
                    <a href="javascript:void(0)" class="flex items-center p-4 bg-gray-50 rounded-2xl hover:bg-blue-50 transition font-bold text-gray-700 text-sm">📚 수업자료</a>
                    <a href="javascript:void(0)" class="flex items-center p-4 bg-gray-50 rounded-2xl hover:bg-blue-50 transition font-bold text-gray-700 text-sm">💻 프로그램</a>
                </div>
            </div>

            <!-- 중2 -->
            <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-gray-100">
                <div class="bg-green-50 w-12 h-12 rounded-2xl flex items-center justify-center mb-6 text-green-600 font-bold text-xl">2</div>
                <h3 class="text-2xl font-bold mb-4 text-gray-800">중학교 2학년</h3>
                <button onclick="toggleMenu(2)" class="text-green-600 font-bold text-sm flex items-center group">
                    자료 보기 <i id="arrow-2" class="fa-solid fa-chevron-down ml-2 text-xs transition-transform"></i>
                </button>
                <div id="menu-2" class="menu-content space-y-3">
                    <a href="javascript:void(0)" class="flex items-center p-4 bg-gray-50 rounded-2xl hover:bg-green-50 transition font-bold text-gray-700 text-sm">📚 수업자료</a>
                    <a href="javascript:void(0)" class="flex items-center p-4 bg-gray-50 rounded-2xl hover:bg-green-50 transition font-bold text-gray-700 text-sm">💻 프로그램</a>
                </div>
            </div>

            <!-- 중3 -->
            <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-purple-100 ring-4 ring-purple-50">
                <div class="bg-purple-50 w-12 h-12 rounded-2xl flex items-center justify-center mb-6 text-purple-600 font-bold text-xl">3</div>
                <h3 class="text-2xl font-bold mb-4 text-gray-800">중학교 3학년</h3>
                <button onclick="toggleMenu(3)" class="text-purple-600 font-bold text-sm flex items-center group">
                    자료 보기 <i id="arrow-3" class="fa-solid fa-chevron-down ml-2 text-xs transition-transform"></i>
                </button>
                <div id="menu-3" class="menu-content space-y-3">
                    <a href="javascript:void(0)" class="flex items-center p-4 bg-gray-50 rounded-2xl hover:bg-purple-50 transition font-bold text-gray-700 text-sm">📚 수업자료</a>
                    <a href="javascript:void(0)" class="flex items-center p-4 bg-gray-50 rounded-2xl hover:bg-purple-50 transition font-bold text-gray-700 text-sm">💻 프로그램</a>
                </div>
            </div>
        </div>

        <!-- 보드게임 섹션 -->
        <h2 class="text-3xl font-bold text-gray-800 mb-8 flex items-center">
            <i class="fa-solid fa-dice text-orange-500 mr-4"></i> 창의적 체험활동 (보드게임)
        </h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-20">
            <a href="javascript:void(0)" class="flex items-center p-5 bg-white rounded-[2rem] shadow-sm border border-gray-100 hover:shadow-lg transition group">
                <span class="text-3xl mr-4 group-hover:rotate-12 transition">🎲</span>
                <span class="font-bold text-gray-700 group-hover:text-orange-500 text-base">요트 다이스</span>
            </a>
            <a href="javascript:void(0)" class="flex items-center p-5 bg-white rounded-[2rem] shadow-sm border border-gray-100 hover:shadow-lg transition group">
                <span class="text-3xl mr-4 group-hover:scale-110 transition">🕵️</span>
                <span class="font-bold text-gray-700 group-hover:text-orange-500 text-base">코드네임</span>
            </a>
            <a href="javascript:void(0)" class="flex items-center p-5 bg-white rounded-[2rem] shadow-sm border border-gray-100 hover:shadow-lg transition group">
                <span class="text-3xl mr-4 group-hover:bounce transition">🅰️</span>
                <span class="font-bold text-gray-700 group-hover:text-orange-500 text-base">초성게임</span>
            </a>
            <button onclick="showDrawingApp()" class="flex items-center p-5 bg-white rounded-[2rem] shadow-sm border border-orange-200 ring-2 ring-orange-50 hover:shadow-lg transition group text-left">
                <span class="text-3xl mr-4 group-hover:rotate-[-12deg] transition">🎨</span>
                <span class="font-bold text-gray-700 group-hover:text-orange-500 text-base">릴레이 이어그리기</span>
            </button>
        </div>

        <!-- 학급 관리 도구 섹션 -->
        <h2 class="text-3xl font-bold text-gray-800 mb-8 flex items-center">
            <i class="fa-solid fa-toolbox text-indigo-500 mr-4"></i> 학급 관리 도구
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <a href="javascript:void(0)" class="flex items-center p-7 bg-white rounded-[2rem] shadow-sm border border-indigo-100 hover:shadow-lg hover:border-indigo-300 transition group">
                <div class="w-16 h-16 bg-indigo-50 rounded-2xl flex items-center justify-center mr-6 group-hover:bg-indigo-100 transition">
                    <i class="fa-solid fa-shuffle text-3xl text-indigo-500 group-hover:rotate-45 transition"></i>
                </div>
                <div>
                    <span class="block font-bold text-gray-800 text-lg">랜덤 숫자뽑기</span>
                    <span class="text-sm text-gray-500 font-medium">발표자 선정 및 번호 추첨</span>
                </div>
            </a>
            <a href="javascript:void(0)" class="flex items-center p-7 bg-white rounded-[2rem] shadow-sm border border-indigo-100 hover:shadow-lg hover:border-indigo-300 transition group">
                <div class="w-16 h-16 bg-indigo-50 rounded-2xl flex items-center justify-center mr-6 group-hover:bg-indigo-100 transition">
                    <i class="fa-solid fa-chair text-3xl text-indigo-500 group-hover:scale-110 transition"></i>
                </div>
                <div>
                    <span class="block font-bold text-gray-800 text-lg">자리배치도</span>
                    <span class="text-sm text-gray-500 font-medium">좌석 배치 및 명렬표 관리</span>
                </div>
            </a>
        </div>
    </div>

    <!-- [2] 릴레이 이어그리기 프로그램 섹션 -->
    <div id="drawing-app-page" class="hidden max-w-4xl mx-auto flex flex-col items-center">
        
        <!-- 게임 설정 화면 -->
        <div id="setup-screen" class="bg-white p-10 rounded-[3rem] shadow-2xl w-full text-center">
            <div class="text-6xl mb-6">🎨</div>
            <h2 class="text-3xl font-black text-gray-800 mb-4">릴레이 이어그리기 설정</h2>
            <p class="text-gray-500 mb-8">참가할 인원을 적고 게임을 시작하세요.</p>
            <div class="mb-10 max-w-xs mx-auto">
                <div class="flex items-center gap-4">
                    <input type="number" id="player-count-input" min="2" max="20" value="2" 
                        class="w-full px-6 py-4 border-2 border-gray-100 rounded-2xl focus:border-blue-500 outline-none text-center text-2xl font-black shadow-inner">
                    <span class="text-xl font-bold text-gray-500">명</span>
                </div>
            </div>
            <div class="flex flex-col gap-3">
                <button id="start-game-btn" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black text-xl hover:bg-blue-700 shadow-lg transition-all">
                    조 편성 완료 & 시작
                </button>
                <button onclick="showPortal()" class="text-gray-400 font-bold hover:text-gray-600 transition-colors">자료실로 돌아가기</button>
            </div>
        </div>

        <!-- 게임 본 화면 -->
        <div id="game-arena" class="hidden w-full">
            <header class="w-full flex justify-between items-center mb-6">
                <button onclick="confirmGoBack()" class="text-gray-400 hover:text-gray-600">
                    <i class="fa-solid fa-arrow-left text-xl"></i>
                </button>
                <div id="status-controls" class="flex gap-3">
                    <div class="bg-red-50 text-red-600 px-5 py-2 rounded-2xl border border-red-100 font-black text-lg shadow-sm">
                        <span id="time-left">5</span>초
                    </div>
                    <div id="turn-display" class="bg-white px-5 py-2 rounded-2xl shadow-sm border border-blue-100 font-black text-blue-600">
                        제 1 주자 준비
                    </div>
                </div>
                <div id="result-header-actions" class="hidden flex gap-2">
                    <button id="restart-game-btn" class="bg-gray-200 text-gray-700 px-5 py-2 rounded-2xl font-black text-sm hover:bg-gray-300">다시 하기</button>
                    <button id="final-save-btn" class="bg-green-600 text-white px-5 py-2 rounded-2xl font-black text-sm shadow-md hover:bg-green-700">저장</button>
                </div>
            </header>

            <main class="canvas-container mb-6">
                <canvas id="drawing-canvas"></canvas>
                <div id="eraser-cursor"></div>
                <div id="game-overlay">
                    <h2 id="overlay-title" class="text-4xl font-black mb-4 uppercase">준비!</h2>
                    <p id="overlay-desc" class="mb-8 font-medium opacity-90 leading-relaxed">버튼을 누르면 5초 타이머가 시작됩니다.</p>
                    <button id="overlay-action-btn" class="bg-white text-blue-700 px-10 py-4 rounded-2xl font-black text-xl hover:scale-105 transition-all shadow-xl active:scale-95">
                        지금 시작하기
                    </button>
                </div>
            </main>

            <div id="toolbar" class="bg-white p-5 rounded-[2.5rem] shadow-xl flex flex-wrap gap-4 items-center justify-between">
                <div class="flex gap-2">
                    <button id="pen-tool" class="tool-btn active-tool bg-gray-50 p-4 rounded-2xl" title="펜"><i class="fa-solid fa-pen"></i></button>
                    <button id="eraser-tool" class="tool-btn bg-gray-50 p-4 rounded-2xl" title="지우개"><i class="fa-solid fa-eraser"></i></button>
                </div>
                <div class="flex gap-2 items-center bg-gray-50 px-4 py-2 rounded-2xl shadow-inner">
                    <button data-color="#000000" class="color-btn active-option w-8 h-8 bg-black rounded-full hover:scale-110 transition-transform"></button>
                    <button data-color="#3b82f6" class="color-btn w-8 h-8 bg-blue-500 rounded-full hover:scale-110 transition-transform"></button>
                    <button data-color="#ef4444" class="color-btn w-8 h-8 bg-red-500 rounded-full hover:scale-110 transition-transform"></button>
                </div>
                <div class="flex gap-3 items-center bg-gray-50 px-4 py-2 rounded-2xl shadow-inner">
                    <button data-size="4" class="size-btn flex items-center justify-center w-8 h-8 hover:scale-110 transition-transform"><div class="w-1 h-1 bg-gray-800 rounded-full"></div></button>
                    <button data-size="12" class="size-btn active-option flex items-center justify-center w-8 h-8 hover:scale-110 transition-transform"><div class="w-3 h-3 bg-gray-800 rounded-full"></div></button>
                    <button data-size="28" class="size-btn flex items-center justify-center w-8 h-8 hover:scale-110 transition-transform"><div class="w-6 h-6 bg-gray-800 rounded-full"></div></button>
                </div>
                <button id="save-image" class="bg-green-100 text-green-700 p-4 rounded-2xl hover:bg-green-200"><i class="fa-solid fa-download"></i></button>
            </div>
            <div id="final-msg" class="hidden mt-6 text-center text-xl font-black text-gray-800 animate-bounce">✨ 걸작이 완성되었습니다! ✨</div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-8 py-4 rounded-2xl opacity-0 pointer-events-none transition-opacity duration-300 shadow-2xl z-50 font-bold text-sm">
        메시지
    </div>

    <script>
        /* --- [1] 포털 공통 스크립트 --- */
        function toggleMenu(n) {
            const menu = document.getElementById(`menu-${n}`);
            const arrow = document.getElementById(`arrow-${n}`);
            menu.classList.toggle('open');
            if(arrow) arrow.style.transform = menu.classList.contains('open') ? "rotate(180deg)" : "rotate(0deg)";
        }

        function showDrawingApp() {
            document.getElementById('portal-page').classList.add('hidden');
            document.getElementById('drawing-app-page').classList.remove('hidden');
            document.body.style.backgroundColor = "#f1f5f9";
            
            // 화면 전환 애니메이션 후 캔버스 크기 계산을 위해 약간의 지연 시간 부여
            setTimeout(initCanvas, 50);
        }

        function showPortal() {
            if (timerInterval) clearInterval(timerInterval);
            document.getElementById('drawing-app-page').classList.add('hidden');
            document.getElementById('portal-page').classList.remove('hidden');
            document.body.style.backgroundColor = "#f8f9fa";
        }

        function confirmGoBack() {
            if (confirm("게임을 중단하고 자료실로 돌아갈까요?")) showPortal();
        }

        /* --- [2] 릴레이 이어그리기 로직 --- */
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d');
        const playerCountInput = document.getElementById('player-count-input');
        const turnDisplay = document.getElementById('turn-display');
        const timeLeftSpan = document.getElementById('time-left');
        const gameOverlay = document.getElementById('game-overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');
        const overlayActionBtn = document.getElementById('overlay-action-btn');
        const gameArena = document.getElementById('game-arena');
        const setupScreen = document.getElementById('setup-screen');
        const restartBtn = document.getElementById('restart-game-btn');
        const eraserCursor = document.getElementById('eraser-cursor');
        const toast = document.getElementById('toast');

        let isDrawing = false;
        let currentTool = 'pen';
        let totalPlayers = 2;
        let currentTurn = 1;
        let timeLeft = 5;
        let timerInterval = null;
        let lastX = 0, lastY = 0;
        let isTimerActive = false;
        let currentColor = "#000000";
        let currentSize = 12;
        const ERASER_MULTIPLIER = 10;

        document.getElementById('start-game-btn').addEventListener('click', () => {
            totalPlayers = parseInt(playerCountInput.value);
            if (isNaN(totalPlayers) || totalPlayers < 2) {
                showToast("최소 2명 이상 필요합니다.");
                return;
            }
            setupScreen.classList.add('hidden');
            gameArena.classList.remove('hidden');
            initCanvas();
            currentTurn = 1;
            prepareNextTurn();
        });

        function initCanvas() {
            const container = canvas.parentElement;
            if (!container) return;
            canvas.width = container.clientWidth;
            canvas.height = window.innerHeight * 0.55;
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function prepareNextTurn() {
            isTimerActive = false;
            if (timerInterval) clearInterval(timerInterval);
            timeLeft = 5;
            timeLeftSpan.textContent = timeLeft;
            turnDisplay.innerHTML = `제 ${currentTurn} 주자 준비`;
            gameOverlay.style.display = 'flex';
            overlayTitle.textContent = `제 ${currentTurn} 주자`;
            overlayDesc.textContent = "준비가 되면 버튼을 눌러주세요.\n바로 5초 타이머가 시작됩니다!";
            overlayActionBtn.textContent = "지금 시작하기";
        }

        // 오버레이 버튼 리스너 중앙 관리
        overlayActionBtn.addEventListener('click', () => {
            const text = overlayActionBtn.textContent;
            if (text === "지금 시작하기") {
                startTimer();
            } else if (text === "다음 주자 시작 대기") {
                currentTurn++;
                prepareNextTurn();
            } else if (text === "결과 확인하기") {
                showResultMode();
            }
        });

        function startTimer() {
            gameOverlay.style.display = 'none';
            isTimerActive = true;
            turnDisplay.innerHTML = `제 ${currentTurn} 주자 그리는 중!`;
            timerInterval = setInterval(() => {
                timeLeft--;
                timeLeftSpan.textContent = timeLeft;
                if (timeLeft <= 0) endTurn();
            }, 1000);
        }

        function endTurn() {
            isTimerActive = false;
            clearInterval(timerInterval);
            isDrawing = false;
            gameOverlay.style.display = 'flex';
            if (currentTurn >= totalPlayers) {
                overlayTitle.textContent = "모든 순서 종료!";
                overlayDesc.textContent = "작품이 완성되었습니다!\n결과를 확인해볼까요?";
                overlayActionBtn.textContent = "결과 확인하기";
            } else {
                overlayTitle.textContent = "시간 종료!";
                overlayDesc.textContent = `제 ${currentTurn} 주자의 시간이 끝났습니다.\n다음 주자에게 자리를 넘겨주세요.`;
                overlayActionBtn.textContent = "다음 주자 시작 대기";
            }
        }

        function showResultMode() {
            gameOverlay.style.display = 'none';
            document.getElementById('status-controls').classList.add('hidden');
            document.getElementById('toolbar').classList.add('hidden');
            document.getElementById('result-header-actions').classList.remove('hidden');
            document.getElementById('final-msg').classList.remove('hidden');
            canvas.style.cursor = 'default';
            showToast("그림이 최종 완성되었습니다!");
        }

        // 다시 하기 기능 전면 수정
        restartBtn.addEventListener('click', () => {
            if (confirm("처음부터 다시 시작할까요?")) {
                if (timerInterval) clearInterval(timerInterval);
                
                // 모든 변수 초기화
                currentTurn = 1;
                timeLeft = 5;
                isTimerActive = false;
                isDrawing = false;
                currentTool = 'pen';
                currentColor = "#000000";
                currentSize = 12;

                // UI 전면 초기화
                gameArena.classList.add('hidden');
                setupScreen.classList.remove('hidden');
                document.getElementById('status-controls').classList.remove('hidden');
                document.getElementById('toolbar').classList.remove('hidden');
                document.getElementById('result-header-actions').classList.add('hidden');
                document.getElementById('final-msg').classList.add('hidden');
                
                // 캔버스 초기화
                initCanvas();
                
                // 도구 스타일 리셋
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active-option'));
                const defaultColor = document.querySelector('[data-color="#000000"]');
                if (defaultColor) defaultColor.classList.add('active-option');
                
                document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active-option'));
                const defaultSize = document.querySelector('[data-size="12"]');
                if (defaultSize) defaultSize.classList.add('active-option');
                
                document.getElementById('pen-tool').classList.add('active-tool');
                document.getElementById('eraser-tool').classList.remove('active-tool');
                
                showToast("초기 화면으로 돌아왔습니다.");
            }
        });

        /* --- 그리기 핵심 로직 --- */
        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = (e.touches && e.touches.length > 0) ? e.touches[0].clientX : e.clientX;
            const clientY = (e.touches && e.touches.length > 0) ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        canvas.addEventListener('mousedown', (e) => {
            if (!isTimerActive) return;
            isDrawing = true;
            const pos = getMousePos(e);
            [lastX, lastY] = [pos.x, pos.y];
        });

        canvas.addEventListener('mousemove', (e) => {
            const pos = getMousePos(e);
            if (currentTool === 'eraser' && isTimerActive) {
                const size = currentSize * ERASER_MULTIPLIER;
                eraserCursor.style.width = size + 'px';
                eraserCursor.style.height = size + 'px';
                eraserCursor.style.left = pos.x + 'px';
                eraserCursor.style.top = pos.y + 'px';
                eraserCursor.style.display = 'block';
                canvas.style.cursor = 'none';
            } else {
                eraserCursor.style.display = 'none';
                canvas.style.cursor = isTimerActive ? 'crosshair' : 'default';
            }

            if (!isDrawing || !isTimerActive) return;
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.strokeStyle = currentTool === 'eraser' ? '#FFFFFF' : currentColor;
            ctx.lineWidth = currentTool === 'eraser' ? currentSize * ERASER_MULTIPLIER : currentSize;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
            [lastX, lastY] = [pos.x, pos.y];
        });

        window.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('touchstart', (e) => { if (e.target === canvas) e.preventDefault(); }, { passive: false });
        canvas.addEventListener('touchmove', (e) => { if (e.target === canvas) e.preventDefault(); }, { passive: false });
        canvas.addEventListener('touchend', () => isDrawing = false);

        /* --- 도구 버튼 제어 --- */
        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentColor = btn.dataset.color;
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active-option'));
                btn.classList.add('active-option');
                currentTool = 'pen';
                document.getElementById('pen-tool').classList.add('active-tool');
                document.getElementById('eraser-tool').classList.remove('active-tool');
            });
        });

        document.querySelectorAll('.size-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentSize = parseInt(btn.dataset.size);
                document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active-option'));
                btn.classList.add('active-option');
            });
        });

        document.getElementById('pen-tool').addEventListener('click', () => {
            currentTool = 'pen';
            document.getElementById('pen-tool').classList.add('active-tool');
            document.getElementById('eraser-tool').classList.remove('active-tool');
        });

        document.getElementById('eraser-tool').addEventListener('click', () => {
            currentTool = 'eraser';
            document.getElementById('eraser-tool').classList.add('active-tool');
            document.getElementById('pen-tool').classList.remove('active-tool');
        });

        const saveFn = () => {
            try {
                const link = document.createElement('a');
                link.download = `릴레이-그림-완성.png`;
                link.href = canvas.toDataURL("image/png");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("작품이 저장되었습니다!");
            } catch (err) {
                showToast("저장 중 오류가 발생했습니다.");
            }
        };
        document.getElementById('save-image').addEventListener('click', saveFn);
        document.getElementById('final-save-btn').addEventListener('click', saveFn);

        function showToast(m) {
            toast.textContent = m;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 2000);
        }

        // 창 크기 변경 시 대응
        window.addEventListener('resize', () => {
            if (!gameArena.classList.contains('hidden')) {
                const container = canvas.parentElement;
                const tempImage = ctx.getImageData(0, 0, canvas.width, canvas.height);
                canvas.width = container.clientWidth;
                canvas.height = window.innerHeight * 0.55;
                ctx.fillStyle = "white";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.putImageData(tempImage, 0, 0);
            }
        });
    </script>
</body>
</html>
