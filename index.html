<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학 수업 자료실</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8f9fa; }
        .file-list-container { max-height: 0; overflow: hidden; transition: max-height 0.5s ease-out; }
        .file-list-container.open { max-height: 1000px; margin-top: 1.5rem; border-top: 1px solid #eee; padding-top: 1rem; }
    </style>
</head>
<body class="py-12 px-6">
    <div class="max-w-6xl mx-auto">
        <h2 class="text-2xl font-bold text-gray-800 mb-8 px-2 flex items-center">
            <i class="fa-solid fa-graduation-cap text-purple-600 mr-3"></i>학년별 교육과정
        </h2>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-16">
            <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
                <div class="bg-blue-50 w-12 h-12 rounded-xl flex items-center justify-center mb-6 text-blue-600 font-bold text-xl">1</div>
                <h3 class="text-xl font-bold mb-3 text-gray-800">중학교 1학년</h3>
                <button onclick="toggleGrade(1)" class="text-blue-600 font-bold text-sm flex items-center hover:underline">자료 보기 <i id="arrow-1" class="fa-solid fa-chevron-right ml-2 text-xs transition-transform"></i></button>
                <div id="list-1" class="file-list-container"><div id="files-1" class="space-y-2 mt-2"></div></div>
            </div>
            <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
                <div class="bg-green-50 w-12 h-12 rounded-xl flex items-center justify-center mb-6 text-green-600 font-bold text-xl">2</div>
                <h3 class="text-xl font-bold mb-3 text-gray-800">중학교 2학년</h3>
                <button onclick="toggleGrade(2)" class="text-green-600 font-bold text-sm flex items-center hover:underline">자료 보기 <i id="arrow-2" class="fa-solid fa-chevron-right ml-2 text-xs transition-transform"></i></button>
                <div id="list-2" class="file-list-container"><div id="files-2" class="space-y-2 mt-2"></div></div>
            </div>
            <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 ring-2 ring-purple-100">
                <div class="bg-purple-50 w-12 h-12 rounded-xl flex items-center justify-center mb-6 text-purple-600 font-bold text-xl">3</div>
                <h3 class="text-xl font-bold mb-3 text-gray-800">중학교 3학년</h3>
                <button onclick="toggleGrade(3)" class="text-purple-600 font-bold text-sm flex items-center hover:underline">자료 보기 <i id="arrow-3" class="fa-solid fa-chevron-right ml-2 text-xs transition-transform"></i></button>
                <div id="list-3" class="file-list-container"><div id="files-3" class="space-y-2 mt-2"></div></div>
            </div>
        </div>

        <h2 class="text-2xl font-bold text-gray-800 mb-8 px-2 flex items-center">
            <i class="fa-solid fa-dice text-orange-500 mr-3"></i>창의적 체험활동 (보드게임)
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="board-games">
            </div>
    </div>

    <script>
        const repo = "thiago-alcantaraA/ALCANTARA";
        let allFiles = [];

        async function init() {
            try {
                const res = await fetch(`https://api.github.com/repos/${repo}/git/trees/main?recursive=1`);
                const data = await res.json();
                allFiles = data.tree.filter(f => f.path.endsWith('.html') && f.path !== 'index.html');
                renderBoardGames();
            } catch (e) { console.error("데이터 로딩 실패"); }
        }

        function toggleGrade(num) {
            const list = document.getElementById(`list-${num}`);
            const arrow = document.getElementById(`arrow-${num}`);
            const container = document.getElementById(`files-${num}`);
            
            if (!list.classList.contains('open')) {
                const filtered = allFiles.filter(f => f.path.includes(`중${num}`));
                container.innerHTML = filtered.length ? '' : '<p class="text-xs text-gray-400 py-2 italic">자료 준비 중</p>';
                filtered.forEach(file => {
                    const a = document.createElement('a');
                    a.href = file.path;
                    a.className = "block p-3 bg-gray-50 rounded-lg text-sm text-gray-700 hover:bg-purple-50 hover:text-purple-600 transition truncate";
                    a.innerText = file.path.split('/').pop().replace('.html', '');
                    container.appendChild(a);
                });
                list.classList.add('open');
                arrow.style.transform = "rotate(90deg)";
            } else {
                list.classList.remove('open');
                arrow.style.transform = "rotate(0deg)";
            }
        }

        function renderBoardGames() {
            const bgContainer = document.getElementById('board-games');
            const games = allFiles.filter(f => f.path.includes('게임') || f.path.includes('다이스') || f.path.includes('네임'));
            games.forEach(file => {
                const icon = file.path.includes('다이스') ? '🎲' : '🕵️';
                bgContainer.innerHTML += `
                    <a href="${file.path}" class="flex items-center p-6 bg-white rounded-2xl shadow-sm border border-gray-100 hover:shadow-md transition group">
                        <div class="text-3xl mr-6">${icon}</div>
                        <div><h4 class="font-bold text-gray-800 group-hover:text-orange-500">${file.path.split('/').pop().replace('.html', '')}</h4></div>
                    </a>`;
            });
        }
        init();
    </script>
</body>
</html>
