<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학 수업 자료실</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8f9fa; }
        .card:hover { transform: translateY(-5px); transition: 0.3s; }
    </style>
</head>
<body class="py-12 px-6">
    <div class="max-w-5xl mx-auto">
        <div class="mb-12">
            <h2 class="text-2xl font-bold text-gray-800 mb-2">
                <i class="fa-solid fa-book-open text-purple-600 mr-2"></i>학년별 교육과정
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="card bg-white p-8 rounded-2xl shadow-sm border border-gray-100 relative overflow-hidden">
                    <div class="bg-purple-50 w-12 h-12 rounded-xl flex items-center justify-center mb-6 text-purple-600 font-bold text-xl">Σ</div>
                    <h3 class="text-xl font-bold mb-3 text-gray-800">중학교 3학년</h3>
                    <p class="text-gray-500 text-sm leading-relaxed mb-6">제곱근, 무리수, 대소비교 등 3학년 주제별 수업 자료가 준비되어 있습니다.</p>
                    <div class="space-y-3">
                        <a href="제곱근.html" class="flex items-center text-purple-600 font-medium hover:underline">제곱근 시각화 탐구 <i class="fa-solid fa-arrow-right ml-2 text-xs"></i></a>
                        <a href="2차시 대소비교 .html" class="flex items-center text-purple-600 font-medium hover:underline">2차시 대소비교 <i class="fa-solid fa-arrow-right ml-2 text-xs"></i></a>
                        <a href="수직선 위의 무리수 .html" class="flex items-center text-purple-600 font-medium hover:underline">수직선 위의 무리수 <i class="fa-solid fa-arrow-right ml-2 text-xs"></i></a>
                    </div>
                </div>
                <div class="bg-gray-50 p-8 rounded-2xl border border-dashed border-gray-200 opacity-60">
                    <div class="bg-gray-200 w-12 h-12 rounded-xl flex items-center justify-center mb-6 text-gray-400 font-bold text-xl">Σ</div>
                    <h3 class="text-xl font-bold mb-3 text-gray-400">중학교 1학년</h3>
                    <p class="text-gray-400 text-sm">자료 준비 중입니다.</p>
                </div>
                <div class="bg-gray-50 p-8 rounded-2xl border border-dashed border-gray-200 opacity-60">
                    <div class="bg-gray-200 w-12 h-12 rounded-xl flex items-center justify-center mb-6 text-gray-400 font-bold text-xl">Σ</div>
                    <h3 class="text-xl font-bold mb-3 text-gray-400">중학교 2학년</h3>
                    <p class="text-gray-400 text-sm">자료 준비 중입니다.</p>
                </div>
            </div>
        </div>

        <div>
            <h2 class="text-2xl font-bold text-gray-800 mb-6">
                <i class="fa-solid fa-chart-simple text-purple-600 mr-2"></i>창의적 체험활동 (보드게임)
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <a href="코드네임 조별 게임.html" class="card bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between group">
                    <div class="flex items-center">
                        <div class="w-16 h-16 bg-gray-50 rounded-xl flex items-center justify-center text-3xl mr-6">🕵️</div>
                        <div>
                            <h3 class="text-lg font-bold text-gray-800 group-hover:text-purple-600 transition">코드네임 (Codenames)</h3>
                            <p class="text-sm text-gray-500">팀원들과 단어 힌트를 통해 스파이를 찾는 추리 게임</p>
                        </div>
                    </div>
                    <i class="fa-solid fa-arrow-right text-gray-300 group-hover:text-purple-600"></i>
                </a>
                <a href="요트 다이스 조별 게임.html" class="card bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between group">
                    <div class="flex items-center">
                        <div class="w-16 h-16 bg-gray-50 rounded-xl flex items-center justify-center text-3xl mr-6">🎲</div>
                        <div>
                            <h3 class="text-lg font-bold text-gray-800 group-hover:text-purple-600 transition">요트 다이스 (Yacht Dice)</h3>
                            <p class="text-sm text-gray-500">주사위를 굴려 조합을 완성하는 전략 보드게임</p>
                        </div>
                    </div>
                    <i class="fa-solid fa-arrow-right text-gray-300 group-hover:text-purple-600"></i>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
