<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>중3 수학 프로그램</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 py-12 px-6">
    <div class="max-w-4xl mx-auto">
        <a href="index.html" class="text-gray-400 hover:text-orange-600 mb-8 inline-flex items-center transition">
            <i class="fa-solid fa-chevron-left mr-2"></i> 메인 포털로 돌아가기
        </a>
        <div class="bg-white p-10 rounded-[2.5rem] shadow-sm border border-orange-50">
            <h1 class="text-3xl font-bold text-gray-800 mb-2 text-orange-600">중3 수학 프로그램</h1>
            <p class="text-orange-300 mb-10 italic">Interactive Teaching Tools</p>
            <div id="program-list" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <p class="text-gray-300 italic p-10 text-center col-span-2">프로그램을 불러오고 있습니다...</p>
            </div>
        </div>
    </div>
    <script>
        async function loadPrograms() {
            const repo = "thiago-alcantaraA/ALCANTARA";
            const res = await fetch(`https://api.github.com/repos/${repo}/git/trees/main?recursive=1`);
            const data = await res.json();
            const container = document.getElementById('program-list');
            
            const programs = data.tree.filter(f => 
                f.path.includes('중3') && 
                f.path.includes('프로그램') && 
                f.path.endsWith('.html')
            );
            
            if (programs.length === 0) {
                container.innerHTML = '<p class="text-gray-300 italic p-10 text-center col-span-2">등록된 프로그램이 없습니다.</p>';
                return;
            }

            container.innerHTML = '';
            programs.forEach(file => {
                const name = file.path.split('/').pop().replace('.html', '');
                container.innerHTML += `
                    <a href="${encodeURI(file.path)}" class="flex flex-col p-8 bg-orange-50/30 rounded-[2rem] hover:bg-orange-50 transition group border border-transparent hover:border-orange-200">
                        <div class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center shadow-sm mb-6 group-hover:rotate-12 transition text-orange-400 text-xl">
                            <i class="fa-solid fa-laptop-code"></i>
                        </div>
                        <span class="font-bold text-gray-800 group-hover:text-orange-700 text-xl mb-2 font-sans">${name}</span>
                        <span class="text-sm text-orange-300">프로그램 실행하기 →</span>
                    </a>`;
            });
        }
        loadPrograms();
    </script>
</body>
</html>
