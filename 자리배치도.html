<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자리 배치도 생성기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f9fafb;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
        }

        @media print {
            .print-hidden {
                display: none !important;
            }
            body {
                background: white !important;
                padding: 0 !important;
            }
            .main-container {
                max-width: 100% !important;
                margin: 0 !important;
                box-shadow: none !important;
                border: none !important;
            }
            .grid-container {
                gap: 8px !important;
            }
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <!-- 헤더 -->
        <header class="mb-8 text-center print-hidden">
            <h1 class="text-3xl font-bold text-gray-800 mb-2 flex justify-center items-center gap-2">
                <i data-lucide="users" class="text-blue-600"></i> 자리 배치도 생성기
            </h1>
            <p class="text-gray-500 text-sm">교실 상황에 맞춰 행/열을 설정하고 자리를 배치하세요.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <!-- 설정 영역 -->
            <div class="lg:col-span-1 space-y-6 print-hidden">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                    <h2 class="text-lg font-bold mb-4 flex items-center gap-2 text-gray-700 border-b pb-2">
                        <i data-lucide="settings" class="w-5 h-5"></i> 배치 설정
                    </h2>
                    
                    <div class="space-y-4">
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-medium text-gray-600 mb-1">행 (세로)</label>
                                <input type="number" id="rowsInput" min="1" value="5" 
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-gray-600 mb-1">열 (가로)</label>
                                <input type="number" id="colsInput" min="1" value="6" 
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">번호 범위</label>
                            <div class="flex items-center gap-2">
                                <input type="number" id="startNumInput" value="1" 
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                                <span class="text-gray-400">~</span>
                                <input type="number" id="endNumInput" value="30" 
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                        </div>
                    </div>

                    <div class="mt-8 space-y-2">
                        <button id="shuffleBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition-all flex items-center justify-center gap-2">
                            <i data-lucide="shuffle" class="w-5 h-5"></i> 무작위 배치하기
                        </button>
                        <button id="resetBtn" class="w-full bg-white hover:bg-gray-50 text-gray-500 font-medium py-2 px-4 rounded-xl border border-gray-200 transition-all flex items-center justify-center gap-2">
                            <i data-lucide="trash-2" class="w-4 h-4"></i> 초기화
                        </button>
                    </div>
                </div>

                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                    <h3 class="text-sm font-bold text-gray-700 mb-3">도움말</h3>
                    <ul class="text-xs text-gray-500 space-y-2">
                        <li class="flex gap-2">• 각 자리를 클릭하여 <strong>고정석</strong>이나 <strong>통로(제외)</strong>를 설정할 수 있습니다.</li>
                        <li class="flex gap-2">• 설정을 마친 후 '무작위 배치하기'를 누르세요.</li>
                    </ul>
                </div>
            </div>

            <!-- 배치도 메인 영역 -->
            <div class="lg:col-span-3">
                <div id="captureArea" class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-200 relative min-h-[600px] flex flex-col main-container">
                    <!-- 상단: 교실 앞 -->
                    <div class="flex justify-between items-center mb-10">
                        <div class="flex-1 h-px bg-gray-200 mr-4"></div>
                        <div class="px-6 py-2 bg-gray-800 text-white rounded-lg text-sm font-bold tracking-widest shadow-md">
                            교실 앞 (칠판)
                        </div>
                        <div class="flex-1 h-px bg-gray-200 ml-4"></div>
                        
                        <button onclick="window.print()" class="ml-4 p-2 text-gray-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-all print-hidden" title="인쇄하기">
                            <i data-lucide="printer"></i>
                        </button>
                    </div>

                    <!-- 그리드 좌석 배치 -->
                    <div id="seatingGrid" class="grid gap-3 flex-grow grid-container">
                        <!-- JS에서 동적으로 생성됨 -->
                    </div>

                    <!-- 하단: 교실 뒤 -->
                    <div class="mt-12 flex justify-center items-center">
                        <div class="w-12 h-px bg-gray-100"></div>
                        <div class="px-8 py-2 bg-gray-100 text-gray-400 rounded-full text-xs font-bold border border-gray-200">
                            교실 뒤
                        </div>
                        <div class="w-12 h-px bg-gray-100"></div>
                    </div>

                    <!-- 범례 -->
                    <div class="mt-8 flex justify-center gap-6 text-[10px] text-gray-400 font-medium">
                        <div class="flex items-center gap-1.5">
                            <div class="w-2.5 h-2.5 bg-blue-50 border border-blue-400 rounded-sm"></div> 고정석
                        </div>
                        <div class="flex items-center gap-1.5">
                            <div class="w-2.5 h-2.5 bg-gray-50 border border-gray-200 border-dashed rounded-sm"></div> 제외(통로)
                        </div>
                        <div class="flex items-center gap-1.5">
                            <div class="w-2.5 h-2.5 bg-white border border-gray-100 rounded-sm"></div> 일반석
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 편집 모달 -->
    <div id="editModal" class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop p-4 hidden print-hidden">
        <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-[280px] border border-gray-200">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-bold text-gray-800 text-sm">
                   <span id="modalSeatId" class="text-blue-600 mr-1">#1</span> 자리 설정
                </h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="space-y-3" id="modalControls">
                <!-- 동적 컨트롤 -->
            </div>
        </div>
    </div>

    <script>
        // 상태 관리
        let rows = 5;
        let cols = 6;
        let startNum = 1;
        let endNum = 30;
        let seatingPlan = [];
        let editingIndex = null;

        // 초기화 함수
        function init() {
            rows = parseInt(document.getElementById('rowsInput').value);
            cols = parseInt(document.getElementById('colsInput').value);
            startNum = parseInt(document.getElementById('startNumInput').value);
            endNum = parseInt(document.getElementById('endNumInput').value);

            const totalSeats = rows * cols;
            seatingPlan = Array(totalSeats).fill(null).map(() => ({
                value: null,
                isFixed: false,
                isExcluded: false
            }));
            
            renderGrid();
            lucide.createIcons();
        }

        // 그리드 렌더링
        function renderGrid() {
            const grid = document.getElementById('seatingGrid');
            grid.innerHTML = '';
            grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;

            seatingPlan.forEach((seat, index) => {
                const btn = document.createElement('button');
                btn.onclick = () => openModal(index);
                
                let classes = "relative aspect-[4/3] flex flex-col items-center justify-center rounded-xl border-2 transition-all group ";
                if (seat.isExcluded) {
                    classes += "bg-gray-50 border-gray-200 border-dashed opacity-50";
                } else if (seat.isFixed) {
                    classes += "bg-blue-50 border-blue-400 ring-2 ring-blue-500/20";
                } else {
                    classes += "bg-white border-gray-100 hover:border-blue-300 hover:shadow-md";
                }
                btn.className = classes;

                const indexBadge = `<span class="absolute top-1.5 left-2 text-[10px] font-medium text-gray-300 group-hover:text-blue-400 transition-colors">${index + 1}</span>`;
                
                let content = "";
                if (seat.isExcluded) {
                    content = `<div class="flex flex-col items-center text-gray-300"><i data-lucide="ban" class="w-4 h-4"></i><span class="text-[10px] font-bold mt-0.5">제외</span></div>`;
                } else if (seat.isFixed) {
                    content = `<div class="flex flex-col items-center"><span class="text-2xl font-black text-blue-700 leading-none">${seat.value}</span><i data-lucide="lock" class="w-2.5 h-2.5 text-blue-400 mt-1"></i></div>`;
                } else {
                    content = `<div class="flex flex-col items-center"><span class="text-2xl font-black leading-none ${seat.value ? 'text-gray-800' : 'text-gray-100'}">${seat.value || "?"}</span></div>`;
                }

                btn.innerHTML = indexBadge + content;
                grid.appendChild(btn);
            });
            lucide.createIcons();
        }

        // 모달 열기
        function openModal(index) {
            editingIndex = index;
            const seat = seatingPlan[index];
            document.getElementById('modalSeatId').innerText = `#${index + 1}`;
            
            const controls = document.getElementById('modalControls');
            controls.innerHTML = '';

            if (!seat.isExcluded) {
                const fixArea = document.createElement('div');
                fixArea.className = "flex gap-2 mb-3";
                fixArea.innerHTML = `
                    <input type="number" id="tempInput" value="${seat.value || ''}" placeholder="번호 입력" 
                        class="flex-1 px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-center font-bold">
                    <button onclick="applyFixedNumber()" class="px-3 bg-blue-600 text-white rounded-lg font-bold">
                        <i data-lucide="check" class="w-5 h-5"></i>
                    </button>
                `;
                controls.appendChild(fixArea);
            }

            const excludeBtn = document.createElement('button');
            excludeBtn.className = `w-full flex items-center justify-center gap-2 py-2.5 rounded-lg font-bold text-xs transition-all ${
                seat.isExcluded ? 'bg-green-50 text-green-600 border border-green-200' : 'bg-gray-100 text-gray-600 border border-gray-200'
            }`;
            excludeBtn.onclick = toggleExclude;
            excludeBtn.innerHTML = seat.isExcluded 
                ? `<i data-lucide="undo-2" class="w-4 h-4"></i> 자리에 학생 배정하기`
                : `<i data-lucide="ban" class="w-4 h-4"></i> 이 자리 비워두기(통로)`;
            controls.appendChild(excludeBtn);

            if (seat.isFixed) {
                const clearBtn = document.createElement('button');
                clearBtn.className = "w-full mt-2 py-2 text-[11px] font-bold text-red-400 hover:bg-red-50 rounded-lg";
                clearBtn.onclick = clearFixed;
                clearBtn.innerText = "고정 해제";
                controls.appendChild(clearBtn);
            }

            document.getElementById('editModal').classList.remove('hidden');
            lucide.createIcons();
            
            if (!seat.isExcluded) document.getElementById('tempInput').focus();
        }

        function closeModal() {
            document.getElementById('editModal').classList.add('hidden');
            editingIndex = null;
        }

        function applyFixedNumber() {
            const val = parseInt(document.getElementById('tempInput').value);
            if (!isNaN(val)) {
                seatingPlan[editingIndex] = { value: val, isFixed: true, isExcluded: false };
                renderGrid();
                closeModal();
            }
        }

        function clearFixed() {
            seatingPlan[editingIndex] = { ...seatingPlan[editingIndex], value: null, isFixed: false };
            renderGrid();
            closeModal();
        }

        function toggleExclude() {
            const current = seatingPlan[editingIndex];
            seatingPlan[editingIndex] = { value: null, isFixed: false, isExcluded: !current.isExcluded };
            renderGrid();
            closeModal();
        }

        // 무작위 셔플
        function shuffle() {
            const start = parseInt(document.getElementById('startNumInput').value);
            const end = parseInt(document.getElementById('endNumInput').value);
            if (start > end) return;

            // 번호 풀 생성
            const allNumbers = [];
            for (let i = start; i <= end; i++) allNumbers.push(i);

            // 고정된 번호 제거
            const fixedNumbers = seatingPlan
                .filter(s => s.isFixed && s.value !== null)
                .map(s => s.value);
            
            let availableNumbers = allNumbers.filter(n => !fixedNumbers.includes(n));

            // 셔플
            for (let i = availableNumbers.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [availableNumbers[i], availableNumbers[availableNumbers.length - 1]] = [availableNumbers[availableNumbers.length - 1], availableNumbers[i]]; // Dummy swap for logic
                // Real shuffle logic:
                const temp = availableNumbers[i];
                availableNumbers[i] = availableNumbers[j];
                availableNumbers[j] = temp;
            }

            // 배치
            seatingPlan = seatingPlan.map(seat => {
                if (seat.isExcluded || seat.isFixed) return seat;
                return { ...seat, value: availableNumbers.length > 0 ? availableNumbers.shift() : null };
            });

            renderGrid();
        }

        // 이벤트 리스너
        document.getElementById('rowsInput').onchange = init;
        document.getElementById('colsInput').onchange = init;
        document.getElementById('startNumInput').onchange = init;
        document.getElementById('endNumInput').onchange = init;
        document.getElementById('shuffleBtn').onclick = shuffle;
        document.getElementById('resetBtn').onclick = init;

        // 초기 실행
        window.onload = init;
    </script>
</body>
</html>
