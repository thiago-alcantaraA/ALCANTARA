<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자리 배치도 생성기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide 아이콘 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8fafc;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
        }

        /* 회전 애니메이션 및 스타일 */
        .rotate-180-visual {
            transform: rotate(180deg);
        }
        
        .seat-content-reverse {
            transform: rotate(180deg);
        }

        @media print {
            .print-hidden {
                display: none !important;
            }
            body {
                background: white !important;
                padding: 0 !important;
            }
            .main-container {
                max-width: 100% !important;
                margin: 0 !important;
                box-shadow: none !important;
                border: none !important;
            }
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <!-- 메인 섹션 -->
        <div id="seatingSection" class="animate-in fade-in duration-500">
            <header class="mb-10 text-center print-hidden relative">
                <div class="flex flex-col md:flex-row justify-center items-center gap-4">
                    <h1 class="text-4xl font-black text-gray-900 flex items-center gap-3">
                        <i data-lucide="users" class="text-blue-600 w-10 h-10"></i> 자리 배치도 생성기
                    </h1>
                    <div class="flex gap-2">
                        <button onclick="toggleFlip()" class="flex items-center gap-2 bg-white hover:bg-gray-50 text-gray-700 font-bold px-5 py-2.5 rounded-2xl border border-gray-200 shadow-sm transition-all active:scale-95">
                            <i data-lucide="rotate-cw" id="flipIcon" class="w-5 h-5 transition-transform duration-500"></i>
                            화면 뒤집기
                        </button>
                        <button onclick="openLineModal()" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-2xl shadow-sm transition-all active:scale-95">
                            <i data-lucide="layout-list" class="w-5 h-5"></i>
                            줄별 배치
                        </button>
                    </div>
                </div>
                <p class="text-gray-500 font-medium mt-3">교실 상황에 맞춰 학생들의 자리를 배치하고 관리하세요.</p>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
                <!-- 설정 패널 -->
                <div class="lg:col-span-1 space-y-6 print-hidden">
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-200">
                        <h2 class="text-xl font-bold mb-5 flex items-center gap-2 text-gray-800 border-b pb-3">
                            <i data-lucide="settings-2" class="w-5 h-5 text-blue-500"></i> 배치 옵션
                        </h2>
                        
                        <div class="space-y-5">
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-2">행 (세로줄)</label>
                                    <input type="number" id="rowsInput" min="1" value="5" 
                                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none font-bold text-center">
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-2">열 (가로줄)</label>
                                    <input type="number" id="colsInput" min="1" value="6" 
                                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none font-bold text-center">
                                </div>
                            </div>

                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-2">번호 범위 (시작 ~ 끝)</label>
                                <div class="flex items-center gap-2">
                                    <input type="number" id="startNumInput" value="1" 
                                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none font-bold text-center">
                                    <span class="text-gray-400 font-bold">~</span>
                                    <input type="number" id="endNumInput" value="30" 
                                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none font-bold text-center">
                                </div>
                            </div>
                        </div>

                        <div class="mt-8 space-y-3">
                            <button id="shuffleBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 px-4 rounded-2xl transition-all flex items-center justify-center gap-2 shadow-lg shadow-blue-100 text-lg">
                                <i data-lucide="shuffle" class="w-6 h-6"></i> 무작위 배치 시작
                            </button>
                            <button id="shuffleRemainingBtn" class="hidden w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 px-4 rounded-2xl transition-all flex items-center justify-center gap-2 shadow-lg shadow-emerald-100 text-lg animate-bounce">
                                <i data-lucide="sparkles" class="w-6 h-6"></i> 그외 자리 무작위 배정
                            </button>
                            <button id="resetBtn" class="w-full bg-white hover:bg-gray-50 text-gray-500 font-bold py-3 px-4 rounded-2xl border border-gray-200 transition-all flex items-center justify-center gap-2">
                                <i data-lucide="refresh-cw" class="w-5 h-5"></i> 설정 초기화
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 배치판 메인 -->
                <div class="lg:col-span-3">
                    <div id="captureArea" class="bg-white p-8 md:p-12 rounded-[2rem] shadow-xl border border-gray-100 relative min-h-[700px] flex flex-col main-container transition-all duration-500">
                        
                        <!-- 상단 라벨 -->
                        <div id="topLabelContainer" class="flex justify-between items-center mb-12 order-1">
                            <div class="flex-1 h-1 bg-gradient-to-r from-transparent via-gray-200 to-transparent mr-4"></div>
                            <div id="topLabel" class="px-10 py-3 bg-gray-900 text-white rounded-2xl text-lg font-black tracking-[0.3em] shadow-xl min-w-[180px] text-center">
                                칠 판
                            </div>
                            <div class="flex-1 h-1 bg-gradient-to-r from-transparent via-gray-200 to-transparent ml-4"></div>
                            
                            <button onclick="window.print()" class="ml-6 p-3 text-gray-400 hover:text-blue-600 hover:bg-blue-50 rounded-2xl transition-all print-hidden" title="인쇄 및 저장">
                                <i data-lucide="printer" class="w-6 h-6"></i>
                            </button>
                        </div>

                        <!-- 그리드 영역 -->
                        <div id="gridWrapper" class="flex-grow order-2 transition-transform duration-500">
                            <div id="seatingGrid" class="grid gap-4 h-full transition-transform duration-500">
                                <!-- 자바스크립트로 생성 -->
                            </div>
                        </div>

                        <!-- 하단 라벨 -->
                        <div id="bottomLabelContainer" class="mt-16 flex flex-col items-center order-3">
                            <div id="bottomLabel" class="px-12 py-2 bg-gray-50 text-gray-400 rounded-full text-xs font-black border border-gray-100 tracking-widest mb-4">
                                사물함
                            </div>
                            <div class="w-32 h-1.5 bg-gray-100 rounded-full"></div>
                        </div>

                        <!-- 범례 -->
                        <div class="mt-10 flex justify-center gap-8 text-xs text-gray-400 font-bold print-hidden order-4">
                            <div class="flex items-center gap-2">
                                <div class="w-4 h-4 bg-blue-100 border-2 border-blue-400 rounded-md"></div> 고정석
                            </div>
                            <div class="flex items-center gap-2">
                                <div class="w-4 h-4 bg-red-50 border-2 border-red-300 border-dashed rounded-md flex items-center justify-center">
                                    <i data-lucide="x" class="w-3 h-3 text-red-400"></i>
                                </div> 제외석 (통로)
                            </div>
                            <div class="flex items-center gap-2">
                                <div class="w-4 h-4 bg-white border-2 border-gray-100 rounded-md"></div> 일반석
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 설정 모달 -->
    <div id="editModal" class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop p-4 hidden print-hidden">
        <div class="bg-white rounded-[2rem] shadow-2xl p-8 w-full max-w-[320px] border border-gray-100 animate-in zoom-in duration-200">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-black text-gray-900 text-lg">
                   <span id="modalSeatId" class="text-blue-600 mr-2">#1</span> 자리 설정
                </h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-900 transition-colors">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <div class="space-y-4" id="modalControls">
                <!-- 동적 버튼 생성 -->
            </div>
        </div>
    </div>

    <!-- 줄별 배치 모달 -->
    <div id="lineModal" class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop p-4 hidden print-hidden">
        <div class="bg-white rounded-[2.5rem] shadow-2xl p-10 w-full max-w-[500px] border border-gray-100 animate-in zoom-in duration-200">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-black text-gray-900 text-xl flex items-center gap-2">
                   <i data-lucide="layout-list" class="text-indigo-600"></i> 줄별 무작위 배치 (다중 선택)
                </h3>
                <button onclick="closeLineModal()" class="text-gray-400 hover:text-gray-900 transition-colors">
                    <i data-lucide="x" class="w-7 h-7"></i>
                </button>
            </div>

            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-3 uppercase tracking-wider">배치할 줄 선택 (중복 선택 가능)</label>
                    <div id="lineSelector" class="grid grid-cols-3 sm:grid-cols-6 gap-2">
                        <!-- 열 개수에 따라 동적 생성 -->
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-2 uppercase tracking-wider">배치할 번호들 입력</label>
                    <textarea id="lineNumbers" placeholder="예: 1, 3, 5, 10, 12 (공백이나 쉼표로 구분)" 
                        class="w-full h-32 p-4 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none font-bold text-gray-700 resize-none"></textarea>
                </div>

                <div class="flex gap-2">
                    <button onclick="closeLineModal()" class="flex-1 py-4 bg-gray-100 text-gray-500 rounded-2xl font-bold hover:bg-gray-200 transition-all">취소</button>
                    <button onclick="executeLineShuffle()" class="flex-[2] py-4 bg-indigo-600 text-white rounded-2xl font-black text-lg hover:bg-indigo-700 shadow-xl shadow-indigo-100 transition-all active:scale-95 flex items-center justify-center gap-2">
                        <i data-lucide="play-circle" class="w-6 h-6"></i> 선택 줄 무작위 배치 실행
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let rows = 5;
        let cols = 6;
        let seatingPlan = [];
        let editingIndex = null;
        let isFlipped = false;
        let selectedLines = new Set(); 

        function toggleFlip() {
            isFlipped = !isFlipped;
            const gridWrapper = document.getElementById('gridWrapper');
            const flipIcon = document.getElementById('flipIcon');
            const topLabel = document.getElementById('topLabel');
            const bottomLabel = document.getElementById('bottomLabel');

            if (isFlipped) {
                flipIcon.style.transform = 'rotate(180deg)';
                topLabel.innerText = '사물함';
                topLabel.classList.remove('bg-gray-900', 'text-white');
                topLabel.classList.add('bg-gray-50', 'text-gray-400', 'rounded-full', 'text-xs', 'border-gray-100');
                
                bottomLabel.innerText = '칠 판';
                bottomLabel.classList.remove('bg-gray-50', 'text-gray-400', 'rounded-full', 'text-xs', 'border-gray-100');
                bottomLabel.classList.add('bg-gray-900', 'text-white', 'rounded-2xl', 'text-lg', 'tracking-[0.3em]');
                
                gridWrapper.classList.add('rotate-180-visual');
            } else {
                flipIcon.style.transform = 'rotate(0deg)';
                topLabel.innerText = '칠 판';
                topLabel.classList.add('bg-gray-900', 'text-white', 'rounded-2xl', 'text-lg', 'tracking-[0.3em]');
                topLabel.classList.remove('bg-gray-50', 'text-gray-400', 'rounded-full', 'text-xs', 'border-gray-100');
                
                bottomLabel.innerText = '사물함';
                bottomLabel.classList.add('bg-gray-50', 'text-gray-400', 'rounded-full', 'text-xs', 'border-gray-100');
                bottomLabel.classList.remove('bg-gray-900', 'text-white', 'rounded-2xl', 'text-lg', 'tracking-[0.3em]');
                
                gridWrapper.classList.remove('rotate-180-visual');
            }
            renderGrid();
        }

        function initSeating() {
            rows = parseInt(document.getElementById('rowsInput').value) || 1;
            cols = parseInt(document.getElementById('colsInput').value) || 1;
            const total = rows * cols;
            seatingPlan = Array(total).fill(null).map(() => ({
                value: null,
                isFixed: false,
                isExcluded: false
            }));
            selectedLines.clear();
            document.getElementById('shuffleRemainingBtn').classList.add('hidden');
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('seatingGrid');
            grid.innerHTML = '';
            grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;

            seatingPlan.forEach((seat, index) => {
                const btn = document.createElement('button');
                btn.onclick = () => openModal(index);
                
                let baseClass = "relative aspect-[5/4] flex flex-col items-center justify-center rounded-2xl border-2 transition-all group ";
                let contentClass = isFlipped ? "seat-content-reverse flex flex-col items-center justify-center w-full h-full" : "flex flex-col items-center justify-center w-full h-full";

                if (seat.isExcluded) {
                    btn.className = baseClass + "bg-red-50/50 border-red-200 border-dashed";
                    btn.innerHTML = `<div class="${contentClass}">
                        <span class="absolute top-2 left-3 text-[10px] font-black text-red-300">${index+1}</span>
                        <i data-lucide="x" class="w-10 h-10 text-red-400 stroke-[3px]"></i>
                    </div>`;
                } else if (seat.isFixed) {
                    btn.className = baseClass + "bg-blue-50 border-blue-400 ring-4 ring-blue-500/10";
                    btn.innerHTML = `<div class="${contentClass}">
                        <span class="absolute top-2 left-3 text-[10px] font-black text-blue-300">${index+1}</span>
                        <span class="text-3xl font-black text-blue-700">${seat.value}</span>
                        <i data-lucide="lock" class="w-3 h-3 text-blue-400 absolute bottom-2 right-3"></i>
                    </div>`;
                } else {
                    btn.className = baseClass + "bg-white border-gray-100 hover:border-blue-200 hover:shadow-lg";
                    btn.innerHTML = `<div class="${contentClass}">
                        <span class="absolute top-2 left-3 text-[10px] font-black text-gray-200 group-hover:text-blue-300">${index+1}</span>
                        <span class="text-3xl font-black ${seat.value ? 'text-gray-800' : 'text-gray-50'}">${seat.value || '?'}</span>
                    </div>`;
                }
                grid.appendChild(btn);
            });
            lucide.createIcons();
        }

        function openModal(index) {
            editingIndex = index;
            const seat = seatingPlan[index];
            document.getElementById('modalSeatId').innerText = `#${index + 1}`;
            const controls = document.getElementById('modalControls');
            controls.innerHTML = '';

            if (!seat.isExcluded) {
                const inputDiv = document.createElement('div');
                inputDiv.className = "flex items-center gap-2 mb-2 w-full";
                inputDiv.innerHTML = `
                    <input type="number" id="fixedVal" value="${seat.value || ''}" placeholder="번호" 
                        class="flex-1 w-0 px-3 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-center font-black text-lg">
                    <button onclick="setFixedSeat()" class="whitespace-nowrap px-4 py-3 bg-blue-600 text-white rounded-xl font-bold shadow-lg shadow-blue-100">
                        저장
                    </button>
                `;
                controls.appendChild(inputDiv);
            }

            const toggleExBtn = document.createElement('button');
            toggleExBtn.className = `w-full py-4 rounded-xl font-black text-sm flex items-center justify-center gap-2 border-2 transition-all ${
                seat.isExcluded ? 'bg-green-50 text-green-700 border-green-200' : 'bg-gray-50 text-gray-600 border-gray-100'
            }`;
            toggleExBtn.onclick = toggleExcluded;
            toggleExBtn.innerHTML = seat.isExcluded 
                ? `<i data-lucide="check-circle" class="w-5 h-5"></i> 다시 활성화`
                : `<i data-lucide="ban" class="w-5 h-5"></i> 통로(제외석) 설정`;
            controls.appendChild(toggleExBtn);

            if (seat.isFixed) {
                const clearBtn = document.createElement('button');
                clearBtn.className = "w-full py-2 text-xs font-bold text-red-400 hover:bg-red-50 rounded-xl transition-colors mt-2";
                clearBtn.onclick = clearSeat;
                clearBtn.innerText = "고정 해제";
                controls.appendChild(clearBtn);
            }

            document.getElementById('editModal').classList.remove('hidden');
            lucide.createIcons();
            
            const input = document.getElementById('fixedVal');
            if(input) setTimeout(() => input.focus(), 50);
        }

        function closeModal() {
            document.getElementById('editModal').classList.add('hidden');
            editingIndex = null;
        }

        function openLineModal() {
            const selector = document.getElementById('lineSelector');
            selector.innerHTML = '';
            for (let i = 0; i < cols; i++) {
                const btn = document.createElement('button');
                const isSelected = selectedLines.has(i);
                btn.className = `py-3 rounded-xl font-black transition-all ${isSelected ? 'bg-indigo-600 text-white ring-4 ring-indigo-100' : 'bg-gray-50 text-gray-400 hover:bg-gray-100'}`;
                btn.innerText = `${i + 1}열`;
                btn.onclick = () => {
                    if (selectedLines.has(i)) selectedLines.delete(i);
                    else selectedLines.add(i);
                    openLineModal(); 
                };
                selector.appendChild(btn);
            }
            document.getElementById('lineModal').classList.remove('hidden');
            lucide.createIcons();
        }

        function closeLineModal() {
            document.getElementById('lineModal').classList.add('hidden');
        }

        function executeLineShuffle() {
            const inputStr = document.getElementById('lineNumbers').value;
            const numbers = inputStr.match(/\d+/g)?.map(Number) || [];
            
            if (numbers.length === 0) return;
            if (selectedLines.size === 0) return;

            let targetIndices = [];
            selectedLines.forEach(colIdx => {
                for (let r = 0; r < rows; r++) {
                    const idx = r * cols + colIdx;
                    const seat = seatingPlan[idx];
                    if (!seat.isExcluded && !seat.isFixed) {
                        targetIndices.push(idx);
                        seatingPlan[idx].value = null;
                    }
                }
            });

            if (targetIndices.length === 0) return;

            for (let i = numbers.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
            }

            for (let i = targetIndices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [targetIndices[i], targetIndices[j]] = [targetIndices[j], targetIndices[i]];
            }

            numbers.forEach((num, i) => {
                if (i < targetIndices.length) {
                    seatingPlan[targetIndices[i]].value = num;
                }
            });

            renderGrid();
            closeLineModal();
            document.getElementById('shuffleRemainingBtn').classList.remove('hidden');
        }

        function setFixedSeat() {
            const val = parseInt(document.getElementById('fixedVal').value);
            if (!isNaN(val)) {
                seatingPlan[editingIndex] = { value: val, isFixed: true, isExcluded: false };
                renderGrid();
                closeModal();
            }
        }

        function clearSeat() {
            seatingPlan[editingIndex] = { value: null, isFixed: false, isExcluded: false };
            renderGrid();
            closeModal();
        }

        function toggleExcluded() {
            const isEx = seatingPlan[editingIndex].isExcluded;
            seatingPlan[editingIndex] = { value: null, isFixed: false, isExcluded: !isEx };
            renderGrid();
            closeModal();
        }

        function shuffleSeating() {
            const start = parseInt(document.getElementById('startNumInput').value);
            const end = parseInt(document.getElementById('endNumInput').value);
            if (start > end) return;
            
            const allNumbers = [];
            for (let i = start; i <= end; i++) allNumbers.push(i);
            
            const fixedNumbers = seatingPlan.filter(s => s.isFixed && s.value !== null).map(s => s.value);
            let pool = allNumbers.filter(n => !fixedNumbers.includes(n));
            
            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }
            
            seatingPlan = seatingPlan.map(seat => {
                if (seat.isExcluded || seat.isFixed) return seat;
                return { ...seat, value: pool.length > 0 ? pool.shift() : null };
            });
            
            document.getElementById('shuffleRemainingBtn').classList.add('hidden');
            renderGrid();
        }

        function shuffleRemaining() {
            const start = parseInt(document.getElementById('startNumInput').value);
            const end = parseInt(document.getElementById('endNumInput').value);
            if (start > end) return;

            const allNumbers = [];
            for (let i = start; i <= end; i++) allNumbers.push(i);
            
            const usedNumbers = seatingPlan.filter(s => s.value !== null).map(s => s.value);
            let pool = allNumbers.filter(n => !usedNumbers.includes(n));
            
            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }

            seatingPlan = seatingPlan.map(seat => {
                if (seat.isExcluded || seat.isFixed || seat.value !== null) return seat;
                return { ...seat, value: pool.length > 0 ? pool.shift() : null };
            });

            document.getElementById('shuffleRemainingBtn').classList.add('hidden');
            renderGrid();
        }

        window.onload = () => {
            initSeating();
            lucide.createIcons();
            document.getElementById('rowsInput').onchange = initSeating;
            document.getElementById('colsInput').onchange = initSeating;
            document.getElementById('shuffleBtn').onclick = shuffleSeating;
            document.getElementById('shuffleRemainingBtn').onclick = shuffleRemaining;
            document.getElementById('resetBtn').onclick = initSeating;
        };
    </script>
</body>
</html>
