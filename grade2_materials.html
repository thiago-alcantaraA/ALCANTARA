<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>중2 수업자료</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 py-12 px-6">
    <div class="max-w-4xl mx-auto">
        <a href="index.html" class="text-gray-400 hover:text-green-600 mb-8 inline-block font-bold">← 메인으로 돌아가기</a>
        <div class="bg-white p-10 rounded-[2.5rem] shadow-sm border border-gray-100">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">중학교 2학년 수업자료</h1>
            <p class="text-gray-400 mb-10 italic">Grade 2 Mathematics Materials</p>
            <div id="file-list" class="grid grid-cols-1 gap-4"></div>
        </div>
    </div>
    <script>
        async function loadFiles() {
            const res = await fetch(`https://api.github.com/repos/thiago-alcantaraA/ALCANTARA/git/trees/main?recursive=1`);
            const data = await res.json();
            const container = document.getElementById('file-list');
            // '중2' 포함 + '프로그램' 미포함 필터링
            const files = data.tree.filter(f => f.path.includes('중2') && !f.path.includes('프로그램') && f.path.endsWith('.html') && !f.path.includes('grade'));
            container.innerHTML = files.length ? '' : '<p class="text-center text-gray-300">등록된 자료가 없습니다.</p>';
            files.forEach(file => {
                const name = file.path.split('/').pop().replace('.html', '');
                container.innerHTML += `<a href="${encodeURI(file.path)}" class="flex items-center p-6 bg-gray-50 rounded-2xl hover:bg-green-50 transition border border-transparent hover:border-green-100 font-bold text-gray-700"><i class="fa-solid fa-book-open mr-4 text-green-400"></i>${name}</a>`;
            });
        }
        loadFiles();
    </script>
</body>
</html>
