<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이차방정식 인수분해 마스터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        
        body {
            font-family: 'Jua', sans-serif;
            background-color: #f1f5f9;
            overflow: hidden;
            user-select: none;
            /* 화면 배율을 125%로 조정 (표준 브라우저 대응) */
            zoom: 1.25; 
        }

        /* Zoom 미지원 브라우저 대비 (필요 시) */
        @supports not (zoom: 1.25) {
            #game-main {
                transform: scale(1.25);
                transform-origin: top center;
            }
        }

        .balloon {
            width: 85px;
            height: 105px;
            border-radius: 50% 50% 50% 50% / 45% 45% 55% 55%;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: inset -6px -8px 0 rgba(0,0,0,0.1), 0 10px 15px -3px rgba(0,0,0,0.1);
            transition: transform 0.2s, background-color 0.2s;
            position: absolute;
            z-index: 10;
            text-align: center;
            padding: 4px;
            border: 2px solid rgba(255,255,255,0.4);
            white-space: nowrap;
            overflow: visible;
        }

        .balloon::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 12px solid currentColor;
        }

        .frac {
            display: inline-flex;
            flex-direction: column;
            vertical-align: middle;
            text-align: center;
            font-size: 0.85em;
            line-height: 1.1;
            margin: 0 0.1rem;
        }
        .num {
            border-bottom: 1.5px solid currentColor;
            padding: 0 2px;
        }
        .den {
            padding: 0 2px;
        }

        .static-balloon {
            position: relative !important;
            margin: auto;
        }

        @keyframes conveyor {
            from { left: -120px; }
            to { left: 110vw; }
        }

        .conveyor-move {
            animation: conveyor 25s linear forwards;
        }

        .pop-effect { animation: pop 0.4s forwards; }
        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(0); opacity: 0; }
        }

        .shake-effect { animation: shake 0.5s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 12px;
            padding: 12px;
            height: 100%;
        }

        .config-btn.active {
            background-color: #2563eb;
            color: white;
            border-color: #1d4ed8;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        
        .team-card.active {
            border-color: #eab308;
            background-color: #fefce8;
            transform: scale(1.02);
        }

        .bonus-notify {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            color: #fbbf24;
            font-weight: 900;
            text-shadow: 2px 2px 0 #b45309, 0 0 30px rgba(251, 191, 36, 0.5);
            z-index: 100;
            pointer-events: none;
            animation: bonusAnim 2s ease-out forwards;
        }

        @keyframes bonusAnim {
            0% { transform: translate(-50%, 20%) scale(0.5); opacity: 0; }
            30% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            100% { transform: translate(-50%, -150%) scale(1); opacity: 0; }
        }

        .hidden { display: none; }
    </style>
</head>
<body class="p-4 bg-slate-100">

    <div id="game-main" class="max-w-6xl mx-auto">
        
        <!-- 대시보드 섹션 -->
        <div class="bg-white rounded-[2rem] shadow-xl p-4 mb-4 border-b-8 border-blue-200">
            <div class="grid grid-cols-1 lg:grid-cols-4 gap-4 items-center">
                
                <!-- 시간 설정 -->
                <div class="space-y-1">
                    <p class="text-slate-400 text-center text-[10px] font-bold uppercase">시간 설정</p>
                    <div class="flex gap-1.5 justify-center">
                        <button onclick="changeLimit(60, this)" class="config-btn flex-1 py-1.5 border-2 border-slate-200 rounded-xl text-xs font-bold active">1분</button>
                        <button onclick="changeLimit(120, this)" class="config-btn flex-1 py-1.5 border-2 border-slate-200 rounded-xl text-xs font-bold">2분</button>
                        <button onclick="changeLimit(180, this)" class="config-btn flex-1 py-1.5 border-2 border-slate-200 rounded-xl text-xs font-bold">3분</button>
                    </div>
                </div>

                <!-- 단계 선택 -->
                <div class="space-y-1">
                    <p class="text-slate-400 text-center text-[10px] font-bold uppercase">시작 단계</p>
                    <div class="flex gap-1.5 justify-center">
                        <button onclick="changeStartRound(1, this)" class="config-btn flex-1 py-1.5 border-2 border-slate-200 rounded-xl text-xs font-bold active">1단계</button>
                        <button onclick="changeStartRound(2, this)" class="config-btn flex-1 py-1.5 border-2 border-slate-200 rounded-xl text-xs font-bold">2단계</button>
                        <button onclick="changeStartRound(3, this)" class="config-btn flex-1 py-1.5 border-2 border-slate-200 rounded-xl text-xs font-bold">3단계</button>
                    </div>
                </div>

                <!-- 중앙 타이머 및 시작 -->
                <div class="bg-slate-800 rounded-2xl p-3 flex flex-col items-center justify-center gap-1 shadow-lg">
                    <div class="flex items-center gap-3">
                        <span id="round-label" class="bg-blue-600 text-white px-2 py-0.5 rounded-full text-[10px] font-black">1단계</span>
                        <span class="text-2xl text-white font-black tabular-nums"><span id="timer-display">60</span><small class="text-sm ml-0.5 font-normal opacity-60">초</small></span>
                    </div>
                    <button id="launch-btn" onclick="startChallenge()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-1.5 rounded-xl text-sm font-bold transition-all active:scale-95">
                        도전 시작
                    </button>
                </div>

                <!-- 진행도 표시 -->
                <div class="text-center space-y-1 border-l-2 border-slate-200 pl-4">
                    <p id="team-status" class="text-slate-400 font-bold text-[10px]">팀을 선택하세요</p>
                    <div class="flex flex-col items-center">
                        <p class="text-blue-600 text-2xl font-black" id="solved-status">0 / 7</p>
                        <div id="chance-display" class="text-[9px] text-slate-500 font-bold mt-0.5">
                            <!-- 현재 팀의 상세 점수 기록 표시 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 문제 노출 영역 (가로 레이아웃) -->
        <div class="bg-white rounded-[2rem] shadow-lg p-4 mb-4 text-center border-t-4 border-blue-500 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-slate-100">
                <div id="status-bar" class="h-full bg-blue-500 transition-all duration-500" style="width: 0%"></div>
            </div>
            <div class="flex items-center justify-center gap-8 min-h-[70px]">
                <div id="equation-view" class="text-4xl font-black text-slate-300">식 표시</div>
                <div id="eq-sign" class="text-4xl font-bold text-slate-300">=</div>
                <div id="factor-view" class="flex gap-4">
                    <!-- 인수 슬롯 -->
                </div>
            </div>
        </div>

        <!-- 게임 플레이 영역 -->
        <div id="canvas-area" class="h-[36vh] bg-white rounded-[2.5rem] border-4 border-dashed border-slate-200 relative shadow-inner overflow-hidden">
            <div id="layer-balloon" class="relative h-full w-full">
                <div id="ready-msg" class="absolute inset-0 flex flex-col items-center justify-center text-center p-10">
                    <div class="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center mb-4 text-3xl">🚀</div>
                    <h3 class="text-2xl font-black text-slate-800 mb-1">인수분해 대결 준비</h3>
                    <p class="text-slate-400 font-medium">팀을 고르고 시작 버튼을 누르세요!</p>
                </div>
            </div>
            <div id="layer-effect"></div>
            
            <!-- 결과창 오버레이 -->
            <div id="ui-overlay" class="hidden absolute inset-0 bg-white/95 z-[100] flex flex-col items-center justify-center text-center p-10">
                <div id="overlay-icon" class="text-6xl mb-4"></div>
                <h2 id="overlay-title" class="text-6xl font-black mb-2">결과</h2>
                <div id="overlay-score-info" class="mb-6">
                    <!-- 점수 정보 -->
                </div>
                <p id="overlay-desc" class="text-xl text-slate-600 mb-8"></p>
                <div class="flex gap-4">
                    <button id="overlay-btn-retry" class="hidden bg-emerald-500 text-white px-8 py-4 rounded-3xl text-xl font-bold shadow-xl hover:bg-emerald-600 transition-all">다시 도전하기</button>
                    <button id="overlay-btn" class="bg-slate-900 text-white px-8 py-4 rounded-3xl text-xl font-bold shadow-xl hover:bg-slate-800 transition-all">확인</button>
                </div>
            </div>
        </div>

        <!-- 팀 점수판 (개선된 레이아웃) -->
        <div class="mt-4 grid grid-cols-6 gap-3">
            <script>
                const colors = ['bg-red-500', 'bg-blue-500', 'bg-emerald-500', 'bg-amber-500', 'bg-purple-500', 'bg-rose-500'];
                for(let i=1; i<=6; i++) {
                    document.write(`
                        <div onclick="selectTeam(${i})" id="team-card-${i}" class="team-card cursor-pointer bg-white p-3 rounded-3xl shadow-md border-4 border-transparent transition-all">
                            <div class="flex flex-col items-center">
                                <div class="flex items-center gap-1.5 mb-2">
                                    <div class="w-2.5 h-2.5 rounded-full ${colors[i-1]}"></div>
                                    <span class="text-[11px] font-black text-slate-600 uppercase">${i}팀 최고</span>
                                    <span id="score-val-${i}" class="text-xl font-black text-blue-600 leading-none">0</span>
                                </div>
                                <div id="team-history-${i}" class="grid grid-cols-3 gap-1 w-full border-t border-slate-100 pt-2">
                                    <div class="text-center">
                                        <p class="text-[8px] text-slate-400">1차</p>
                                        <p id="h-${i}-0" class="text-[14px] font-black text-slate-700">-</p>
                                    </div>
                                    <div class="text-center border-l border-r border-slate-100">
                                        <p class="text-[8px] text-slate-400">2차</p>
                                        <p id="h-${i}-1" class="text-[14px] font-black text-slate-700">-</p>
                                    </div>
                                    <div class="text-center">
                                        <p class="text-[8px] text-slate-400">3차</p>
                                        <p id="h-${i}-2" class="text-[14px] font-black text-slate-700">-</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `);
                }
            </script>
        </div>
    </div>

    <script>
        const engine = {
            round: 1,
            startRound: 1,
            time: 60,
            baseTime: 60,
            solved: 0,
            goal: 7,
            team: null,
            playing: false,
            isTransitioning: false,
            history: Array(6).fill().map(() => [null, null, null]),
            attempts: Array(6).fill(0),   
            currentSessionScore: 0,       
            currentFactors: [],
            foundIndices: [],
            tracks: Array(7).fill(0)
        };

        let timerCore = null;
        let spawnCore = null;

        function mathFormat(str) {
            let res = str.replace(/x²/g, 'x<sup style="font-size:0.6em">2</sup>');
            res = res.replace(/(\d+)\/(\d+)/g, '<span class="frac"><span class="num">$1</span><span class="den">$2</span></span>');
            return res;
        }

        function changeLimit(s, el) {
            if (engine.playing) return;
            engine.baseTime = s;
            engine.time = s;
            document.getElementById('timer-display').innerText = s;
            el.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        function changeStartRound(r, el) {
            if (engine.playing) return;
            engine.startRound = r;
            document.getElementById('round-label').innerText = `${r}단계`;
            el.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        function selectTeam(n) {
            if (engine.playing) return;
            engine.team = n;
            document.querySelectorAll('.team-card').forEach(c => c.classList.remove('active'));
            document.getElementById(`team-card-${n}`).classList.add('active');
            
            const status = document.getElementById('team-status');
            const used = engine.attempts[n-1];
            const left = 3 - used;
            
            if (left <= 0) {
                status.innerText = `${n}팀은 모든 기회를 사용했습니다.`;
                status.className = "text-red-500 font-black text-xs";
                document.getElementById('launch-btn').disabled = true;
                document.getElementById('launch-btn').classList.add('opacity-50');
            } else {
                status.innerText = `${n}팀 대결 준비 (${used + 1}번째 도전 가능)`;
                status.className = "text-blue-600 font-black text-xs uppercase tracking-widest";
                document.getElementById('launch-btn').disabled = false;
                document.getElementById('launch-btn').classList.remove('opacity-50');
            }
            updateSessionUI();
        }

        function updateSessionUI() {
            if (!engine.team) return;
            const container = document.getElementById('chance-display');
            const h = engine.history[engine.team - 1];
            container.innerHTML = `1차: ${h[0] ?? '-'} | 2차: ${h[1] ?? '-'} | 3차: ${h[2] ?? '-'}`;
        }

        function resetToLobby() {
            engine.playing = false;
            engine.isTransitioning = false;
            document.getElementById('ui-overlay').classList.add('hidden');
            document.getElementById('launch-btn').disabled = false;
            document.getElementById('launch-btn').classList.remove('opacity-50');
            
            const eqView = document.getElementById('equation-view');
            eqView.innerText = "식 표시";
            eqView.className = "text-4xl font-black text-slate-300";
            document.getElementById('eq-sign').className = "text-4xl font-bold text-slate-300";
            document.getElementById('factor-view').innerHTML = "";
            
            document.getElementById('status-bar').style.width = "0%";
            document.getElementById('layer-balloon').innerHTML = `
                <div id="ready-msg" class="absolute inset-0 flex flex-col items-center justify-center text-center p-10">
                    <div class="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center mb-4 text-3xl">🚀</div>
                    <h3 class="text-2xl font-black text-slate-800 mb-1">인수분해 대결 준비</h3>
                    <p class="text-slate-400 font-medium">다음 팀을 선택하고 시작 버튼을 누르세요!</p>
                </div>
            `;
            engine.team = null;
            document.querySelectorAll('.team-card').forEach(c => c.classList.remove('active'));
            document.getElementById('team-status').innerText = "팀을 선택하세요";
            document.getElementById('team-status').className = "text-slate-400 font-bold text-xs";
            document.getElementById('solved-status').innerText = "0 / 7";
            document.getElementById('chance-display').innerHTML = "";
            document.getElementById('timer-display').innerText = engine.baseTime;
        }

        function startChallenge() {
            if (!engine.team) return;
            const teamIdx = engine.team - 1;
            if (engine.attempts[teamIdx] >= 3) {
                alert("이 팀은 이미 3번의 기회를 모두 사용했습니다.");
                return;
            }

            engine.attempts[teamIdx]++;
            engine.round = engine.startRound;
            engine.solved = 0;
            engine.currentSessionScore = 0;
            engine.playing = true;
            engine.isTransitioning = false;
            engine.time = engine.baseTime;
            
            document.getElementById('launch-btn').disabled = true;
            document.getElementById('launch-btn').classList.add('opacity-50');
            document.getElementById('layer-balloon').innerHTML = ''; 
            
            startCycle();
        }

        function startCycle() {
            engine.playing = true;
            document.getElementById('ui-overlay').classList.add('hidden');
            document.getElementById('round-label').innerText = `${engine.round}단계`;
            document.getElementById('timer-display').innerText = Math.ceil(engine.time);
            
            updateUI();
            nextProblem();
            
            if(timerCore) clearInterval(timerCore);
            timerCore = setInterval(() => {
                if (!engine.playing) return;
                engine.time--;
                document.getElementById('timer-display').innerText = Math.max(0, Math.ceil(engine.time));
                if (engine.time <= 0) stopGame();
            }, 1000);

            if(spawnCore) clearInterval(spawnCore);
            if(engine.round === 3) {
                for(let i = 0; i < 15; i++) {
                    createSushiBalloon(-(Math.random() * 20)); 
                }
                spawnCore = setInterval(() => createSushiBalloon(0), 1000);
            }
        }

        function nextProblem() {
            engine.isTransitioning = false;
            let p, q, r, s;
            let type = Math.random();

            if (engine.round === 1) {
                p = 1; r = 1;
                q = Math.floor(Math.random() * 11) - 5;
                s = Math.floor(Math.random() * 11) - 5;
            } else {
                if (type < 0.7) {
                    p = [1, 2, 3][Math.floor(Math.random() * 3)];
                    r = [1, 2][Math.floor(Math.random() * 2)];
                    q = Math.floor(Math.random() * 9) - 4;
                    s = Math.floor(Math.random() * 9) - 4;
                } else if (type < 0.9) {
                    p = 1; r = 1; q = 0;
                    s = Math.floor(Math.random() * 11) - 5;
                } else {
                    const n = [2, 3, 4, 5][Math.floor(Math.random() * 4)];
                    engine.currentFactors = [`x+1/${n}`, `x-1/${n}`];
                    engine.foundIndices = [];
                    const eqBox = document.getElementById('equation-view');
                    eqBox.innerHTML = mathFormat(`x² - 1/${n*n}`);
                    eqBox.className = "text-4xl font-black text-slate-800";
                    document.getElementById('eq-sign').className = "text-4xl font-bold text-slate-800";
                    drawFactorSlots();
                    if(engine.round < 3) drawGrid();
                    return;
                }
            }

            const getF = (a, b) => {
                if (a === 0) return b.toString();
                let ap = (a === 1 ? "x" : (a === -1 ? "-x" : a + "x"));
                if (b === 0) return ap;
                return ap + (b > 0 ? "+" + b : b);
            };

            engine.currentFactors = [getF(p, q), getF(r, s)];
            engine.foundIndices = [];

            const A = p * r;
            const B = p * s + q * r;
            const C = q * s;

            let eqStr = "";
            if (A !== 0) eqStr += (A === 1 ? "x²" : (A === -1 ? "-x²" : A + "x²"));
            if (B !== 0) {
                let abB = Math.abs(B);
                eqStr += (B > 0 ? " + " : " - ") + (abB === 1 ? "x" : abB + "x");
            }
            if (C !== 0) eqStr += (C > 0 ? " + " : " - ") + Math.abs(C);
            if (!eqStr) eqStr = "0";

            const eqView = document.getElementById('equation-view');
            eqView.innerHTML = mathFormat(eqStr);
            eqView.className = "text-4xl font-black text-slate-800";
            document.getElementById('eq-sign').className = "text-4xl font-bold text-slate-800";
            
            drawFactorSlots();
            if(engine.round < 3) drawGrid();
        }

        function drawFactorSlots() {
            const box = document.getElementById('factor-view');
            box.innerHTML = '';
            engine.currentFactors.forEach((f, i) => {
                const s = document.createElement('div');
                const ok = engine.foundIndices.includes(i);
                s.className = `px-5 py-2 rounded-xl border-4 transition-all duration-500 font-black text-2xl min-w-[120px] text-center ${ok ? 'bg-blue-600 border-blue-700 text-white shadow-lg' : 'bg-white border-dashed border-slate-300 text-slate-200'}`;
                s.innerHTML = ok ? mathFormat(`(${f})`) : '( ? )';
                box.appendChild(s);
            });
            const max = engine.round === 3 ? 20 : engine.goal;
            const per = (engine.solved / max) * 100;
            document.getElementById('status-bar').style.width = per + '%';
        }

        const balColors = ['#f43f5e', '#2563eb', '#10b981', '#f59e0b', '#8b5cf6', '#d946ef'];

        function getWrongF() {
            if (engine.round === 1) return `x${(Math.random() > 0.5 ? '+' : '-')}${Math.floor(Math.random()*9+1)}`;
            const t = Math.random();
            if (t < 0.7) {
                const a = [1, 2, 3][Math.floor(Math.random()*3)];
                const b = Math.floor(Math.random()*11)-5;
                return (a === 1 ? 'x' : a+'x') + (b === 0 ? '' : (b > 0 ? '+'+b : b));
            } else if (t < 0.9) return "x";
            else return `x${Math.random() > 0.5 ? '+' : '-'}1/${[2, 3, 5][Math.floor(Math.random()*3)]}`;
        }

        function drawGrid() {
            const layer = document.getElementById('layer-balloon');
            layer.innerHTML = '';
            layer.className = "game-grid";
            let list = engine.currentFactors.map(f => ({ t: f }));
            while(list.length < 15) {
                const w = getWrongF();
                if(!engine.currentFactors.includes(w)) list.push({ t: w });
            }
            list.sort(() => Math.random() - 0.5);
            list.forEach(item => {
                const b = document.createElement('div');
                b.className = 'balloon static-balloon';
                b.innerHTML = mathFormat(`(${item.t})`);
                b.style.backgroundColor = balColors[Math.floor(Math.random() * balColors.length)];
                b.onclick = () => onPop(b, item.t);
                layer.appendChild(b);
            });
        }

        function createSushiBalloon(delay = 0) {
            if(!engine.playing || engine.round !== 3) return;
            const layer = document.getElementById('layer-balloon');
            layer.className = "relative h-full w-full";

            let avLanes = [];
            const now = Date.now();
            engine.tracks.forEach((cool, idx) => { if (now > cool) avLanes.push(idx); });

            if (avLanes.length === 0) return; 

            const lane = avLanes[Math.floor(Math.random() * avLanes.length)];
            engine.tracks[lane] = now + 4000;

            const b = document.createElement('div');
            b.className = 'balloon conveyor-move';
            
            const isOk = Math.random() < 0.45;
            let txt = isOk ? engine.currentFactors[Math.floor(Math.random() * 2)] : getWrongF();

            const laneHeight = 75 / 7; 
            const topPos = 5 + (lane * laneHeight); 

            b.innerHTML = mathFormat(`(${txt})`);
            b.style.backgroundColor = balColors[Math.floor(Math.random() * balColors.length)];
            b.style.top = topPos + '%';
            
            if (delay !== 0) b.style.animationDelay = delay + 's';
            
            b.onclick = () => onPop(b, txt);
            layer.appendChild(b);
            
            setTimeout(() => { if(b.parentNode) b.remove(); }, 30000);
        }

        function onPop(el, text) {
            if (!engine.playing || engine.isTransitioning) return;
            
            const idx = engine.currentFactors.findIndex((f, i) => f === text && !engine.foundIndices.includes(i));

            if (idx !== -1) {
                el.classList.add('pop-effect');
                engine.foundIndices.push(idx);
                engine.currentSessionScore += 5;
                drawFactorSlots();
                updateUI();
                
                if (engine.foundIndices.length === 2) {
                    engine.isTransitioning = true;
                    engine.currentSessionScore += 10;
                    engine.solved++;
                    updateUI();
                    
                    setTimeout(() => {
                        if(el.parentNode) el.remove();
                        if (engine.round < 3 && engine.solved >= engine.goal) {
                            clearRound();
                        } else {
                            if(engine.round === 3) {
                                document.getElementById('layer-balloon').innerHTML = '';
                            }
                            nextProblem();
                        }
                    }, 400);
                } else {
                    setTimeout(() => { if(el.parentNode) el.remove(); }, 400);
                }
            } else {
                el.classList.add('shake-effect');
                el.style.backgroundColor = '#334155';
                engine.time = Math.max(0, engine.time - 4);
                engine.currentSessionScore = Math.max(0, engine.currentSessionScore - 5);
                updateUI();
                setTimeout(() => el.classList.remove('shake-effect'), 500);
            }
        }

        function updateUI() {
            if (!engine.team) return;
            const teamIdx = engine.team - 1;
            const target = engine.round === 3 ? "∞" : engine.goal;
            document.getElementById('solved-status').innerText = `${engine.solved} / ${target}`;
            
            const maxScore = Math.max(engine.currentSessionScore, ...engine.history[teamIdx].filter(v => v !== null), 0);
            document.getElementById(`score-val-${engine.team}`).innerText = maxScore;
            
            // 팀 상세 히스토리 텍스트 및 개별 칸 업데이트
            const h = engine.history[teamIdx];
            for(let j=0; j<3; j++) {
                const el = document.getElementById(`h-${engine.team}-${j}`);
                if (el) el.innerText = h[j] ?? '-';
            }
            
            updateSessionUI();
        }

        function clearRound() {
            engine.playing = false;
            engine.isTransitioning = false;
            clearInterval(timerCore);
            if(spawnCore) clearInterval(spawnCore);
            
            const bonus = 15; 
            engine.time += bonus;
            showExtension(bonus);

            const ui = document.getElementById('ui-overlay');
            const title = document.getElementById('overlay-title');
            const desc = document.getElementById('overlay-desc');
            const btn = document.getElementById('overlay-btn');
            const btnRetry = document.getElementById('overlay-btn-retry');
            const icon = document.getElementById('overlay-icon');

            btnRetry.classList.add('hidden');
            title.innerText = "단계 통과!";
            title.className = "text-6xl font-black mb-4 text-blue-600";
            desc.innerHTML = `목표를 달성했습니다. 다음 단계로 나아갑니다.<br><span class="text-amber-500 text-4xl">+${bonus}초 보너스 시간!</span>`;
            
            icon.innerText = "⭐";
            btn.innerText = "다음 단계 도전";
            btn.onclick = () => {
                engine.round++;
                startCycle();
            };
            ui.classList.remove('hidden');
        }

        function showExtension(s) {
            const box = document.getElementById('layer-effect');
            const d = document.createElement('div');
            d.className = 'bonus-notify';
            d.innerText = `+${s}초 시간 연장`;
            box.appendChild(d);
            setTimeout(() => d.remove(), 2000);
        }

        function stopGame() {
            engine.playing = false;
            engine.isTransitioning = false;
            clearInterval(timerCore);
            if(spawnCore) clearInterval(spawnCore);
            
            const teamIdx = engine.team - 1;
            const currentAttemptIdx = engine.attempts[teamIdx] - 1;
            engine.history[teamIdx][currentAttemptIdx] = engine.currentSessionScore;

            const ui = document.getElementById('ui-overlay');
            const title = document.getElementById('overlay-title');
            const desc = document.getElementById('overlay-desc');
            const btn = document.getElementById('overlay-btn');
            const btnRetry = document.getElementById('overlay-btn-retry');
            const icon = document.getElementById('overlay-icon');
            const scoreInfo = document.getElementById('overlay-score-info');

            title.innerText = "시간 종료";
            title.className = "text-6xl font-black mb-2 text-red-500";
            
            const maxScore = Math.max(...engine.history[teamIdx].filter(v => v !== null));
            const isNewBest = engine.currentSessionScore === maxScore;

            scoreInfo.innerHTML = `
                <div class="bg-slate-100 rounded-2xl p-4 inline-block">
                    <p class="text-slate-500 text-sm font-bold">${engine.attempts[teamIdx]}차 도전 점수</p>
                    <p class="text-4xl font-black ${isNewBest ? 'text-emerald-500' : 'text-slate-800'}">${engine.currentSessionScore}</p>
                    <p class="text-slate-400 text-xs mt-2">팀 최고 기록: ${maxScore}</p>
                </div>
            `;

            const left = 3 - engine.attempts[teamIdx];
            if (left > 0) {
                desc.innerHTML = `아쉬워요! 아직 <span class="text-blue-600 font-bold">${left}번</span>의 기회가 더 남아있습니다.`;
                btnRetry.classList.remove('hidden');
                btnRetry.onclick = () => startChallenge();
            } else {
                desc.innerHTML = `모든 기회를 사용했습니다.<br>최종 최고 기록: <span class="text-blue-600 font-bold">${maxScore}점</span>`;
                btnRetry.classList.add('hidden');
            }

            icon.innerText = "⏰";
            btn.innerText = "메인으로";
            btn.onclick = () => resetToLobby();
            ui.classList.remove('hidden');
            
            updateUI();
        }
    </script>
</body>
</html>
