<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이차방정식 인수분해 마스터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        
        body {
            font-family: 'Jua', sans-serif;
            background-color: #f1f5f9;
            user-select: none;
            touch-action: manipulation;
            overflow-x: hidden;
        }

        /* 전체 화면 비율 90% 조정 */
        #game-main {
            transform: scale(0.9);
            transform-origin: top center;
            width: 100%;
            margin-bottom: -5vh; 
        }

        .balloon {
            width: 95px;
            height: 115px;
            border-radius: 50% 50% 50% 50% / 45% 45% 55% 55%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: inset -5px -7px 0 rgba(0,0,0,0.1), 0 8px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s, opacity 0.2s;
            position: absolute;
            z-index: 10;
            text-align: center;
            padding: 4px;
            border: 2px solid rgba(255,255,255,0.3);
            white-space: nowrap;
        }

        .balloon::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 10px solid currentColor;
        }

        .frac {
            display: inline-flex;
            flex-direction: column;
            vertical-align: middle;
            text-align: center;
            font-size: 0.8em;
            line-height: 1;
            margin: 0 0.1rem;
        }
        .num { border-bottom: 1.5px solid currentColor; padding: 0 1px; }
        .den { padding: 0 1px; }

        .pop-effect { animation: pop 0.3s forwards; }
        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.8); opacity: 0; }
        }

        .config-btn.active {
            background-color: #2563eb;
            color: white;
            border-color: #1d4ed8;
            transform: scale(1.05);
        }

        .mode-btn {
            background-color: #f8fafc;
            color: #64748b;
            border: 2px solid #e2e8f0;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background-color: #10b981;
            color: white;
            border-color: #059669;
            box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.2);
        }
        
        .team-card {
            position: relative;
        }

        .team-card.active {
            border-color: #eab308;
            background-color: #fefce8;
            transform: translateY(-8px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        /* 각 팀 상자 등수 메달 */
        .rank-medal {
            position: absolute;
            top: -15px;
            left: -15px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.3rem;
            color: white;
            border: 4px solid white;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            z-index: 30;
            background-color: #cbd5e1;
            transition: all 0.3s ease;
        }

        .medal-1 { background: linear-gradient(135deg, #fbbf24, #f59e0b); }
        .medal-2 { background: linear-gradient(135deg, #94a3b8, #64748b); }
        .medal-3 { background: linear-gradient(135deg, #b45309, #78350f); }

        .bonus-notify {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            color: #fbbf24;
            font-weight: 900;
            text-shadow: 3px 3px 0 #b45309;
            z-index: 110;
            pointer-events: none;
            animation: bonusAnim 1.5s ease-out forwards;
        }

        @keyframes bonusAnim {
            0% { transform: translate(-50%, 0) scale(0.5); opacity: 0; }
            30% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -100%) scale(1); opacity: 0; }
        }

        /* 대기실 팀 이름 입력 스타일 대폭 확대 */
        .lobby-input-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            width: 90%;
            max-width: 900px;
        }
        .lobby-input-box {
            background: #ffffff;
            padding: 1.5rem;
            border-radius: 2rem;
            border: 3px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: all 0.2s;
        }
        .lobby-input-box:focus-within {
            border-color: #3b82f6;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.1);
            transform: translateY(-2px);
        }
        .lobby-input-box label {
            font-size: 14px;
            color: #64748b;
            font-weight: 900;
            padding-left: 4px;
        }
        .lobby-input-box input {
            background: #f1f5f9;
            border: 2px solid transparent;
            border-radius: 1rem;
            padding: 0.75rem;
            font-family: 'Jua', sans-serif;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 900;
            outline: none;
            color: #1e293b;
            width: 100%;
            transition: all 0.2s;
        }
        .lobby-input-box input:focus {
            background: #ffffff;
            border-color: #3b82f6;
        }
    </style>
</head>
<body class="p-4 sm:p-6 bg-slate-100 min-h-screen flex flex-col items-center">

    <div id="game-main" class="max-w-6xl w-full flex flex-col">
        
        <!-- 설정 및 대시보드 섹션 -->
        <div class="bg-white rounded-[2.5rem] shadow-xl p-5 mb-4 border-b-8 border-blue-200">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 items-center">
                
                <!-- 시간 설정 -->
                <div class="space-y-2">
                    <p class="text-slate-400 text-center text-xs font-bold uppercase tracking-wider">시간 설정</p>
                    <div class="flex gap-2 justify-center">
                        <button onclick="changeLimit(60, this)" class="config-btn flex-1 py-3 border-2 border-slate-200 rounded-2xl text-sm font-bold active">1분</button>
                        <button onclick="changeLimit(120, this)" class="config-btn flex-1 py-3 border-2 border-slate-200 rounded-2xl text-sm font-bold">2분</button>
                        <button onclick="changeLimit(180, this)" class="config-btn flex-1 py-3 border-2 border-slate-200 rounded-2xl text-sm font-bold">3분</button>
                    </div>
                </div>

                <!-- 단계 설정 -->
                <div class="space-y-2">
                    <p class="text-slate-400 text-center text-xs font-bold uppercase tracking-wider">시작 단계</p>
                    <div class="flex gap-2 justify-center">
                        <button onclick="changeStartRound(1, this)" class="config-btn flex-1 py-3 border-2 border-slate-200 rounded-2xl text-sm font-bold active">1단계</button>
                        <button onclick="changeStartRound(2, this)" class="config-btn flex-1 py-3 border-2 border-slate-200 rounded-2xl text-sm font-bold">2단계</button>
                        <button onclick="changeStartRound(3, this)" class="config-btn flex-1 py-3 border-2 border-slate-200 rounded-2xl text-sm font-bold">3단계</button>
                    </div>
                </div>

                <!-- 메인 컨트롤 -->
                <div class="flex items-stretch gap-2 h-full">
                    <div class="bg-slate-800 rounded-3xl p-3 flex flex-col items-center justify-center shadow-lg transform hover:scale-[1.02] transition-transform flex-grow gap-2">
                        <div class="flex items-center gap-3">
                            <span id="round-label" class="bg-blue-600 text-white px-3 py-1 rounded-full text-[10px] font-black">1단계</span>
                            <span class="text-2xl text-white font-black tabular-nums"><span id="timer-display">60</span><small class="text-base ml-1 opacity-60">초</small></span>
                        </div>
                        <button id="launch-btn" onclick="startChallenge()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-2.5 rounded-2xl text-lg font-black transition-all shadow-md active:scale-95">
                            도전 시작
                        </button>
                    </div>
                    <!-- 버전 선택 세로 배치 -->
                    <div class="flex flex-col gap-1.5 min-w-[100px]">
                        <button onclick="changeScoreMode('best', this)" class="mode-btn active flex-1 px-2 rounded-2xl text-base font-black">최고점</button>
                        <button onclick="changeScoreMode('total', this)" class="mode-btn flex-1 px-2 rounded-2xl text-base font-black">합산</button>
                    </div>
                </div>

                <!-- 팀 상태 표시 -->
                <div class="text-center border-l-4 border-slate-100 pl-4">
                    <p id="team-status" class="text-slate-400 font-bold text-xs mb-1">팀을 선택하세요</p>
                    <div class="flex flex-col items-center">
                        <p class="text-blue-600 text-4xl font-black mb-1" id="solved-status">0 / 7</p>
                        <div id="chance-display" class="text-xs text-slate-500 font-bold bg-slate-50 px-3 py-1 rounded-full"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 문제 표시창 -->
        <div class="bg-white rounded-[2.5rem] shadow-lg p-6 mb-4 text-center border-t-8 border-blue-500 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1.5 bg-slate-50">
                <div id="status-bar" class="h-full bg-blue-500 transition-all duration-500" style="width: 0%"></div>
            </div>
            <div class="flex flex-wrap items-center justify-center gap-6 sm:gap-12 min-h-[100px]">
                <div id="equation-view" class="text-4xl sm:text-6xl font-black text-slate-800">식 표시</div>
                <div id="eq-sign" class="text-4xl sm:text-6xl font-bold text-slate-800">=</div>
                <div id="factor-view" class="flex gap-4 sm:gap-6"></div>
            </div>
        </div>

        <!-- 게임 플레이 판 -->
        <div id="canvas-area" class="h-[440px] bg-white rounded-[3rem] border-4 border-dashed border-slate-200 relative shadow-inner overflow-hidden mb-6 flex items-center justify-center">
            <div id="layer-balloon" class="relative h-full w-full">
                <!-- 초기 대기실 화면 -->
                <div id="lobby-ui" class="absolute inset-0 flex flex-col items-center justify-center p-8 bg-white/50">
                    <div class="text-center mb-8">
                        <h3 class="text-4xl font-black text-slate-800 mb-2">팀 이름을 설정하세요!</h3>
                        <p class="text-slate-500 text-xl">아래 상자에 이름을 입력하고, 하단에서 팀 카드를 골라 도전을 시작하세요.</p>
                    </div>
                    <div class="lobby-input-container" id="lobby-inputs-grid">
                        <!-- 입력 필드가 JS에서 생성됨 -->
                    </div>
                </div>
            </div>
            <div id="layer-effect"></div>
            
            <!-- 결과창 오버레이 -->
            <div id="ui-overlay" class="hidden absolute inset-0 z-[100] flex items-center justify-center p-6">
                <div class="flex flex-col md:flex-row items-center justify-between w-full max-w-5xl gap-6 bg-white/95 p-10 rounded-[4rem] shadow-2xl backdrop-blur-md border-4 border-white">
                    <div class="flex flex-col items-center text-center md:text-left md:items-start min-w-[200px]">
                        <div id="overlay-icon" class="text-8xl mb-2 filter drop-shadow-md"></div>
                        <h2 id="overlay-title" class="text-5xl font-black tracking-tight">결과</h2>
                    </div>
                    <div id="overlay-score-info" class="flex-grow flex justify-center py-4"></div>
                    <div class="flex flex-col items-center md:items-end gap-8 min-w-[300px]">
                        <p id="overlay-desc" class="text-2xl text-slate-600 font-bold text-center md:text-right leading-tight"></p>
                        <div class="flex flex-row gap-4">
                            <button id="overlay-btn-retry" class="hidden bg-emerald-500 text-white px-8 py-5 rounded-[2rem] text-xl font-bold shadow-lg hover:bg-emerald-600 transition-all active:scale-95">다시 도전</button>
                            <button id="overlay-btn" class="bg-slate-900 text-white px-8 py-5 rounded-[2rem] text-xl font-bold shadow-lg hover:bg-slate-800 transition-all active:scale-95">메인으로</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 하단 팀 점수판 -->
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4 mt-6">
            <script>
                const colors = ['bg-red-500', 'bg-blue-500', 'bg-emerald-500', 'bg-amber-500', 'bg-purple-500', 'bg-rose-500'];
                for(let i=1; i<=6; i++) {
                    document.write(`
                        <div onclick="selectTeam(${i})" id="team-card-${i}" class="team-card cursor-pointer bg-white p-4 rounded-[2.5rem] shadow-lg border-4 border-transparent transition-all">
                            <!-- 개별 등수 메달 -->
                            <div id="rank-badge-${i}" class="rank-medal">-</div>
                            
                            <div class="flex flex-col items-center mt-3">
                                <div class="flex items-center gap-2 mb-2 group">
                                    <div class="w-3 h-3 rounded-full ${colors[i-1]}"></div>
                                    <span id="team-name-label-${i}" class="text-xs font-black text-slate-500 uppercase">${i}팀</span>
                                </div>
                                <span id="score-val-${i}" class="text-4xl font-black text-blue-600 leading-none mb-3">0</span>
                                <div class="grid grid-cols-3 gap-1 w-full border-t border-slate-100 pt-3 text-[10px] text-center font-bold text-slate-400">
                                    <div class="flex flex-col"><span class="opacity-50 text-[8px]">1차</span><span id="h-${i}-0" class="text-slate-700 text-sm">-</span></div>
                                    <div class="flex flex-col border-l border-r border-slate-50"><span class="opacity-50 text-[8px]">2차</span><span id="h-${i}-1" class="text-slate-700 text-sm">-</span></div>
                                    <div class="flex flex-col"><span class="opacity-50 text-[8px]">3차</span><span id="h-${i}-2" class="text-slate-700 text-sm">-</span></div>
                                </div>
                            </div>
                        </div>
                    `);
                }
            </script>
        </div>
    </div>

    <script>
        const engine = {
            round: 1,
            startRound: 1,
            time: 60,
            baseTime: 60,
            solved: 0,
            goal: 7,
            team: null,
            teamNames: ["1팀", "2팀", "3팀", "4팀", "5팀", "6팀"],
            playing: false,
            scoreMode: 'best', 
            isTransitioning: false,
            history: Array(6).fill().map(() => [null, null, null]),
            attempts: Array(6).fill(0),   
            currentSessionScore: 0,       
            currentFactors: [],
            foundIndices: [],
            lastEqStr: "",
            balloons: [],
            speed: 1.8,
            animationId: null
        };

        let timerCore = null;

        function mathFormat(str) {
            let res = str.replace(/x²/g, 'x<sup style="font-size:0.6em">2</sup>');
            res = res.replace(/(\d+)\/(\d+)/g, '<span class="frac"><span class="num">$1</span><span class="den">$2</span></span>');
            return res;
        }

        function changeLimit(s, el) {
            if (engine.playing) return;
            engine.baseTime = s;
            engine.time = s;
            document.getElementById('timer-display').innerText = s;
            el.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        function changeStartRound(r, el) {
            if (engine.playing) return;
            engine.startRound = r;
            engine.goal = (r === 1) ? 7 : (r === 2 ? 5 : 99);
            document.getElementById('round-label').innerText = `${r}단계`;
            document.getElementById('solved-status').innerText = `0 / ${r === 3 ? '∞' : engine.goal}`;
            el.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        function changeScoreMode(mode, el) {
            if (engine.playing) return;
            engine.scoreMode = mode;
            el.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            updateAllTeamScoresUI();
        }

        function updateTeamName(teamNum, val) {
            if (val.trim() === "") {
                engine.teamNames[teamNum-1] = teamNum + "팀";
            } else {
                engine.teamNames[teamNum-1] = val.trim();
            }
            const label = document.getElementById(`team-name-label-${teamNum}`);
            if (label) label.innerText = engine.teamNames[teamNum-1];
            updateAllTeamScoresUI();
        }

        function selectTeam(n) {
            if (engine.playing || !n) return;
            engine.team = n;
            document.querySelectorAll('.team-card').forEach(c => c.classList.remove('active'));
            const selectedCard = document.getElementById(`team-card-${n}`);
            if (selectedCard) selectedCard.classList.add('active');
            
            const status = document.getElementById('team-status');
            const used = engine.attempts[n-1];
            if (used >= 3) {
                status.innerText = `${engine.teamNames[n-1]} 도전 완료`;
                status.className = "text-red-500 font-bold text-sm uppercase";
                document.getElementById('launch-btn').disabled = true;
                document.getElementById('launch-btn').classList.add('opacity-50');
            } else {
                status.innerText = `${engine.teamNames[n-1]} 선택됨 (${used + 1}차 시도 가능)`;
                status.className = "text-blue-600 font-bold text-sm uppercase";
                document.getElementById('launch-btn').disabled = false;
                document.getElementById('launch-btn').classList.remove('opacity-50');
            }
            updateSessionUI();
        }

        function updateSessionUI() {
            if (!engine.team) return;
            const container = document.getElementById('chance-display');
            const h = engine.history[engine.team - 1];
            container.innerHTML = `기록: ${h[0] ?? '-'}/${h[1] ?? '-'}/${h[2] ?? '-'}`;
        }

        function updateAllTeamScoresUI() {
            const teamSummary = [];
            for(let i=1; i<=6; i++) {
                const teamIdx = i - 1;
                const h = engine.history[teamIdx];
                for(let j=0; j<3; j++) {
                    const cell = document.getElementById(`h-${i}-${j}`);
                    if (cell) cell.innerText = h[j] ?? '-';
                }
                const activeScores = h.filter(v => v !== null);
                let currentTotalScore = 0;
                if (activeScores.length > 0) {
                    currentTotalScore = (engine.scoreMode === 'best') ? Math.max(...activeScores) : activeScores.reduce((a, b) => a + b, 0);
                }
                const scoreVal = document.getElementById(`score-val-${i}`);
                if (scoreVal) scoreVal.innerText = currentTotalScore;
                teamSummary.push({ num: i, score: currentTotalScore });
            }
            const ranked = [...teamSummary].sort((a, b) => b.score - a.score);
            teamSummary.forEach(team => {
                const rank = ranked.findIndex(t => t.num === team.num) + 1;
                const badge = document.getElementById(`rank-badge-${team.num}`);
                if (badge) {
                    if (team.score === 0) {
                        badge.innerText = "-";
                        badge.className = "rank-medal bg-slate-300";
                    } else {
                        badge.className = `rank-medal medal-${rank > 3 ? 'etc' : rank}`;
                        if (rank === 1) badge.innerText = "🥇";
                        else if (rank === 2) badge.innerText = "🥈";
                        else if (rank === 3) badge.innerText = "🥉";
                        else {
                            badge.innerText = rank;
                            badge.style.backgroundColor = "#94a3b8";
                        }
                    }
                }
            });
        }

        function startChallenge() {
            if (!engine.team || engine.attempts[engine.team-1] >= 3) return;
            engine.attempts[engine.team-1]++;
            engine.round = engine.startRound;
            engine.goal = (engine.round === 1) ? 7 : (engine.round === 2 ? 5 : 99);
            engine.solved = 0;
            engine.currentSessionScore = 0;
            engine.playing = true;
            engine.time = engine.baseTime;
            engine.lastEqStr = "";
            document.getElementById('launch-btn').disabled = true;
            document.getElementById('launch-btn').classList.add('opacity-50');
            startCycle();
        }

        function startCycle() {
            engine.playing = true;
            document.getElementById('ui-overlay').classList.add('hidden');
            document.getElementById('round-label').innerText = `${engine.round}단계`;
            updateUI();
            nextProblem();
            if(timerCore) clearInterval(timerCore);
            timerCore = setInterval(() => {
                if (!engine.playing) return;
                engine.time--;
                document.getElementById('timer-display').innerText = Math.max(0, engine.time);
                if (engine.time <= 0) stopGame();
            }, 1000);
            if (engine.animationId) cancelAnimationFrame(engine.animationId);
            if (engine.round === 3) requestAnimationFrame(updateConveyor);
        }

        function nextProblem() {
            engine.isTransitioning = false;
            let p=1, q, r=1, s;
            let currentEqStr = "";
            let tries = 0;
            do {
                if (engine.round === 1) {
                    p = 1; r = 1;
                    q = Math.floor(Math.random() * 21) - 10;
                    s = Math.floor(Math.random() * 21) - 10;
                    if (q === 0 && s === 0) s = 1;
                } else if (engine.round === 2) {
                    // 2단계: 최고차항 p*r이 2 이상
                    const coeffPairs = [[2,1], [1,2], [3,1], [1,3], [2,2], [4,1], [1,4]];
                    const pair = coeffPairs[Math.floor(Math.random() * coeffPairs.length)];
                    p = pair[0]; r = pair[1];
                    q = Math.floor(Math.random() * 11) - 5;
                    s = Math.floor(Math.random() * 11) - 5;
                    if (q === 0 && s === 0) s = 2;
                } else {
                    p = Math.floor(Math.random() * 4) + 1;
                    r = Math.floor(Math.random() * 3) + 1;
                    q = Math.floor(Math.random() * 17) - 8;
                    s = Math.floor(Math.random() * 17) - 8;
                }
                const A = p * r, B = p * s + q * r, C = q * s;
                currentEqStr = `${A},${B},${C}`;
                tries++;
            } while (currentEqStr === engine.lastEqStr && tries < 15);
            engine.lastEqStr = currentEqStr;
            const getF = (a, b) => {
                if (a === 0) return b.toString();
                let ap = (a === 1 ? "x" : (a === -1 ? "-x" : a + "x"));
                if (b === 0) return ap;
                return ap + (b > 0 ? "+" + b : b);
            };
            engine.currentFactors = [getF(p, q), getF(r, s)];
            engine.foundIndices = [];
            let eqStr = "";
            const A = p * r, B = p * s + q * r, C = q * s;
            if (A !== 0) eqStr += (A === 1 ? "x²" : (A === -1 ? "-x²" : A + "x²"));
            if (B !== 0) {
                let op = (B > 0 ? " + " : " - ");
                let absB = Math.abs(B);
                eqStr += op + (absB === 1 ? "x" : absB + "x");
            }
            if (C !== 0) eqStr += (C > 0 ? " + " : " - ") + Math.abs(C);
            if (!eqStr) eqStr = "0";
            document.getElementById('equation-view').innerHTML = mathFormat(eqStr);
            drawFactorSlots();
            initBalloons();
        }

        function drawFactorSlots() {
            const box = document.getElementById('factor-view');
            box.innerHTML = '';
            engine.currentFactors.forEach((f, i) => {
                const s = document.createElement('div');
                const ok = engine.foundIndices.includes(i);
                s.className = `px-6 py-3 sm:px-8 sm:py-4 rounded-3xl border-4 sm:border-8 transition-all duration-500 font-black text-2xl sm:text-4xl min-w-[120px] sm:min-w-[160px] text-center ${ok ? 'bg-blue-600 border-blue-700 text-white shadow-xl scale-105' : 'bg-white border-dashed border-slate-200 text-slate-100'}`;
                s.innerHTML = ok ? mathFormat(`(${f})`) : '( ? )';
                box.appendChild(s);
            });
            const per = Math.min((engine.solved / engine.goal) * 100, 100);
            document.getElementById('status-bar').style.width = per + '%';
        }

        function getWrongF() {
            let a, b;
            if (engine.round === 1) { a = 1; b = Math.floor(Math.random() * 21) - 10; }
            else { a = [1, 2, 3][Math.floor(Math.random() * 3)]; b = Math.floor(Math.random() * 21) - 10; }
            return (a === 1 ? "x" : a + "x") + (b === 0 ? "" : (b > 0 ? "+" + b : b));
        }

        function initBalloons() {
            const layer = document.getElementById('layer-balloon');
            const containerWidth = layer.clientWidth || 900;
            layer.innerHTML = '';
            engine.balloons = [];
            const is3 = (engine.round === 3);
            const cols = is3 ? 8 : 5; 
            const rows = 3;
            const colSpacing = is3 ? 200 : 180;
            const rowSpacing = 135;
            let positions = [];
            for (let c = 0; c < cols; c++) {
                for (let r = 0; r < rows; r++) positions.push({c, r});
            }
            positions.sort(() => Math.random() - 0.5);
            let startX = 0;
            if (!is3) {
                const totalGridWidth = (cols - 1) * colSpacing + 95; 
                startX = (containerWidth - totalGridWidth) / 2;
            }
            for (let i = 0; i < positions.length; i++) {
                const pos = positions[i];
                const isAnswer = i < 2; 
                let text = isAnswer ? engine.currentFactors[i] : getWrongF();
                const bEl = document.createElement('div');
                bEl.className = 'balloon';
                bEl.innerHTML = mathFormat(`(${text})`);
                const colorsArr = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#f43f5e'];
                bEl.style.backgroundColor = colorsArr[Math.floor(Math.random() * colorsArr.length)];
                const xPos = is3 ? (pos.c * colSpacing) : (startX + pos.c * colSpacing);
                const yPos = pos.r * rowSpacing + 30;
                const obj = { x: xPos, y: yPos, text: text, isTarget: isAnswer, el: bEl };
                bEl.style.left = obj.x + 'px';
                bEl.style.top = obj.y + 'px';
                bEl.onclick = () => onPop(obj);
                layer.appendChild(bEl);
                engine.balloons.push(obj);
            }
        }

        function updateConveyor() {
            if (!engine.playing || engine.round !== 3) return;
            const colSpacing = 200, cols = 8, totalWidth = colSpacing * cols;
            engine.balloons.forEach(b => {
                b.x -= engine.speed;
                if (b.x < -120) {
                    b.x += totalWidth;
                    const factorIdx = engine.currentFactors.indexOf(b.text);
                    const isAlreadyFound = factorIdx !== -1 && engine.foundIndices.includes(factorIdx);
                    if (!b.isTarget || isAlreadyFound) {
                        const newText = getWrongF();
                        b.text = newText;
                        b.el.innerHTML = mathFormat(`(${newText})`);
                        b.el.style.opacity = "1";
                        b.el.style.transform = "scale(1)";
                        b.el.classList.remove('pop-effect');
                        b.isTarget = false;
                        if (Math.random() < 0.15 && engine.foundIndices.length < 2) {
                            const unfound = engine.foundIndices.includes(0) ? 1 : 0;
                            b.text = engine.currentFactors[unfound];
                            b.el.innerHTML = mathFormat(`(${b.text})`);
                            b.isTarget = true;
                        }
                    }
                }
                b.el.style.left = b.x + 'px';
            });
            engine.animationId = requestAnimationFrame(updateConveyor);
        }

        function onPop(obj) {
            if (!engine.playing || engine.isTransitioning) return;
            const idx = engine.currentFactors.findIndex((f, i) => f === obj.text && !engine.foundIndices.includes(i));
            if (idx !== -1) {
                obj.el.classList.add('pop-effect');
                engine.foundIndices.push(idx);
                engine.currentSessionScore += 10;
                drawFactorSlots();
                if (engine.foundIndices.length === 2) {
                    engine.isTransitioning = true;
                    engine.solved++;
                    updateUI();
                    setTimeout(() => {
                        if (engine.solved >= engine.goal && engine.round < 3) clearRound();
                        else nextProblem();
                    }, 400);
                }
            } else {
                obj.el.classList.add('pop-effect');
                obj.el.style.backgroundColor = '#334155'; 
                engine.time = Math.max(0, engine.time - 3);
                engine.currentSessionScore = Math.max(0, engine.currentSessionScore - 5);
                updateUI();
                // 오답 풍선 제거를 위한 타임아웃 추가
                setTimeout(() => { if (obj.el.parentNode) obj.el.parentNode.removeChild(obj.el); }, 400);
            }
        }

        function updateUI() {
            if (!engine.team) return;
            const goalText = engine.round >= 3 ? '∞' : engine.goal;
            document.getElementById('solved-status').innerText = `${engine.solved} / ${goalText}`;
            updateAllTeamScoresUI();
            updateSessionUI();
        }

        function clearRound() {
            engine.playing = false;
            clearInterval(timerCore);
            if (engine.animationId) cancelAnimationFrame(engine.animationId);
            const bonus = 15;
            engine.time += bonus;
            showBonusEffect(bonus);
            const ui = document.getElementById('ui-overlay');
            document.getElementById('overlay-icon').innerText = "⭐";
            document.getElementById('overlay-title').innerText = `${engine.round}단계 통과!`;
            document.getElementById('overlay-title').className = "text-5xl font-black text-blue-600 tracking-tight";
            document.getElementById('overlay-score-info').innerHTML = `
                <div class="bg-blue-600 rounded-[3rem] p-10 inline-block border-8 border-white shadow-2xl scale-110">
                    <p class="text-blue-100 text-sm font-bold mb-1 uppercase">팀 현재 점수</p>
                    <p class="text-8xl font-black text-white">${engine.currentSessionScore}</p>
                </div>
            `;
            document.getElementById('overlay-desc').innerHTML = `환상적인 실력입니다!<br><span class="text-amber-500 font-black">+${bonus}초 보너스!</span>`;
            document.getElementById('overlay-btn-retry').classList.add('hidden');
            document.getElementById('overlay-btn').innerText = "다음 단계로";
            document.getElementById('overlay-btn').onclick = () => {
                engine.round++;
                if (engine.round === 2) engine.goal = (engine.goal === 7) ? 12 : 5;
                else engine.goal = 99;
                startCycle();
            };
            ui.classList.remove('hidden');
        }

        function stopGame() {
            engine.playing = false;
            clearInterval(timerCore);
            if (engine.animationId) cancelAnimationFrame(engine.animationId);
            const teamIdx = engine.team - 1;
            const currentAttempt = engine.attempts[teamIdx] - 1;
            engine.history[teamIdx][currentAttempt] = engine.currentSessionScore;
            const ui = document.getElementById('ui-overlay');
            document.getElementById('overlay-icon').innerText = "⏰";
            document.getElementById('overlay-title').innerText = "시간 종료";
            document.getElementById('overlay-title').className = "text-5xl font-black text-red-500 tracking-tight";
            document.getElementById('overlay-score-info').innerHTML = `
                <div class="bg-white rounded-[3rem] p-10 inline-block border-8 border-slate-100 shadow-inner scale-110">
                    <p class="text-slate-400 text-sm font-bold mb-1 uppercase tracking-widest">이번 도전 점수</p>
                    <p class="text-8xl font-black text-blue-600">${engine.currentSessionScore}</p>
                </div>
            `;
            const left = 3 - engine.attempts[teamIdx];
            if (left > 0) {
                document.getElementById('overlay-desc').innerHTML = `아쉬워요!<br>남은 기회: <span class="text-blue-600">${left}번</span>`;
                document.getElementById('overlay-btn-retry').classList.remove('hidden');
                document.getElementById('overlay-btn-retry').onclick = () => startChallenge();
            } else {
                document.getElementById('overlay-desc').innerHTML = `도전 완료!<br><span class="text-slate-400 font-medium">모든 기회를 사용했습니다.</span>`;
                document.getElementById('overlay-btn-retry').classList.add('hidden');
            }
            document.getElementById('overlay-btn').innerText = "메인으로";
            document.getElementById('overlay-btn').onclick = () => {
                ui.classList.add('hidden');
                resetLobby();
            };
            ui.classList.remove('hidden');
            updateUI();
        }

        function showBonusEffect(s) {
            const d = document.createElement('div');
            d.className = 'bonus-notify';
            d.innerText = `+${s}초 연장!`;
            document.getElementById('layer-effect').appendChild(d);
            setTimeout(() => d.remove(), 1500);
        }

        function resetLobby() {
            engine.playing = false;
            document.getElementById('launch-btn').disabled = false;
            document.getElementById('launch-btn').classList.remove('opacity-50');
            document.getElementById('equation-view').innerText = "식 표시";
            document.getElementById('equation-view').className = "text-4xl sm:text-6xl font-black text-slate-300";
            document.getElementById('factor-view').innerHTML = "";
            document.getElementById('status-bar').style.width = "0%";
            // 대기실 UI 복구
            const layer = document.getElementById('layer-balloon');
            layer.innerHTML = `
                <div id="lobby-ui" class="absolute inset-0 flex flex-col items-center justify-center p-8 bg-white/50">
                    <div class="text-center mb-8">
                        <h3 class="text-4xl font-black text-slate-800 mb-2">팀 이름을 설정해 주세요!</h3>
                        <p class="text-slate-500 text-xl">아래 상자에 이름을 입력하고, 하단에서 팀 카드를 골라 시작하세요.</p>
                    </div>
                    <div class="lobby-input-container" id="lobby-inputs-grid"></div>
                </div>
            `;
            const inputContainer = document.getElementById('lobby-inputs-grid');
            for(let i=1; i<=6; i++) {
                const box = document.createElement('div');
                box.className = 'lobby-input-box';
                box.innerHTML = `
                    <label class="text-[14px] font-bold text-slate-400 uppercase tracking-tighter">${i}팀 이름</label>
                    <input type="text" id="lobby-name-input-${i}" value="${engine.teamNames[i-1]}" maxlength="8" oninput="updateTeamName(${i}, this.value)">
                `;
                inputContainer.appendChild(box);
            }
            // 이전에 선택된 팀이 있다면 다시 활성화 (null 체크 보강)
            if (engine.team) {
                selectTeam(engine.team);
            }
            updateAllTeamScoresUI();
        }

        window.onload = () => {
            resetLobby();
        };
    </script>
</body>
</html>
