<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이차방정식 인수분해 마스터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        
        body {
            font-family: 'Jua', sans-serif;
            background-color: #f1f5f9;
            overflow: hidden;
            user-select: none;
        }

        /* 풍선 스타일 */
        .balloon {
            width: 85px;
            height: 105px;
            border-radius: 50% 50% 50% 50% / 45% 45% 55% 55%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: inset -6px -8px 0 rgba(0,0,0,0.1), 0 10px 15px -3px rgba(0,0,0,0.1);
            transition: transform 0.2s, background-color 0.2s;
            position: absolute;
            z-index: 10;
            text-align: center;
            padding: 4px;
            border: 2px solid rgba(255,255,255,0.4);
        }

        .balloon::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 12px solid currentColor;
        }

        /* 분수 스타일 */
        .frac {
            display: inline-flex;
            flex-direction: column;
            vertical-align: middle;
            text-align: center;
            font-size: 0.85em;
            line-height: 1.1;
            margin: 0 0.1rem;
        }
        .num {
            border-bottom: 1.5px solid currentColor;
            padding: 0 2px;
        }
        .den {
            padding: 0 2px;
        }

        /* 1, 2단계 고정 격자 */
        .static-balloon {
            position: relative !important;
            margin: auto;
        }

        /* 3단계 가로 이동 애니메이션 (회전초밥) */
        @keyframes conveyor {
            from { left: -120px; }
            to { left: 110vw; }
        }

        .conveyor-move {
            animation: conveyor 25s linear forwards;
        }

        /* 효과 */
        .pop-effect { animation: pop 0.4s forwards; }
        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(0); opacity: 0; }
        }

        .shake-effect { animation: shake 0.5s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 12px;
            padding: 12px;
            height: 100%;
        }

        .config-btn.active {
            background-color: #2563eb;
            color: white;
            border-color: #1d4ed8;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        
        .team-card.active {
            border-color: #eab308;
            background-color: #fefce8;
            transform: scale(1.02);
        }

        .bonus-notify {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            color: #fbbf24;
            font-weight: 900;
            text-shadow: 2px 2px 0 #b45309, 0 0 30px rgba(251, 191, 36, 0.5);
            z-index: 100;
            pointer-events: none;
            animation: bonusAnim 2s ease-out forwards;
        }

        @keyframes bonusAnim {
            0% { transform: translate(-50%, 20%) scale(0.5); opacity: 0; }
            30% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            100% { transform: translate(-50%, -150%) scale(1); opacity: 0; }
        }

        .hidden { display: none; }
    </style>
</head>
<body class="p-4 bg-slate-100">

    <div id="game-main" class="max-w-6xl mx-auto">
        
        <!-- 대시보드 -->
        <div class="bg-white rounded-[2rem] shadow-xl p-5 mb-4 border-b-8 border-blue-200">
            <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 items-center">
                
                <!-- 시간 -->
                <div class="space-y-2">
                    <p class="text-slate-400 text-center text-xs font-bold uppercase tracking-wider">시간 설정</p>
                    <div class="flex gap-2 justify-center">
                        <button onclick="changeLimit(60, this)" class="config-btn flex-1 py-2 border-2 border-slate-200 rounded-2xl text-sm font-bold active">1분</button>
                        <button onclick="changeLimit(120, this)" class="config-btn flex-1 py-2 border-2 border-slate-200 rounded-2xl text-sm font-bold">2분</button>
                        <button onclick="changeLimit(180, this)" class="config-btn flex-1 py-2 border-2 border-slate-200 rounded-2xl text-sm font-bold">3분</button>
                    </div>
                </div>

                <!-- 단계 -->
                <div class="space-y-2">
                    <p class="text-slate-400 text-center text-xs font-bold uppercase tracking-wider">시작 단계</p>
                    <div class="flex gap-2 justify-center">
                        <button onclick="changeStartRound(1, this)" class="config-btn flex-1 py-2 border-2 border-slate-200 rounded-2xl text-sm font-bold active">1단계</button>
                        <button onclick="changeStartRound(2, this)" class="config-btn flex-1 py-2 border-2 border-slate-200 rounded-2xl text-sm font-bold">2단계</button>
                        <button onclick="changeStartRound(3, this)" class="config-btn flex-1 py-2 border-2 border-slate-200 rounded-2xl text-sm font-bold">3단계</button>
                    </div>
                </div>

                <!-- 중앙 컨트롤 -->
                <div class="bg-slate-800 rounded-3xl p-4 flex flex-col items-center justify-center gap-2 shadow-lg">
                    <div class="flex items-center gap-3">
                        <span id="round-label" class="bg-blue-600 text-white px-3 py-1 rounded-full text-xs font-black">1단계</span>
                        <span class="text-3xl text-white font-black tabular-nums"><span id="timer-display">60</span><small class="text-lg ml-1 font-normal opacity-60">초</small></span>
                    </div>
                    <button id="launch-btn" onclick="startChallenge()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-2 rounded-xl text-lg font-bold transition-all active:scale-95">
                        도전 시작
                    </button>
                </div>

                <!-- 진행 현황 -->
                <div class="text-center space-y-1 border-l-2 border-slate-200 pl-4">
                    <p id="team-status" class="text-slate-400 font-bold text-xs">팀을 선택하세요</p>
                    <div class="flex flex-col items-center">
                        <p class="text-blue-600 text-3xl font-black" id="solved-status">0 / 7</p>
                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-tighter">진행 중인 문제</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 문제 노출 -->
        <div class="bg-white rounded-[2rem] shadow-lg p-6 mb-4 text-center border-t-4 border-blue-500 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-slate-100">
                <div id="status-bar" class="h-full bg-blue-500 transition-all duration-500" style="width: 0%"></div>
            </div>
            <div id="equation-view" class="text-5xl font-black text-slate-300 min-h-[60px] flex items-center justify-center">문제가 여기에 표시됩니다</div>
            <div id="factor-view" class="flex justify-center gap-6 mt-6"></div>
        </div>

        <!-- 게임 캔버스 -->
        <div id="canvas-area" class="h-[40vh] bg-white rounded-[2.5rem] border-4 border-dashed border-slate-200 relative shadow-inner overflow-hidden">
            <div id="layer-balloon" class="relative h-full w-full">
                <div id="ready-msg" class="absolute inset-0 flex flex-col items-center justify-center text-center p-10">
                    <div class="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center mb-4 text-3xl">🚀</div>
                    <h3 class="text-2xl font-black text-slate-800 mb-1">인수분해 대결 준비</h3>
                    <p class="text-slate-400 font-medium">팀을 고르고 시작 버튼을 누르세요!</p>
                </div>
            </div>
            <div id="layer-effect"></div>
            
            <!-- 오버레이 -->
            <div id="ui-overlay" class="hidden absolute inset-0 bg-white/95 z-[100] flex flex-col items-center justify-center text-center p-10">
                <div id="overlay-icon" class="text-6xl mb-4"></div>
                <h2 id="overlay-title" class="text-6xl font-black mb-4">결과</h2>
                <p id="overlay-desc" class="text-2xl text-slate-600 mb-10"></p>
                <button id="overlay-btn" class="bg-slate-900 text-white px-12 py-4 rounded-3xl text-2xl font-bold shadow-xl hover:bg-slate-800 transition-all">확인</button>
            </div>
        </div>

        <!-- 점수판 -->
        <div class="mt-4 grid grid-cols-6 gap-3">
            <script>
                const colors = ['bg-red-500', 'bg-blue-500', 'bg-emerald-500', 'bg-amber-500', 'bg-purple-500', 'bg-rose-500'];
                for(let i=1; i<=6; i++) {
                    document.write(`
                        <div onclick="selectTeam(${i})" id="team-card-${i}" class="team-card cursor-pointer bg-white p-4 rounded-3xl shadow border-4 border-transparent transition-all">
                            <div class="flex flex-col items-center gap-1">
                                <div class="w-3 h-3 rounded-full ${colors[i-1]}"></div>
                                <span class="text-xs font-black text-slate-400 uppercase">${i}팀</span>
                                <span id="score-val-${i}" class="text-2xl font-black text-slate-800">0</span>
                            </div>
                        </div>
                    `);
                }
            </script>
        </div>
    </div>

    <script>
        // 엔진 데이터
        const engine = {
            round: 1,
            startRound: 1,
            time: 60,
            baseTime: 60,
            solved: 0,
            goal: 7,
            team: null,
            playing: false,
            scores: Array(7).fill(0),
            currentFactors: [],
            foundIndices: [],
            // 회전초밥용 트랙 (레인) 7개
            tracks: Array(7).fill(0)
        };

        let timerCore = null;
        let spawnCore = null;

        // 수식 변환
        function mathFormat(str) {
            let res = str.replace(/x²/g, 'x<sup style="font-size:0.6em">2</sup>');
            res = res.replace(/(\d+)\/(\d+)/g, '<span class="frac"><span class="num">$1</span><span class="den">$2</span></span>');
            return res;
        }

        function changeLimit(s, el) {
            if (engine.playing) return;
            engine.baseTime = s;
            engine.time = s;
            document.getElementById('timer-display').innerText = s;
            el.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        function changeStartRound(r, el) {
            if (engine.playing) return;
            engine.startRound = r;
            document.getElementById('round-label').innerText = `${r}단계`;
            el.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        function selectTeam(n) {
            if (engine.playing) return;
            engine.team = n;
            document.querySelectorAll('.team-card').forEach(c => c.classList.remove('active'));
            document.getElementById(`team-card-${n}`).classList.add('active');
            const status = document.getElementById('team-status');
            status.innerText = `${n}팀 대결 준비 완료`;
            status.className = "text-blue-600 font-black text-xs uppercase tracking-widest";
        }

        function resetToLobby() {
            engine.playing = false;
            document.getElementById('ui-overlay').classList.add('hidden');
            document.getElementById('launch-btn').disabled = false;
            document.getElementById('launch-btn').classList.remove('opacity-50');
            document.getElementById('equation-view').innerText = "문제가 여기에 표시됩니다";
            document.getElementById('equation-view').className = "text-5xl font-black text-slate-300 flex items-center justify-center";
            document.getElementById('factor-view').innerHTML = "";
            document.getElementById('status-bar').style.width = "0%";
            document.getElementById('layer-balloon').innerHTML = `
                <div id="ready-msg" class="absolute inset-0 flex flex-col items-center justify-center text-center p-10">
                    <div class="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center mb-4 text-3xl">🚀</div>
                    <h3 class="text-2xl font-black text-slate-800 mb-1">인수분해 대결 준비</h3>
                    <p class="text-slate-400 font-medium">다음 팀을 선택하고 시작 버튼을 누르세요!</p>
                </div>
            `;
            engine.team = null;
            document.querySelectorAll('.team-card').forEach(c => c.classList.remove('active'));
            document.getElementById('team-status').innerText = "팀을 선택하세요";
            document.getElementById('team-status').className = "text-slate-400 font-bold text-xs";
            document.getElementById('solved-status').innerText = "0 / 7";
            document.getElementById('timer-display').innerText = engine.baseTime;
        }

        function startChallenge() {
            if (!engine.team) {
                alert("참가할 팀을 먼저 골라주세요.");
                return;
            }
            engine.round = engine.startRound;
            engine.solved = 0;
            engine.playing = true;
            engine.time = engine.baseTime;
            document.getElementById('launch-btn').disabled = true;
            document.getElementById('launch-btn').classList.add('opacity-50');
            document.getElementById('layer-balloon').innerHTML = ''; 
            startCycle();
        }

        function startCycle() {
            engine.solved = 0;
            engine.playing = true;
            document.getElementById('ui-overlay').classList.add('hidden');
            document.getElementById('round-label').innerText = `${engine.round}단계`;
            document.getElementById('timer-display').innerText = Math.ceil(engine.time);
            
            updateUI();
            nextProblem();
            
            if(timerCore) clearInterval(timerCore);
            timerCore = setInterval(() => {
                if (!engine.playing) return;
                engine.time--;
                document.getElementById('timer-display').innerText = Math.max(0, Math.ceil(engine.time));
                if (engine.time <= 0) stopGame();
            }, 1000);

            if(spawnCore) clearInterval(spawnCore);
            if(engine.round === 3) {
                // 초기에 화면에 풍선 배치 (이미 트랙 중간에 있도록 딜레이 사용)
                for(let i = 0; i < 15; i++) {
                    createSushiBalloon(-(Math.random() * 20)); 
                }
                // 지속적 생성
                spawnCore = setInterval(() => createSushiBalloon(0), 1000);
            }
        }

        function nextProblem() {
            let p, q, r, s;
            let type = Math.random();

            if (engine.round === 1) {
                p = 1; r = 1;
                q = Math.floor(Math.random() * 11) - 5;
                s = Math.floor(Math.random() * 11) - 5;
            } else {
                if (type < 0.7) {
                    p = [1, 2, 3][Math.floor(Math.random() * 3)];
                    r = [1, 2][Math.floor(Math.random() * 2)];
                    q = Math.floor(Math.random() * 9) - 4;
                    s = Math.floor(Math.random() * 9) - 4;
                } else if (type < 0.9) {
                    p = 1; r = 1; q = 0;
                    s = Math.floor(Math.random() * 11) - 5;
                } else {
                    const n = [2, 3, 4, 5][Math.floor(Math.random() * 4)];
                    engine.currentFactors = [`x+1/${n}`, `x-1/${n}`];
                    engine.foundIndices = [];
                    const eqBox = document.getElementById('equation-view');
                    eqBox.innerHTML = mathFormat(`x² - 1/${n*n}`);
                    eqBox.className = "text-5xl font-black text-slate-800 flex items-center justify-center";
                    drawFactorSlots();
                    if(engine.round < 3) drawGrid();
                    return;
                }
            }

            const getF = (a, b) => {
                if (a === 0) return b.toString();
                let ap = (a === 1 ? "x" : (a === -1 ? "-x" : a + "x"));
                if (b === 0) return ap;
                return ap + (b > 0 ? "+" + b : b);
            };

            engine.currentFactors = [getF(p, q), getF(r, s)];
            engine.foundIndices = [];

            const A = p * r;
            const B = p * s + q * r;
            const C = q * s;

            let eqStr = "";
            if (A !== 0) eqStr += (A === 1 ? "x²" : (A === -1 ? "-x²" : A + "x²"));
            if (B !== 0) {
                let abB = Math.abs(B);
                eqStr += (B > 0 ? " + " : " - ") + (abB === 1 ? "x" : abB + "x");
            }
            if (C !== 0) eqStr += (C > 0 ? " + " : " - ") + Math.abs(C);
            if (!eqStr) eqStr = "0";

            const eqView = document.getElementById('equation-view');
            eqView.innerHTML = mathFormat(eqStr);
            eqView.className = "text-5xl font-black text-slate-800 flex items-center justify-center";
            
            drawFactorSlots();
            if(engine.round < 3) drawGrid();
        }

        function drawFactorSlots() {
            const box = document.getElementById('factor-view');
            box.innerHTML = '';
            engine.currentFactors.forEach((f, i) => {
                const s = document.createElement('div');
                const ok = engine.foundIndices.includes(i);
                s.className = `px-6 py-3 rounded-2xl border-4 transition-all duration-500 font-black text-2xl ${ok ? 'bg-blue-600 border-blue-700 text-white' : 'bg-white border-dashed border-slate-300 text-slate-200'}`;
                s.innerHTML = ok ? mathFormat(`(${f})`) : '( ? )';
                box.appendChild(s);
            });
            const max = engine.round === 3 ? 20 : engine.goal;
            const per = (engine.solved / max) * 100;
            document.getElementById('status-bar').style.width = per + '%';
        }

        const balColors = ['#f43f5e', '#2563eb', '#10b981', '#f59e0b', '#8b5cf6', '#d946ef'];

        function getWrongF() {
            if (engine.round === 1) return `x${(Math.random() > 0.5 ? '+' : '-')}${Math.floor(Math.random()*9+1)}`;
            const t = Math.random();
            if (t < 0.7) {
                const a = [1, 2, 3][Math.floor(Math.random()*3)];
                const b = Math.floor(Math.random()*11)-5;
                return (a === 1 ? 'x' : a+'x') + (b === 0 ? '' : (b > 0 ? '+'+b : b));
            } else if (t < 0.9) return "x";
            else return `x${Math.random() > 0.5 ? '+' : '-'}1/${[2, 3, 5][Math.floor(Math.random()*3)]}`;
        }

        function drawGrid() {
            const layer = document.getElementById('layer-balloon');
            layer.innerHTML = '';
            layer.className = "game-grid";
            let list = engine.currentFactors.map(f => ({ t: f }));
            while(list.length < 15) {
                const w = getWrongF();
                if(!engine.currentFactors.includes(w)) list.push({ t: w });
            }
            list.sort(() => Math.random() - 0.5);
            list.forEach(item => {
                const b = document.createElement('div');
                b.className = 'balloon static-balloon';
                b.innerHTML = mathFormat(`(${item.t})`);
                b.style.backgroundColor = balColors[Math.floor(Math.random() * balColors.length)];
                b.onclick = () => onPop(b, item.t);
                layer.appendChild(b);
            });
        }

        function createSushiBalloon(delay = 0) {
            if(!engine.playing || engine.round !== 3) return;
            const layer = document.getElementById('layer-balloon');
            layer.className = "relative h-full w-full";

            let avLanes = [];
            const now = Date.now();
            engine.tracks.forEach((cool, idx) => { if (now > cool) avLanes.push(idx); });

            if (avLanes.length === 0) return; 

            const lane = avLanes[Math.floor(Math.random() * avLanes.length)];
            // 가로 간격 확보를 위해 트랙 예약 (5초 대기)
            engine.tracks[lane] = now + 5000; 

            const b = document.createElement('div');
            b.className = 'balloon conveyor-move';
            
            const isOk = Math.random() < 0.45;
            let txt = isOk ? engine.currentFactors[Math.floor(Math.random() * 2)] : getWrongF();

            const trackHeight = 100 / 7;
            const topPos = (lane * trackHeight) + (trackHeight / 2) - 8;

            b.innerHTML = mathFormat(`(${txt})`);
            b.style.backgroundColor = balColors[Math.floor(Math.random() * balColors.length)];
            b.style.top = topPos + '%';
            
            if (delay !== 0) b.style.animationDelay = delay + 's';
            
            b.onclick = () => onPop(b, txt);
            layer.appendChild(b);
            
            setTimeout(() => { if(b.parentNode) b.remove(); }, 30000);
        }

        function onPop(el, text) {
            if (!engine.playing) return;
            const idx = engine.currentFactors.findIndex((f, i) => f === text && !engine.foundIndices.includes(i));

            if (idx !== -1) {
                el.classList.add('pop-effect');
                engine.foundIndices.push(idx);
                engine.scores[engine.team - 1] += 5;
                drawFactorSlots();
                updateUI();
                
                if (engine.foundIndices.length === 2) {
                    engine.scores[engine.team - 1] += 10;
                    engine.solved++;
                    updateUI();
                    if (engine.round < 3 && engine.solved >= engine.goal) {
                        clearRound();
                    } else {
                        setTimeout(nextProblem, 500);
                    }
                } else {
                    setTimeout(() => { if(el.parentNode) el.remove(); }, 400);
                }
            } else {
                el.classList.add('shake-effect');
                el.style.backgroundColor = '#334155';
                engine.time = Math.max(0, engine.time - 4);
                engine.scores[engine.team - 1] = Math.max(0, engine.scores[engine.team - 1] - 5);
                updateUI();
                setTimeout(() => el.classList.remove('shake-effect'), 500);
            }
        }

        function updateUI() {
            if (!engine.team) return;
            const target = engine.round === 3 ? "∞" : engine.goal;
            document.getElementById('solved-status').innerText = `${engine.solved} / ${target}`;
            document.getElementById(`score-val-${engine.team}`).innerText = engine.scores[engine.team - 1];
        }

        function clearRound() {
            engine.playing = false;
            clearInterval(timerCore);
            if(spawnCore) clearInterval(spawnCore);
            
            let bonus = 0;
            if (engine.time > (engine.baseTime / 2)) {
                bonus = 25; 
                engine.time += bonus;
                showExtension(bonus);
            }

            const ui = document.getElementById('ui-overlay');
            const title = document.getElementById('overlay-title');
            const desc = document.getElementById('overlay-desc');
            const btn = document.getElementById('overlay-btn');
            const icon = document.getElementById('overlay-icon');

            title.innerText = bonus > 0 ? "시간 연장!" : "단계 통과!";
            title.className = "text-6xl font-black mb-4 text-blue-600";
            desc.innerHTML = bonus > 0 ? 
                `속도가 대단합니다! 보너스 시간이 주어집니다.<br><span class="text-amber-500 text-4xl">+${bonus}초 추가!</span>` : 
                "목표를 달성했습니다. 다음 단계로 나아갑니다.";
            
            icon.innerText = "⭐";
            btn.innerText = "다음 단계 도전";
            btn.onclick = () => {
                engine.round++;
                startCycle();
            };
            ui.classList.remove('hidden');
        }

        function showExtension(s) {
            const box = document.getElementById('layer-effect');
            const d = document.createElement('div');
            d.className = 'bonus-notify';
            d.innerText = `+${s}초 시간 연장`;
            box.appendChild(d);
            setTimeout(() => d.remove(), 2000);
        }

        function stopGame() {
            engine.playing = false;
            clearInterval(timerCore);
            if(spawnCore) clearInterval(spawnCore);
            
            const ui = document.getElementById('ui-overlay');
            const title = document.getElementById('overlay-title');
            const desc = document.getElementById('overlay-desc');
            const btn = document.getElementById('overlay-btn');
            const icon = document.getElementById('overlay-icon');

            title.innerText = "시간 종료";
            title.className = "text-6xl font-black mb-4 text-red-500";
            desc.innerHTML = `대결이 끝났습니다!<br><span class="text-slate-800 font-black">해결한 문제: ${engine.solved}개</span><br><small class="text-slate-400">점수는 점수판에 보존됩니다.</small>`;
            icon.innerText = "⏰";
            btn.innerText = "메인으로 돌아가기";
            btn.onclick = () => resetToLobby();
            ui.classList.remove('hidden');
        }
    </script>
</body>
</html>
