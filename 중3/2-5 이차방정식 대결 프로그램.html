<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>이차방정식 토너먼트 배틀</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        body {
            font-family: 'Jua', sans-serif;
            background-color: #020617;
            color: #f1f5f9;
            overflow: hidden;
            margin: 0;
            user-select: none;
            touch-action: none;
        }
        canvas {
            display: block;
        }
        .screen {
            display: none;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        .screen.active {
            display: flex;
        }
        .match-card {
            background: #0f172a;
            border: 3px solid #1e293b;
            border-radius: 1.5rem;
            padding: 1.25rem;
            position: relative;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }
        .solo-card {
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
            border: 2px dashed #312e81;
        }
        .final-card {
            border: 3px solid #eab308;
            box-shadow: 0 0 25px rgba(234, 179, 8, 0.2);
        }
        .rank-badge {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-weight: 900;
        }
        .final-report-item {
            background: rgba(30, 41, 59, 0.7);
            border-radius: 1rem;
            margin-bottom: 0.5rem;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        /* 조작 가능 요소 스타일 */
        .team-winner-btn {
            cursor: pointer;
            transition: all 0.2s;
        }
        .team-winner-btn:hover {
            filter: brightness(1.2);
            transform: scale(1.02);
        }
    </style>
</head>
<body>

<div id="app">
    <!-- 1. 설정 화면 -->
    <div id="view-setup" class="screen flex-col items-center justify-center p-6 bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 overflow-y-auto active">
        <div class="bg-slate-900 p-8 md:p-12 rounded-[40px] border-2 border-slate-800 w-full max-w-2xl shadow-2xl">
            <h1 class="text-3xl md:text-4xl font-black mb-8 text-center text-blue-400">참가 팀 설정</h1>
            <div id="team-inputs" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8"></div>
            <div class="flex flex-col gap-4">
                <button id="btn-create-tournament" class="w-full bg-blue-600 hover:bg-blue-700 py-5 rounded-2xl text-2xl font-black text-white shadow-xl">새 토너먼트 시작</button>
                <button id="btn-continue-tournament" class="hidden w-full bg-slate-700 hover:bg-slate-600 py-4 rounded-2xl text-xl font-black text-white border-2 border-slate-500">이어서 하기</button>
            </div>
        </div>
    </div>

    <!-- 2. 대진표 화면 -->
    <div id="view-bracket" class="screen flex-col p-4 md:p-8 overflow-y-auto bg-slate-950">
        <div class="max-w-[1400px] mx-auto w-full flex flex-col">
            <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                <h1 class="text-3xl md:text-5xl font-bold text-white flex items-center gap-3">
                    <span class="text-yellow-400">🏆</span> 토너먼트 챌린지
                </h1>
                <button id="btn-reset" class="bg-slate-800 hover:bg-slate-700 px-6 py-2 rounded-xl text-white text-sm border border-slate-700">🔄 초기화</button>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="space-y-4">
                    <h2 class="text-slate-400 font-bold border-b border-slate-800 pb-2 flex justify-between">
                        <span>1단계: 예선 배틀</span>
                        <span class="text-[10px] bg-slate-800 px-2 rounded-full">VS 모드</span>
                    </h2>
                    <div id="round-1-matches" class="space-y-4"></div>
                </div>

                <div class="space-y-4">
                    <h2 class="text-indigo-400 font-bold border-b border-indigo-900 pb-2 flex justify-between">
                        <span>2단계: 솔로 기록 도전</span>
                        <span class="text-[10px] bg-indigo-900/50 px-2 rounded-full text-indigo-200">기록 모드</span>
                    </h2>
                    <div id="round-2-solo" class="space-y-4"></div>
                    <div id="ranking-board" class="mt-6 bg-slate-900/80 p-5 rounded-2xl border border-slate-800">
                        <h3 class="text-xs font-bold text-slate-500 mb-3 uppercase tracking-tighter">실시간 챌린지 순위</h3>
                        <div id="ranking-items" class="space-y-2"></div>
                    </div>
                </div>

                <div class="space-y-4">
                    <h2 class="text-yellow-400 font-bold border-b border-yellow-900 pb-2 flex justify-between">
                        <span>3단계: 최종 결승</span>
                        <span class="text-[10px] bg-yellow-900/50 px-2 rounded-full text-yellow-200">결승 배틀</span>
                    </h2>
                    <div id="final-match" class="flex flex-col justify-center min-h-[180px]"></div>
                    <div id="champion-display" class="hidden mt-4 p-6 bg-yellow-500/10 border-2 border-yellow-500/50 rounded-3xl text-center">
                        <span class="text-5xl block">🤴</span>
                        <p id="champion-name" class="text-3xl font-black text-white mt-2"></p>
                        <p class="text-[10px] text-yellow-500 font-bold uppercase">토너먼트 챔피언</p>
                        <button id="btn-show-report" class="mt-4 bg-yellow-500 text-black px-4 py-2 rounded-lg font-bold text-xs">전체 순위 리포트 보기</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. 게임 화면 -->
    <div id="view-game" class="screen flex-col overflow-hidden bg-slate-950">
        <canvas id="gameCanvas"></canvas>
        <div class="absolute top-0 left-0 w-full p-4 flex justify-between items-start pointer-events-none z-10">
            <div id="hud-left" class="bg-blue-600/90 px-4 py-2 rounded-xl border border-white/30 text-white shadow-xl backdrop-blur-sm">
                <p id="hud-p1-name" class="text-xs font-bold opacity-80">팀 A</p>
                <p id="hud-p1-score" class="text-2xl font-black text-yellow-300">0</p>
            </div>
            
            <div class="flex flex-col items-center gap-2 pointer-events-auto">
                <div id="hud-mode-tag" class="bg-white/10 px-3 py-1 rounded-full text-[10px] font-bold text-white tracking-widest uppercase">기록 모드</div>
                <div id="hud-timer" class="bg-slate-900/95 px-8 py-1 rounded-full border-2 border-yellow-500 text-3xl font-black text-white shadow-2xl min-w-[100px] text-center">--</div>
                <button id="btn-pause" class="text-xs text-slate-500 hover:text-white transition">일시정지</button>
            </div>

            <div id="hud-right" class="bg-red-600/90 px-4 py-2 rounded-xl border border-white/30 text-white shadow-xl backdrop-blur-sm text-right">
                <p id="hud-p2-name" class="text-xs font-bold opacity-80">팀 B</p>
                <p id="hud-p2-score" class="text-2xl font-black text-yellow-300">0</p>
            </div>
        </div>

        <div id="overlay-pause" class="hidden absolute inset-0 bg-black/80 flex items-center justify-center backdrop-blur-md z-30">
            <div class="text-center bg-slate-900 p-8 rounded-[2rem] border border-slate-700 w-full max-w-xs">
                <h2 class="text-2xl font-black text-white mb-6">경기 일시정지</h2>
                <div class="flex flex-col gap-3">
                    <button id="btn-resume" class="bg-blue-600 text-white py-3 rounded-xl font-bold">계속하기</button>
                    <button id="btn-quit" class="bg-slate-700 text-slate-300 py-3 rounded-xl font-bold">대진표로 나가기</button>
                </div>
            </div>
        </div>

        <div id="overlay-ready" class="absolute inset-0 bg-black/90 flex items-center justify-center backdrop-blur-md z-40">
            <div class="text-center bg-slate-900/80 p-8 rounded-[3rem] border border-slate-700 w-full max-w-sm">
                <h2 id="ready-title" class="text-3xl font-black text-white mb-2">기록에 도전하세요!</h2>
                <p id="ready-desc" class="text-slate-400 mb-8 text-sm">양쪽 총 10개의 문제가 동시에 나타납니다.</p>
                <div class="flex flex-col gap-3">
                    <button onclick="startGameEngine(60)" class="bg-blue-600 text-white py-4 rounded-2xl text-xl font-black">1분 시작</button>
                    <button onclick="startGameEngine(120)" class="bg-indigo-600 text-white py-4 rounded-2xl text-xl font-black">2분 시작</button>
                </div>
            </div>
        </div>

        <div id="overlay-result" class="hidden absolute inset-0 bg-black/95 flex items-center justify-center z-50">
            <div class="text-center p-10 bg-slate-900 rounded-[3rem] border border-slate-700 w-full max-w-md">
                <h2 class="text-4xl font-black text-yellow-500 mb-6 italic">종료!</h2>
                <div id="result-display" class="mb-8"></div>
                <button id="btn-save-result" class="w-full bg-white text-black py-4 rounded-2xl text-xl font-black">결과 저장 및 닫기</button>
            </div>
        </div>
    </div>

    <!-- 4. 최종 리포트 화면 -->
    <div id="view-report" class="screen flex-col items-center justify-center p-6 bg-slate-950 overflow-y-auto">
        <div class="bg-slate-900 p-8 md:p-12 rounded-[40px] border-2 border-yellow-500/50 w-full max-w-2xl shadow-2xl relative">
            <div class="text-6xl text-center mb-4">🏆</div>
            <h1 class="text-3xl md:text-4xl font-black mb-8 text-center text-white">최종 순위 리포트</h1>
            
            <div id="final-report-list" class="space-y-2 mb-10">
                <!-- 순위 아이템들이 여기에 생성됨 -->
            </div>

            <button id="btn-report-close" class="w-full bg-slate-800 hover:bg-slate-700 text-white py-4 rounded-2xl text-xl font-black transition-all">대진표로 돌아가기</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // --- 상태 ---
    let db = null, auth = null, user = null, isOffline = true;
    let tournament = null;
    let currentMatchId = null;
    let teamNames = ['팀 A', '팀 B', '팀 C', '팀 D', '팀 E', '팀 F'];
    let gameData = { mode: 'VS', scores: [0, 0], timeLeft: 60, gameState: 'ready', baskets: [], numbers: [], touches: {}, lastSpawn: 0, animId: null };
    let timerInterval = null;
    
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'quad-tournament-solo-v2';

    const showView = (id) => {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(`view-${id}`).classList.add('active');
    };

    const renderSetupInputs = () => {
        const container = document.getElementById('team-inputs');
        container.innerHTML = teamNames.map((n, i) => `
            <div class="flex flex-col">
                <label class="text-[10px] text-slate-500 ml-1 mb-1 font-bold">팀 ${i+1}</label>
                <input type="text" data-index="${i}" value="${n}" class="team-input bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white font-bold outline-none focus:border-blue-500">
            </div>
        `).join('');
    };

    const init = async () => {
        if (typeof __firebase_config !== 'undefined' && __firebase_config) {
            try {
                const config = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config;
                const app = initializeApp(config);
                auth = getAuth(app);
                db = getFirestore(app);
                isOffline = false;
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                else await signInAnonymously(auth);
                onAuthStateChanged(auth, (u) => { user = u; if (user) listenTournament(); });
            } catch (e) { isOffline = true; }
        }

        const saved = localStorage.getItem('local_tournament_solo_v2');
        if (saved) {
            tournament = JSON.parse(saved);
            teamNames = tournament.teams.map(t => t.name);
            document.getElementById('btn-continue-tournament').classList.remove('hidden');
        }

        renderSetupInputs();
        document.getElementById('btn-create-tournament').onclick = createTournament;
        document.getElementById('btn-continue-tournament').onclick = () => { renderBracket(); showView('bracket'); };
        document.getElementById('btn-reset').onclick = () => showView('setup');
        document.getElementById('btn-pause').onclick = () => { gameData.gameState = 'paused'; clearInterval(timerInterval); document.getElementById('overlay-pause').classList.remove('hidden'); };
        document.getElementById('btn-resume').onclick = () => { gameData.gameState = 'playing'; startTimer(); document.getElementById('overlay-pause').classList.add('hidden'); };
        document.getElementById('btn-quit').onclick = () => { gameData.gameState = 'ended'; showView('bracket'); };
        document.getElementById('btn-save-result').onclick = recordMatchResult;
        document.getElementById('btn-show-report').onclick = renderFinalReport;
        document.getElementById('btn-report-close').onclick = () => showView('bracket');
    };

    const listenTournament = () => {
        if (!db || isOffline) return;
        onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'tournament', 'main'), (snap) => {
            if (snap.exists()) {
                tournament = snap.data();
                renderSetupInputs();
                document.getElementById('btn-continue-tournament').classList.remove('hidden');
                if (document.getElementById('view-bracket').classList.contains('active')) renderBracket();
            }
        });
    };

    const saveState = async (data) => {
        tournament = data;
        if (!isOffline && db && user) {
            try { await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'tournament', 'main'), data); } catch(e) {}
        } else {
            localStorage.setItem('local_tournament_solo_v2', JSON.stringify(data));
        }
        renderBracket();
        showView('bracket');
    };

    const createTournament = async () => {
        const inputs = document.querySelectorAll('.team-input');
        teamNames = Array.from(inputs).map(i => i.value || `팀 ${parseInt(i.dataset.index)+1}`);
        const shuffledIndices = [0, 1, 2, 3, 4, 5].sort(() => Math.random() - 0.5);
        
        const newState = {
            teams: teamNames.map((name, id) => ({ id, name })),
            matches: [
                { id: 0, mode: 'VS', p1: shuffledIndices[0], p2: shuffledIndices[1], winner: null },
                { id: 1, mode: 'VS', p1: shuffledIndices[2], p2: shuffledIndices[3], winner: null },
                { id: 2, mode: 'VS', p1: shuffledIndices[4], p2: shuffledIndices[5], winner: null },
                { id: 3, mode: 'SOLO', p1: null, score: 0, finished: false },
                { id: 4, mode: 'SOLO', p1: null, score: 0, finished: false },
                { id: 5, mode: 'SOLO', p1: null, score: 0, finished: false },
                { id: 6, mode: 'VS', p1: null, p2: null, winner: null, loser: null }
            ],
            winner: null
        };
        await saveState(newState);
    };

    // 조작 기능: 클릭 시 승리 처리
    window.manuallySetWinner = async (matchId, winnerId) => {
        const updated = JSON.parse(JSON.stringify(tournament));
        const m = updated.matches.find(x => x.id === matchId);

        if (m.mode === 'SOLO') {
            // 솔로 모드는 조작 시 임의의 점수(100점)로 완료 처리
            m.score = 100;
            m.finished = true;
            const solos = updated.matches.slice(3, 6);
            if (solos.every(s => s.finished)) {
                const winners = solos.sort((a, b) => b.score - a.score);
                updated.matches[6].p1 = winners[0].p1;
                updated.matches[6].p2 = winners[1].p1;
            }
        } else {
            const loserId = (winnerId === m.p1) ? m.p2 : m.p1;
            m.winner = winnerId;
            if (matchId < 3) {
                updated.matches[matchId + 3].p1 = winnerId;
            } else if (matchId === 6) {
                updated.winner = winnerId;
                m.loser = loserId;
            }
        }
        await saveState(updated);
        if (matchId === 6) renderFinalReport();
    };

    const renderBracket = () => {
        if (!tournament) return;
        const r1 = document.getElementById('round-1-matches'), r2 = document.getElementById('round-2-solo'), rf = document.getElementById('final-match'), rankBoard = document.getElementById('ranking-items');
        r1.innerHTML = ''; r2.innerHTML = ''; rf.innerHTML = ''; rankBoard.innerHTML = '';

        // 1단계 예선
        tournament.matches.slice(0, 3).forEach(m => {
            const p1 = tournament.teams.find(t => t.id === m.p1), p2 = tournament.teams.find(t => t.id === m.p2);
            const div = document.createElement('div'); div.className = 'match-card';
            div.innerHTML = `
                <div onclick="window.manuallySetWinner(${m.id}, ${m.p1})" class="team-winner-btn flex justify-between items-center p-3 rounded-xl mb-1 ${m.winner === m.p1 ? 'bg-blue-600/20 ring-1 ring-blue-500' : 'bg-slate-900'}">
                    <span class="truncate">${p1.name}</span> ${m.winner === m.p1 ? '🏅' : ''}
                </div>
                <div onclick="window.manuallySetWinner(${m.id}, ${m.p2})" class="team-winner-btn flex justify-between items-center p-3 rounded-xl ${m.winner === m.p2 ? 'bg-blue-600/20 ring-1 ring-blue-500' : 'bg-slate-900'}">
                    <span class="truncate">${p2.name}</span> ${m.winner === m.p2 ? '🏅' : ''}
                </div>
                ${m.winner === null ? `<button class="absolute -right-3 top-1/2 -translate-y-1/2 bg-blue-600 w-10 h-10 rounded-full flex items-center justify-center shadow-lg" onclick="event.stopPropagation(); startMatch(${m.id})">▶</button>` : ''}
            `;
            r1.appendChild(div);
        });

        // 2단계 솔로
        tournament.matches.slice(3, 6).forEach(m => {
            const p1 = tournament.teams.find(t => t.id === m.p1);
            const div = document.createElement('div'); div.className = 'match-card solo-card';
            div.innerHTML = `
                <div onclick="${p1 && !m.finished ? `window.manuallySetWinner(${m.id}, ${m.p1})` : ''}" class="${p1 && !m.finished ? 'team-winner-btn' : ''} flex flex-col items-center gap-1">
                    <span class="text-indigo-400 text-[10px] font-bold">솔로 도전</span>
                    <span class="text-lg font-black">${p1 ? p1.name : '대기 중'}</span>
                    <span class="text-2xl font-black text-indigo-300">${m.finished ? m.score + '점' : '--'}</span>
                </div>
                ${(p1 && !m.finished) ? `<button class="absolute -right-3 top-1/2 -translate-y-1/2 bg-indigo-600 w-10 h-10 rounded-full flex items-center justify-center shadow-lg" onclick="event.stopPropagation(); startMatch(${m.id})">▶</button>` : ''}
            `;
            r2.appendChild(div);
        });

        // 랭킹 보드
        const soloWinners = tournament.matches.slice(3, 6).filter(m => m.finished).sort((a, b) => b.score - a.score);
        soloWinners.forEach((w, i) => {
            const team = tournament.teams.find(t => t.id === w.p1);
            const div = document.createElement('div'); div.className = `flex justify-between items-center p-2 rounded-lg ${i < 2 ? 'bg-slate-800' : 'opacity-50'}`;
            div.innerHTML = `
                <div class="flex items-center gap-2">
                    <div class="rank-badge ${i === 0 ? 'bg-yellow-500' : (i === 1 ? 'bg-slate-400' : 'bg-orange-800')} text-[10px] text-black">${i+1}</div>
                    <span class="text-xs font-bold">${team.name}</span>
                </div>
                <span class="text-xs font-black text-blue-400">${w.score}</span>
            `;
            rankBoard.appendChild(div);
        });

        // 3단계 결승
        const fm = tournament.matches[6];
        const fp1 = tournament.teams.find(t => t.id === fm.p1), fp2 = tournament.teams.find(t => t.id === fm.p2);
        const fDiv = document.createElement('div'); fDiv.className = 'match-card final-card text-center relative';
        fDiv.innerHTML = `
            <div class="text-[10px] text-yellow-500 font-black mb-3">그랜드 파이널</div>
            <div class="flex items-center justify-around gap-2 mb-2">
                <div onclick="${fp1 && !fm.winner ? `window.manuallySetWinner(${fm.id}, ${fm.p1})` : ''}" class="${fp1 && !fm.winner ? 'team-winner-btn' : ''} flex flex-col items-center">
                    <div class="w-12 h-12 rounded-full bg-slate-900 border border-slate-700 flex items-center justify-center mb-1 ${fm.winner === fm.p1 ? 'ring-2 ring-yellow-500' : ''}">${fm.winner === fm.p1 ? '🤴' : '🛡️'}</div>
                    <span class="text-xs font-bold truncate max-w-[80px]">${fp1 ? fp1.name : '1위 대기'}</span>
                </div>
                <span class="text-slate-700 font-black italic">VS</span>
                <div onclick="${fp2 && !fm.winner ? `window.manuallySetWinner(${fm.id}, ${fm.p2})` : ''}" class="${fp2 && !fm.winner ? 'team-winner-btn' : ''} flex flex-col items-center">
                    <div class="w-12 h-12 rounded-full bg-slate-900 border border-slate-700 flex items-center justify-center mb-1 ${fm.winner === fm.p2 ? 'ring-2 ring-yellow-500' : ''}">${fm.winner === fm.p2 ? '🤴' : '🛡️'}</div>
                    <span class="text-xs font-bold truncate max-w-[80px]">${fp2 ? fp2.name : '2위 대기'}</span>
                </div>
            </div>
            ${(fp1 && fp2 && !fm.winner) ? `<button class="bg-yellow-500 text-black px-6 py-2 rounded-xl font-black text-sm mt-2 shadow-lg" onclick="event.stopPropagation(); startMatch(6)">결승전 시작!</button>` : ''}
        `;
        rf.appendChild(fDiv);

        if (tournament.winner !== null) {
            document.getElementById('champion-display').classList.remove('hidden');
            document.getElementById('champion-name').innerText = tournament.teams.find(t => t.id === tournament.winner).name;
        }
    };

    const renderFinalReport = () => {
        const list = document.getElementById('final-report-list');
        list.innerHTML = '';
        
        const rankings = [];
        const fm = tournament.matches[6];
        
        // 1등, 2등
        rankings.push({ id: fm.winner, rank: 1, points: 10, name: tournament.teams.find(t => t.id === fm.winner).name });
        rankings.push({ id: fm.loser, rank: 2, points: 5, name: tournament.teams.find(t => t.id === fm.loser).name });
        
        // 3등 (솔로전에서 결승 못간 1팀)
        const soloParticipants = tournament.matches.slice(3, 6).map(m => m.p1);
        const finalParticipants = [fm.p1, fm.p2];
        const thirdPlaceId = soloParticipants.find(id => !finalParticipants.includes(id));
        if (thirdPlaceId !== undefined) {
            rankings.push({ id: thirdPlaceId, rank: 3, points: 3, name: tournament.teams.find(t => t.id === thirdPlaceId).name });
        }
        
        // 예선 탈락 (3팀)
        const qualifierMatches = tournament.matches.slice(0, 3);
        qualifierMatches.forEach(m => {
            const loserId = m.winner === m.p1 ? m.p2 : m.p1;
            rankings.push({ id: loserId, rank: 4, points: 1, name: tournament.teams.find(t => t.id === loserId).name });
        });

        rankings.sort((a, b) => a.rank - b.rank).forEach(r => {
            const div = document.createElement('div');
            div.className = `final-report-item ${r.rank === 1 ? 'border-2 border-yellow-500' : ''}`;
            div.innerHTML = `
                <div class="flex items-center gap-4">
                    <span class="text-2xl font-black ${r.rank === 1 ? 'text-yellow-400' : 'text-slate-400'}">${r.rank}위</span>
                    <span class="text-xl font-bold text-white">${r.name}</span>
                </div>
                <div class="text-right">
                    <span class="text-sm block text-slate-500">획득 포인트</span>
                    <span class="text-2xl font-black text-blue-400">${r.points}점</span>
                </div>
            `;
            list.appendChild(div);
        });
        
        showView('report');
    };

    window.startMatch = (id) => {
        currentMatchId = id;
        const m = tournament.matches.find(x => x.id === id);
        gameData.mode = m.mode;
        
        if (m.mode === 'SOLO') {
            const p1 = tournament.teams.find(t => t.id === m.p1);
            document.getElementById('hud-p1-name').innerText = p1.name;
            document.getElementById('hud-right').classList.add('invisible');
            document.getElementById('hud-mode-tag').innerText = '기록 도전 모드 (10문제)';
            document.getElementById('ready-title').innerText = `${p1.name} 팀의 기록 도전!`;
        } else {
            const p1 = tournament.teams.find(t => t.id === m.p1), p2 = tournament.teams.find(t => t.id === m.p2);
            document.getElementById('hud-p1-name').innerText = p1.name;
            document.getElementById('hud-p2-name').innerText = p2.name;
            document.getElementById('hud-right').classList.remove('invisible');
            document.getElementById('hud-mode-tag').innerText = id === 6 ? '최종 결승전' : '배틀 모드';
            document.getElementById('ready-title').innerText = '진검승부 배틀!';
        }
        initGameEngine();
        showView('game');
    };

    const recordMatchResult = async () => {
        const updated = JSON.parse(JSON.stringify(tournament));
        const m = updated.matches.find(x => x.id === currentMatchId);
        
        if (m.mode === 'SOLO') {
            m.score = gameData.scores[0] + gameData.scores[1];
            m.finished = true;
            const solos = updated.matches.slice(3, 6);
            if (solos.every(s => s.finished)) {
                const winners = solos.sort((a, b) => b.score - a.score);
                updated.matches[6].p1 = winners[0].p1;
                updated.matches[6].p2 = winners[1].p1;
            }
        } else {
            const winnerIdx = gameData.scores[0] >= gameData.scores[1] ? 0 : 1;
            const winnerId = winnerIdx === 0 ? m.p1 : m.p2;
            const loserId = winnerIdx === 0 ? m.p2 : m.p1;
            m.winner = winnerId;
            
            if (currentMatchId < 3) updated.matches[currentMatchId + 3].p1 = winnerId;
            else if (currentMatchId === 6) {
                updated.winner = winnerId;
                m.loser = loserId;
            }
        }
        await saveState(updated);
        
        if (currentMatchId === 6) {
            renderFinalReport();
        } else {
            showView('bracket');
        }
    };

    // --- 게임 엔진 ---
    const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d');
    
    const generateEquation = () => {
        let r1, r2; do { r1 = Math.floor(Math.random() * 11) - 5; r2 = Math.floor(Math.random() * 11) - 5; } while (r1 === r2);
        const sum = r1 + r2, prod = r1 * r2;
        let t2 = sum === 0 ? "" : (sum > 0 ? ` - ${sum}x` : ` + ${Math.abs(sum)}x`);
        if (sum === 1) t2 = " - x"; if (sum === -1) t2 = " + x";
        let t3 = prod === 0 ? "" : (prod > 0 ? ` + ${prod}` : ` - ${Math.abs(prod)}`);
        return { str: `x²${t2}${t3} = 0`, roots: [r1, r2], found: [] };
    };

    const spawnNumber = (val = null, sideHint = null) => {
        let x;
        if (sideHint === 0) x = 300 + Math.random() * (canvas.width/2 - 400);
        else if (sideHint === 1) x = canvas.width/2 + 100 + Math.random() * (canvas.width/2 - 400);
        else x = canvas.width/2 + (Math.random() - 0.5) * 100;

        gameData.numbers.push({ 
            x: x, y: Math.random() * (canvas.height - 300) + 150,
            val: val !== null ? val : Math.floor(Math.random() * 15) - 7, radius: 32, 
            color: `hsl(${Math.random() * 360}, 60%, 60%)`, vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4, dragId: null 
        });
    };

    const initGameEngine = () => {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        gameData.scores = [0, 0]; gameData.gameState = 'ready'; gameData.numbers = []; gameData.touches = {};
        document.getElementById('hud-p1-score').innerText = '0'; document.getElementById('hud-p2-score').innerText = '0';
        document.getElementById('overlay-ready').classList.remove('hidden'); document.getElementById('overlay-result').classList.add('hidden');
        
        const isSolo = gameData.mode === 'SOLO';
        const numBaskets = isSolo ? 10 : 5;
        gameData.baskets = Array.from({ length: numBaskets }, (_, i) => {
            const side = isSolo ? (i < 5 ? 0 : 1) : null;
            const yIndex = isSolo ? (i % 5) : i;
            return { eq: generateEquation(), y: 120 + yIndex * ((canvas.height - 220) / 5), h: ((canvas.height - 220) / 5) - 10, side: side };
        });
        gameData.baskets.forEach(b => { spawnNumber(b.eq.roots[0], b.side); spawnNumber(b.eq.roots[1], b.side); });
        if (gameData.animId) cancelAnimationFrame(gameData.animId);
        gameData.animId = requestAnimationFrame(gameLoop);
    };

    window.startGameEngine = (sec) => {
        gameData.timeLeft = sec; gameData.gameState = 'playing'; startTimer();
        document.getElementById('overlay-ready').classList.add('hidden');
    };

    const startTimer = () => {
        timerInterval = setInterval(() => {
            gameData.timeLeft--; document.getElementById('hud-timer').innerText = gameData.timeLeft;
            if (gameData.timeLeft <= 0) { gameData.gameState = 'ended'; clearInterval(timerInterval); showFinalResult(); }
        }, 1000);
    };

    const gameLoop = (t) => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#0f172a'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.setLineDash([10, 10]);
        ctx.beginPath(); ctx.moveTo(canvas.width/2, 100); ctx.lineTo(canvas.width/2, canvas.height-50); ctx.stroke(); ctx.setLineDash([]);

        gameData.baskets.forEach((b) => {
            if (gameData.mode === 'SOLO') {
                const side = b.side; const x = side === 0 ? 20 : canvas.width - 250, w = 230;
                ctx.fillStyle = '#1e3a8a'; ctx.beginPath(); ctx.roundRect(x, b.y, w, b.h, 12); ctx.fill();
                ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.stroke();
                ctx.fillStyle = '#fff'; ctx.font = 'bold 16px Arial'; ctx.textAlign = 'center';
                ctx.fillText(b.eq.str, x + w/2, b.y + b.h/2 + 5);
                b.eq.found.forEach((f, i) => { ctx.beginPath(); ctx.arc(x + w/2 - 15 + i*30, b.y + b.h - 12, 5, 0, Math.PI*2); ctx.fillStyle = '#fbbf24'; ctx.fill(); });
            } else {
                [0, 1].forEach(side => {
                    const x = side === 0 ? 20 : canvas.width - 250, w = 230;
                    ctx.fillStyle = side === 0 ? '#1e40af' : '#991b1b';
                    ctx.beginPath(); ctx.roundRect(x, b.y, w, b.h, 12); ctx.fill();
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
                    ctx.fillStyle = '#fff'; ctx.font = 'bold 18px Arial'; ctx.textAlign = 'center';
                    ctx.fillText(b.eq.str, x + w/2, b.y + b.h/2 + 5);
                    b.eq.found.forEach((f, i) => { ctx.beginPath(); ctx.arc(x + w/2 - 15 + i*30, b.y + b.h - 12, 5, 0, Math.PI*2); ctx.fillStyle = '#fbbf24'; ctx.fill(); });
                });
            }
        });

        gameData.numbers.forEach(n => {
            if (!n.dragId && gameData.gameState === 'playing') { n.x += n.vx; n.y += n.vy; if (n.x < 280 || n.x > canvas.width - 280) n.vx *= -1; if (n.y < 100 || n.y > canvas.height - 100) n.vy *= -1; }
            ctx.fillStyle = n.color; ctx.beginPath(); ctx.arc(n.x, n.y, n.radius, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.font = 'bold 20px Arial'; ctx.textAlign = 'center'; ctx.fillText(n.val, n.x, n.y + 7);
        });
        if (gameData.gameState === 'playing' && t - gameData.lastSpawn > 1400) { spawnNumber(); gameData.lastSpawn = t; }
        gameData.animId = requestAnimationFrame(gameLoop);
    };

    const showFinalResult = () => {
        const res = document.getElementById('result-display');
        const total = gameData.scores[0] + gameData.scores[1];
        if (gameData.mode === 'SOLO') res.innerHTML = `<p class="text-indigo-400 text-lg uppercase font-bold tracking-widest">기록 점수</p><p class="text-8xl font-black text-white">${total}</p>`;
        else res.innerHTML = `<div class="flex justify-around items-center gap-4"><div><p class="text-5xl font-black text-blue-500">${gameData.scores[0]}</p><p class="text-[10px] opacity-50 uppercase">블루 팀</p></div><div class="text-3xl opacity-30 italic font-black">VS</div><div><p class="text-5xl font-black text-red-500">${gameData.scores[1]}</p><p class="text-[10px] opacity-50 uppercase">레드 팀</p></div></div>`;
        document.getElementById('overlay-result').classList.remove('hidden');
    };

    const handleStart = (e) => {
        if (gameData.gameState !== 'playing') return;
        const r = canvas.getBoundingClientRect();
        const ts = e.touches ? Array.from(e.touches) : [e];
        ts.forEach(t => {
            const x = (t.clientX || t.pageX) - r.left, y = (t.clientY || t.pageY) - r.top, id = t.identifier || 'mouse';
            const target = gameData.numbers.find(n => !n.dragId && Math.sqrt((n.x-x)**2+(n.y-y)**2) < n.radius);
            if (target) { target.dragId = id; gameData.touches[id] = target; }
        });
    };
    const handleMove = (e) => {
        if (gameData.gameState !== 'playing') return;
        const r = canvas.getBoundingClientRect();
        const ts = e.touches ? Array.from(e.touches) : [e];
        ts.forEach(t => { const id = t.identifier || 'mouse'; if (gameData.touches[id]) { gameData.touches[id].x = (t.clientX || t.pageX) - r.left; gameData.touches[id].y = (t.clientY || t.pageY) - r.top; } });
        if (e.cancelable) e.preventDefault();
    };
    const handleEnd = (e) => {
        const ids = e.changedTouches ? Array.from(e.changedTouches).map(t => t.identifier) : ['mouse'];
        ids.forEach(id => {
            const n = gameData.touches[id];
            if (n) {
                if (gameData.gameState === 'playing') {
                    const side = n.x < canvas.width / 2 ? 0 : 1; const bx = side === 0 ? 20 : canvas.width - 250; let hit = false;
                    const relevantBaskets = gameData.mode === 'SOLO' ? gameData.baskets.filter(b => b.side === side) : gameData.baskets;
                    relevantBaskets.forEach(b => {
                        if (n.x > bx && n.x < bx + 230 && n.y > b.y && n.y < b.y + b.h) {
                            if (b.eq.roots.includes(n.val) && !b.eq.found.includes(n.val)) {
                                b.eq.found.push(n.val); gameData.scores[side] += 20; hit = true;
                                if (b.eq.found.length === 2) { gameData.scores[side] += 30; setTimeout(() => { b.eq = generateEquation(); spawnNumber(b.eq.roots[0], b.side); spawnNumber(b.eq.roots[1], b.side); }, 200); }
                            } else { gameData.scores[side] = Math.max(0, gameData.scores[side] - 10); }
                        }
                    });
                    document.getElementById('hud-p1-score').innerText = gameData.mode === 'SOLO' ? gameData.scores[0] + gameData.scores[1] : gameData.scores[0];
                    document.getElementById('hud-p2-score').innerText = gameData.scores[1];
                    if (hit) gameData.numbers = gameData.numbers.filter(x => x !== n); else n.dragId = null;
                } else n.dragId = null;
                delete gameData.touches[id];
            }
        });
    };

    canvas.addEventListener('mousedown', handleStart); window.addEventListener('mousemove', handleMove, { passive: false }); window.addEventListener('mouseup', handleEnd);
    canvas.addEventListener('touchstart', handleStart, { passive: false }); window.addEventListener('touchmove', handleMove, { passive: false }); window.addEventListener('touchend', handleEnd);
    window.onload = init;
</script>
</body>
</html>
