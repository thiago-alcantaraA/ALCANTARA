<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이차함수 평행이동 시뮬레이터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;800&display=swap');
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; overflow: hidden; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            background: #334155;
            height: 0.4rem;
            border-radius: 0.5rem;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            margin-top: -0.55rem;
            background-color: currentColor;
            height: 1.5rem;
            width: 1.5rem;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const App = () => {
            const [a, setA] = useState(1);
            const [p, setP] = useState(0);
            const [q, setQ] = useState(0);

            useEffect(() => { 
                if (window.lucide) {
                    window.lucide.createIcons(); 
                }
            }, []);

            const RenderFrac = ({ val, className = "" }) => {
                if (val === 0) return <span>0</span>;
                if (Number.isInteger(val)) return <span>{val}</span>;
                const numerator = Math.round(val * 2);
                const isNegative = numerator < 0;
                const absNumerator = Math.abs(numerator);
                return (
                    <span className={`inline-flex items-center align-middle ${className}`}>
                        {isNegative && <span className="mr-0.5">－</span>}
                        <span className="flex flex-col items-center leading-none text-[0.8em]">
                            <span className="pb-0.5 border-b border-current px-0.5">{absNumerator}</span>
                            <span className="pt-0.5 px-0.5">2</span>
                        </span>
                    </span>
                );
            };

            const RenderA = (val) => {
                if (val === 0) return <span>0</span>;
                if (val === 1) return null;
                if (val === -1) return <span className="mr-[-2px]">－</span>;
                return <RenderFrac val={val} className="mr-1" />;
            };

            const points = useMemo(() => {
                const data = [];
                for (let x = -3; x <= 3; x++) {
                    const y = a * Math.pow(x, 2);
                    data.push({ x, y, newX: x + p, newY: y + q });
                }
                return data;
            }, [a, p, q]);

            const viewBoxWidth = 600;
            const viewBoxHeight = 400;
            const scaleX = 35; 
            const scaleY = 12;
            const centerX = viewBoxWidth / 2; 
            const centerY = (viewBoxHeight / 2) + 50; 
            
            const toSvgX = (x) => centerX + x * scaleX;
            const toSvgY = (y) => centerY - y * scaleY;

            const getPath = (ca, cp, cq) => {
                let d = "";
                for (let x = -12; x <= 12; x += 0.1) {
                    const y = ca * Math.pow(x - cp, 2) + cq;
                    const sx = toSvgX(x); const sy = toSvgY(y);
                    if (x === -12) d += `M ${sx} ${sy}`;
                    else d += ` L ${sx} ${sy}`;
                }
                return d;
            };

            return (
                <div className="flex flex-col h-screen bg-slate-900 text-slate-100 p-6 overflow-hidden">
                    <header className="flex justify-between items-center mb-6 px-4">
                        <h1 className="text-3xl font-bold flex items-center gap-3">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-blue-400"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
                            이차함수 평행이동의 원리
                        </h1>
                        <div className="bg-slate-800 px-10 py-4 rounded-full border border-slate-700 shadow-2xl">
                            <code className="text-3xl font-mono flex items-center">
                                y － <span className="text-green-400 font-bold mx-1">{q >= 0 ? q : `(${q})`}</span>
                                <span className="mx-2">＝</span>
                                {a === 0 ? <span className="font-bold">0</span> : 
                                    <React.Fragment>
                                        {RenderA(a)}(x － <span className="text-red-400 font-bold mx-1">{p >= 0 ? p : `(${p})`}</span>)²
                                    </React.Fragment>
                                }
                            </code>
                        </div>
                    </header>

                    <div className="grid grid-cols-12 gap-6 flex-1 overflow-hidden">
                        <div className="col-span-7 flex flex-col gap-6 overflow-hidden">
                            
                            {/* 1. 상단 가로형 조절기 - p의 범위를 -6 ~ 6으로 수정 */}
                            <div className="bg-slate-800/50 rounded-3xl p-6 border border-slate-700 shadow-lg">
                                <div className="grid grid-cols-3 gap-8">
                                    <div className="flex flex-col justify-center">
                                        <div className="flex justify-between mb-2 items-center">
                                            <label className="text-slate-400 font-medium">폭 (a)</label>
                                            <span className="text-blue-400 font-bold text-xl"><RenderFrac val={a} /></span>
                                        </div>
                                        <input type="range" min="-4" max="4" step="0.5" value={a} onChange={(e) => setA(parseFloat(e.target.value))} className="w-full text-blue-500" />
                                    </div>
                                    <div className="flex flex-col justify-center border-l border-slate-700/50 pl-8">
                                        <div className="flex justify-between mb-2 items-center">
                                            <label className="text-slate-400 font-medium">x축 이동 (p)</label>
                                            <span className="text-red-400 font-bold text-xl">{p >= 0 ? `+${p}` : p}</span>
                                        </div>
                                        <input type="range" min="-6" max="6" step="1" value={p} onChange={(e) => setP(parseFloat(e.target.value))} className="w-full text-red-500" />
                                    </div>
                                    <div className="flex flex-col justify-center border-l border-slate-700/50 pl-8">
                                        <div className="flex justify-between mb-2 items-center">
                                            <label className="text-slate-400 font-medium">y축 이동 (q)</label>
                                            <span className="text-green-400 font-bold text-xl">{q >= 0 ? `+${q}` : q}</span>
                                        </div>
                                        <input type="range" min="-10" max="10" step="1" value={q} onChange={(e) => setQ(parseFloat(e.target.value))} className="w-full text-green-500" />
                                    </div>
                                </div>
                            </div>

                            {/* 2. 가로로 긴 그래프 */}
                            <div className="flex-1 bg-white rounded-3xl p-4 flex flex-col relative shadow-2xl overflow-hidden">
                                <div className="flex-1 relative border-2 border-slate-100 rounded-2xl overflow-hidden bg-slate-50">
                                    <svg viewBox={`0 0 ${viewBoxWidth} ${viewBoxHeight}`} className="w-full h-full preserve-aspect-ratio">
                                        {/* Grid lines */}
                                        {[-10, -8, -6, -4, -2, 0, 2, 4, 6, 8, 10].map(x => (
                                            <line key={`x-${x}`} x1={toSvgX(x)} y1="0" x2={toSvgX(x)} y2={viewBoxHeight} stroke="#e2e8f0" strokeWidth="1" strokeDasharray={x===0?"0":"4"} />
                                        ))}
                                        {[-20, -15, -10, -5, 0, 5, 10, 15, 20].map(y => (
                                            <line key={`y-${y}`} x1="0" y1={toSvgY(y)} x2={viewBoxWidth} y2={toSvgY(y)} stroke="#e2e8f0" strokeWidth="1" strokeDasharray={y===0?"0":"4"} />
                                        ))}
                                        
                                        {/* Axes */}
                                        <line x1="0" y1={centerY} x2={viewBoxWidth} y2={centerY} stroke="#94a3b8" strokeWidth="2" />
                                        <line x1={centerX} y1="0" x2={centerX} y2={viewBoxHeight} stroke="#94a3b8" strokeWidth="2" />
                                        
                                        {/* Base Curve (Dashed) */}
                                        <path d={getPath(a, 0, 0)} fill="none" stroke="#cbd5e1" strokeWidth="3" strokeDasharray="6" />
                                        
                                        {/* Translated Curve */}
                                        <path d={getPath(a, p, q)} fill="none" stroke="#3b82f6" strokeWidth="5" />
                                        
                                        {/* Moving Points */}
                                        {points.map((pt, i) => (
                                            <g key={i}>
                                                <circle cx={toSvgX(pt.x)} cy={toSvgY(pt.y)} r="3" fill="#cbd5e1" />
                                                <circle cx={toSvgX(pt.newX)} cy={toSvgY(pt.newY)} r="6" fill="#ef4444" />
                                                {(p !== 0 || q !== 0) && <path d={`M ${toSvgX(pt.x)} ${toSvgY(pt.y)} L ${toSvgX(pt.newX)} ${toSvgY(pt.newY)}`} stroke="#ef4444" strokeWidth="2" strokeDasharray="3" opacity="0.4" />}
                                            </g>
                                        ))}
                                    </svg>
                                    <div className="absolute top-4 left-4 flex gap-4 text-xs font-bold text-slate-400">
                                        <div className="flex items-center gap-1"><div className="w-3 h-0.5 bg-slate-300 border-dashed border-b-2"></div> 기본형 (y={a}x²)</div>
                                        <div className="flex items-center gap-1"><div className="w-3 h-0.5 bg-blue-500"></div> 이동형</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* 3. 오른쪽 표 */}
                        <div className="col-span-5 bg-slate-800/50 rounded-3xl border border-slate-700 overflow-hidden flex flex-col shadow-lg">
                            <table className="w-full text-center border-collapse h-full">
                                <thead className="bg-slate-800 text-slate-400">
                                    <tr className="border-b border-slate-700">
                                        <th className="py-6 px-4"><div className="text-xs mb-1 font-bold uppercase tracking-wider">원래 규칙</div><div className="text-xl font-mono text-slate-300 italic">y ＝ {RenderA(a)}x²</div></th>
                                        <th className="py-6 px-4 text-blue-400 bg-blue-900/10"><div className="text-xs mb-1 font-bold text-blue-500/50 uppercase tracking-wider">이동 후 결과</div><div className="text-xl font-bold italic">점의 좌표</div></th>
                                        <th className="py-6 px-4 text-white"><div className="text-xs mb-1 font-bold text-slate-500 uppercase tracking-wider">규칙 분석</div><div className="text-2xl font-black">？</div></th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-700/50">
                                    {points.map((pt, i) => (
                                        <tr key={i} className="hover:bg-slate-700/30 transition-colors">
                                            <td className="py-3 font-mono text-slate-400 text-2xl font-bold tracking-tight">
                                                ({pt.x}, <RenderFrac val={pt.y} />)
                                            </td>
                                            <td className="py-3 font-black text-blue-400 font-mono text-3xl bg-blue-900/5">
                                                ({pt.newX}, <RenderFrac val={pt.newY} />)
                                            </td>
                                            <td className="py-3 bg-slate-700/20 font-mono text-2xl font-bold tracking-tight">
                                                <span className="text-slate-500">(</span>{pt.x}<span className="text-red-400 mx-0.5">{p >= 0 ? `+${p}` : `－${Math.abs(p)}`}</span>
                                                <span className="text-slate-500">,</span> <RenderFrac val={pt.y} /><span className="text-green-400 mx-0.5">{q >= 0 ? `+${q}` : `－${Math.abs(q)}`}</span><span className="text-slate-500">)</span>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                            <div className="p-5 bg-slate-800 text-center text-blue-300 text-lg font-bold border-t border-slate-700">
                                점의 좌표는 이동량만큼 더해지지만, 식에서는 보정(－)이 필요합니다.
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
