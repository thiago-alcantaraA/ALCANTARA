<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다항식 곱셈 및 동류항 시각화</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .rect-box {
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 2.5rem; /* 사각형 내부 문자 크기 */
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.3);
        }
        .math-text {
            font-family: 'Times New Roman', serif;
            font-style: italic;
        }
        sup {
            font-size: 0.6em;
            vertical-align: super;
            line-height: 0;
        }
        input:focus {
            box-shadow: 0 0 0-4px rgba(59, 130, 246, 0.5);
        }
        /* 스크롤바 숨김 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-2 md:p-4">
    <div class="max-w-[1600px] w-full bg-white rounded-3xl shadow-2xl p-4 md:p-10 mt-2">
        <h1 class="text-2xl md:text-4xl font-extrabold text-center mb-8 text-gray-800 underline decoration-indigo-200">다항식 곱셈: 분배법칙과 동류항</h1>
        
        <!-- 입력 영역 -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10 bg-gray-50 p-4 md:p-6 rounded-2xl border-2 border-gray-200">
            <div class="relative">
                <label class="text-sm font-bold text-red-600 uppercase mb-1 block">가로 항 1</label>
                <input type="text" id="charA" value="a" maxlength="8" class="w-full border-b-4 border-red-300 p-2 text-center text-3xl md:text-4xl font-bold focus:border-red-500 outline-none math-text bg-transparent">
            </div>
            <div class="relative">
                <label class="text-sm font-bold text-orange-600 uppercase mb-1 block">가로 항 2</label>
                <input type="text" id="charB" value="b" maxlength="8" class="w-full border-b-4 border-orange-300 p-2 text-center text-3xl md:text-4xl font-bold focus:border-orange-500 outline-none math-text bg-transparent">
            </div>
            <div class="relative">
                <label class="text-sm font-bold text-green-600 uppercase mb-1 block">세로 항 1</label>
                <input type="text" id="charC" value="c" maxlength="8" class="w-full border-b-4 border-green-300 p-2 text-center text-3xl md:text-4xl font-bold focus:border-green-500 outline-none math-text bg-transparent">
            </div>
            <div class="relative">
                <label class="text-sm font-bold text-purple-600 uppercase mb-1 block">세로 항 2</label>
                <input type="text" id="charD" value="d" maxlength="8" class="w-full border-b-4 border-purple-300 p-2 text-center text-3xl md:text-4xl font-bold focus:border-purple-500 outline-none math-text bg-transparent">
            </div>
        </div>

        <!-- 메인 콘텐츠 영역 (중간 화면 이상에서 가로 배치) -->
        <div class="flex flex-col sm:flex-row items-center md:items-stretch justify-center gap-8">
            
            <!-- 왼쪽: 사각형 모델 -->
            <div class="w-full md:w-2/5 flex flex-col items-center justify-center border-b-2 md:border-b-0 md:border-r-2 border-gray-100 pb-8 md:pb-0 md:pr-8">
                <div class="relative inline-flex flex-col items-center scale-90 md:scale-100">
                    <!-- 가로 라벨 -->
                    <div class="flex w-80 mb-4 border-b-4 border-gray-400 pb-2">
                        <div id="labA" class="w-1/2 text-center font-bold text-red-600 math-text text-3xl md:text-4xl border-r-2 border-gray-200"></div>
                        <div id="labB" class="w-1/2 text-center font-bold text-orange-600 math-text text-3xl md:text-4xl"></div>
                    </div>

                    <div class="flex items-center">
                        <!-- 세로 라벨 -->
                        <div class="flex flex-col h-80 mr-4 border-r-4 border-gray-400 pr-2">
                            <div id="labC" class="h-1/2 flex items-center justify-end font-bold text-green-600 math-text text-3xl md:text-4xl border-b-2 border-gray-200 pr-2"></div>
                            <div id="labD" class="h-1/2 flex items-center justify-end font-bold text-purple-600 math-text text-3xl md:text-4xl pr-2"></div>
                        </div>

                        <!-- 사각형 박스 -->
                        <div class="relative w-80 h-80 border-4 border-gray-300 rounded-2xl overflow-hidden shadow-xl bg-gray-100 flex-shrink-0">
                            <div class="grid grid-cols-2 grid-rows-2 w-full h-full">
                                <div id="rectAC" class="rect-box bg-red-400"></div>
                                <div id="rectBC" class="rect-box bg-orange-400"></div>
                                <div id="rectAD" class="rect-box bg-green-400"></div>
                                <div id="rectBD" class="rect-box bg-purple-400"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <p class="mt-6 text-xl text-gray-400 font-bold">사각형 모델 (넓이)</p>
            </div>

            <!-- 오른쪽: 수식 영역 -->
            <div class="w-full md:w-3/5 bg-slate-50 p-6 md:p-8 rounded-[2.5rem] border-2 border-slate-200 font-serif shadow-inner flex flex-col justify-center overflow-x-auto no-scrollbar">
                <div class="flex flex-col space-y-10 min-w-max md:min-w-0">
                    <!-- 기본 식 -->
                    <div class="flex flex-wrap items-center gap-4 text-3xl md:text-4xl text-gray-800 font-bold">
                        <div class="math-text">(<span class="tA"></span> + <span class="tB"></span>)(<span class="tC"></span> + <span class="tD"></span>)</div>
                    </div>

                    <!-- 1단계 전개 -->
                    <div class="flex flex-wrap items-center gap-4 text-3xl md:text-4xl text-gray-700">
                        <div class="text-gray-300 text-3xl font-light">=</div>
                        <div class="math-text leading-tight">
                            <span id="step1" class="font-bold text-blue-600"></span>
                        </div>
                    </div>
                    
                    <!-- 2단계 전개 -->
                    <div class="flex flex-wrap items-center gap-4 text-3xl md:text-4xl border-t-2 border-slate-200 pt-8">
                        <div class="text-gray-300 text-3xl font-light">=</div>
                        <div id="expandedResult" class="math-text font-bold tracking-wider flex flex-wrap gap-x-6 gap-y-2">
                            <!-- JS에서 생성 -->
                        </div>
                    </div>

                    <!-- 최종 결과 -->
                    <div id="simplifiedSection" class="hidden flex items-center gap-6 mt-4 text-4xl md:text-6xl text-indigo-700 border-t-4 border-indigo-100 pt-6">
                        <div class="text-gray-300 text-2xl">∴</div>
                        <div id="finalResult" class="math-text font-black tracking-widest leading-none">
                            <!-- JS에서 생성 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const inputs = ['charA', 'charB', 'charC', 'charD'];

            // 항 분석 (계수와 문자 분리)
            function parseTerm(s) {
                s = s.trim();
                if (!s) return { coeff: 0, variable: '' };
                const match = s.match(/^([-+]?\d*\.?\d*)(.*)$/);
                let coeffStr = match[1];
                let variable = match[2];

                let coeff = 1;
                if (coeffStr === '-') coeff = -1;
                else if (coeffStr === '+') coeff = 1;
                else if (coeffStr !== '') coeff = parseFloat(coeffStr);

                return { coeff, variable };
            }

            // 항 곱하기
            function multiplyTerms(t1Str, t2Str) {
                const t1 = parseTerm(t1Str);
                const t2 = parseTerm(t2Str);
                const resCoeff = t1.coeff * t2.coeff;
                
                let varMap = {};
                let vars = (t1.variable + t2.variable).split('').sort();
                vars.forEach(v => {
                    if (v.trim()) varMap[v] = (varMap[v] || 0) + 1;
                });

                let resVar = '';
                for (let v in varMap) {
                    resVar += v + (varMap[v] > 1 ? `<sup>${varMap[v]}</sup>` : '');
                }

                const rawVarKey = Object.keys(varMap).sort().map(v => v + varMap[v]).join('');
                return { coeff: resCoeff, variable: resVar, rawVar: rawVarKey };
            }

            // 수식 포맷팅
            function formatTerm(coeff, variable, isFirst = false) {
                if (coeff === 0) return '';
                let s = '';
                if (coeff > 0 && !isFirst) s += ' + ';
                if (coeff < 0) s += isFirst ? '-' : ' - ';
                let absCoeff = Math.abs(coeff);
                if (absCoeff !== 1 || variable === '') s += absCoeff;
                s += variable;
                return s;
            }

            function update() {
                const a = document.getElementById('charA').value || '0';
                const b = document.getElementById('charB').value || '0';
                const c = document.getElementById('charC').value || '0';
                const d = document.getElementById('charD').value || '0';

                const terms = [
                    { id: 'AC', color: 'text-red-500', val: multiplyTerms(a, c) },
                    { id: 'BC', color: 'text-orange-500', val: multiplyTerms(b, c) },
                    { id: 'AD', color: 'text-green-500', val: multiplyTerms(a, d) },
                    { id: 'BD', color: 'text-purple-500', val: multiplyTerms(b, d) }
                ];

                // 사각형 내부
                terms.forEach(t => {
                    const html = formatTerm(t.val.coeff, t.val.variable, true);
                    document.getElementById('rect' + t.id).innerHTML = html || '0';
                });

                // 라벨 및 텍스트
                document.getElementById('labA').innerText = a;
                document.getElementById('labB').innerText = b;
                document.getElementById('labC').innerText = c;
                document.getElementById('labD').innerText = d;
                document.querySelectorAll('.tA').forEach(el => el.innerText = a);
                document.querySelectorAll('.tB').forEach(el => el.innerText = b);
                document.querySelectorAll('.tC').forEach(el => el.innerText = c);
                document.querySelectorAll('.tD').forEach(el => el.innerText = d);

                // 1단계 전개식
                document.getElementById('step1').innerHTML = `${a}(${c} + ${d}) + ${b}(${c} + ${d})`;

                // 2단계 전개식 (4개 항)
                const expandedEl = document.getElementById('expandedResult');
                expandedEl.innerHTML = '';
                terms.forEach((t, idx) => {
                    const span = document.createElement('span');
                    span.className = t.color;
                    span.innerHTML = formatTerm(t.val.coeff, t.val.variable, idx === 0);
                    expandedEl.appendChild(span);
                });

                // 동류항 합산
                const sumMap = {};
                const order = [];
                const varDisplayMap = {};

                terms.forEach(t => {
                    const key = t.val.rawVar;
                    if (!(key in sumMap)) {
                        order.push(key);
                        varDisplayMap[key] = t.val.variable;
                    }
                    sumMap[key] = (sumMap[key] || 0) + t.val.coeff;
                });

                let finalHtml = '';
                let first = true;
                let visibleTermsCount = 0;
                
                order.forEach(key => {
                    if (sumMap[key] !== 0) {
                        finalHtml += formatTerm(sumMap[key], varDisplayMap[key], first);
                        first = false;
                        visibleTermsCount++;
                    }
                });

                const simplifiedSection = document.getElementById('simplifiedSection');
                if (visibleTermsCount < 4 && finalHtml) {
                    simplifiedSection.classList.remove('hidden');
                    document.getElementById('finalResult').innerHTML = finalHtml;
                } else {
                    simplifiedSection.classList.add('hidden');
                }
            }

            inputs.forEach(id => {
                document.getElementById(id).addEventListener('input', update);
            });

            update();
        });
    </script>
</body>
</html>
