<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다항식 곱셈 및 동류항 시각화</title>
    <!-- Tailwind CSS CDN: 스타일을 담당합니다 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .rect-box {
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.25rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
            border: 2px solid rgba(255,255,255,0.3);
        }
        .math-text {
            font-family: 'Times New Roman', serif;
            font-style: italic;
        }
        sup {
            font-size: 0.7em;
            vertical-align: super;
            line-height: 0;
        }
        /* 입력창 포커스 시 테두리 색상 */
        input:focus {
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center p-4">
    <div class="max-w-4xl w-full bg-white rounded-3xl shadow-2xl p-6 md:p-8 mt-4 md:mt-10">
        <h1 class="text-xl md:text-2xl font-extrabold text-center mb-8 text-gray-800">다항식 곱셈: 동류항 계산 모드</h1>
        
        <!-- 문자 및 숫자 입력 영역 -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6 mb-10">
            <div class="relative">
                <label class="text-xs font-bold text-red-500 uppercase tracking-wider">가로 항 1</label>
                <input type="text" id="charA" value="a" maxlength="8" class="w-full border-b-2 border-red-300 p-2 text-center text-lg md:text-xl focus:border-red-500 outline-none math-text bg-transparent">
            </div>
            <div class="relative">
                <label class="text-xs font-bold text-orange-500 uppercase tracking-wider">가로 항 2</label>
                <input type="text" id="charB" value="b" maxlength="8" class="w-1/2 border-b-2 border-orange-300 p-2 text-center text-lg md:text-xl focus:border-orange-500 outline-none math-text bg-transparent">
            </div>
            <div class="relative">
                <label class="text-xs font-bold text-green-500 uppercase tracking-wider">세로 항 1</label>
                <input type="text" id="charC" value="c" maxlength="8" class="w-full border-b-2 border-green-300 p-2 text-center text-lg md:text-xl focus:border-green-500 outline-none math-text bg-transparent">
            </div>
            <div class="relative">
                <label class="text-xs font-bold text-purple-500 uppercase tracking-wider">세로 항 2</label>
                <input type="text" id="charD" value="d" maxlength="8" class="w-full border-b-2 border-purple-300 p-2 text-center text-lg md:text-xl focus:border-purple-500 outline-none math-text bg-transparent">
            </div>
        </div>

        <div class="flex flex-col items-center space-y-8">
            <!-- 사각형 모델 영역 -->
            <div class="relative flex flex-col items-center overflow-x-auto w-full py-4">
                <div class="inline-flex flex-col items-center">
                    <!-- 상단 가로 길이 -->
                    <div class="flex w-64 mb-2 border-b-2 border-gray-300 pb-1">
                        <div id="labA" class="w-1/2 text-center font-bold text-red-600 math-text text-lg border-r border-gray-200"></div>
                        <div id="labB" class="w-1/2 text-center font-bold text-orange-600 math-text text-lg"></div>
                    </div>

                    <div class="flex items-center">
                        <!-- 왼쪽 세로 길이 -->
                        <div class="flex flex-col h-64 mr-2 border-r-2 border-gray-300 pr-1">
                            <div id="labC" class="h-1/2 flex items-center justify-end font-bold text-green-600 math-text text-lg border-b border-gray-200 pr-1"></div>
                            <div id="labD" class="h-1/2 flex items-center justify-end font-bold text-purple-600 math-text text-lg pr-1"></div>
                        </div>

                        <!-- 4개 사각형 -->
                        <div class="relative w-64 h-64 border-2 border-gray-200 rounded-sm overflow-hidden shadow-sm bg-gray-100">
                            <div class="grid grid-cols-2 grid-rows-2 w-full h-full">
                                <div id="rectAC" class="rect-box bg-red-400"></div>
                                <div id="rectBC" class="rect-box bg-orange-400"></div>
                                <div id="rectAD" class="rect-box bg-green-400"></div>
                                <div id="rectBD" class="rect-box bg-purple-400"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 수식 전개 과정 영역 -->
            <div class="w-full bg-gray-50 p-6 rounded-2xl border border-gray-100 font-serif shadow-inner overflow-x-auto">
                <div class="flex flex-nowrap items-center justify-start md:justify-center gap-2 text-lg md:text-2xl text-gray-700 min-w-max">
                    <div class="math-text">(<span class="tA"></span> + <span class="tB"></span>)(<span class="tC"></span> + <span class="tD"></span>)</div>
                    <div class="text-gray-400">=</div>
                    <div class="math-text">
                        <span id="step1" class="font-bold text-blue-600"></span>
                    </div>
                </div>
                
                <div class="flex items-center justify-start md:justify-center gap-2 mt-6 text-xl md:text-3xl border-t border-gray-200 pt-6 min-w-max">
                    <div class="text-gray-400">=</div>
                    <div id="expandedResult" class="math-text font-bold tracking-wider flex flex-wrap gap-2">
                        <!-- 전개된 결과 -->
                    </div>
                </div>

                <!-- 최종 정리 결과 (동류항 합산 시) -->
                <div id="simplifiedSection" class="hidden flex items-center justify-start md:justify-center gap-2 mt-4 text-2xl md:text-4xl text-indigo-600 border-t-2 border-indigo-100 pt-4 min-w-max">
                    <div class="text-gray-400 text-xl md:text-2xl">∴</div>
                    <div id="finalResult" class="math-text font-black tracking-widest">
                        <!-- 최종 합산 식 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // DOM이 모두 로드된 후 실행되도록 설정 (홈페이지 삽입 시 안정성 강화)
        document.addEventListener('DOMContentLoaded', function() {
            const inputs = ['charA', 'charB', 'charC', 'charD'];

            // 입력값에서 계수와 문자 분리 (예: '2x' -> 2, 'x')
            function parseTerm(s) {
                s = s.trim();
                if (!s) return { coeff: 0, variable: '' };
                const match = s.match(/^([-+]?\d*\.?\d*)(.*)$/);
                let coeffStr = match[1];
                let variable = match[2];

                let coeff = 1;
                if (coeffStr === '-') coeff = -1;
                else if (coeffStr === '+') coeff = 1;
                else if (coeffStr !== '') coeff = parseFloat(coeffStr);

                return { coeff, variable };
            }

            // 두 항의 곱셈 처리 (숫자 계산 및 지수 표현)
            function multiplyTerms(t1Str, t2Str) {
                const t1 = parseTerm(t1Str);
                const t2 = parseTerm(t2Str);
                const resCoeff = t1.coeff * t2.coeff;
                
                let varMap = {};
                let vars = (t1.variable + t2.variable).split('').sort();
                vars.forEach(v => {
                    if (v.trim()) varMap[v] = (varMap[v] || 0) + 1;
                });

                let resVar = '';
                for (let v in varMap) {
                    resVar += v + (varMap[v] > 1 ? `<sup>${varMap[v]}</sup>` : '');
                }

                const rawVarKey = Object.keys(varMap).sort().map(v => v + varMap[v]).join('');
                return { coeff: resCoeff, variable: resVar, rawVar: rawVarKey };
            }

            // 항을 사람이 읽기 좋은 수식 형태로 변환
            function formatTerm(coeff, variable, isFirst = false) {
                if (coeff === 0) return '';
                let s = '';
                if (coeff > 0 && !isFirst) s += ' + ';
                if (coeff < 0) s += isFirst ? '-' : ' - ';
                let absCoeff = Math.abs(coeff);
                if (absCoeff !== 1 || variable === '') s += absCoeff;
                s += variable;
                return s;
            }

            function update() {
                const a = document.getElementById('charA').value || '0';
                const b = document.getElementById('charB').value || '0';
                const c = document.getElementById('charC').value || '0';
                const d = document.getElementById('charD').value || '0';

                const terms = [
                    { id: 'AC', color: 'text-red-500', val: multiplyTerms(a, c) },
                    { id: 'BC', color: 'text-orange-500', val: multiplyTerms(b, c) },
                    { id: 'AD', color: 'text-green-500', val: multiplyTerms(a, d) },
                    { id: 'BD', color: 'text-purple-500', val: multiplyTerms(b, d) }
                ];

                // 1. 사각형 내부 텍스트 업데이트
                terms.forEach(t => {
                    const html = formatTerm(t.val.coeff, t.val.variable, true);
                    document.getElementById('rect' + t.id).innerHTML = html || '0';
                });

                // 2. 외부 라벨 업데이트
                document.getElementById('labA').innerText = a;
                document.getElementById('labB').innerText = b;
                document.getElementById('labC').innerText = c;
                document.getElementById('labD').innerText = d;
                document.querySelectorAll('.tA').forEach(el => el.innerText = a);
                document.querySelectorAll('.tB').forEach(el => el.innerText = b);
                document.querySelectorAll('.tC').forEach(el => el.innerText = c);
                document.querySelectorAll('.tD').forEach(el => el.innerText = d);

                // 3. 분배법칙 단계별 수식
                document.getElementById('step1').innerHTML = `${a}(${c} + ${d}) + ${b}(${c} + ${d})`;

                // 4. 전개된 4개 항 표시
                const expandedEl = document.getElementById('expandedResult');
                expandedEl.innerHTML = '';
                terms.forEach((t, idx) => {
                    const span = document.createElement('span');
                    span.className = t.color;
                    span.innerHTML = formatTerm(t.val.coeff, t.val.variable, idx === 0);
                    expandedEl.appendChild(span);
                });

                // 5. 동류항 합산 로직 (순서 유지)
                const sumMap = {};
                const order = [];
                const varDisplayMap = {};

                terms.forEach(t => {
                    const key = t.val.rawVar;
                    if (!(key in sumMap)) {
                        order.push(key);
                        varDisplayMap[key] = t.val.variable;
                    }
                    sumMap[key] = (sumMap[key] || 0) + t.val.coeff;
                });

                let finalHtml = '';
                let first = true;
                let visibleTermsCount = 0;
                
                order.forEach(key => {
                    if (sumMap[key] !== 0) {
                        finalHtml += formatTerm(sumMap[key], varDisplayMap[key], first);
                        first = false;
                        visibleTermsCount++;
                    }
                });

                const simplifiedSection = document.getElementById('simplifiedSection');
                if (visibleTermsCount < 4 && finalHtml) {
                    simplifiedSection.classList.remove('hidden');
                    document.getElementById('finalResult').innerHTML = finalHtml;
                } else {
                    simplifiedSection.classList.add('hidden');
                }
            }

            // 이벤트 바인딩
            inputs.forEach(id => {
                document.getElementById(id).addEventListener('input', update);
            });

            // 초기 실행
            update();
        });
    </script>
</body>
</html>
