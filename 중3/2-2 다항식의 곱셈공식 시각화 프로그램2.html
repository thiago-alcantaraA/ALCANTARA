<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기하학적 대수학 정밀 시뮬레이션</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap');
        
        body { font-family: 'Noto Sans KR', sans-serif; overflow: hidden; background-color: #ffffff; }
        .math-font { font-family: 'Noto Serif KR', serif; font-style: italic; }
        
        /* 아이언맨 스타일 조립 애니메이션 */
        .ironman-transition {
            transition: transform 2.5s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        opacity 1.2s ease,
                        fill 2s ease;
            transform-origin: 0 0; 
        }
        
        .dimension-line {
            stroke: #334155;
            stroke-width: 2; 
        }

        /* 배경 점선 그리드 (이미지 느낌) */
        .canvas-bg {
            background-color: #ffffff;
            background-image: radial-gradient(#cbd5e1 2px, transparent 2px);
            background-size: 40px 40px;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(203, 213, 225, 1);
        }

        /* 면적 라벨 스타일 */
        .area-label {
            font-weight: 900;
            fill: #1e293b;
            font-size: 1.6rem;
        }
        .area-label-b2 { fill: #ffffff !important; } 
        .area-label-ab { fill: #dc2626 !important; }
        .area-label-res { fill: #4338ca !important; }

        /* 튕겨 나가는 b² 조각 */
        .ejected-b2 rect {
            stroke-width: 3;
            filter: drop-shadow(0 0 10px rgba(220, 38, 38, 0.4));
        }

        /* 점선 테두리 */
        .dashed-border {
            stroke-dasharray: 8, 5;
        }
    </style>
</head>
<body class="min-h-screen p-4 flex items-center justify-center">
    <div class="max-w-7xl w-full bg-white rounded-[3rem] shadow-2xl overflow-hidden border border-slate-200">
        <!-- 상단 헤더 -->
        <div class="bg-slate-900 p-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="text-center md:text-left">
                <h1 class="text-white text-2xl font-black tracking-tight">기하 대수학 시뮬레이터</h1>
                <p class="text-slate-400 text-sm mt-1">라벨 겹침을 방지하기 위해 텍스트 위치를 정밀하게 조정했습니다.</p>
            </div>
            <div class="flex bg-slate-800 p-2 rounded-2xl border border-slate-700">
                <button id="tab1" class="px-10 py-3 rounded-xl font-bold transition-all bg-indigo-600 text-white shadow-lg">
                    (a &minus; b)²
                </button>
                <button id="tab2" class="px-10 py-3 rounded-xl font-bold transition-all text-slate-400 hover:text-white border border-transparent">
                    a² &minus; b²
                </button>
            </div>
        </div>

        <!-- 메인 시각화 영역 -->
        <div class="relative canvas-bg min-h-[900px] flex items-center justify-center p-4">
            <svg id="mainSvg" width="1150" height="900" viewBox="0 0 1150 900" class="overflow-visible">
                <g id="dimGroup"></g>
                <g id="pieceGroup"></g>
            </svg>

            <!-- 상태 정보 -->
            <div id="statusLabel" class="absolute top-10 left-10 glass-panel px-6 py-3 rounded-full text-sm font-black text-slate-600 uppercase tracking-widest shadow-md">
                조립된 상태
            </div>

            <!-- 메인 버튼 -->
            <div class="absolute bottom-12 left-1/2 -translate-x-1/2">
                <button id="toggleBtn" class="group px-16 py-7 bg-indigo-600 hover:bg-indigo-700 text-white rounded-[2.5rem] font-black text-3xl shadow-[0_12px_0_rgb(67,56,202)] active:shadow-none active:translate-y-2 transition-all flex items-center gap-6">
                    <span id="btnText">전개 과정 보기</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 group-hover:translate-x-3 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M17 8l4 4m0 0l-4 4m4-4H3" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const pieceGroup = document.getElementById('pieceGroup');
        const dimGroup = document.getElementById('dimGroup');
        const toggleBtn = document.getElementById('toggleBtn');
        const btnText = document.getElementById('btnText');
        const statusLabel = document.getElementById('statusLabel');
        const tab1 = document.getElementById('tab1');
        const tab2 = document.getElementById('tab2');

        let isExpanded = false;
        let currentTab = 1;

        const A = 400; 
        const B = 120;  
        const DIFF = A - B; 
        const CENTER_X = 620; 
        const CENTER_Y = 480; 

        const pieces = {};

        function createSVGElement(tag, attrs = {}) {
            const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
            for (let key in attrs) el.setAttribute(key, attrs[key]);
            return el;
        }

        function initElements() {
            pieceGroup.innerHTML = '';
            pieces.p_frame = createBlock(A, A, 'none', '#94a3b8', '', '');
            pieces.p_frame.firstChild.setAttribute('stroke-dasharray', '8,4');
            pieces.p_res = createBlock(DIFF, DIFF, '#e0e7ff', '#6366f1', '(a-b)²', 'area-label-res');
            pieces.p_ab1 = createBlock(A, B, 'rgba(186, 230, 253, 0.6)', '#0ea5e9', 'ab', 'area-label-ab'); 
            pieces.p_ab2 = createBlock(B, A, 'rgba(186, 230, 253, 0.6)', '#0ea5e9', 'ab', 'area-label-ab'); 
            pieces.p_ejected_b2 = createBlock(B, B, 'rgba(186, 230, 253, 0.9)', '#0284c7', 'b²', 'area-label-b2');
            pieces.p_ejected_b2.classList.add('ejected-b2');
            pieces.h1 = createBlock(DIFF, DIFF, '#e0e7ff', '#6366f1', '', ''); 
            pieces.h2 = createBlock(B, DIFF, '#bae6fd', '#0ea5e9', '', '');    
            pieces.h3 = createBlock(DIFF, B, '#bae6fd', '#0ea5e9', '', '');    
            pieces.h_hole = createBlock(B, B, 'none', '#94a3b8', 'b²', '');
            pieces.h_hole.firstChild.setAttribute('stroke-dasharray', '8,4');
            Object.values(pieces).forEach(p => pieceGroup.appendChild(p));
        }

        function createBlock(w, h, fill, stroke, label, customClass) {
            const g = createSVGElement('g', { class: 'ironman-transition' });
            const rect = createSVGElement('rect', {
                width: w, height: h, fill: fill, stroke: stroke, 'stroke-width': 2.5, rx: 12
            });
            g.appendChild(rect);
            if (label) {
                const text = createSVGElement('text', {
                    x: w/2, y: h/2, 'text-anchor': 'middle', 'dominant-baseline': 'middle',
                    fill: stroke, class: `math-font area-label ${customClass}`
                });
                text.textContent = label;
                g.appendChild(text);
            }
            return g;
        }

        /**
         * 치수선 그리기
         * xOffset: 가로축에서 텍스트를 좌우로 밀 때 사용
         */
        function drawDim(x1, y1, x2, y2, label, side='상단', textGap = 55, xOffset = 0) {
            const g = createSVGElement('g', { class: 'ironman-transition' });
            const line = createSVGElement('line', { class: 'dimension-line' });
            const c1 = createSVGElement('line', { class: 'dimension-line' });
            const c2 = createSVGElement('line', { class: 'dimension-line' });
            const t = createSVGElement('text', { 
                'text-anchor': 'middle', 'dominant-baseline': 'middle', 
                class: 'math-font font-black fill-slate-800',
                style: 'font-size: 1.7rem;'
            });

            const capSize = 30; 
            line.setAttribute('x1', x1); line.setAttribute('y1', y1);
            line.setAttribute('x2', x2); line.setAttribute('y2', y2);
            
            if (y1 === y2) { // 가로 치수선
                c1.setAttribute('x1', x1); c1.setAttribute('y1', y1-capSize/2); c1.setAttribute('x2', x1); c1.setAttribute('y2', y1+capSize/2);
                c2.setAttribute('x1', x2); c2.setAttribute('y1', y1-capSize/2); c2.setAttribute('x2', x2); c2.setAttribute('y2', y1+capSize/2);
                t.setAttribute('x', ((x1+x2)/2) + xOffset); // xOffset 적용
                t.setAttribute('y', y1 + (side==='상단' ? -textGap : textGap));
            } else { // 세로 치수선
                c1.setAttribute('x1', x1-capSize/2); c1.setAttribute('y1', y1); c1.setAttribute('x2', x1+capSize/2); c1.setAttribute('y2', y1);
                c2.setAttribute('x1', x1-capSize/2); c2.setAttribute('y1', y2); c2.setAttribute('x2', x1+capSize/2); c2.setAttribute('y2', y2);
                t.setAttribute('x', x1 + (side==='좌측' ? -textGap : textGap)); 
                t.setAttribute('y', (y1+y2)/2);
            }
            t.textContent = label;
            g.append(line, c1, c2, t);
            dimGroup.appendChild(g);
        }

        function animate() {
            dimGroup.innerHTML = ''; 
            const bx = CENTER_X - A/2;
            const by = CENTER_Y - A/2;
            Object.values(pieces).forEach(p => p.style.opacity = "0");

            if (currentTab === 1) {
                const cx = CENTER_X - DIFF/2;
                const cy = CENTER_Y - DIFF/2;
                pieces.p_res.style.opacity = "1";
                pieces.p_ab1.style.opacity = isExpanded ? "1" : "0";
                pieces.p_ab2.style.opacity = isExpanded ? "1" : "0";
                pieces.p_frame.style.opacity = isExpanded ? "1" : "0";
                pieces.p_ejected_b2.style.opacity = isExpanded ? "1" : "0";

                const curX = isExpanded ? bx : cx;
                const curY = isExpanded ? by : cy;

                // 가로 치수선 (전체 길이 a의 텍스트를 왼쪽으로 -40px 이동)
                drawDim(curX, curY-90, curX+DIFF, curY-90, "a-b", "상단", 50);
                drawDim(curX+DIFF, curY-90, curX+A, curY-90, "b", "상단", 50);
                drawDim(curX, curY-180, curX+A, curY-180, "전체 길이 a", "상단", 55, -40); 

                // 세로 치수선 (텍스트를 선에서 더 멀리 -110px 밀어서 겹침 방지)
                drawDim(curX-90, curY, curX-90, curY+DIFF, "a-b", "좌측", 50);
                drawDim(curX-90, curY+DIFF, curX-90, curY+A, "b", "좌측", 50);
                drawDim(curX-200, curY, curX-200, curY+A, "전체 길이 a", "좌측", 110);

                if (!isExpanded) {
                    pieces.p_res.style.transform = `translate(${cx}px, ${cy}px)`;
                    pieces.p_ab1.style.transform = `translate(${cx}px, ${cy}px)`;
                    pieces.p_ab2.style.transform = `translate(${cx}px, ${cy}px)`;
                    pieces.p_ejected_b2.style.transform = `translate(${cx}px, ${cy}px)`;
                    pieces.p_ejected_b2.querySelector('rect').setAttribute('fill', 'rgba(186, 230, 253, 0.9)');
                } else {
                    pieces.p_frame.style.transform = `translate(${bx}px, ${by}px)`;
                    pieces.p_res.style.transform = `translate(${bx}px, ${by}px)`;
                    pieces.p_ab1.style.transform = `translate(${bx}px, ${by + DIFF}px)`; 
                    pieces.p_ab2.style.transform = `translate(${bx + DIFF}px, ${by}px)`; 
                    pieces.p_ejected_b2.style.transform = `translate(${bx + DIFF + B + 140}px, ${by + DIFF + B + 140}px)`;
                    pieces.p_ejected_b2.querySelector('rect').setAttribute('fill', '#dc2626'); 
                }
            } else {
                pieces.h1.style.opacity = "1";
                pieces.h2.style.opacity = "1";
                pieces.h3.style.opacity = "1";
                pieces.h_hole.style.opacity = isExpanded ? "1" : "0";
                const fx = CENTER_X - (A + B) / 2;
                const fy = CENTER_Y - DIFF / 2;

                if (isExpanded) {
                    pieces.h1.style.transform = `translate(${bx}px, ${by}px)`;
                    pieces.h2.style.transform = `translate(${bx + DIFF}px, ${by}px)`;
                    pieces.h3.style.transform = `translate(${bx}px, ${by + DIFF}px)`;
                    pieces.h_hole.style.transform = `translate(${bx + DIFF}px, ${by + DIFF}px)`;
                    drawDim(bx, by-90, bx+DIFF, by-90, "a-b", "상단", 50);
                    drawDim(bx+DIFF, by-90, bx+A, by-90, "b", "상단", 50);
                    drawDim(bx, by-180, bx+A, by-180, "전체 길이 a", "상단", 55, -40);
                    drawDim(bx-200, by, bx-200, by+A, "전체 길이 a", "좌측", 110);
                } else {
                    pieces.h1.style.transform = `translate(${fx}px, ${fy}px)`;
                    pieces.h2.style.transform = `translate(${fx + DIFF}px, ${fy}px)`;
                    pieces.h3.style.transform = `translate(${fx + A + B}px, ${fy}px) rotate(90deg)`;
                    drawDim(fx, fy-90, fx+A, fy-90, "길이 a", "상단", 50);
                    drawDim(fx+A, fy-90, fx+A+B, fy-90, "길이 b", "상단", 50);
                    drawDim(fx, fy-180, fx+A+B, fy-180, "전체 가로 (a+b)", "상단", 55, -40);
                    drawDim(fx-90, fy, fx-90, fy+DIFF, "a-b", "좌측", 50);
                    drawDim(fx-200, fy, fx-200, fy+A, "전체 길이 a", "좌측", 110);
                }
            }
            statusLabel.innerText = isExpanded ? "전개 상태" : "조립 상태";
            btnText.innerText = isExpanded ? "다시 조립하기" : "전개 과정 보기";
        }
        toggleBtn.addEventListener('click', () => { isExpanded = !isExpanded; animate(); });
        tab1.addEventListener('click', () => { currentTab = 1; isExpanded = false; tab1.className = "px-10 py-3 rounded-xl font-bold bg-indigo-600 text-white shadow-lg"; tab2.className = "px-10 py-3 rounded-xl font-bold text-slate-400 hover:text-white border border-transparent"; animate(); });
        tab2.addEventListener('click', () => { currentTab = 2; isExpanded = false; tab2.className = "px-10 py-3 rounded-xl font-bold bg-indigo-600 text-white shadow-lg"; tab1.className = "px-10 py-3 rounded-xl font-bold text-slate-400 hover:text-white border border-transparent"; animate(); });
        initElements(); animate();
    </script>
</body>
</html>
