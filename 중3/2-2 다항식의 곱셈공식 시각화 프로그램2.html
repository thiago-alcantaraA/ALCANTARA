<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기하학적 대수학 정밀 시뮬레이션</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap');
        
        body { font-family: 'Noto Sans KR', sans-serif; overflow: hidden; background-color: #ffffff; }
        .math-font { font-family: 'Noto Serif KR', serif; font-style: italic; }
        
        /* 부드러운 이동 및 색상 변화 애니메이션 */
        .ironman-transition {
            transition: transform 2.5s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        opacity 1.2s ease,
                        fill 2s ease;
            transform-origin: 0 0; 
        }
        
        .dimension-line {
            stroke: #334155;
            stroke-width: 2.5; 
        }

        /* 배경 점선 그리드 */
        .canvas-bg {
            background-color: #ffffff;
            background-image: radial-gradient(#cbd5e1 2px, transparent 2px);
            background-size: 40px 40px;
        }

        .control-panel {
            background: #f1f5f9;
            border-left: 2px solid #e2e8f0;
        }

        /* 면적 라벨 스타일 */
        .area-label {
            font-weight: 900;
            fill: #1e293b;
            font-size: 1.6rem;
        }
        .area-label-b2 { fill: #ffffff !important; } 
        .area-label-ab { fill: #dc2626 !important; }
        .area-label-res { fill: #4338ca !important; }

        /* 튕겨 나가는 b² 조각 강조 */
        .ejected-b2 rect {
            stroke-width: 3;
            filter: drop-shadow(0 0 15px rgba(220, 38, 38, 0.5));
        }
    </style>
</head>
<body class="h-screen flex flex-col">
    <!-- 상단 헤더 -->
    <div class="bg-slate-900 p-4 flex justify-between items-center shadow-lg z-10">
        <div>
            <h1 class="text-white text-2xl font-black tracking-tight">기하 대수학 시뮬레이터</h1>
            <p class="text-slate-400 text-sm mt-0.5">전자칠판용 가로 확장 레이아웃</p>
        </div>
        <div class="flex bg-slate-800 p-1.5 rounded-2xl border border-slate-700">
            <button id="tab1" class="px-10 py-2.5 rounded-xl font-bold transition-all bg-indigo-600 text-white shadow-lg">
                (a &minus; b)²
            </button>
            <button id="tab2" class="px-10 py-2.5 rounded-xl font-bold transition-all text-slate-400 hover:text-white border border-transparent ml-2">
                a² &minus; b²
            </button>
        </div>
    </div>

    <!-- 메인 컨텐츠 영역 -->
    <div class="flex-1 flex overflow-hidden">
        <!-- 왼쪽: 시각화 영역 (그리드 배경) -->
        <div class="flex-1 relative canvas-bg overflow-hidden flex items-center justify-center">
            <svg id="mainSvg" width="1100" height="900" viewBox="0 0 1100 900" class="overflow-visible">
                <g id="dimGroup"></g>
                <g id="pieceGroup"></g>
            </svg>
            
            <!-- 상태 정보 -->
            <div id="statusLabel" class="absolute top-8 left-8 bg-white/95 px-6 py-3 rounded-full text-sm font-black text-slate-600 uppercase tracking-widest shadow-md border border-slate-200">
                조립된 상태
            </div>
        </div>

        <!-- 오른쪽: 제어 패널 (세로형 버튼) -->
        <div class="w-96 control-panel p-10 flex flex-col justify-center items-center gap-10 shadow-2xl">
            <div class="text-center">
                <p class="text-slate-500 font-black text-lg mb-3">공식 전개 제어</p>
                <div class="h-1.5 w-16 bg-indigo-500 mx-auto rounded-full"></div>
            </div>

            <button id="toggleBtn" class="group w-full py-14 bg-indigo-600 hover:bg-indigo-700 text-white rounded-[3rem] font-black text-3xl shadow-[0_12px_0_rgb(67,56,202)] active:shadow-none active:translate-y-2 transition-all flex flex-col items-center justify-center gap-6">
                <span id="btnText">전개 과정 보기</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 group-hover:scale-110 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
            </button>

            <div class="mt-auto text-center p-6 bg-white/60 rounded-3xl border border-slate-200 shadow-sm">
                <p class="text-slate-500 text-sm font-bold leading-relaxed">
                    도형의 이동과 겹침을 통해<br>대수학 공식을 기하학적으로<br>증명하는 시뮬레이터입니다.
                </p>
            </div>
        </div>
    </div>

    <script>
        const pieceGroup = document.getElementById('pieceGroup');
        const dimGroup = document.getElementById('dimGroup');
        const toggleBtn = document.getElementById('toggleBtn');
        const btnText = document.getElementById('btnText');
        const statusLabel = document.getElementById('statusLabel');
        const tab1 = document.getElementById('tab1');
        const tab2 = document.getElementById('tab2');

        let isExpanded = false;
        let currentTab = 1;

        // 크기 설정
        const A = 380; 
        const B = 110;  
        const DIFF = A - B; 
        const CENTER_X = 600; 
        const CENTER_Y = 500; 

        const pieces = {};

        function createSVGElement(tag, attrs = {}) {
            const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
            for (let key in attrs) el.setAttribute(key, attrs[key]);
            return el;
        }

        function initElements() {
            pieceGroup.innerHTML = '';
            
            // (a-b)^2 보라색 (이미지 느낌)
            pieces.p_frame = createBlock(A, A, 'none', '#94a3b8', '', '');
            pieces.p_frame.firstChild.setAttribute('stroke-dasharray', '8,4');
            pieces.p_res = createBlock(DIFF, DIFF, '#e0e7ff', '#6366f1', '(a-b)²', 'area-label-res');
            
            // ab 직사각형 (이미지 느낌의 하늘색)
            pieces.p_ab1 = createBlock(A, B, 'rgba(186, 230, 253, 0.7)', '#0ea5e9', 'ab', 'area-label-ab'); 
            pieces.p_ab2 = createBlock(B, A, 'rgba(186, 230, 253, 0.7)', '#0ea5e9', 'ab', 'area-label-ab'); 
            
            // 튕겨 나가는 b² 조각
            pieces.p_ejected_b2 = createBlock(B, B, 'rgba(186, 230, 253, 0.95)', '#0284c7', 'b²', 'area-label-b2');
            pieces.p_ejected_b2.classList.add('ejected-b2');
            
            // 공식 2 (합차)
            pieces.h1 = createBlock(DIFF, DIFF, '#e0e7ff', '#6366f1', '', ''); 
            pieces.h2 = createBlock(B, DIFF, '#bae6fd', '#0ea5e9', '', '');    
            pieces.h3 = createBlock(DIFF, B, '#bae6fd', '#0ea5e9', '', '');    
            pieces.h_hole = createBlock(B, B, 'none', '#94a3b8', 'b²', '');
            pieces.h_hole.firstChild.setAttribute('stroke-dasharray', '8,4');

            Object.values(pieces).forEach(p => pieceGroup.appendChild(p));
        }

        function createBlock(w, h, fill, stroke, label, customClass) {
            const g = createSVGElement('g', { class: 'ironman-transition' });
            const rect = createSVGElement('rect', {
                width: w, height: h, fill: fill, stroke: stroke, 'stroke-width': 2.5, rx: 12
            });
            g.appendChild(rect);
            if (label) {
                const text = createSVGElement('text', {
                    x: w/2, y: h/2, 'text-anchor': 'middle', 'dominant-baseline': 'middle',
                    fill: stroke, class: `math-font area-label ${customClass}`
                });
                text.textContent = label;
                g.appendChild(text);
            }
            return g;
        }

        /**
         * 치수선 그리기
         * xOffset: 텍스트를 선 방향으로 추가 이동 (글자 잘림 방지용)
         */
        function drawDim(x1, y1, x2, y2, label, side='상단', textGap = 55, xOffset = 0) {
            const g = createSVGElement('g', { class: 'ironman-transition' });
            const line = createSVGElement('line', { class: 'dimension-line' });
            const c1 = createSVGElement('line', { class: 'dimension-line' });
            const c2 = createSVGElement('line', { class: 'dimension-line' });
            const t = createSVGElement('text', { 
                'text-anchor': 'middle', 'dominant-baseline': 'middle', 
                class: 'math-font font-black fill-slate-800',
                style: 'font-size: 1.7rem;'
            });

            const capSize = 35; 
            line.setAttribute('x1', x1); line.setAttribute('y1', y1);
            line.setAttribute('x2', x2); line.setAttribute('y2', y2);
            
            if (y1 === y2) { // 가로
                c1.setAttribute('x1', x1); c1.setAttribute('y1', y1-capSize/2); c1.setAttribute('x2', x1); c1.setAttribute('y2', y1+capSize/2);
                c2.setAttribute('x1', x2); c2.setAttribute('y1', y1-capSize/2); c2.setAttribute('x2', x2); c2.setAttribute('y2', y1+capSize/2);
                t.setAttribute('x', ((x1+x2)/2) + xOffset); 
                t.setAttribute('y', y1 + (side==='상단' ? -textGap : textGap));
            } else { // 세로
                c1.setAttribute('x1', x1-capSize/2); c1.setAttribute('y1', y1); c1.setAttribute('x2', x1+capSize/2); c1.setAttribute('y2', y1);
                c2.setAttribute('x1', x1-capSize/2); c2.setAttribute('y1', y2); c2.setAttribute('x2', x1+capSize/2); c2.setAttribute('y2', y2);
                t.setAttribute('x', x1 + (side==='좌측' ? -textGap : textGap)); 
                t.setAttribute('y', (y1+y2)/2);
            }
            t.textContent = label;
            g.append(line, c1, c2, t);
            dimGroup.appendChild(g);
        }

        function animate() {
            dimGroup.innerHTML = ''; 
            const bx = CENTER_X - A/2;
            const by = CENTER_Y - A/2;
            Object.values(pieces).forEach(p => p.style.opacity = "0");

            if (currentTab === 1) {
                const cx = CENTER_X - DIFF/2;
                const cy = CENTER_Y - DIFF/2;
                pieces.p_res.style.opacity = "1";
                pieces.p_ab1.style.opacity = isExpanded ? "1" : "0";
                pieces.p_ab2.style.opacity = isExpanded ? "1" : "0";
                pieces.p_frame.style.opacity = isExpanded ? "1" : "0";
                pieces.p_ejected_b2.style.opacity = isExpanded ? "1" : "0";

                const curX = isExpanded ? bx : cx;
                const curY = isExpanded ? by : cy;

                // --- 가로 치수선 (이미지 스타일 복구) ---
                drawDim(curX, curY-100, curX+DIFF, curY-100, "a-b", "상단", 55);
                drawDim(curX+DIFF, curY-100, curX+A, curY-100, "b", "상단", 55);
                // "전체 길이 a" 텍스트 겹침 방지를 위해 xOffset -45px 적용
                drawDim(curX, curY-210, curX+A, curY-210, "전체 길이 a", "상단", 60, -45); 

                // --- 세로 치수선 (이미지 스타일 복구) ---
                drawDim(curX-100, curY, curX-100, curY+DIFF, "a-b", "좌측", 65);
                drawDim(curX-100, curY+DIFF, curX-100, curY+A, "b", "좌측", 65);
                // 세로 "전체 길이 a"는 선에서 130px 띄워 선명하게 표시
                drawDim(curX-240, curY, curX-240, curY+A, "전체 길이 a", "좌측", 130);

                if (!isExpanded) {
                    pieces.p_res.style.transform = `translate(${cx}px, ${cy}px)`;
                    pieces.p_ab1.style.transform = `translate(${cx}px, ${cy}px)`;
                    pieces.p_ab2.style.transform = `translate(${cx}px, ${cy}px)`;
                    pieces.p_ejected_b2.style.transform = `translate(${cx}px, ${cy}px)`;
                    pieces.p_ejected_b2.querySelector('rect').setAttribute('fill', 'rgba(186, 230, 253, 0.95)');
                } else {
                    pieces.p_frame.style.transform = `translate(${bx}px, ${by}px)`;
                    pieces.p_res.style.transform = `translate(${bx}px, ${by}px)`;
                    pieces.p_ab1.style.transform = `translate(${bx}px, ${by + DIFF}px)`; 
                    pieces.p_ab2.style.transform = `translate(${bx + DIFF}px, ${by}px)`; 
                    
                    // 튕겨 나가는 애니메이션 및 색상 일치
                    pieces.p_ejected_b2.style.transform = `translate(${bx + DIFF + B + 140}px, ${by + DIFF + B + 140}px)`;
                    pieces.p_ejected_b2.querySelector('rect').setAttribute('fill', '#dc2626'); 
                }
            } else {
                pieces.h1.style.opacity = "1";
                pieces.h2.style.opacity = "1";
                pieces.h3.style.opacity = "1";
                pieces.h_hole.style.opacity = isExpanded ? "1" : "0";
                const fx = CENTER_X - (A + B) / 2;
                const fy = CENTER_Y - DIFF / 2;

                if (isExpanded) {
                    pieces.h1.style.transform = `translate(${bx}px, ${by}px)`;
                    pieces.h2.style.transform = `translate(${bx + DIFF}px, ${by}px)`;
                    pieces.h3.style.transform = `translate(${bx}px, ${by + DIFF}px)`;
                    pieces.h_hole.style.transform = `translate(${bx + DIFF}px, ${by + DIFF}px)`;
                    drawDim(bx, by-100, bx+DIFF, by-100, "a-b", "상단", 55);
                    drawDim(bx+DIFF, by-100, bx+A, by-100, "b", "상단", 55);
                    drawDim(bx, by-210, bx+A, by-210, "전체 길이 a", "상단", 60, -45);
                    drawDim(bx-240, by, bx-240, by+A, "전체 길이 a", "좌측", 130);
                } else {
                    pieces.h1.style.transform = `translate(${fx}px, ${fy}px)`;
                    pieces.h2.style.transform = `translate(${fx + DIFF}px, ${fy}px)`;
                    pieces.h3.style.transform = `translate(${fx + A + B}px, ${fy}px) rotate(90deg)`;
                    drawDim(fx, fy-100, fx+A, fy-100, "길이 a", "상단", 55);
                    drawDim(fx+A, fy-100, fx+A+B, fy-100, "길이 b", "상단", 55);
                    drawDim(fx, fy-210, fx+A+B, fy-210, "전체 가로 (a+b)", "상단", 60, -45);
                    drawDim(fx-100, fy, fx-100, fy+DIFF, "a-b", "좌측", 65);
                    drawDim(fx-240, fy, fx-240, fy+A, "전체 길이 a", "좌측", 130);
                }
            }
            statusLabel.innerText = isExpanded ? "전개 상태" : "조립 상태";
            btnText.innerText = isExpanded ? "다시 조립하기" : "전개 과정 보기";
        }
        toggleBtn.addEventListener('click', () => { isExpanded = !isExpanded; animate(); });
        tab1.addEventListener('click', () => { currentTab = 1; isExpanded = false; tab1.className = "px-10 py-2.5 rounded-xl font-bold bg-indigo-600 text-white shadow-lg"; tab2.className = "px-10 py-2.5 rounded-xl font-bold text-slate-400 hover:text-white border border-transparent ml-2"; animate(); });
        tab2.addEventListener('click', () => { currentTab = 2; isExpanded = false; tab2.className = "px-10 py-2.5 rounded-xl font-bold bg-indigo-600 text-white shadow-lg"; tab1.className = "px-10 py-2.5 rounded-xl font-bold text-slate-400 hover:text-white border border-transparent ml-2"; animate(); });
        initElements(); animate();
    </script>
</body>
</html>
