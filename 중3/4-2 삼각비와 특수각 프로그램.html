<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>삼각형으로 보는 삼각비 특수각</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 폰트 및 부드러운 스크롤 설정 */
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; }
    
    /* SVG 부드러운 변환 애니메이션 */
    .svg-anim {
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    /* 숨김 처리된 스크롤바 */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  </style>
</head>
<body class="w-screen h-screen overflow-hidden bg-slate-100 flex flex-col items-center justify-center p-3 md:p-6 text-slate-800">

  <!-- 메인 앱 컨테이너 -->
  <div class="w-full max-w-[1400px] h-full bg-white rounded-[2rem] shadow-xl flex flex-col overflow-hidden border border-slate-200 relative">
    
    <!-- 상단 헤더 -->
    <header class="bg-slate-800 text-white p-5 md:px-8 flex flex-col md:flex-row justify-between items-center shrink-0 z-20 shadow-md gap-4 md:gap-0">
      <div class="text-center md:text-left">
        <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight mb-1">삼각비 특수각의 원리</h1>
        <p class="text-slate-300 text-sm md:text-base font-medium">정삼각형과 정사각형에서 유도되는 삼각비의 원리를 시각적으로 확인하세요.</p>
      </div>
      
      <!-- 원리(보조 도형) 보기 토글 -->
      <div class="flex items-center gap-3 bg-slate-700/50 px-4 py-2 rounded-2xl border border-slate-600/50">
        <span class="text-sm font-semibold text-slate-200">기본 도형 확장 보기</span>
        <button id="toggleBtn" class="w-14 h-8 rounded-full bg-slate-500 relative transition-colors duration-300 focus:outline-none shadow-inner" onclick="toggleAux()">
          <div id="toggleThumb" class="w-6 h-6 rounded-full bg-white absolute top-1 left-1 transition-transform duration-300 shadow-md"></div>
        </button>
      </div>
    </header>

    <!-- 중앙 컨텐츠 영역 -->
    <div class="flex flex-col md:flex-row flex-1 min-h-0 bg-slate-50 relative">
      
      <!-- 왼쪽: 도형 시각화 영역 -->
      <div class="w-full md:w-[60%] h-[55%] md:h-full relative flex flex-col items-center justify-center border-b md:border-b-0 md:border-r border-slate-200 bg-white overflow-hidden">
        
        <!-- 각도 선택 탭 -->
        <div class="absolute top-5 left-1/2 transform -translate-x-1/2 flex bg-slate-100 p-1.5 rounded-2xl shadow-sm z-10 border border-slate-200">
          <button onclick="changeAngle(30)" id="btn-30" class="px-5 md:px-8 py-2 md:py-2.5 rounded-xl text-lg md:text-xl font-bold transition-all duration-300 text-slate-500 hover:text-indigo-600">30°</button>
          <button onclick="changeAngle(45)" id="btn-45" class="px-5 md:px-8 py-2 md:py-2.5 rounded-xl text-lg md:text-xl font-bold transition-all duration-300 text-slate-500 hover:text-indigo-600">45°</button>
          <button onclick="changeAngle(60)" id="btn-60" class="px-5 md:px-8 py-2 md:py-2.5 rounded-xl text-lg md:text-xl font-bold transition-all duration-300 text-slate-500 hover:text-indigo-600">60°</button>
        </div>

        <!-- SVG 캔버스 (viewBox 고정으로 안정감 부여) -->
        <svg viewBox="-220 -220 440 440" class="w-full h-full max-h-[800px] drop-shadow-sm overflow-visible absolute inset-0 m-auto">
          
          <!-- 보조 도형 (정삼각형/정사각형 확장 파트) -->
          <path id="auxPath" class="svg-anim" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="8,8" opacity="0" />
          
          <!-- 직각 기호 -->
          <path id="rightAngle" class="svg-anim" fill="none" stroke="#64748b" stroke-width="2" />
          
          <!-- 메인 직각삼각형 -->
          <path id="mainTriangle" class="svg-anim" fill="#ffffff" stroke="#1e293b" stroke-width="3" stroke-linejoin="round" />
          
          <!-- 기준 각도 표시 (호선) -->
          <path id="angleArc" class="svg-anim" fill="none" stroke="#1e293b" stroke-width="2.5" />
          <text id="angleText" class="svg-anim text-xl font-extrabold" fill="#1e293b" text-anchor="middle" dominant-baseline="middle"></text>

          <!-- 변 길이 텍스트 라벨을 위한 그룹 (CSS Transform 애니메이션 적용) -->
          <g id="group-hyp" class="svg-anim" style="transform: translate(0px, 0px)">
            <foreignObject x="-40" y="-20" width="80" height="40" class="overflow-visible">
              <div class="w-full h-full flex items-center justify-center">
                <span id="label-hyp" class="px-2.5 py-1 bg-white/90 backdrop-blur-sm rounded-lg shadow-sm border border-purple-100 text-purple-600 font-extrabold text-lg flex items-center justify-center whitespace-nowrap"></span>
              </div>
            </foreignObject>
          </g>
          <g id="group-base" class="svg-anim" style="transform: translate(0px, 0px)">
            <foreignObject x="-40" y="-20" width="80" height="40" class="overflow-visible">
              <div class="w-full h-full flex items-center justify-center">
                <span id="label-base" class="px-2.5 py-1 bg-white/90 backdrop-blur-sm rounded-lg shadow-sm border border-blue-100 text-blue-600 font-extrabold text-lg flex items-center justify-center whitespace-nowrap"></span>
              </div>
            </foreignObject>
          </g>
          <g id="group-height" class="svg-anim" style="transform: translate(0px, 0px)">
            <foreignObject x="-40" y="-20" width="80" height="40" class="overflow-visible">
              <div class="w-full h-full flex items-center justify-center">
                <span id="label-height" class="px-2.5 py-1 bg-white/90 backdrop-blur-sm rounded-lg shadow-sm border border-red-100 text-red-600 font-extrabold text-lg flex items-center justify-center whitespace-nowrap"></span>
              </div>
            </foreignObject>
          </g>
        </svg>

        <!-- 하단 보조 설명 배너 -->
        <div id="aux-banner" class="absolute bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-2xl text-sm md:text-base font-medium shadow-xl opacity-0 translate-y-4 transition-all duration-500 pointer-events-none whitespace-nowrap flex items-center gap-2 z-10">
          <svg class="w-5 h-5 text-yellow-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path></svg>
          <span id="aux-banner-text"></span>
        </div>

      </div>

      <!-- 오른쪽: 수식 및 설명 영역 -->
      <div class="w-full md:w-[40%] h-[45%] md:h-full p-4 md:p-8 flex flex-col justify-between overflow-y-auto custom-scrollbar">
        
        <!-- 삼각비 수식 리스트 -->
        <div id="formula-container" class="flex flex-col gap-4 w-full max-w-sm mx-auto flex-1 justify-center">
          <!-- JS를 통해 동적 렌더링 됨 -->
        </div>
        
        <!-- 추가 학습 개념 팁 -->
        <div class="mt-4 bg-indigo-50/70 border-t-4 border-indigo-200 rounded-b-2xl rounded-t-lg p-5 text-slate-700 shadow-sm shrink-0">
          <h3 class="font-bold text-indigo-800 mb-2.5 flex items-center gap-2 text-base md:text-lg">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            극단적인 각도는 어떻게 될까?
          </h3>
          <p class="leading-relaxed text-sm md:text-base">
            <span class="font-bold text-slate-900">0°</span>에 가까워지면 <span class="text-red-500 font-bold bg-red-100 px-1.5 py-0.5 rounded">높이</span>가 사라져 <span class="font-extrabold text-slate-800">sin(0°) = 0</span> 이 됩니다.<br>
            <span class="font-bold text-slate-900 mt-1 inline-block">90°</span>에 가까워지면 <span class="text-blue-500 font-bold bg-blue-100 px-1.5 py-0.5 rounded">밑변</span>이 사라져 <span class="font-extrabold text-slate-800">cos(90°) = 0</span> 이 됩니다.
          </p>
        </div>

      </div>
      
    </div>
  </div>

  <script>
    // 상태 변수
    let currentAngle = 30;
    let isAuxVisible = false;

    // 데이터 정의 (색상 및 값 매핑)
    const colorMap = {
      hyp: 'text-purple-600',
      base: 'text-blue-600',
      height: 'text-red-600'
    };

    const mathData = {
      30: { hyp: '2', base: '√3', height: '1', sin: ['1', '2'], cos: ['√3', '2'], tan: ['1', '√3'] },
      45: { hyp: '√2', base: '1', height: '1', sin: ['√2', '2'], cos: ['√2', '2'], tan: ['1', '1'] },
      60: { hyp: '2', base: '1', height: '√3', sin: ['√3', '2'], cos: ['1', '2'], tan: ['√3', '1'] }
    };

    // 초기화
    window.onload = () => {
      renderAll();
    };

    // 각도 변경 핸들러
    window.changeAngle = (angle) => {
      currentAngle = angle;
      renderAll();
    };

    // 토글 핸들러
    window.toggleAux = () => {
      isAuxVisible = !isAuxVisible;
      
      const thumb = document.getElementById('toggleThumb');
      const btn = document.getElementById('toggleBtn');
      const auxPath = document.getElementById('auxPath');
      const banner = document.getElementById('aux-banner');

      if (isAuxVisible) {
        thumb.style.transform = 'translateX(1.5rem)';
        btn.classList.replace('bg-slate-500', 'bg-indigo-500');
        auxPath.setAttribute('opacity', '1');
        banner.classList.remove('opacity-0', 'translate-y-4');
        banner.classList.add('opacity-100', 'translate-y-0');
      } else {
        thumb.style.transform = 'translateX(0)';
        btn.classList.replace('bg-indigo-500', 'bg-slate-500');
        auxPath.setAttribute('opacity', '0');
        banner.classList.add('opacity-0', 'translate-y-4');
        banner.classList.remove('opacity-100', 'translate-y-0');
      }
    };

    // 근호가 포함된 문자열을 예쁘게 렌더링하는 함수
    function renderMathValue(val) {
      if (val.includes('√')) {
        const num = val.replace('√', '');
        return `
          <span class="inline-flex items-center">
            <span class="text-[1.1em] leading-none mr-[1px] font-medium relative top-[-0.05em]">√</span>
            <span class="border-t-[1.5px] border-current pt-[2px] leading-none">${num}</span>
          </span>
        `;
      }
      return val;
    }

    // 전체 화면 렌더링
    function renderAll() {
      updateTabs();
      updateGeometry();
      updateFormulas();
      updateBannerText();
    }

    // 탭 버튼 스타일 업데이트
    function updateTabs() {
      [30, 45, 60].forEach(angle => {
        const btn = document.getElementById(`btn-${angle}`);
        if (angle === currentAngle) {
          btn.className = "px-5 md:px-8 py-2 md:py-2.5 rounded-xl text-lg md:text-xl font-extrabold transition-all duration-300 bg-indigo-600 text-white shadow-md transform scale-105";
        } else {
          btn.className = "px-5 md:px-8 py-2 md:py-2.5 rounded-xl text-lg md:text-xl font-bold transition-all duration-300 text-slate-500 hover:text-indigo-600 hover:bg-white bg-transparent";
        }
      });
    }

    // 배너 텍스트 업데이트
    function updateBannerText() {
      const bannerText = document.getElementById('aux-banner-text');
      if (currentAngle === 45) {
        bannerText.innerHTML = "직각이등변삼각형 2개를 붙이면 <b>정사각형</b>이 됩니다.";
      } else {
        bannerText.innerHTML = "특수각 직각삼각형 2개를 붙이면 <b>정삼각형</b>이 됩니다.";
      }
    }

    // 도형 그리기 (좌표 계산 및 SVG 업데이트)
    function updateGeometry() {
      const unit = currentAngle === 45 ? 150 : 130;
      let A, B, C, D; // A:왼하단(기준각), B:우하단(직각), C:우상단, D:보조도형 팁
      let w, h;

      if (currentAngle === 30) {
        w = unit * Math.sqrt(3); // 밑변
        h = unit;                // 높이
        A = { x: 0, y: h };
        B = { x: w, y: h };
        C = { x: w, y: 0 };
        // 보조: 직각삼각형을 아래로 대칭
        D = { x: w, y: h * 2 };
      } else if (currentAngle === 60) {
        w = unit;                // 밑변
        h = unit * Math.sqrt(3); // 높이
        A = { x: 0, y: h };
        B = { x: w, y: h };
        C = { x: w, y: 0 };
        // 보조: 직각삼각형을 오른쪽으로 대칭
        D = { x: w * 2, y: h };
      } else if (currentAngle === 45) {
        w = unit * 1.1;
        h = unit * 1.1;
        A = { x: 0, y: h };
        B = { x: w, y: h };
        C = { x: w, y: 0 };
        // 보조: 정사각형 (좌상단 포인트)
        D = { x: 0, y: 0 };
      }

      // 화면 중앙 정렬을 위한 Bounding Box 중심 계산
      let minX = 0, maxX = 0, minY = 0, maxY = 0;
      if (currentAngle === 30) {
        maxX = w; maxY = h * 2;
      } else if (currentAngle === 60) {
        maxX = w * 2; maxY = h;
      } else {
        maxX = w; maxY = h;
      }
      const cx = (minX + maxX) / 2;
      const cy = (minY + maxY) / 2;

      // 오프셋 적용 함수
      const shift = (pt) => ({ x: pt.x - cx, y: pt.y - cy + 10 }); // 시각적 안정을 위해 약간 아래로(+10)

      const sA = shift(A);
      const sB = shift(B);
      const sC = shift(C);
      const sD = shift(D);

      // SVG 경로 생성 (명령어 개수를 맞춰 transition 최적화)
      const mainPathStr = `M ${sA.x} ${sA.y} L ${sC.x} ${sC.y} L ${sB.x} ${sB.y} Z`;
      document.getElementById('mainTriangle').setAttribute('d', mainPathStr);

      let auxPathStr = "";
      if (currentAngle === 30) {
        // sA, sB, sD 연결
        auxPathStr = `M ${sA.x} ${sA.y} L ${sB.x} ${sB.y} L ${sD.x} ${sD.y} Z`;
      } else if (currentAngle === 60) {
        // sC, sB, sD 연결
        auxPathStr = `M ${sC.x} ${sC.y} L ${sB.x} ${sB.y} L ${sD.x} ${sD.y} Z`;
      } else if (currentAngle === 45) {
        // sA, sD, sC 연결
        auxPathStr = `M ${sA.x} ${sA.y} L ${sD.x} ${sD.y} L ${sC.x} ${sC.y} Z`;
      }
      document.getElementById('auxPath').setAttribute('d', auxPathStr);

      // 직각 기호 (sB에서 왼쪽/위로 15px)
      const rightAngleStr = `M ${sB.x - 18} ${sB.y} L ${sB.x - 18} ${sB.y - 18} L ${sB.x} ${sB.y - 18}`;
      document.getElementById('rightAngle').setAttribute('d', rightAngleStr);

      // 각도 호 (sA 기준)
      const r = 40;
      const rad = currentAngle * Math.PI / 180;
      // 시작: 밑변 위, 끝: 빗변 위
      const arcStartX = sA.x + r;
      const arcStartY = sA.y;
      const arcEndX = sA.x + r * Math.cos(rad);
      const arcEndY = sA.y - r * Math.sin(rad); // y는 위가 -, 아래가 +
      const arcStr = `M ${arcStartX} ${arcStartY} A ${r} ${r} 0 0 0 ${arcEndX} ${arcEndY}`;
      document.getElementById('angleArc').setAttribute('d', arcStr);

      // 각도 텍스트
      const angleTextEl = document.getElementById('angleText');
      angleTextEl.setAttribute('x', sA.x + r + 22);
      angleTextEl.setAttribute('y', sA.y - 15);
      angleTextEl.textContent = `${currentAngle}°`;

      // 변 길이 라벨 위치 및 텍스트
      const data = mathData[currentAngle];
      
      // 빗변 (sA 와 sC의 중점에서 직각 방향으로 띄움)
      const hypX = (sA.x + sC.x) / 2 - 35;
      const hypY = (sA.y + sC.y) / 2 - 35;
      document.getElementById('group-hyp').style.transform = `translate(${hypX}px, ${hypY}px)`;
      document.getElementById('label-hyp').innerHTML = renderMathValue(data.hyp);

      // 밑변 (sA 와 sB의 중점에서 아래로 띄움)
      const baseX = (sA.x + sB.x) / 2;
      const baseY = sA.y + 35;
      document.getElementById('group-base').style.transform = `translate(${baseX}px, ${baseY}px)`;
      document.getElementById('label-base').innerHTML = renderMathValue(data.base);

      // 높이 (sB 와 sC의 중점에서 오른쪽으로 띄움)
      const heightX = sB.x + 35;
      const heightY = (sB.y + sC.y) / 2;
      document.getElementById('group-height').style.transform = `translate(${heightX}px, ${heightY}px)`;
      document.getElementById('label-height').innerHTML = renderMathValue(data.height);
    }

    // 수식 영역 생성
    function updateFormulas() {
      const v = mathData[currentAngle];
      const container = document.getElementById('formula-container');

      // 분수 HTML 생성 헬퍼
      const buildFrac = (top, bottom, isResult) => {
        const borderClass = isResult ? 'border-slate-800 border-b-[2px]' : 'border-slate-300 border-b';
        const textClass = isResult ? 'text-slate-800 text-xl font-extrabold' : 'text-slate-600 text-base font-bold';
        return `
          <div class="flex flex-col items-center justify-center min-w-[2.5rem]">
            <div class="${borderClass} pb-1 px-1 w-full text-center ${textClass}">${top}</div>
            <div class="pt-1 px-1 w-full text-center ${textClass}">${bottom}</div>
          </div>
        `;
      };

      const formulasHtml = `
        <!-- SIN -->
        <div class="bg-white rounded-[1.25rem] p-4 shadow-sm border border-slate-100 flex items-center justify-between hover:shadow-md transition-all group">
          <div class="flex flex-col items-center justify-center w-14 h-14 bg-red-50 rounded-2xl text-red-500 font-black text-xl shrink-0 group-hover:scale-105 transition-transform">
            sin
          </div>
          <div class="flex-1 flex items-center justify-center gap-2 md:gap-4">
            ${buildFrac(`<span class="${colorMap.height}">${renderMathValue(v.height)}</span>`, `<span class="${colorMap.hyp}">${renderMathValue(v.hyp)}</span>`, false)}
            <div class="text-slate-300 font-bold text-xl">=</div>
            ${buildFrac(renderMathValue(v.sin[0]), renderMathValue(v.sin[1]), true)}
          </div>
        </div>

        <!-- COS -->
        <div class="bg-white rounded-[1.25rem] p-4 shadow-sm border border-slate-100 flex items-center justify-between hover:shadow-md transition-all group">
          <div class="flex flex-col items-center justify-center w-14 h-14 bg-blue-50 rounded-2xl text-blue-500 font-black text-xl shrink-0 group-hover:scale-105 transition-transform">
            cos
          </div>
          <div class="flex-1 flex items-center justify-center gap-2 md:gap-4">
            ${buildFrac(`<span class="${colorMap.base}">${renderMathValue(v.base)}</span>`, `<span class="${colorMap.hyp}">${renderMathValue(v.hyp)}</span>`, false)}
            <div class="text-slate-300 font-bold text-xl">=</div>
            ${buildFrac(renderMathValue(v.cos[0]), renderMathValue(v.cos[1]), true)}
          </div>
        </div>

        <!-- TAN -->
        <div class="bg-white rounded-[1.25rem] p-4 shadow-sm border border-slate-100 flex items-center justify-between hover:shadow-md transition-all group">
          <div class="flex flex-col items-center justify-center w-14 h-14 bg-emerald-50 rounded-2xl text-emerald-600 font-black text-xl shrink-0 group-hover:scale-105 transition-transform">
            tan
          </div>
          <div class="flex-1 flex items-center justify-center gap-2 md:gap-4">
            ${buildFrac(`<span class="${colorMap.height}">${renderMathValue(v.height)}</span>`, `<span class="${colorMap.base}">${renderMathValue(v.base)}</span>`, false)}
            <div class="text-slate-300 font-bold text-xl">=</div>
            ${buildFrac(renderMathValue(v.tan[0]), renderMathValue(v.tan[1]), true)}
          </div>
        </div>
      `;

      container.innerHTML = formulasHtml;
    }
  </script>
</body>
</html>
