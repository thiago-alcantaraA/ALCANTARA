<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수직선 위 무리수 작도</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        canvas {
            touch-action: none;
            background-color: #ffffff;
        }

        /* 근호(Root) 시각화 스타일 */
        .root-container {
            display: inline-flex;
            align-items: center;
            position: relative;
            vertical-align: middle;
        }

        .root-svg {
            height: 1.4em;
            margin-right: -1.5px;
            flex-shrink: 0;
        }

        .root-content {
            border-top: 2.5px solid currentColor;
            padding-top: 1px;
            padding-left: 4px;
            padding-right: 6px;
            display: inline-block;
            line-height: 1;
        }
        
        #mathDisplay {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            min-height: 5rem;
            overflow: visible;
        }

        .math-value {
            color: #4f46e5;
            font-weight: 800;
        }
        
        .math-container {
            white-space: nowrap;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(1);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-4xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-100">
        
        <!-- 그림 영역 (Canvas) -->
        <div class="relative w-full h-[400px] bg-white">
            <canvas id="gameCanvas" class="w-full h-full"></canvas>
        </div>

        <!-- 수식 계산 영역 -->
        <div class="bg-white px-6 py-6 border-t border-b border-gray-100">
            <div id="mathDisplay" class="text-2xl md:text-3xl font-bold text-gray-800 math-container">
                <!-- 기준점과 빗변 수식 -->
            </div>
        </div>

        <!-- 조작 컨트롤 영역 -->
        <div class="p-8 bg-gray-50/50">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-tighter mb-2 ml-1">기준점 (O)</label>
                    <input type="number" id="originInput" value="0" class="w-full px-5 py-3 bg-white border-2 border-gray-100 rounded-2xl focus:border-indigo-500 outline-none text-lg shadow-sm transition-all">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-tighter mb-2 ml-1">밑변 a</label>
                    <input type="number" id="baseInput" value="2" min="0.1" step="0.1" class="w-full px-5 py-3 bg-white border-2 border-gray-100 rounded-2xl focus:border-indigo-500 outline-none text-lg shadow-sm transition-all">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-tighter mb-2 ml-1">높이 b</label>
                    <input type="number" id="heightInput" value="1" min="0.1" step="0.1" class="w-full px-5 py-3 bg-white border-2 border-gray-100 rounded-2xl focus:border-indigo-500 outline-none text-lg shadow-sm transition-all">
                </div>
            </div>

            <div class="flex flex-wrap gap-4">
                <button id="step1Btn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-black py-5 px-6 rounded-2xl transition-all transform active:scale-[0.98] text-xl shadow-xl shadow-indigo-100">
                    삼각형 그리기
                </button>
                <button id="step2Btn" disabled class="flex-1 bg-rose-500 hover:bg-rose-600 text-white font-black py-5 px-6 rounded-2xl transition-all transform active:scale-[0.98] text-xl shadow-xl shadow-rose-100">
                    호 그리기 (양방향)
                </button>
                <button id="resetBtn" class="bg-white hover:bg-gray-100 text-gray-500 font-bold py-5 px-8 rounded-2xl border-2 border-gray-100 transition-all text-xl">
                    초기화
                </button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const originInput = document.getElementById('originInput');
        const baseInput = document.getElementById('baseInput');
        const heightInput = document.getElementById('heightInput');
        const step1Btn = document.getElementById('step1Btn');
        const step2Btn = document.getElementById('step2Btn');
        const resetBtn = document.getElementById('resetBtn');
        const mathDisplay = document.getElementById('mathDisplay');

        let animationId;
        let progress = 0;
        let state = 'IDLE'; 

        const PADDING_BOTTOM = 140; 
        const UNIT_PIXELS = 55;

        function getRootHtml(content) {
            return `
                <div class="root-container">
                    <svg class="root-svg" viewBox="0 0 12 15" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M1 9.5L4 13.5L11 1.5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span class="root-content">${content}</span>
                </div>
            `;
        }

        function initCanvas() {
            const rect = canvas.parentNode.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            draw();
            updateMathText();
        }

        function drawStaticAxis() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const centerY = canvas.height - PADDING_BOTTOM;
            const centerX = canvas.width / 2; 

            ctx.beginPath();
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 3;
            ctx.moveTo(0, centerY);
            ctx.lineTo(canvas.width, centerY);
            ctx.stroke();

            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.font = '800 16px sans-serif';
            ctx.fillStyle = '#94a3b8';

            for (let i = -7; i <= 7; i++) {
                const x = centerX + i * UNIT_PIXELS;
                ctx.beginPath();
                ctx.moveTo(x, centerY - 8);
                ctx.lineTo(x, centerY + 8);
                ctx.stroke();
                ctx.fillText(i, x, centerY + 12);
            }
        }

        function updateMathText() {
            const a = parseFloat(baseInput.value) || 0;
            const b = parseFloat(heightInput.value) || 0;
            const origin = parseFloat(originInput.value) || 0;
            
            mathDisplay.innerHTML = `
                <span class="text-gray-500">기준점(O) = ${origin}</span>
                <span class="mx-4 text-gray-200">|</span>
                <span>빗변의 길이</span>
                <span class="mx-2">=</span>
                ${getRootHtml(`<span class="math-value">${a}² + ${b}²</span>`)}
            `;
        }

        function handleInputChange() {
            resetAnimation();
            updateMathText();
        }

        [originInput, baseInput, heightInput].forEach(input => {
            input.addEventListener('input', handleInputChange);
        });

        function draw() {
            const origin = parseFloat(originInput.value) || 0;
            const a = parseFloat(baseInput.value) || 0;
            const b = parseFloat(heightInput.value) || 0;
            const sumSq = a * a + b * b;
            const c = Math.sqrt(sumSq);
            const innerVal = Number.isInteger(sumSq) ? sumSq : sumSq.toFixed(1);
            
            const centerY = canvas.height - PADDING_BOTTOM;
            const centerX = canvas.width / 2;
            const startX = centerX + origin * UNIT_PIXELS;

            drawStaticAxis();

            if (state !== 'IDLE') {
                const triProgress = (state === 'DRAWING_TRIANGLE') ? progress : 1;
                
                ctx.beginPath();
                ctx.strokeStyle = '#6366f1';
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.moveTo(startX, centerY);
                const currentA = a * UNIT_PIXELS * Math.min(triProgress * 2, 1);
                ctx.lineTo(startX + currentA, centerY);
                ctx.stroke();

                if (triProgress > 0.5) {
                    const hProgress = (triProgress - 0.5) * 2;
                    ctx.beginPath();
                    ctx.moveTo(startX + a * UNIT_PIXELS, centerY);
                    ctx.lineTo(startX + a * UNIT_PIXELS, centerY - b * UNIT_PIXELS * hProgress);
                    ctx.stroke();
                }

                if (triProgress === 1) {
                    ctx.beginPath();
                    ctx.strokeStyle = '#6366f1';
                    ctx.lineWidth = 4;
                    ctx.lineJoin = 'round';
                    ctx.moveTo(startX, centerY);
                    ctx.lineTo(startX + a * UNIT_PIXELS, centerY);
                    ctx.lineTo(startX + a * UNIT_PIXELS, centerY - b * UNIT_PIXELS);
                    ctx.closePath();
                    ctx.stroke();
                    ctx.fillStyle = 'rgba(99, 102, 241, 0.05)';
                    ctx.fill();

                    ctx.beginPath();
                    ctx.strokeStyle = '#f43f5e';
                    ctx.lineWidth = 6;
                    ctx.lineCap = 'round';
                    ctx.moveTo(startX, centerY);
                    ctx.lineTo(startX + a * UNIT_PIXELS, centerY - b * UNIT_PIXELS);
                    ctx.stroke();
                }
            }

            if (state === 'DRAWING_ARC' || state === 'FINISHED') {
                const arcProgress = (state === 'DRAWING_ARC') ? progress : 1;
                const startAngle = -Math.atan2(b, a);
                const radius = c * UNIT_PIXELS;

                const targetAngleRight = 0;
                const currentAngleRight = startAngle + (targetAngleRight - startAngle) * arcProgress;
                ctx.setLineDash([8, 8]);
                ctx.beginPath();
                ctx.strokeStyle = '#f43f5e';
                ctx.lineWidth = 3;
                ctx.arc(startX, centerY, radius, startAngle, currentAngleRight, false);
                ctx.stroke();

                const targetAngleLeft = -Math.PI;
                const currentAngleLeft = startAngle + (targetAngleLeft - startAngle) * arcProgress;
                ctx.beginPath();
                ctx.strokeStyle = '#10b981'; 
                ctx.arc(startX, centerY, radius, startAngle, currentAngleLeft, true);
                ctx.stroke();
                ctx.setLineDash([]);

                if (state === 'FINISHED') {
                    const textY = centerY + 70; // Y축 위치 소폭 조정

                    // 오른쪽 점 P
                    const targetXRight = startX + radius;
                    ctx.beginPath();
                    ctx.fillStyle = '#f43f5e';
                    ctx.arc(targetXRight, centerY, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    
                    // P는 중앙 정렬 유지, 좌표는 오른쪽 옆에
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'top';
                    ctx.fillStyle = '#f43f5e';
                    ctx.font = 'bold 30px sans-serif';
                    ctx.fillText('P', targetXRight, textY);
                    
                    ctx.textAlign = 'left';
                    ctx.font = 'bold 22px sans-serif';
                    ctx.fillText(` (${origin} + √${innerVal})`, targetXRight + 15, textY + 5);

                    // 왼쪽 점 Q
                    const targetXLeft = startX - radius;
                    ctx.beginPath();
                    ctx.fillStyle = '#10b981';
                    ctx.arc(targetXLeft, centerY, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    ctx.textAlign = 'center';
                    ctx.fillStyle = '#10b981';
                    ctx.font = 'bold 30px sans-serif';
                    ctx.fillText('Q', targetXLeft, textY);
                    
                    ctx.textAlign = 'left';
                    ctx.font = 'bold 22px sans-serif';
                    ctx.fillText(` (${origin} - √${innerVal})`, targetXLeft + 15, textY + 5);
                }
            }

            if (state === 'DRAWING_TRIANGLE') {
                progress += 0.003; 
                if (progress >= 1) {
                    progress = 1;
                    state = 'TRIANGLE_DONE';
                    step1Btn.disabled = true;
                    step2Btn.disabled = false;
                }
                animationId = requestAnimationFrame(draw);
            } else if (state === 'DRAWING_ARC') {
                progress += 0.003; 
                if (progress >= 1) {
                    progress = 1;
                    state = 'FINISHED';
                    step2Btn.disabled = true;
                }
                animationId = requestAnimationFrame(draw);
            } else {
                animationId = requestAnimationFrame(draw);
            }
        }

        function resetAnimation() {
            cancelAnimationFrame(animationId);
            state = 'IDLE';
            progress = 0;
            step1Btn.disabled = false;
            step2Btn.disabled = true;
            draw();
        }

        step1Btn.addEventListener('click', () => {
            if (state === 'IDLE') {
                state = 'DRAWING_TRIANGLE';
                progress = 0;
            }
        });

        step2Btn.addEventListener('click', () => {
            if (state === 'TRIANGLE_DONE') {
                state = 'DRAWING_ARC';
                progress = 0;
            }
        });

        resetBtn.addEventListener('click', resetAnimation);

        window.addEventListener('resize', initCanvas);
        window.onload = function() {
            initCanvas();
        };
    </script>
</body>
</html>
