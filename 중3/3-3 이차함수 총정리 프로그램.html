<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이차함수 그래프 생성기 (3가지 방법)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap');
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8fafc;
        }
        
        .math-text {
            font-family: 'Noto Serif KR', serif;
        }
        
        /* 숫자 입력 화살표 숨기기 */
        input[type="number"] {
            -moz-appearance: textfield;
        }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* 수식 입력칸 자연스럽게 만들기 */
        .eq-input {
            width: 3.5rem;
            text-align: center;
            background-color: transparent;
            border: none;
            border-bottom: 2px solid #cbd5e1;
            border-radius: 0;
            padding: 2px 4px;
            font-weight: 700;
            transition: all 0.2s;
        }
        .eq-input:focus {
            outline: none;
            border-bottom-color: #0f172a;
            background-color: #f1f5f9;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 lg:p-8">

    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-[1400px] overflow-hidden flex flex-col xl:flex-row">
        
        <!-- 왼쪽: 그래프 영역 -->
        <div class="p-6 lg:p-10 bg-slate-50 border-b xl:border-b-0 xl:border-r border-slate-200 flex flex-col items-center justify-center w-full xl:w-[55%]">
            <h2 class="text-3xl lg:text-4xl font-bold text-slate-800 mb-6 math-text tracking-wider" id="display-equation">y = x²</h2>
            
            <div class="relative border-2 border-slate-300 bg-white rounded-lg shadow-inner overflow-hidden w-full max-w-[880px] aspect-square">
                <canvas id="graph-canvas" width="880" height="880" class="w-full h-full touch-none"></canvas>
            </div>
            <p class="mt-4 text-slate-500 font-medium">💡 빨간색 꼭짓점을 드래그해서 움직여보세요!</p>
        </div>

        <!-- 오른쪽: 입력 영역 -->
        <div class="p-6 lg:p-10 w-full xl:w-[45%] flex flex-col bg-white overflow-y-auto max-h-[100vh] xl:max-h-[960px]">
            <div class="mb-6">
                <h1 class="text-3xl font-extrabold text-slate-800 mb-2">이차함수 탐구</h1>
                <p class="text-slate-500">세 가지 방법 중 하나를 선택해 값을 수정해보세요. 모두 실시간으로 연동됩니다.</p>
            </div>

            <div class="space-y-6 flex-grow">
                
                <!-- 방법 1: 꼭짓점 기준 (속성값) -->
                <div class="bg-blue-50/50 p-5 rounded-2xl border border-blue-100 shadow-sm relative transition-all hover:shadow-md">
                    <div class="absolute -top-3 left-4 bg-blue-500 text-white px-3 py-1 text-sm font-bold rounded-full shadow-sm">
                        방법 1. 속성값 입력
                    </div>
                    
                    <div class="mt-3 space-y-4">
                        <div class="flex items-center justify-between">
                            <label class="text-slate-700 font-semibold">폭과 방향 (a)</label>
                            <div class="flex items-center space-x-2">
                                <span class="math-text text-xl italic text-slate-600">a = </span>
                                <input type="number" id="m1-a" value="1" step="0.5" 
                                       class="w-20 px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-center font-bold text-slate-800 bg-white">
                            </div>
                        </div>
                        <div class="flex items-center justify-between">
                            <label class="text-slate-700 font-semibold">축의 방정식</label>
                            <div class="flex items-center space-x-2">
                                <span class="math-text text-xl italic text-slate-600">x = </span>
                                <input type="number" id="m1-axis" value="0" step="1" 
                                       class="w-20 px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-center font-bold text-blue-600 bg-white">
                            </div>
                        </div>
                        <div class="flex items-center justify-between">
                            <label class="text-slate-700 font-semibold">꼭짓점 좌표</label>
                            <div class="flex items-center space-x-2 text-xl">
                                <span class="math-text text-slate-600">(</span>
                                <input type="number" id="m1-p" value="0" step="1" 
                                       class="w-20 px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-center font-bold text-blue-600 bg-white">
                                <span class="math-text text-slate-600">,</span>
                                <input type="number" id="m1-q" value="0" step="1" 
                                       class="w-20 px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-center font-bold text-rose-500 bg-white">
                                <span class="math-text text-slate-600">)</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-center -my-2">
                    <span class="bg-slate-100 text-slate-400 px-3 py-1 rounded-full text-xs font-bold z-10">OR</span>
                </div>

                <!-- 방법 2: 일반형 식 -->
                <div class="bg-emerald-50/50 p-5 rounded-2xl border border-emerald-100 shadow-sm relative transition-all hover:shadow-md">
                    <div class="absolute -top-3 left-4 bg-emerald-500 text-white px-3 py-1 text-sm font-bold rounded-full shadow-sm">
                        방법 2. 일반형 직접 쓰기
                    </div>
                    
                    <div class="mt-4 flex flex-col items-center justify-center space-y-3">
                        <p class="text-sm text-slate-500 font-medium w-full text-left">y = ax² + bx + c 꼴 (전개형)</p>
                        
                        <div class="flex items-center math-text text-2xl lg:text-3xl font-medium text-slate-700 bg-white px-4 py-4 rounded-xl border border-emerald-200 shadow-sm w-full justify-center flex-wrap gap-y-3">
                            <span class="mr-2">y = </span>
                            <input type="number" id="m2-a" value="1" step="0.5" class="eq-input text-emerald-600">
                            <span class="mx-1">x² + </span>
                            <input type="number" id="m2-b" value="0" step="1" class="eq-input text-emerald-600">
                            <span class="mx-1">x + </span>
                            <input type="number" id="m2-c" value="0" step="1" class="eq-input text-emerald-600">
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-center -my-2">
                    <span class="bg-slate-100 text-slate-400 px-3 py-1 rounded-full text-xs font-bold z-10">OR</span>
                </div>

                <!-- 방법 3: 표준형 식 -->
                <div class="bg-purple-50/50 p-5 rounded-2xl border border-purple-100 shadow-sm relative transition-all hover:shadow-md">
                    <div class="absolute -top-3 left-4 bg-purple-500 text-white px-3 py-1 text-sm font-bold rounded-full shadow-sm">
                        방법 3. 표준형 직접 쓰기
                    </div>
                    
                    <div class="mt-4 flex flex-col items-center justify-center space-y-3">
                        <p class="text-sm text-slate-500 font-medium w-full text-left">y = a(x - p)² + q 꼴 (완전제곱꼴)</p>
                        
                        <div class="flex items-center math-text text-2xl lg:text-3xl font-medium text-slate-700 bg-white px-4 py-4 rounded-xl border border-purple-200 shadow-sm w-full justify-center flex-wrap gap-y-3">
                            <span class="mr-2">y = </span>
                            <input type="number" id="m3-a" value="1" step="0.5" class="eq-input text-purple-600">
                            <span class="mx-1">( x - </span>
                            <input type="number" id="m3-p" value="0" step="1" class="eq-input text-purple-600">
                            <span class="mx-1">)² + </span>
                            <input type="number" id="m3-q" value="0" step="1" class="eq-input text-purple-600">
                        </div>
                    </div>
                </div>

            </div>

            <!-- 초기화 버튼 -->
            <button id="reset-btn" class="mt-6 w-full py-4 bg-slate-800 hover:bg-slate-700 text-white text-lg font-bold rounded-xl shadow-lg transition-colors flex items-center justify-center space-x-2">
                <span><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd" /></svg></span>
                <span>y = x² 기본값으로 되돌리기</span>
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('graph-canvas');
        const ctx = canvas.getContext('2d');
        
        // --- 요소 선택 ---
        const m1A = document.getElementById('m1-a'), m1Axis = document.getElementById('m1-axis'), m1P = document.getElementById('m1-p'), m1Q = document.getElementById('m1-q');
        const m2A = document.getElementById('m2-a'), m2B = document.getElementById('m2-b'), m2C = document.getElementById('m2-c');
        const m3A = document.getElementById('m3-a'), m3P = document.getElementById('m3-p'), m3Q = document.getElementById('m3-q');
        
        const displayEquation = document.getElementById('display-equation');
        const resetBtn = document.getElementById('reset-btn');

        // 상태 변수: 마지막으로 편집한 폼 형태 ('standard' 혹은 'general')
        let lastEditedFormat = 'standard'; 
        
        // 드래그 상태 변수
        let isDragging = false;
        let isHoveringVertex = false;

        // 소수점 연산 오류 방지
        function cleanNum(num) {
            return Math.round(num * 10000) / 10000;
        }

        // --- 이벤트 리스너 ---
        
        // 방법 1 수정 시
        m1Axis.addEventListener('input', (e) => { m1P.value = e.target.value; syncFromM1(); });
        m1P.addEventListener('input', (e) => { m1Axis.value = e.target.value; syncFromM1(); });
        [m1A, m1Q].forEach(el => el.addEventListener('input', syncFromM1));

        // 방법 2 수정 시
        [m2A, m2B, m2C].forEach(el => el.addEventListener('input', syncFromM2));

        // 방법 3 수정 시
        [m3A, m3P, m3Q].forEach(el => el.addEventListener('input', syncFromM3));

        // 초기화 버튼
        resetBtn.addEventListener('click', () => {
            m1A.value = 1; m1Axis.value = 0; m1P.value = 0; m1Q.value = 0;
            syncFromM1();
        });

        // --- 캔버스 드래그 로직 ---

        // 마우스 좌표 계산 함수
        function getMousePos(canvas, evt) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            let clientX = evt.clientX;
            let clientY = evt.clientY;
            
            // 터치 이벤트 대응
            if (evt.touches && evt.touches.length > 0) {
                clientX = evt.touches[0].clientX;
                clientY = evt.touches[0].clientY;
            }
            
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        // 마우스가 꼭짓점 근처에 있는지 확인
        function checkVertexHit(mouseX, mouseY) {
            let p = parseFloat(m1P.value) || 0;
            let q = parseFloat(m1Q.value) || 0;
            const unit = 40;
            const originX = canvas.width / 2;
            const originY = canvas.height / 2;
            
            const vx = originX + p * unit;
            const vy = originY - q * unit;
            
            const dx = mouseX - vx;
            const dy = mouseY - vy;
            // 25px 반경 이내면 선택된 것으로 간주 (터치를 위해 조금 넉넉하게)
            return dx * dx + dy * dy <= 25 * 25; 
        }

        function handlePointerDown(e) {
            const pos = getMousePos(canvas, e);
            if (checkVertexHit(pos.x, pos.y)) {
                isDragging = true;
                update(); // 크기 변화를 위해 즉시 업데이트
            }
        }

        function handlePointerMove(e) {
            const pos = getMousePos(canvas, e);
            
            const hit = checkVertexHit(pos.x, pos.y);
            if (hit !== isHoveringVertex && !isDragging) {
                isHoveringVertex = hit;
                update(); // 커서 스타일 및 꼭짓점 크기 업데이트
            }

            if (!isDragging) return;

            const unit = 40;
            const originX = canvas.width / 2;
            const originY = canvas.height / 2;
            
            // 픽셀을 좌표로 변환
            let newP = (pos.x - originX) / unit;
            let newQ = (originY - pos.y) / unit;
            
            // 1 단위로 스냅 (정수로만 이동)
            newP = Math.round(newP);
            newQ = Math.round(newQ);
            
            // 입력칸 업데이트 및 동기화
            m1P.value = newP;
            m1Axis.value = newP;
            m1Q.value = newQ;
            
            syncFromM1();
        }

        function handlePointerUp() {
            if (isDragging) {
                isDragging = false;
                update();
            }
        }

        // 이벤트 리스너 등록
        canvas.addEventListener('mousedown', handlePointerDown);
        canvas.addEventListener('mousemove', handlePointerMove);
        canvas.addEventListener('mouseup', handlePointerUp);
        canvas.addEventListener('mouseleave', handlePointerUp);

        // 모바일 터치 이벤트
        canvas.addEventListener('touchstart', (e) => { 
            e.preventDefault(); 
            handlePointerDown(e); 
        }, {passive: false});
        canvas.addEventListener('touchmove', (e) => { 
            e.preventDefault(); 
            handlePointerMove(e); 
        }, {passive: false});
        canvas.addEventListener('touchend', handlePointerUp);

        // --- 동기화 로직 ---

        function syncFromM1() {
            lastEditedFormat = 'standard';
            let a = parseFloat(m1A.value) || 0;
            let p = parseFloat(m1P.value) || 0;
            let q = parseFloat(m1Q.value) || 0;

            m2A.value = cleanNum(a);
            m2B.value = cleanNum(-2 * a * p);
            m2C.value = cleanNum((a * p * p) + q);

            m3A.value = cleanNum(a);
            m3P.value = cleanNum(p);
            m3Q.value = cleanNum(q);

            update();
        }

        function syncFromM2() {
            lastEditedFormat = 'general';
            let a = parseFloat(m2A.value) || 0;
            let b = parseFloat(m2B.value) || 0;
            let c = parseFloat(m2C.value) || 0;

            let p = 0, q = c;
            if (a !== 0) {
                p = -b / (2 * a);
                q = c - (b * b) / (4 * a);
            }

            m1A.value = cleanNum(a);
            m1P.value = cleanNum(p);
            m1Axis.value = cleanNum(p);
            m1Q.value = cleanNum(q);

            m3A.value = cleanNum(a);
            m3P.value = cleanNum(p);
            m3Q.value = cleanNum(q);

            update();
        }

        function syncFromM3() {
            lastEditedFormat = 'standard';
            let a = parseFloat(m3A.value) || 0;
            let p = parseFloat(m3P.value) || 0;
            let q = parseFloat(m3Q.value) || 0;

            m1A.value = cleanNum(a);
            m1P.value = cleanNum(p);
            m1Axis.value = cleanNum(p);
            m1Q.value = cleanNum(q);

            m2A.value = cleanNum(a);
            m2B.value = cleanNum(-2 * a * p);
            m2C.value = cleanNum((a * p * p) + q);

            update();
        }

        // --- 렌더링 로직 ---

        function update() {
            let a = parseFloat(m1A.value) || 0;
            let p = parseFloat(m1P.value) || 0;
            let q = parseFloat(m1Q.value) || 0;
            let b = parseFloat(m2B.value) || 0;
            let c = parseFloat(m2C.value) || 0;

            updateDisplayEquation(a, p, q, b, c);
            drawGraph(a, p, q);
            updateCursor();
        }

        function updateCursor() {
            if (isDragging) {
                canvas.style.cursor = 'grabbing';
            } else if (isHoveringVertex) {
                canvas.style.cursor = 'grab';
            } else {
                canvas.style.cursor = 'default';
            }
        }

        function updateDisplayEquation(a, p, q, b, c) {
            let text = `y = `;
            
            if (lastEditedFormat === 'standard') {
                if (a === 0) text += `${q}`;
                else {
                    if (a === -1) text += `-`;
                    else if (a !== 1) text += `${a}`;
                    
                    if (p === 0) text += `x²`;
                    else if (p > 0) text += `(x - ${p})²`;
                    else text += `(x + ${-p})²`;
                    
                    if (q > 0) text += (p === 0 && a === 1 ? ` + ${q}` : ` + ${q}`);
                    else if (q < 0) text += ` - ${-q}`;
                }
            } else {
                if (a === 0 && b === 0) {
                    text += `${c}`;
                } else {
                    if (a === -1) text += `-x²`;
                    else if (a === 1) text += `x²`;
                    else if (a !== 0) text += `${a}x²`;

                    if (b > 0) text += (a !== 0 ? ` + ` : ``) + (b === 1 ? `x` : `${b}x`);
                    else if (b < 0) text += (a !== 0 ? ` - ` : `-`) + (b === -1 ? `x` : `${-b}x`);

                    if (c > 0) text += (a !== 0 || b !== 0 ? ` + ` : ``) + `${c}`;
                    else if (c < 0) text += (a !== 0 || b !== 0 ? ` - ` : `-`) + `${-c}`;
                }
            }
            if(text === 'y = ') text = 'y = 0';
            
            displayEquation.textContent = text;
        }

        function drawArrow(ctx, x, y, angle, size = 12) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-size, size/2);
            ctx.lineTo(-size, -size/2);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function drawGraph(a, p, q) {
            const width = canvas.width;
            const height = canvas.height;
            ctx.clearRect(0, 0, width, height);
            
            const unit = 40; 
            const originX = width / 2; 
            const originY = height / 2; 
            
            // 모눈
            ctx.strokeStyle = '#e2e8f0'; 
            ctx.lineWidth = 1;
            for (let x = originX % unit; x <= width; x += unit) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
            }
            for (let y = originY % unit; y <= height; y += unit) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
            }
            
            // 축
            ctx.strokeStyle = '#0f172a';
            ctx.fillStyle = '#0f172a';
            ctx.lineWidth = 2.5;
            
            ctx.beginPath(); ctx.moveTo(0, originY); ctx.lineTo(width, originY); ctx.stroke();
            drawArrow(ctx, width - 4, originY, 0, 16);
            
            ctx.beginPath(); ctx.moveTo(originX, 0); ctx.lineTo(originX, height); ctx.stroke();
            drawArrow(ctx, originX, 4, -Math.PI / 2, 16);
            
            // 라벨
            ctx.font = '22px "Noto Serif KR", serif';
            ctx.fillStyle = '#475569';
            ctx.textAlign = 'right'; ctx.textBaseline = 'top';
            ctx.fillText('O', originX - 8, originY + 8);
            
            ctx.font = 'bold 24px "Noto Serif KR", serif';
            ctx.fillText('x', width - 12, originY + 12);
            ctx.fillText('y', originX - 12, 12);
            
            ctx.font = '20px "Noto Serif KR", serif';
            ctx.textAlign = 'center';
            for(let i = -10; i <= 10; i += 2) {
                if(i !== 0) {
                    let px = originX + i * unit;
                    if(px > 20 && px < width - 20) ctx.fillText(i, px, originY + 12);
                }
            }
            ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
            for(let i = -10; i <= 10; i += 2) {
                if(i !== 0) {
                    let py = originY - i * unit;
                    if(py > 20 && py < height - 20) ctx.fillText(i, originX - 10, py);
                }
            }
            
            // 포물선
            ctx.strokeStyle = '#2563eb';
            ctx.lineWidth = 4;
            ctx.beginPath();
            
            let started = false;
            for (let px = 0; px <= width; px += 2) {
                let x = (px - originX) / unit;
                let y = a * Math.pow(x - p, 2) + q;
                let py = originY - y * unit;
                
                if (py >= -100 && py <= height + 100) {
                    if (!started) { ctx.moveTo(px, py); started = true; } 
                    else { ctx.lineTo(px, py); }
                } else {
                    started = false;
                }
            }
            ctx.stroke();
            
            // 축의 방정식과 꼭짓점
            if (a !== 0) {
                ctx.strokeStyle = '#ef4444'; 
                ctx.lineWidth = 2;
                ctx.setLineDash([8, 8]); 
                ctx.beginPath();
                const axisPx = originX + p * unit;
                ctx.moveTo(axisPx, 0); ctx.lineTo(axisPx, height); ctx.stroke();
                ctx.setLineDash([]); 
                
                const py = originY - q * unit;
                if (axisPx >= 0 && axisPx <= width && py >= 0 && py <= height) {
                    // 호버 및 드래그 상태에 따라 꼭짓점 크기와 색상 변경
                    const radius = (isDragging || isHoveringVertex) ? 12 : 8;
                    ctx.fillStyle = (isDragging || isHoveringVertex) ? '#dc2626' : '#ef4444';
                    
                    ctx.beginPath(); 
                    ctx.arc(axisPx, py, radius, 0, Math.PI * 2); 
                    ctx.fill();
                    
                    ctx.strokeStyle = '#ffffff'; 
                    ctx.lineWidth = (isDragging || isHoveringVertex) ? 3 : 2; 
                    ctx.stroke();
                }
            }
        }

        // 초기화 실행
        syncFromM1();
    </script>
</body>
</html>
