<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>접현각과 원주각의 성질</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #f8fafc; 
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; 
            user-select: none; 
            touch-action: none;
        }
        canvas { 
            display: block; 
            cursor: crosshair; 
            touch-action: none;
        }
        .panel { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            background: rgba(255, 255, 255, 0.96); 
            backdrop-filter: blur(8px);
            padding: 20px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05); 
            border: 1px solid #e2e8f0; 
            pointer-events: auto; 
            max-width: 340px;
            width: 90%;
        }
    </style>
</head>
<body class="w-full h-screen relative">
    <div class="absolute top-5 left-5 z-10 flex gap-3">
        <button id="reset-btn" class="px-5 py-2.5 bg-slate-700 text-white rounded-xl font-bold hover:bg-slate-800 shadow-md cursor-pointer transition active:scale-95 text-sm md:text-base">
            초기화
        </button>
        <button id="proof-btn" class="px-5 py-2.5 bg-emerald-600 text-white rounded-xl font-bold hover:bg-emerald-700 shadow-md cursor-pointer transition active:scale-95 text-sm md:text-base flex items-center gap-1.5">
            <span id="proof-btn-icon">💡</span>
            <span id="proof-btn-text">증명하기</span>
        </button>
    </div>
    
    <div class="panel z-10">
        <h2 class="font-bold text-lg mb-2 text-slate-800">접현각과 원주각의 성질</h2>
        <p class="text-xs md:text-sm text-slate-600 mb-3 leading-relaxed">
            점 P와 B를 드래그하여 이동해보세요.<br>
            <span class="text-emerald-700 font-bold">증명하기</span> 버튼을 누르면 지름 AC와 보조선 PC를 이용한 원리가 강조됩니다.
        </p>
        
        <div class="text-sm md:text-base font-bold space-y-2 border-t pt-3 border-slate-200">
            <p class="flex items-center justify-between gap-2 text-slate-700">
                <span>접현각 (∠TAB):</span>
                <span id="tab-angle" class="text-red-600 text-lg md:text-xl font-extrabold">0°</span>
            </p>
            <p class="flex items-center justify-between gap-2 text-slate-700">
                <span>원주각 (∠APB):</span>
                <span id="apb-angle" class="text-blue-600 text-lg md:text-xl font-extrabold">0°</span>
            </p>
        </div>

        <div id="proof-info" class="hidden mt-3 pt-3 border-t border-emerald-100 bg-emerald-50/80 p-3 rounded-xl text-xs md:text-sm text-emerald-950 space-y-1.5">
            <p class="font-bold text-emerald-800 flex items-center justify-between">
                <span>🟢 호 BC의 원주각:</span>
                <span id="sub-angle" class="text-emerald-700 font-bold">0°</span>
            </p>
            <p class="text-xs text-emerald-800 leading-snug">
                • ∠CPB = ∠CAB (같은 호 BC에 대한 원주각)<br>
                • ∠APB = 90° - ∠CPB<br>
                • ∠TAB = 90° - ∠CAB<br>
                <span class="font-bold text-emerald-900">∴ ∠TAB = ∠APB</span>
            </p>
        </div>
    </div>
    
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let w, h, cx, cy, r;
        
        // 캔버스 좌표계 각도 설정 (6시 방향: Math.PI / 2)
        const A_ANGLE = Math.PI / 2;    // 90도 (접점 A 고정 위치 - 6시 방향)
        const C_ANGLE = Math.PI * 1.5;  // 270도 (12시 방향, 지름 반대편 C)
        let bAngle = Math.PI * 1.5;     // 점 B 위치 (초기화 시 C 위치)
        let pAngle = Math.PI * 1.15;    // 점 P 위치 (10시 방향 부근)
        
        let dragging = null;
        let proofMode = false;

        function resizeCanvas() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            
            // 우측 패널 고려하여 화면 좌측 영역에 원배치
            cx = w > 768 ? w * 0.38 : w * 0.45;
            cy = h / 2;
            
            r = Math.min(w * 0.3, h * 0.35, 300);
            draw();
        }
        window.onresize = resizeCanvas;

        document.getElementById('reset-btn').onclick = () => {
            bAngle = Math.PI * 1.5; // 점 B를 C 위치로 초기화
            pAngle = Math.PI * 1.15;
            draw();
        };

        const proofBtn = document.getElementById('proof-btn');
        const proofInfo = document.getElementById('proof-info');
        const proofBtnText = document.getElementById('proof-btn-text');

        proofBtn.onclick = () => {
            proofMode = !proofMode;
            if (proofMode) {
                proofBtn.classList.remove('bg-emerald-600', 'hover:bg-emerald-700');
                proofBtn.classList.add('bg-emerald-800');
                proofBtnText.innerText = '증명 끄기';
                proofInfo.classList.remove('hidden');
            } else {
                proofBtn.classList.remove('bg-emerald-800');
                proofBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-700');
                proofBtnText.innerText = '증명하기';
                proofInfo.classList.add('hidden');
            }
            draw();
        };

        function normalizeAngle(a) {
            let res = a % (Math.PI * 2);
            if (res < 0) res += Math.PI * 2;
            return res;
        }

        function inRange(angle, start, end) {
            angle = normalizeAngle(angle);
            start = normalizeAngle(start);
            end = normalizeAngle(end);
            if (start <= end) {
                return angle >= start && angle <= end;
            } else {
                return angle >= start || angle <= end;
            }
        }

        function getAngle(p1, vertex, p2) {
            let a1 = Math.atan2(p1.y - vertex.y, p1.x - vertex.x);
            let a2 = Math.atan2(p2.y - vertex.y, p2.x - vertex.x);
            let diff = Math.abs(a1 - a2) * 180 / Math.PI;
            if (diff > 180) diff = 360 - diff;
            return diff;
        }

        // 최단 호(Minor Arc)만을 그리는 전용 함수
        function drawMinorArcOnCircle(cx, cy, radius, angle1, angle2, color, lineWidth = 5) {
            let a1 = normalizeAngle(angle1);
            let a2 = normalizeAngle(angle2);
            let diff = a2 - a1;
            
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;

            ctx.beginPath();
            ctx.arc(cx, cy, radius, a1, a1 + diff, diff < 0);
            ctx.strokeStyle = color;
            ctx.lineWidth = lineWidth;
            ctx.stroke();
        }

        // 각도 표시 아크 함수 (가까운 점이 있을 때 아크 반지름 자동 조정)
        function drawAngleArc(vertex, p1, p2, color, defaultRadius = 42, width = 3) {
            const d1 = Math.hypot(p1.x - vertex.x, p1.y - vertex.y);
            const d2 = Math.hypot(p2.x - vertex.x, p2.y - vertex.y);
            const arcRadius = Math.max(14, Math.min(defaultRadius, d1 * 0.45, d2 * 0.45));

            let a1 = Math.atan2(p1.y - vertex.y, p1.x - vertex.x);
            let a2 = Math.atan2(p2.y - vertex.y, p2.x - vertex.x);
            let diff = a2 - a1;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            
            ctx.beginPath();
            ctx.arc(vertex.x, vertex.y, arcRadius, a1, a1 + diff, diff < 0);
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.stroke();
        }

        function drawRightAngle(vertex, p1, p2, color) {
            const d1 = Math.hypot(p1.x - vertex.x, p1.y - vertex.y);
            const d2 = Math.hypot(p2.x - vertex.x, p2.y - vertex.y);
            if (d1 === 0 || d2 === 0) return;

            const size = Math.max(10, Math.min(20, d1 * 0.3, d2 * 0.3));

            const ux1 = (p1.x - vertex.x) / d1;
            const uy1 = (p1.y - vertex.y) / d1;
            const ux2 = (p2.x - vertex.x) / d2;
            const uy2 = (p2.y - vertex.y) / d2;

            const pt1 = { x: vertex.x + ux1 * size, y: vertex.y + uy1 * size };
            const pt2 = { x: pt1.x + ux2 * size, y: pt1.y + uy2 * size };
            const pt3 = { x: vertex.x + ux2 * size, y: vertex.y + uy2 * size };

            ctx.beginPath();
            ctx.moveTo(pt1.x, pt1.y);
            ctx.lineTo(pt2.x, pt2.y);
            ctx.lineTo(pt3.x, pt3.y);
            ctx.strokeStyle = color;
            ctx.lineWidth = 2.5;
            ctx.stroke();
        }

        function draw() {
            ctx.clearRect(0, 0, w, h);
            
            const O = { x: cx, y: cy };
            const A = { x: cx, y: cy + r }; // 6시 방향 접점
            const C = { x: cx, y: cy - r }; // 12시 방향 (지름 AC)
            const B = { x: cx + r * Math.cos(bAngle), y: cy + r * Math.sin(bAngle) }; 
            const P = { x: cx + r * Math.cos(pAngle), y: cy + r * Math.sin(pAngle) };
            const T = { x: cx + r * 1.35, y: cy + r }; // 접선 연장선 점 T

            const isBAtC = Math.hypot(B.x - C.x, B.y - C.y) < 8;

            // 1. 기본 원그리기
            ctx.beginPath(); 
            ctx.arc(cx, cy, r, 0, Math.PI * 2); 
            ctx.strokeStyle = '#cbd5e1'; 
            ctx.lineWidth = 2;
            ctx.stroke();

            // 2. 증명 모드: 점 C와 B 사이의 "작은 호 BC(Minor Arc)"만 초록색으로 그리기
            if (proofMode && !isBAtC) {
                drawMinorArcOnCircle(cx, cy, r, C_ANGLE, bAngle, '#10b981', 5);
            }

            // 3. 지름 AC 및 보조선 PC (점선)
            if (!isBAtC || proofMode) {
                ctx.save();
                ctx.setLineDash([6, 5]);
                ctx.strokeStyle = proofMode ? '#059669' : '#64748b';
                ctx.lineWidth = 2;

                // 지름 AC
                ctx.beginPath();
                ctx.moveTo(A.x, A.y);
                ctx.lineTo(C.x, C.y);
                ctx.stroke();

                // 보조선 PC
                ctx.beginPath();
                ctx.moveTo(P.x, P.y);
                ctx.lineTo(C.x, C.y);
                ctx.stroke();
                ctx.restore();
            }

            // 4. 직각 표시 (∠OAT - 접선과 반지름의 수직 관계)
            ctx.beginPath();
            ctx.moveTo(A.x, A.y - 18);
            ctx.lineTo(A.x + 18, A.y - 18);
            ctx.lineTo(A.x + 18, A.y);
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 5. 현 AB, 접선 AT 및 원주각 삼각형 APB
            ctx.beginPath(); 
            ctx.moveTo(A.x, A.y); 
            ctx.lineTo(B.x, B.y); 
            ctx.strokeStyle = proofMode ? '#059669' : '#94a3b8'; 
            ctx.lineWidth = 2.5;
            ctx.stroke(); 
            
            // 접선 AT
            ctx.beginPath(); 
            ctx.moveTo(A.x - r * 0.9, A.y); 
            ctx.lineTo(T.x, T.y); 
            ctx.lineWidth = 3; 
            ctx.strokeStyle = '#334155'; 
            ctx.stroke();
            
            // 원주각 삼각형 APB
            ctx.beginPath(); 
            ctx.moveTo(A.x, A.y); 
            ctx.lineTo(P.x, P.y); 
            ctx.lineTo(B.x, B.y); 
            ctx.closePath(); 
            ctx.strokeStyle = '#3b82f6'; 
            ctx.lineWidth = 2.5; 
            ctx.stroke();

            // 6. 각도 수치 계산 및 UI 업데이트
            const tab = getAngle(T, A, B);
            const apb = getAngle(A, P, B); 
            document.getElementById('tab-angle').innerText = tab.toFixed(1) + "°";
            document.getElementById('apb-angle').innerText = apb.toFixed(1) + "°";

            // 7. 각도 표시 (접현각 TAB, 원주각 APB)
            const is90 = Math.abs(tab - 90) < 0.5;
            if (is90) {
                drawRightAngle(P, A, B, '#2563eb');
            } else {
                drawAngleArc(A, T, B, '#dc2626', 42, 3); // 접현각 TAB (빨간색)
                drawAngleArc(P, A, B, '#2563eb', 42, 3); // 원주각 APB (파란색)
            }

            // 8. 증명 모드 활성화 시: ∠CPB 및 ∠CAB 초록색으로 표시
            if (proofMode && !isBAtC) {
                const cpb = getAngle(C, P, B);
                document.getElementById('sub-angle').innerText = cpb.toFixed(1) + "°";

                // ∠CPB (점 P에서의 초록색 각)
                drawAngleArc(P, C, B, '#10b981', 32, 3);
                
                // ∠CAB (점 A에서의 초록색 각)
                drawAngleArc(A, C, B, '#10b981', 32, 3);
            }

            // 9. 주요 점 표시 (O, A, B, P, C)
            const points = [
                { pt: O, label: 'O', offset: { x: -22, y: 5 } },
                { pt: A, label: 'A', offset: { x: -8, y: 35 } },
                { pt: B, label: 'B', isDrag: true },
                { pt: P, label: 'P', isDrag: true },
            ];

            // B가 C 위치가 아닐 때만 점 C 및 라벨 표시
            if (!isBAtC) {
                points.push({ pt: C, label: 'C', offset: { x: -7, y: -15 } });
            }

            points.forEach(p => {
                ctx.beginPath(); 
                ctx.arc(p.pt.x, p.pt.y, p.isDrag ? 8 : 6, 0, Math.PI * 2); 
                ctx.fillStyle = p.isDrag ? '#0f172a' : '#475569'; 
                ctx.fill();

                if (p.isDrag) {
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#ffffff';
                    ctx.stroke();
                }

                // 점 라벨 텍스트
                ctx.font = 'bold 18px Pretendard, sans-serif';
                ctx.fillStyle = '#0f172a';
                if (p.offset) {
                    ctx.fillText(p.label, p.pt.x + p.offset.x, p.pt.y + p.offset.y);
                } else {
                    const dist = Math.hypot(p.pt.x - O.x, p.pt.y - O.y) || 1;
                    const textX = p.pt.x + (p.pt.x - O.x) / dist * 28 - 6;
                    const textY = p.pt.y + (p.pt.y - O.y) / dist * 28 + 6;
                    ctx.fillText(p.label, textX, textY);
                }
            });

            ctx.fillText('T', T.x + 10, T.y + 25);
        }

        function getCanvasCoords(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function handleStart(clientX, clientY) {
            const coords = getCanvasCoords(clientX, clientY);
            const P = { x: cx + r * Math.cos(pAngle), y: cy + r * Math.sin(pAngle) };
            const B = { x: cx + r * Math.cos(bAngle), y: cy + r * Math.sin(bAngle) };
            
            // 전자칠판/터치 인식 영역 55px 확장
            const distP = Math.hypot(coords.x - P.x, coords.y - P.y);
            const distB = Math.hypot(coords.x - B.x, coords.y - B.y);

            if (distP < 55 && distP < distB) {
                dragging = 'P';
            } else if (distB < 55) {
                dragging = 'B';
            }
        }

        function handleMove(clientX, clientY) {
            if (!dragging) return;
            const coords = getCanvasCoords(clientX, clientY);
            let newAngle = Math.atan2(coords.y - cy, coords.x - cx);
            
            if (dragging === 'B') {
                if (inRange(newAngle, pAngle, A_ANGLE)) {
                    bAngle = newAngle;
                }
            }
            else if (dragging === 'P') {
                if (inRange(newAngle, A_ANGLE, bAngle)) {
                    pAngle = newAngle;
                }
            }
            draw();
        }

        function handleEnd() {
            dragging = null;
        }

        // 마우스 이벤트 등록
        canvas.onmousedown = (e) => handleStart(e.clientX, e.clientY);
        window.onmousemove = (e) => handleMove(e.clientX, e.clientY);
        window.onmouseup = handleEnd;

        // 터치 및 전자칠판 스크린 이벤트
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                handleStart(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (dragging && e.touches.length > 0) {
                handleMove(e.touches[0].clientX, e.touches[0].clientY);
                if (e.cancelable) e.preventDefault();
            }
        }, { passive: false });

        window.addEventListener('touchend', handleEnd);
        window.addEventListener('touchcancel', handleEnd);

        // 초기 시작
        resizeCanvas();
    </script>
</body>
</html>
