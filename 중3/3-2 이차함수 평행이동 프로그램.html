<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이차함수 평행이동 시뮬레이터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    <style>
        .frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; padding: 0 0.1rem; }
        .frac > span { display: block; padding: 0 0.2rem; }
        .frac > span.bottom { border-top: 1px solid currentColor; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body class="bg-slate-950 text-white font-sans overflow-hidden">
    <div id="root" class="h-screen w-screen p-4 flex flex-col"></div>

    <script type="text/babel" data-presets="react">
        const { useState } = React;

        const App = () => {
            const aList = [
                { f: "-3", v: -3 }, { f: "-2", v: -2 }, { f: "-1", v: -1 }, 
                { f: "-1/2", v: -1/2 }, { f: "-1/3", v: -1/3 }, { f: "-1/4", v: -1/4 }, { f: "-1/5", v: -1/5 }, { f: "-1/6", v: -1/6 },
                { f: "0", v: 0 },
                { f: "1/6", v: 1/6 }, { f: "1/5", v: 1/5 }, { f: "1/4", v: 1/4 }, { f: "1/3", v: 1/3 }, { f: "1/2", v: 1/2 },
                { f: "1", v: 1 }, { f: "2", v: 2 }, { f: "3", v: 3 }, { f: "4", v: 4 }, { f: "5", v: 5 },
                { f: "6", v: 6 }, { f: "7", v: 7 }, { f: "8", v: 8 }, { f: "9", v: 9 }, { f: "10", v: 10 }
            ];
            
            const [aIndex, setAIndex] = useState(14);
            const [p, setP] = useState(0);
            const [q, setQ] = useState(0);

            const { f: aStr, v: a } = aList[aIndex];

            const Fraction = ({ num, den }) => (
                <div className="frac">
                    <span>{num}</span>
                    <span className="bottom">{den}</span>
                </div>
            );

            const renderNum = (n) => {
                if (n === 0) return "0";
                if (Math.abs(Math.round(n) - n) < 1e-6) return Math.round(n).toString();
                
                const sign = n < 0 ? "-" : "";
                const absN = Math.abs(n);
                for (let d = 2; d <= 6; d++) {
                    if (Math.abs(Math.round(absN * d) - absN * d) < 1e-6) {
                        const numVal = Math.round(absN * d);
                        return <span className="inline-flex items-center">{sign}<Fraction num={numVal} den={d} /></span>;
                    }
                }
                return n.toFixed(2);
            };

            const renderA = (val) => {
                if (val === 0) return "0";
                if (Math.abs(val - 1) < 1e-6) return "";
                if (Math.abs(val + 1) < 1e-6) return "-";
                
                const sign = val < 0 ? "-" : "";
                const absVal = Math.abs(val);
                
                if (Math.abs(Math.round(absVal) - absVal) < 1e-6) {
                    return <span className="inline-flex items-center">{sign}{Math.round(absVal)}</span>;
                }
                
                for (let d = 2; d <= 6; d++) {
                    if (Math.abs(Math.round(absVal * d) - absVal * d) < 1e-6) {
                        const numVal = Math.round(absVal * d);
                        return <span className="inline-flex items-center">{sign}<Fraction num={numVal} den={d} /></span>;
                    }
                }
                
                return <span className="inline-flex items-center">{sign}{absVal}</span>;
            };

            const basePoints = [-2, -1, 0, 1, 2];
            
            const scale = 25; 
            const size = 500;
            const center = size / 2;

            const generatePath = (isOriginal) => {
                let d = "";
                for (let x = -10; x <= 10; x += 0.1) {
                    const y = isOriginal ? a * Math.pow(x, 2) : a * Math.pow(x - p, 2) + q;
                    const sx = center + x * scale;
                    const sy = center - y * scale;
                    d += (x === -10 ? "M " : "L ") + `${sx} ${sy} `;
                }
                return d;
            };

            const gridLines = Array.from({ length: 21 }, (_, i) => i - 10);

            return (
                <div className="w-full h-full flex flex-col">
                    <h1 className="text-3xl font-bold text-center mb-6 text-blue-400">이차함수 직관적 평행이동 시뮬레이터</h1>
                    
                    <div className="flex-grow grid grid-cols-12 gap-6 overflow-hidden">
                        <div className="col-span-5 flex flex-col gap-4 overflow-hidden">
                            <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shrink-0">
                                <label className="block text-sm mb-2 text-slate-300">폭 (a): {aStr}</label>
                                <input type="range" min="0" max={aList.length - 1} step="1" value={aIndex} onChange={(e) => setAIndex(parseInt(e.target.value))} className="w-full mb-4 cursor-pointer" />
                                
                                <label className="block text-sm mb-2 text-slate-300">x축 이동 (p): {p}</label>
                                <input type="range" min="-6" max="6" step="1" value={p} onChange={(e) => setP(parseInt(e.target.value))} className="w-full mb-4 cursor-pointer" />
                                
                                <label className="block text-sm mb-2 text-slate-300">y축 이동 (q): {q}</label>
                                <input type="range" min="-6" max="6" step="1" value={q} onChange={(e) => setQ(parseInt(e.target.value))} className="w-full cursor-pointer" />
                                
                                <div className="mt-6 flex gap-3 items-stretch">
                                    <button 
                                        onClick={() => { setAIndex(14); setP(0); setQ(0); }}
                                        className="bg-slate-700/50 hover:bg-slate-600 text-slate-300 transition-colors rounded-xl border border-slate-600 flex flex-col justify-center items-center w-20 shrink-0 shadow-sm"
                                        title="기본값(y=x²)으로 초기화"
                                    >
                                        <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                                        </svg>
                                        <span className="text-xs font-bold">초기화</span>
                                    </button>
                                    
                                    <div className="flex-grow bg-slate-900 py-4 rounded-xl border border-slate-700 text-center font-mono text-xl flex flex-col justify-center gap-3">
                                        <div className="flex justify-center items-center gap-1">
                                            y = {renderA(a)}
                                            {p === 0 ? <span>x²</span> : (
                                                <span>(x {p > 0 ? "-" : "+"} <span className="text-red-400">{Math.abs(p)}</span>)²</span>
                                            )}
                                            {q !== 0 && (
                                                <span>{q > 0 ? "+" : "-"} <span className="text-green-400">{Math.abs(q)}</span></span>
                                            )}
                                        </div>
                                        <div className="flex justify-center items-center gap-1 text-yellow-400 text-lg">
                                            y {q !== 0 && <span>{q > 0 ? "-" : "+"} <span className="text-green-400">{Math.abs(q)}</span></span>} = {renderA(a)}
                                            {p === 0 ? <span>x²</span> : (
                                                <span>(x {p > 0 ? "-" : "+"} <span className="text-red-400">{Math.abs(p)}</span>)²</span>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 flex-grow overflow-y-auto">
                                <table className="w-full text-center border-separate border-spacing-y-2">
                                    <thead>
                                        <tr className="text-slate-400 text-sm">
                                            <th className="pb-2">원래 점 (x, y)</th>
                                            <th className="pb-2">최종 좌표 (이동 수식)</th>
                                        </tr>
                                    </thead>
                                    <tbody className="text-sm">
                                        {basePoints.map((x) => {
                                            const y = a * Math.pow(x, 2);
                                            return (
                                                <tr key={x} className="bg-slate-900/60 transition-colors hover:bg-slate-700">
                                                    <td className="py-4 rounded-l-xl w-1/3">
                                                        <div className="flex justify-center items-center gap-1">
                                                            ({x}, {renderNum(y)})
                                                        </div>
                                                    </td>
                                                    <td className="py-4 font-bold rounded-r-xl w-2/3">
                                                        <div className="flex flex-row items-center justify-center gap-2">
                                                            <div className="flex items-center text-slate-300">
                                                                ({x}
                                                                {p !== 0 && <span className="text-red-400 mx-1">{p > 0 ? `+ ${p}` : `- ${Math.abs(p)}`}</span>}, 
                                                                <span className="mx-1 flex items-center">{renderNum(y)}</span>
                                                                {q !== 0 && <span className="text-green-400 mr-1">{q > 0 ? `+ ${q}` : `- ${Math.abs(q)}`}</span>})
                                                            </div>
                                                            <div className="text-blue-300 flex items-center">
                                                                = ({x + p}, {renderNum(y + q)})
                                                            </div>
                                                        </div>
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div className="col-span-7 bg-white rounded-3xl flex justify-center items-center shadow-2xl relative overflow-hidden">
                            <svg width="100%" height="100%" viewBox={`0 0 ${size} ${size}`}>
                                <defs>
                                    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                                        <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8" />
                                    </marker>
                                </defs>

                                {gridLines.map((i) => (
                                    <g key={`grid-${i}`}>
                                        <line x1="0" y1={center + i * scale} x2={size} y2={center + i * scale} stroke="#e2e8f0" strokeWidth="1" />
                                        <line x1={center + i * scale} y1="0" x2={center + i * scale} y2={size} stroke="#e2e8f0" strokeWidth="1" />
                                    </g>
                                ))}
                                
                                <line x1="0" y1={center} x2={size} y2={center} stroke="#94a3b8" strokeWidth="2" markerEnd="url(#arrow)" />
                                <line x1={center} y1={size} x2={center} y2="0" stroke="#94a3b8" strokeWidth="2" markerEnd="url(#arrow)" />
                                <circle cx={center} cy={center} r="4" fill="#64748b" />
                                <text x={center+10} y={center+20} fontSize="14" fill="#64748b" fontWeight="bold">O</text>
                                
                                <path d={generatePath(true)} fill="none" stroke="#94a3b8" strokeWidth="2.5" strokeDasharray="6 6" />
                                <path d={generatePath(false)} fill="none" stroke="#3b82f6" strokeWidth="4" />
                                
                                {basePoints.map((x) => {
                                    const y = a * Math.pow(x, 2);
                                    const mx = x + p;
                                    const my = y + q;
                                    
                                    const startX = center + x * scale;
                                    const startY = center - y * scale;
                                    const midX = center + mx * scale;
                                    const endY = center - my * scale;
                                    
                                    return (
                                        <g key={x}>
                                            {p !== 0 && (
                                                <line x1={startX} y1={startY} x2={midX} y2={startY} stroke="#f87171" strokeWidth="2" strokeDasharray="5 3" />
                                            )}
                                            {q !== 0 && (
                                                <line x1={midX} y1={startY} x2={midX} y2={endY} stroke="#4ade80" strokeWidth="2" strokeDasharray="5 3" />
                                            )}
                                            <circle cx={startX} cy={startY} r="5" fill="#64748b" />
                                            <circle cx={midX} cy={endY} r="7" fill="#ef4444" stroke="white" strokeWidth="2" />
                                        </g>
                                    );
                                })}
                            </svg>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
