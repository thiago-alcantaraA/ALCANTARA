<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이차함수 평행이동 시뮬레이터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; overflow: hidden; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        input[type="range"] { -webkit-appearance: none; appearance: none; background: transparent; }
        input[type="range"]::-webkit-slider-runnable-track { background: #334155; height: 0.5rem; border-radius: 0.5rem; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; margin-top: -0.5rem; background-color: currentColor; height: 1.5rem; width: 1.5rem; border-radius: 50%; cursor: pointer; box-shadow: 0 0 15px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-plugins="transform-react-jsx">
        const { useState, useMemo, useEffect } = React;

        const App = () => {
            const [a, setA] = useState(1);
            const [p, setP] = useState(0);
            const [q, setQ] = useState(0);

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, []);

            const RenderValue = ({ val, className = "" }) => {
                if (val === 0) return <span>0</span>;
                if (Number.isInteger(val)) return <span>{val}</span>;
                const num = Math.round(val * 2);
                return (
                    <span className={`inline-flex items-center align-middle ${className}`}>
                        {num < 0 && <span className="mr-0.5">-</span>}
                        <span className="flex flex-col items-center leading-none text-[0.8em]">
                            <span className="pb-0.5 border-b border-current px-0.5">{Math.abs(num)}</span>
                            <span className="pt-0.5 px-0.5">2</span>
                        </span>
                    </span>
                );
            };

            const points = useMemo(() => {
                const data = [];
                for (let x = -3; x <= 3; x++) {
                    const y = a * Math.pow(x, 2);
                    data.push({ x, y, newX: x + p, newY: y + q });
                }
                return data;
            }, [a, p, q]);

            const toSvgX = (x) => 300 + x * 35;
            const toSvgY = (y) => 250 - y * 12;

            const getPath = (ca, cp, cq) => {
                let d = "";
                for (let x = -15; x <= 15; x += 0.2) {
                    const y = ca * Math.pow(x - cp, 2) + cq;
                    d += `${x === -15 ? "M" : "L"} ${toSvgX(x)} ${toSvgY(y)} `;
                }
                return d;
            };

            return (
                <div className="flex flex-col h-screen bg-slate-900 text-slate-100 p-6 overflow-hidden">
                    <header className="flex justify-between items-center mb-6 px-4">
                        <h1 className="text-3xl font-bold flex items-center gap-3">
                            <i data-lucide="line-chart" className="text-blue-400 w-8 h-8"></i>
                            이차함수 평행이동 시뮬레이터
                        </h1>
                        <div className="bg-slate-800 px-10 py-4 rounded-2xl border border-slate-700 shadow-2xl">
                            <code className="text-2xl font-mono">
                                y - {q} = {a === 1 ? "" : a}(x - {p})²
                            </code>
                        </div>
                    </header>

                    <div className="grid grid-cols-12 gap-6 flex-1">
                        <div className="col-span-7 flex flex-col gap-6">
                            <div className="bg-slate-800/50 rounded-3xl p-6 border border-slate-700">
                                <div className="grid grid-cols-3 gap-10">
                                    <div className="flex flex-col">
                                        <label className="text-slate-400 font-bold mb-2">폭 (a)</label>
                                        <input type="range" min="-1" max="4" step="0.5" value={a} onChange={(e) => setA(parseFloat(e.target.value))} className="w-full text-blue-500" />
                                    </div>
                                    <div className="flex flex-col">
                                        <label className="text-slate-400 font-bold mb-2">x축 이동 (p)</label>
                                        <input type="range" min="-6" max="6" step="1" value={p} onChange={(e) => setP(parseInt(e.target.value))} className="w-full text-red-500" />
                                    </div>
                                    <div className="flex flex-col">
                                        <label className="text-slate-400 font-bold mb-2">y축 이동 (q)</label>
                                        <input type="range" min="-10" max="10" step="1" value={q} onChange={(e) => setQ(parseInt(e.target.value))} className="w-full text-green-500" />
                                    </div>
                                </div>
                            </div>

                            <div className="flex-1 bg-white rounded-3xl p-5 shadow-2xl overflow-hidden">
                                <svg viewBox="0 0 600 400" className="w-full h-full">
                                    <line x1="0" y1="250" x2="600" y2="250" stroke="#94a3b8" strokeWidth="2" />
                                    <line x1="300" y1="0" x2="300" y2="400" stroke="#94a3b8" strokeWidth="2" />
                                    <path d={getPath(a, 0, 0)} fill="none" stroke="#cbd5e1" strokeWidth="3" strokeDasharray="8" />
                                    <path d={getPath(a, p, q)} fill="none" stroke="#3b82f6" strokeWidth="6" />
                                </svg>
                            </div>
                        </div>

                        <div className="col-span-5 bg-slate-800/50 rounded-3xl border border-slate-700 p-6">
                            <table className="w-full text-center">
                                <thead>
                                    <tr className="text-slate-400 border-b border-slate-700">
                                        <th className="py-4">원래 규칙</th>
                                        <th className="py-4">이동된 규칙</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {points.map((pt, i) => (
                                        <tr key={i} className="border-b border-slate-700/50">
                                            <td className="py-4 font-mono">({pt.x}, {pt.y})</td>
                                            <td className="py-4 font-mono font-bold text-yellow-400">({pt.newX}, {pt.newY})</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
