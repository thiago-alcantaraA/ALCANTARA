<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>원주각과 중심각</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f8fafc;
            user-select: none;
        }
        #canvas-container {
            width: 100%;
            height: calc(100% - 80px);
            position: relative;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px; /* 기존 right: 20px에서 동일한 높이의 왼쪽으로 이동 */
            background: white;
            padding: 18px 22px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            pointer-events: auto;
            border: 1px solid #e2e8f0;
            max-width: 360px;
            width: calc(100% - 40px);
        }
    </style>
</head>
<body class="flex flex-col">

    <header class="h-20 bg-white shadow-sm flex items-center justify-between px-6 z-10 shrink-0">
        <div>
            <h1 class="text-xl font-bold text-slate-800">원주각과 중심각의 성질</h1>
            <p class="text-sm text-slate-500">원 위를 클릭하여 점 P, Q를 생성하고 드래그해보세요.</p>
        </div>
        <div class="flex flex-wrap items-center gap-2">
            <button id="proof-btn" class="px-3.5 py-2 bg-emerald-600 text-white font-semibold text-sm rounded-lg shadow hover:bg-emerald-700 transition flex items-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                증명하기
            </button>
            <button id="delete-p-btn" class="px-3 py-2 bg-rose-50 text-rose-600 border border-rose-200 font-medium text-sm rounded-lg hover:bg-rose-100 transition">
                P 지우기
            </button>
            <button id="delete-q-btn" class="px-3 py-2 bg-purple-50 text-purple-600 border border-purple-200 font-medium text-sm rounded-lg hover:bg-purple-100 transition">
                Q 지우기
            </button>
            <button id="reset-btn" class="px-4 py-2 bg-slate-700 text-white font-medium text-sm rounded-lg shadow hover:bg-slate-800 transition ml-1">
                초기화
            </button>
        </div>
    </header>

    <main id="canvas-container" style="touch-action: none;">
        <canvas id="canvas"></canvas>
        <div id="info-panel">
            <div class="flex items-center justify-between mb-2">
                <h2 class="text-lg font-bold text-slate-800">각도 비교</h2>
                <span id="proof-badge" class="hidden text-xs bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold">증명 모드 ON</span>
            </div>
            <div id="angle-list" class="text-slate-600 font-medium space-y-3"></div>
            <div id="relation-container" class="mt-3 pt-3 border-t border-slate-200">
                <p id="relation-text" class="text-sm text-slate-500 font-medium">원 테두리를 클릭하여 점을 찍어보세요 (최대 2개).</p>
            </div>
            <div id="proof-info" class="hidden mt-3 pt-3 border-t border-slate-200 text-xs text-slate-600"></div>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const resetBtn = document.getElementById('reset-btn');
        const deletePBtn = document.getElementById('delete-p-btn');
        const deleteQBtn = document.getElementById('delete-q-btn');
        const proofBtn = document.getElementById('proof-btn');
        const angleList = document.getElementById('angle-list');
        const relationText = document.getElementById('relation-text');
        const proofBadge = document.getElementById('proof-badge');
        const proofInfo = document.getElementById('proof-info');

        let width = 0, height = 0, cx = 0, cy = 0;
        let circleRadius = 150;
        let angleA = Math.PI * 0.75; 
        let angleB = Math.PI * 0.25; 
        let userPoints = [];
        let draggingPoint = null; 
        let showProof = false;
        let activeTriangles = new Set(); // 빗금 표시할 삼각형 ID 저장

        function resizeCanvas() {
            const container = document.getElementById('canvas-container');
            const dpr = window.devicePixelRatio || 1;
            width = container.clientWidth; height = container.clientHeight;
            canvas.width = width * dpr; canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            
            circleRadius = Math.min(width, height) * 0.38;
            if (circleRadius < 120) circleRadius = 120;
            if (circleRadius > 550) circleRadius = 550;
            
            cx = width / 2; cy = height / 2;
            draw();
        }

        window.addEventListener('resize', resizeCanvas);

        // 초기화 버튼: 점 P, Q 및 각도 비교 정보, 빗금 선택 상태를 모두 제거
        resetBtn.addEventListener('click', () => {
            angleA = Math.PI * 0.75; 
            angleB = Math.PI * 0.25;
            userPoints = []; 
            draggingPoint = null;
            showProof = false;
            activeTriangles.clear();
            draw();
        });

        // P 지우기
        deletePBtn.addEventListener('click', () => {
            userPoints = userPoints.filter(p => p.id !== 'P');
            activeTriangles.delete('OPA');
            activeTriangles.delete('OPB');
            if (userPoints.length === 0) showProof = false;
            draw();
        });

        // Q 지우기
        deleteQBtn.addEventListener('click', () => {
            userPoints = userPoints.filter(p => p.id !== 'Q');
            activeTriangles.delete('OQA');
            activeTriangles.delete('OQB');
            if (userPoints.length === 0) showProof = false;
            draw();
        });

        // 증명하기 토글 (점이 없는 경우 자동으로 점 P 생성 후 증명 실행)
        proofBtn.addEventListener('click', () => {
            if (userPoints.length === 0) {
                userPoints.push({ id: 'P', angle: Math.PI * 1.35 });
            }
            showProof = !showProof;
            draw();
        });

        // 삼각형 빗금 토글 함수
        function toggleTriangle(id) {
            if (activeTriangles.has(id)) {
                activeTriangles.delete(id);
            } else {
                activeTriangles.add(id);
            }
            draw();
        }
        window.toggleTriangle = toggleTriangle;

        function norm(a) {
            let res = a % (Math.PI * 2);
            return res < 0 ? res + Math.PI * 2 : res;
        }

        // 특정 각도(pAngle)가 호 AB 중 짧은 호(Minor Arc) 위에 있는지 판별
        function isPointOnMinorArc(pAngle, aAng, bAng) {
            let a = norm(aAng);
            let b = norm(bAng);
            let p = norm(pAngle);
            let diffAB = norm(b - a);
            
            if (diffAB <= Math.PI) {
                return norm(p - a) <= diffAB;
            } else {
                return norm(p - b) <= (Math.PI * 2 - diffAB);
            }
        }

        // 빗금 쳐진 삼각형 그리기 함수
        function drawHatchedTriangle(p1, p2, p3, strokeColor, fillColor) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.lineTo(p3.x, p3.y);
            ctx.closePath();

            ctx.fillStyle = fillColor;
            ctx.fill();

            ctx.clip(); // 삼각형 내부 영역으로 제한

            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 1.8;
            ctx.beginPath();

            const minX = Math.min(p1.x, p2.x, p3.x) - 30;
            const maxX = Math.max(p1.x, p2.x, p3.x) + 30;
            const minY = Math.min(p1.y, p2.y, p3.y) - 30;
            const maxY = Math.max(p1.y, p2.y, p3.y) + 30;

            const spacing = 12;
            for (let x = minX - (maxY - minY); x < maxX; x += spacing) {
                ctx.moveTo(x, minY);
                ctx.lineTo(x + (maxY - minY), maxY);
            }
            ctx.stroke();

            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.restore();
        }

        canvas.addEventListener('pointerdown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const px = e.clientX - rect.left;
            const py = e.clientY - rect.top;

            const pts = [
                { id: 'A', x: cx + circleRadius * Math.cos(angleA), y: cy + circleRadius * Math.sin(angleA) },
                { id: 'B', x: cx + circleRadius * Math.cos(angleB), y: cy + circleRadius * Math.sin(angleB) }
            ];
            userPoints.forEach(p => pts.push({ id: p.id, x: cx + circleRadius * Math.cos(p.angle), y: cy + circleRadius * Math.sin(p.angle) }));

            let clicked = null;
            for (let p of pts) {
                if (Math.sqrt((px - p.x)**2 + (py - p.y)**2) < 30) { clicked = p.id; break; }
            }

            if (clicked) {
                draggingPoint = clicked;
            } else if (Math.abs(Math.sqrt((px - cx)**2 + (py - cy)**2) - circleRadius) < 50 && userPoints.length < 2) {
                const existingP = userPoints.find(up => up.id === 'P');
                const newId = !existingP ? 'P' : 'Q';
                userPoints.push({ id: newId, angle: Math.atan2(py - cy, px - cx) });
                draggingPoint = newId; 
                draw();
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (draggingPoint) {
                const rect = canvas.getBoundingClientRect();
                const angle = Math.atan2(e.clientY - rect.top - cy, e.clientX - rect.left - cx);
                if (draggingPoint === 'A') angleA = angle;
                else if (draggingPoint === 'B') angleB = angle;
                else {
                    let p = userPoints.find(up => up.id === draggingPoint);
                    if (p) p.angle = angle;
                }
                draw();
            }
        });

        canvas.addEventListener('pointerup', () => draggingPoint = null);

        function draw() {
            ctx.clearRect(0, 0, width, height);

            let activePt = userPoints.find(p => p.id === draggingPoint) || userPoints[0];
            let pOnMinor = activePt ? isPointOnMinorArc(activePt.angle, angleA, angleB) : false;

            let nA = norm(angleA), nB = norm(angleB), arcLen = norm(nB - nA);
            let isArcLenMajor = arcLen > Math.PI;

            let minorStart = isArcLenMajor ? nB : nA;
            let minorEnd = isArcLenMajor ? nA : nB;
            let minorSpan = isArcLenMajor ? Math.PI * 2 - arcLen : arcLen;

            let startArc, endArc, subtendedArc;
            if (pOnMinor) {
                startArc = minorEnd;
                endArc = minorStart;
                subtendedArc = Math.PI * 2 - minorSpan;
            } else {
                startArc = minorStart;
                endArc = minorEnd;
                subtendedArc = minorSpan;
            }

            // 1. 중심각 호 그리기
            ctx.beginPath();
            ctx.arc(cx, cy, 50, startArc, endArc, false);
            ctx.strokeStyle = '#ea580c';
            ctx.lineWidth = 3;
            ctx.stroke();

            let centralDeg = subtendedArc * 180 / Math.PI;
            let midArc = startArc + subtendedArc / 2;
            drawText(`${centralDeg.toFixed(1)}°`, cx + 80 * Math.cos(midArc), cy + 80 * Math.sin(midArc), '#ea580c');

            // 2. 기본 원 그리기
            ctx.beginPath();
            ctx.arc(cx, cy, circleRadius, 0, Math.PI * 2);
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = '#94a3b8';
            ctx.stroke();

            // 3. 반지름 (OA, OB) 그리기
            const pA = { x: cx + circleRadius * Math.cos(angleA), y: cy + circleRadius * Math.sin(angleA) };
            const pB = { x: cx + circleRadius * Math.cos(angleB), y: cy + circleRadius * Math.sin(angleB) };
            drawLine(cx, cy, pA.x, pA.y, '#f97316', 2.5);
            drawLine(cx, cy, pB.x, pB.y, '#f97316', 2.5);

            // 4. 증명 모드 보조선 및 선택된 삼각형 빗금 그리기
            if (showProof && userPoints.length > 0) {
                userPoints.forEach(up => {
                    const pPt = { x: cx + circleRadius * Math.cos(up.angle), y: cy + circleRadius * Math.sin(up.angle) };
                    const triA_id = `O${up.id}A`;
                    const triB_id = `O${up.id}B`;

                    if (activeTriangles.has(triA_id)) {
                        drawHatchedTriangle(
                            { x: cx, y: cy }, pPt, pA,
                            up.id === 'P' ? '#2563eb' : '#9333ea',
                            up.id === 'P' ? 'rgba(59, 130, 246, 0.15)' : 'rgba(168, 85, 247, 0.15)'
                        );
                    }
                    if (activeTriangles.has(triB_id)) {
                        drawHatchedTriangle(
                            { x: cx, y: cy }, pPt, pB,
                            up.id === 'P' ? '#2563eb' : '#9333ea',
                            up.id === 'P' ? 'rgba(59, 130, 246, 0.15)' : 'rgba(168, 85, 247, 0.15)'
                        );
                    }

                    // 지름 보조선
                    const oppX = cx - (pPt.x - cx);
                    const oppY = cy - (pPt.y - cy);
                    
                    ctx.save();
                    ctx.beginPath();
                    ctx.setLineDash([6, 4]);
                    ctx.moveTo(pPt.x, pPt.y);
                    ctx.lineTo(oppX, oppY);
                    ctx.strokeStyle = '#0f172a';
                    ctx.lineWidth = 2.5;
                    ctx.stroke();
                    ctx.restore();

                    drawPoint(oppX, oppY, '#64748b', 4);
                });
            }

            // 5. 원주각 점 및 각도 표시
            if (userPoints.length > 0) {
                let htmlContent = '';
                const styles = [
                    { line: '#3b82f6', arc: '#2563eb', text: '#2563eb', point: '#ef4444', class: 'text-blue-600' },
                    { line: '#a855f7', arc: '#9333ea', text: '#9333ea', point: '#f59e0b', class: 'text-purple-600' }
                ];
                userPoints.forEach((up, index) => {
                    const style = styles[index];
                    const pPt = { x: cx + circleRadius * Math.cos(up.angle), y: cy + circleRadius * Math.sin(up.angle) };
                    
                    drawLine(pPt.x, pPt.y, pA.x, pA.y, style.line, 2);
                    drawLine(pPt.x, pPt.y, pB.x, pB.y, style.line, 2);
                    
                    const aPA = Math.atan2(pA.y - pPt.y, pA.x - pPt.x);
                    const aPB = Math.atan2(pB.y - pPt.y, pB.x - pPt.x);
                    let diff = norm(aPB - aPA);
                    
                    ctx.beginPath();
                    ctx.arc(pPt.x, pPt.y, 45, diff < Math.PI ? aPA : aPB, diff < Math.PI ? aPB : aPA, false);
                    ctx.strokeStyle = style.arc; 
                    ctx.lineWidth = 3; 
                    ctx.stroke();
                    
                    let upOnMinor = isPointOnMinorArc(up.angle, angleA, angleB);
                    let ptCentralDeg = upOnMinor ? (360 - minorSpan * 180 / Math.PI) : (minorSpan * 180 / Math.PI);
                    let inscribedDeg = ptCentralDeg / 2;
                    
                    drawText(`${inscribedDeg.toFixed(1)}°`, pPt.x + 65 * Math.cos(aPA + (diff < Math.PI ? diff : Math.PI * 2 - diff) / 2), pPt.y + 65 * Math.sin(aPA + (diff < Math.PI ? diff : Math.PI * 2 - diff) / 2), style.text);
                    drawPoint(pPt.x, pPt.y, style.point);
                    drawLabelOutside(up.id, pPt, {x: cx, y: cy}, style.point);
                    
                    htmlContent += `
                        <div class="p-2 bg-slate-50 rounded-lg border border-slate-100">
                            <p class="text-xs text-slate-500">중심각: <span class="text-orange-600 font-bold text-sm">${ptCentralDeg.toFixed(1)}°</span></p>
                            <p class="text-xs text-slate-500">원주각 (${up.id}): <span class="${style.class} font-bold text-sm">${inscribedDeg.toFixed(1)}°</span></p>
                        </div>
                    `;
                });

                angleList.innerHTML = htmlContent;
                relationText.innerHTML = `<span class="text-slate-800 font-bold">중심각 = 2 × 원주각</span>`;
                relationText.className = "text-sm text-emerald-700 font-bold bg-emerald-50 p-2 rounded-lg text-center border border-emerald-200";
            } else {
                angleList.innerHTML = '';
                relationText.innerHTML = `원 테두리를 클릭하여 점을 찍어보세요 (최대 2개).`;
                relationText.className = "text-sm text-slate-500 font-medium";
                showProof = false;
            }

            if (showProof && userPoints.length > 0) {
                proofBadge.classList.remove('hidden');
                
                let triButtonsHTML = '';
                userPoints.forEach(up => {
                    const triA_id = `O${up.id}A`;
                    const triB_id = `O${up.id}B`;
                    const isAActive = activeTriangles.has(triA_id);
                    const isBActive = activeTriangles.has(triB_id);

                    triButtonsHTML += `
                        <div class="grid grid-cols-2 gap-2 my-1">
                            <button onclick="toggleTriangle('${triA_id}')" class="px-2.5 py-1.5 rounded-lg border flex items-center justify-between text-xs transition-all ${isAActive ? 'bg-emerald-600 text-white border-emerald-700 shadow-sm font-bold' : 'bg-white text-emerald-800 border-emerald-300 hover:bg-emerald-100 font-medium'}">
                                <span>△O${up.id}A</span>
                                <span class="text-[10px] ${isAActive ? 'text-emerald-100' : 'text-emerald-600'}">${isAActive ? '빗금 ON' : '보기'}</span>
                            </button>
                            <button onclick="toggleTriangle('${triB_id}')" class="px-2.5 py-1.5 rounded-lg border flex items-center justify-between text-xs transition-all ${isBActive ? 'bg-emerald-600 text-white border-emerald-700 shadow-sm font-bold' : 'bg-white text-emerald-800 border-emerald-300 hover:bg-emerald-100 font-medium'}">
                                <span>△O${up.id}B</span>
                                <span class="text-[10px] ${isBActive ? 'text-emerald-100' : 'text-emerald-600'}">${isBActive ? '빗금 ON' : '보기'}</span>
                            </button>
                        </div>
                    `;
                });

                proofInfo.innerHTML = `
                    <div class="bg-emerald-50/90 p-3 rounded-xl border border-emerald-200 space-y-1.5">
                        <div class="font-bold text-xs text-emerald-900 flex items-center justify-between mb-1">
                            <span class="flex items-center gap-1.5">
                                <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                이등변삼각형 선택
                            </span>
                            <span class="text-[10px] text-emerald-700 font-normal">(클릭 시 빗금)</span>
                        </div>
                        ${triButtonsHTML}
                        <p class="text-[11px] text-slate-500 pt-1 border-t border-emerald-200/60">
                            * OA = OB = O${userPoints.map(p => p.id).join(' = O')} (반지름)
                        </p>
                    </div>
                `;
                proofInfo.classList.remove('hidden');
            } else {
                proofBadge.classList.add('hidden');
                proofInfo.classList.add('hidden');
            }

            // 점 O 및 A, B 라벨 표시
            drawPoint(cx, cy, '#334155'); 
            drawLabelOutside('O', {x: cx, y: cy+10}, {x: cx, y: cy-10}, '#334155');
            drawPoint(pA.x, pA.y, '#10b981'); drawLabelOutside('A', pA, {x: cx, y: cy}, '#10b981');
            drawPoint(pB.x, pB.y, '#10b981'); drawLabelOutside('B', pB, {x: cx, y: cy}, '#10b981');
        }

        function drawPoint(x, y, color, r = 7) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill(); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.stroke(); }
        function drawLine(x1, y1, x2, y2, color, w) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.stroke(); }
        function drawText(t, x, y, c) { ctx.font = 'bold 18px Pretendard, sans-serif'; ctx.fillStyle = c; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineWidth = 4; ctx.strokeStyle = '#ffffff'; ctx.strokeText(t, x, y); ctx.fillText(t, x, y); }
        function drawLabelOutside(t, pt, ref, c) { const d = Math.sqrt((pt.x-ref.x)**2 + (pt.y-ref.y)**2); drawText(t, pt.x + (pt.x-ref.x)/d*35, pt.y + (pt.y-ref.y)/d*35, c); }
        
        resizeCanvas();
    </script>
</body>
</html>
