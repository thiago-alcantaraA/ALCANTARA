<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>이차방정식 토너먼트 배틀</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        body {
            font-family: 'Jua', sans-serif;
            background-color: #020617;
            color: #f1f5f9;
            overflow: hidden;
            margin: 0;
            user-select: none;
            touch-action: none;
        }
        canvas {
            display: block;
        }
        .screen {
            display: none;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        .screen.active {
            display: flex;
        }
        input::placeholder {
            color: #475569;
        }
        .match-card {
            background: #0f172a;
            border: 2px solid #1e293b;
            border-radius: 1rem;
            padding: 1rem;
            position: relative;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }
        .match-card.final {
            border-color: #eab308;
            box-shadow: 0 0 20px rgba(234, 179, 8, 0.2);
        }
        .winner-bg {
            background-color: rgba(30, 64, 175, 0.2);
            color: #60a5fa;
        }
        .winner-bg-red {
            background-color: rgba(153, 27, 27, 0.2);
            color: #f87171;
        }
        .error-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            padding: 1rem;
            border-radius: 0.5rem;
            color: #f87171;
            margin-top: 1rem;
            font-size: 0.875rem;
            max-width: 80%;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div id="app">
    <!-- 로딩 및 오류 화면 -->
    <div id="view-loading" class="screen active flex-col items-center justify-center bg-slate-950">
        <div id="loading-spinner" class="text-center">
            <div class="inline-block w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-xl font-bold">서버 연결 중...</p>
            <p id="loading-hint" class="text-slate-500 text-sm mt-4 opacity-0 transition-opacity duration-1000">연결이 너무 오래 걸린다면 페이지를 새로고침 해주세요.</p>
        </div>
        <div id="error-display" class="hidden flex-col items-center text-center px-6">
            <span class="text-5xl mb-4">⚠️</span>
            <p class="text-xl font-bold text-red-500 mb-2">연결 오류가 발생했습니다</p>
            <p class="text-slate-400 mb-4">설정 데이터를 불러올 수 없거나 네트워크 상태가 불안정합니다.</p>
            <div id="error-detail" class="error-box font-mono"></div>
            <button onclick="location.reload()" class="mt-6 bg-slate-800 hover:bg-slate-700 px-6 py-2 rounded-lg font-bold">다시 시도</button>
        </div>
    </div>

    <!-- 초기 설정 화면 -->
    <div id="view-setup" class="screen flex-col items-center justify-center p-6 bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 overflow-y-auto">
        <div class="bg-slate-900 p-8 md:p-12 rounded-[40px] border-2 border-slate-800 w-full max-w-2xl shadow-2xl">
            <h1 class="text-3xl md:text-4xl font-black mb-8 text-center flex items-center justify-center gap-4">
                <span class="text-blue-500">👥</span> 참가 팀 이름 설정
            </h1>
            <div id="team-inputs" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
                <!-- 자바스크립트에서 입력창 생성 -->
            </div>
            <button id="btn-create-tournament" class="w-full bg-blue-600 hover:bg-blue-700 py-5 rounded-2xl text-2xl font-black transition-all flex items-center justify-center gap-2 shadow-xl">
                무작위 대진표 생성 및 시작 ➔
            </button>
            <p class="text-center mt-6 text-slate-500 text-sm">대진표 생성 시 결승 직행 팀이 무작위로 선정됩니다.</p>
        </div>
    </div>

    <!-- 대진표 화면 -->
    <div id="view-bracket" class="screen flex-col p-4 md:p-8 overflow-y-auto bg-slate-950">
        <div class="max-w-5xl mx-auto w-full">
            <div class="flex flex-col md:flex-row justify-between items-center mb-10 gap-4">
                <h1 class="text-3xl md:text-4xl font-bold flex items-center gap-3">
                    <span class="text-yellow-400">🏆</span> 이차방정식 토너먼트
                </h1>
                <button id="btn-reset" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 px-5 py-2.5 rounded-xl transition shadow-lg">
                    🔄 초기화 및 재설정
                </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 items-start">
                <div class="space-y-8">
                    <h2 class="text-center text-slate-400 font-bold text-sm border-b border-slate-800 pb-2">예선 라운드</h2>
                    <div id="bracket-round-1" class="space-y-6"></div>
                </div>

                <div class="space-y-8 md:pt-24">
                    <h2 class="text-center text-slate-400 font-bold text-sm border-b border-slate-800 pb-2">준결승전</h2>
                    <div id="bracket-round-2" class="space-y-32"></div>
                    <div class="text-center text-xs text-slate-500 italic px-4">
                        예선 3경기 승리 팀은<br><span class="text-yellow-500/80 font-bold">결승전으로 직행</span>합니다.
                    </div>
                </div>

                <div class="space-y-8">
                    <h2 class="text-center text-yellow-400 font-bold text-sm border-b border-yellow-900 pb-2">최종 결승</h2>
                    <div id="bracket-round-3"></div>
                    <div id="champion-display" class="hidden mt-8 p-8 bg-yellow-500/20 border-2 border-yellow-500 rounded-3xl text-center animate-bounce shadow-2xl">
                        <span class="text-5xl block mb-2">🥇</span>
                        <p class="text-xs font-bold text-yellow-500 uppercase">최종 우승팀</p>
                        <p id="champion-name" class="text-3xl font-black text-white mt-1"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 게임 화면 -->
    <div id="view-game" class="screen flex-col overflow-hidden bg-slate-950">
        <canvas id="gameCanvas"></canvas>
        
        <div class="absolute top-0 left-0 w-full p-4 md:p-6 flex justify-between items-start pointer-events-none z-10">
            <div class="bg-blue-600/90 px-4 py-2 md:px-6 md:py-3 rounded-2xl border-2 border-white/50 text-white shadow-2xl backdrop-blur-sm">
                <p class="text-[10px] font-bold opacity-70">플레이어 1</p>
                <p id="hud-p1-name" class="text-lg md:text-xl font-bold truncate max-w-[120px]">팀 A</p>
                <p id="hud-p1-score" class="text-2xl md:text-3xl font-black text-yellow-300">0</p>
            </div>
            <div class="text-center">
                <div id="hud-timer" class="bg-slate-900/90 px-6 py-2 md:px-10 md:py-3 rounded-full border-2 border-yellow-500 text-3xl md:text-4xl font-black text-white shadow-2xl backdrop-blur-sm">
                    45
                </div>
            </div>
            <div class="bg-red-600/90 px-4 py-2 md:px-6 md:py-3 rounded-2xl border-2 border-white/50 text-white shadow-2xl backdrop-blur-sm text-right">
                <p class="text-[10px] font-bold opacity-70">플레이어 2</p>
                <p id="hud-p2-name" class="text-lg md:text-xl font-bold truncate max-w-[120px]">팀 B</p>
                <p id="hud-p2-score" class="text-2xl md:text-3xl font-black text-yellow-300">0</p>
            </div>
        </div>

        <div id="game-ready-overlay" class="absolute inset-0 bg-black/70 flex items-center justify-center backdrop-blur-md z-40">
            <div class="text-center">
                <h2 class="text-5xl md:text-6xl font-black text-white mb-10">배틀 준비!</h2>
                <button id="btn-game-start" class="bg-emerald-500 hover:bg-emerald-600 text-white px-12 py-4 md:px-16 md:py-6 rounded-full text-3xl md:text-4xl font-black shadow-2xl transition-all hover:scale-110 active:scale-95 pointer-events-auto">
                    경기 시작
                </button>
            </div>
        </div>

        <div id="game-end-overlay" class="hidden absolute inset-0 bg-black/90 flex items-center justify-center backdrop-blur-xl z-50">
            <div class="text-center p-8 md:p-12 bg-slate-900 rounded-[40px] border-2 border-slate-700 shadow-2xl max-w-lg w-full m-4">
                <h2 class="text-5xl md:text-6xl font-black text-yellow-500 mb-8 italic">FINISH!</h2>
                <div class="flex gap-8 md:gap-16 mb-12 justify-center items-center">
                    <div id="end-p1-box" class="text-center">
                        <p id="end-p1-score" class="text-5xl md:text-6xl font-black text-white">0</p>
                        <p id="end-p1-name" class="font-bold text-sm mt-2">플레이어 1</p>
                    </div>
                    <div class="text-4xl font-bold text-slate-700">:</div>
                    <div id="end-p2-box" class="text-center">
                        <p id="end-p2-score" class="text-5xl md:text-6xl font-black text-white">0</p>
                        <p id="end-p2-name" class="font-bold text-sm mt-2">플레이어 2</p>
                    </div>
                </div>
                <button id="btn-back-to-bracket" class="w-full bg-white text-slate-950 px-10 py-5 rounded-2xl text-2xl font-black hover:bg-slate-200 transition-colors pointer-events-auto">
                    승패 기록 후 대진표로
                </button>
            </div>
        </div>
    </div>
</div>

<script type="module">
    // --- 파이어베이스 임포트 ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // --- 앱 상태 관리 ---
    let user = null;
    let tournament = null;
    let currentMatchIdx = null;
    let teamNames = ['팀 A', '팀 B', '팀 C', '팀 D', '팀 E', '팀 F'];
    let gameData = {
        scores: [0, 0],
        timeLeft: 45,
        gameState: 'ready',
        baskets: [],
        numbers: [],
        touches: {},
        lastSpawn: 0,
        animId: null
    };

    const showError = (msg) => {
        document.getElementById('loading-spinner').classList.add('hidden');
        document.getElementById('error-display').classList.remove('hidden');
        document.getElementById('error-detail').innerText = msg;
    };

    const showView = (viewId) => {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(`view-${viewId}`).classList.add('active');
    };

    // --- 초기 실행 ---
    const init = async () => {
        // 5초 후에도 연결 중이면 힌트 표시
        setTimeout(() => {
            const hint = document.getElementById('loading-hint');
            if (hint) hint.style.opacity = '1';
        }, 5000);

        let config;
        try {
            // 환경 변수 체크 (문자열인 경우 파싱, 객체인 경우 그대로 사용)
            if (typeof __firebase_config === 'undefined' || !__firebase_config) {
                throw new Error("설정 데이터를 찾을 수 없습니다. (환경 변수 누락)");
            }
            config = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config;
        } catch (e) {
            showError("환경 설정 오류: " + e.message);
            return;
        }

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'quadratic-tournament-html';
        
        try {
            const app = initializeApp(config);
            const auth = getAuth(app);
            const db = getFirestore(app);

            // 1. 인증 프로세스 (Rule 3 준수)
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }

            onAuthStateChanged(auth, (u) => {
                user = u;
                if (user) {
                    listenTournament(db, appId);
                }
            });

            // 설정 화면 입력창 생성
            const inputContainer = document.getElementById('team-inputs');
            if (inputContainer) {
                inputContainer.innerHTML = '';
                teamNames.forEach((name, i) => {
                    const div = document.createElement('div');
                    div.className = 'flex flex-col';
                    div.innerHTML = `
                        <label class="text-[10px] font-bold text-slate-500 mb-1 ml-1">참가 팀 ${i + 1}</label>
                        <input type="text" data-index="${i}" value="${name}" 
                            class="team-input bg-slate-950 border-2 border-slate-800 rounded-xl px-4 py-3 focus:border-blue-500 outline-none transition text-white font-bold">
                    `;
                    inputContainer.appendChild(div);
                });
            }

            // 이벤트 바인딩
            document.getElementById('btn-create-tournament')?.addEventListener('click', () => createTournament(db, appId));
            document.getElementById('btn-reset')?.addEventListener('click', () => showView('setup'));
            document.getElementById('btn-game-start')?.addEventListener('click', startGameEngine);
            document.getElementById('btn-back-to-bracket')?.addEventListener('click', () => recordMatchResult(db, appId));

        } catch (e) {
            showError("시스템 초기화 오류: " + e.message);
        }
    };

    // --- 데이터 실시간 감시 (오류 콜백 필수) ---
    const listenTournament = (db, appId) => {
        const tDoc = doc(db, 'artifacts', appId, 'public', 'data', 'tournament_state', 'main');
        onSnapshot(tDoc, (snap) => {
            if (snap.exists()) {
                tournament = snap.data();
                renderBracket(db, appId);
                showView('bracket');
            } else {
                showView('setup');
            }
        }, (err) => {
            showError("데이터 수신 오류: " + err.message + "\n(권한 문제이거나 경로가 잘못되었습니다.)");
        });
    };

    const createTournament = async (db, appId) => {
