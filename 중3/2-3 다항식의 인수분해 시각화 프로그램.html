<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다항식 인수분해 퍼즐</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .math-text {
            font-family: 'Times New Roman', serif;
            font-style: italic;
        }
        /* 지수(sup)가 잘리지 않도록 높이와 정렬 조절 */
        sup {
            font-size: 0.55em;
            vertical-align: super;
            line-height: 0;
            margin-left: 2px;
        }
        /* 드래그 가능한 조각 스타일 */
        .draggable-piece {
            cursor: grab;
            user-select: none;
            touch-action: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 1rem;
            box-shadow: 0 15px 25px -5px rgba(0, 0, 0, 0.15);
            position: absolute;
            z-index: 10;
            /* 메인 텍스트 폰트 크기 확대 */
            font-size: 2.8rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .draggable-piece:active {
            cursor: grabbing;
            z-index: 100;
            transform: scale(1.05);
        }
        /* 조각 내부의 작은 계산식 라벨 */
        .piece-label {
            font-size: 1rem;
            opacity: 0.8;
            font-weight: 500;
            position: absolute;
            top: 12px;
            pointer-events: none;
        }
        /* 점선 목표 영역 스타일 */
        .target-slot {
            border: 2px dashed #cbd5e1;
            background-color: #f8fafc;
            position: absolute;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font-size: 1.4rem;
            pointer-events: none;
        }
        /* 성공 시 효과 */
        .is-complete {
            border: 4px solid #f59e0b !important;
            box-shadow: 0 0 50px rgba(245, 158, 11, 0.6);
        }
        .drop-zone {
            position: relative;
            background-color: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 2.5rem;
            overflow: hidden;
        }
        /* 완성 후 나타나는 라벨 스타일 */
        .side-label {
            position: absolute;
            font-weight: bold;
            color: #334155;
            transition: opacity 0.5s ease;
            opacity: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }
        .side-label.show {
            opacity: 1;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center p-4 md:p-8">
    <div class="max-w-[1350px] w-full bg-white rounded-[3.5rem] shadow-2xl p-6 md:p-12">
        <h1 class="text-3xl md:text-4xl font-black text-center mb-10 text-slate-800 tracking-tight">인수분해 퍼즐 : 조각 맞추기</h1>
        
        <!-- 입력 영역 -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-10">
            <div class="text-center bg-rose-50/50 p-5 rounded-3xl border border-rose-100 shadow-sm">
                <label class="block text-[11px] font-black text-rose-500 mb-2 uppercase tracking-wider">가로 1 (a)</label>
                <input type="text" id="charA" value="x" class="w-full text-center text-3xl font-bold math-text bg-transparent border-b-2 border-rose-200 outline-none focus:border-rose-500 transition-all">
            </div>
            <div class="text-center bg-orange-50/50 p-5 rounded-3xl border border-orange-100 shadow-sm">
                <label class="block text-[11px] font-black text-orange-500 mb-2 uppercase tracking-wider">가로 2 (b)</label>
                <input type="text" id="charB" value="2" class="w-full text-center text-3xl font-bold math-text bg-transparent border-b-2 border-orange-200 outline-none focus:border-orange-500 transition-all">
            </div>
            <div class="text-center bg-emerald-50/50 p-5 rounded-3xl border border-emerald-100 shadow-sm">
                <label class="block text-[11px] font-black text-emerald-500 mb-2 uppercase tracking-wider">세로 1 (c)</label>
                <input type="text" id="charC" value="x" class="w-full text-center text-3xl font-bold math-text bg-transparent border-b-2 border-emerald-200 outline-none focus:border-emerald-500 transition-all">
            </div>
            <div class="text-center bg-purple-50/50 p-5 rounded-3xl border border-purple-100 shadow-sm">
                <label class="block text-[11px] font-black text-purple-500 mb-2 uppercase tracking-wider">세로 2 (d)</label>
                <input type="text" id="charD" value="2" class="w-full text-center text-3xl font-bold math-text bg-transparent border-b-2 border-purple-200 outline-none focus:border-purple-500 transition-all">
            </div>
        </div>

        <div class="flex flex-col lg:flex-row gap-10">
            <!-- 퍼즐판 영역 -->
            <div class="w-full lg:w-[68%] flex flex-col items-center">
                <div id="gameCanvas" class="drop-zone w-full h-[700px] shadow-inner bg-slate-50/30">
                    <!-- 점선 가이드 (우측 상단 고정) -->
                    <div id="targetOutline" class="absolute border-4 border-dashed border-slate-200 rounded-2xl transition-all duration-500" style="top: 80px; right: 80px;">
                        <!-- 가로 길이 라벨 -->
                        <div id="labelWidth" class="side-label math-text text-2xl -top-14 left-0 w-full border-b-2 border-slate-300 pb-1"></div>
                        <!-- 세로 길이 라벨 -->
                        <div id="labelHeight" class="side-label math-text text-2xl -left-24 top-0 h-full flex items-center justify-center" style="writing-mode: vertical-rl; transform: rotate(180deg);"></div>
                    </div>
                </div>
                <div class="mt-6 flex gap-3 text-sm font-bold text-slate-400 items-center">
                    <span class="text-xl">💡</span>
                    <span>조각들이 겹치지 않게 나열되었습니다. 알맞은 위치로 옮겨보세요!</span>
                </div>
            </div>

            <!-- 상태 및 결과 영역 -->
            <div class="w-full lg:w-[32%] flex flex-col gap-8">
                <div class="bg-slate-50 p-10 rounded-[3rem] border-2 border-slate-100 shadow-sm">
                    <p class="text-slate-400 text-[11px] font-black mb-8 uppercase tracking-widest text-center">수식 분석</p>
                    <div class="space-y-12">
                        <div>
                            <span class="text-xs text-slate-400 font-black block mb-3 uppercase tracking-tighter">인수분해</span>
                            <div id="baseEquation" class="math-text text-4xl font-bold text-slate-700 tracking-tight text-center"></div>
                        </div>
                        <div class="pt-10 border-t-2 border-slate-200">
                            <span class="text-xs text-slate-400 font-black block mb-3 uppercase tracking-tighter">전개 결과</span>
                            <div id="expandedResult" class="math-text text-3xl font-bold text-indigo-600 leading-tight text-center"></div>
                        </div>
                    </div>
                </div>

                <!-- 성공 메시지 -->
                <div id="winMessage" class="hidden animate-bounce p-10 bg-amber-100 rounded-[3rem] border-2 border-amber-200 text-center shadow-lg">
                    <p class="text-amber-600 font-black text-2xl mb-3">✨ 퍼즐 완성! ✨</p>
                    <p id="finalFormula" class="math-text text-amber-900 font-bold text-xl"></p>
                </div>

                <button id="resetPuzzle" class="w-full py-6 bg-slate-800 text-white rounded-[2rem] font-black text-xl hover:bg-slate-700 transition-all shadow-xl active:scale-95">
                    퍼즐 다시 섞기
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const inputs = ['charA', 'charB', 'charC', 'charD'];
            const gameCanvas = document.getElementById('gameCanvas');
            const targetOutline = document.getElementById('targetOutline');
            const winMessage = document.getElementById('winMessage');
            const labelWidth = document.getElementById('labelWidth');
            const labelHeight = document.getElementById('labelHeight');
            
            let slots = [];
            let isDragging = false;
            let currentPiece = null;
            let offset = { x: 0, y: 0 };

            function parseTerm(s) {
                s = s.trim();
                if (!s || s === '0') return { coeff: 0, variable: '', weight: 0 };
                const match = s.match(/^([-+]?\d*\.?\d*)(.*)$/);
                let coeffStr = match[1];
                let variable = match[2];
                let coeff = 1;
                if (coeffStr === '-') coeff = -1;
                else if (coeffStr === '+') coeff = 1;
                else if (coeffStr !== '') coeff = parseFloat(coeffStr);
                let weight = (variable.includes('x')) ? 2.8 : (coeff !== 0 ? Math.abs(coeff) : 0);
                return { coeff, variable, weight, raw: s };
            }

            function multiplyTerms(t1, t2) {
                const resCoeff = t1.coeff * t2.coeff;
                if (resCoeff === 0) return null;
                let varMap = {};
                let vars = (t1.variable + t2.variable).split('').sort();
                vars.forEach(v => { if (v.trim()) varMap[v] = (varMap[v] || 0) + 1; });
                let resVar = '';
                for (let v in varMap) resVar += v + (varMap[v] > 1 ? `<sup>${varMap[v]}</sup>` : '');
                const rawVarKey = Object.keys(varMap).sort().map(v => v + varMap[v]).join('');
                return { coeff: resCoeff, variable: resVar, rawVar: rawVarKey };
            }

            function formatTerm(coeff, variable, isFirst = false) {
                if (coeff === 0) return '';
                let s = '';
                if (coeff > 0 && !isFirst) s += ' + ';
                if (coeff < 0) s += isFirst ? '-' : ' - ';
                let absCoeff = Math.abs(coeff);
                if (absCoeff !== 1 || variable === '') s += absCoeff;
                s += variable;
                return s;
            }

            function initPuzzle() {
                const vals = inputs.map(id => document.getElementById(id).value);
                const terms = vals.map(parseTerm);

                document.querySelectorAll('.draggable-piece').forEach(p => p.remove());
                document.querySelectorAll('.target-slot:not(.side-label)').forEach(s => s.remove());
                winMessage.classList.add('hidden');
                targetOutline.classList.remove('is-complete');
                labelWidth.classList.remove('show');
                labelHeight.classList.remove('show');

                const baseSize = 75; 
                const w1 = terms[0].weight * baseSize;
                const w2 = terms[1].weight * baseSize;
                const h1 = terms[2].weight * baseSize;
                const h2 = terms[3].weight * baseSize;

                targetOutline.style.width = `${w1 + w2}px`;
                targetOutline.style.height = `${h1 + h2}px`;

                slots = [
                    { id: 'AC', x: 0, y: 0, w: w1, h: h1, term1: terms[0], term2: terms[2], color: 'bg-rose-400' },
                    { id: 'BC', x: w1, y: 0, w: w2, h: h1, term1: terms[1], term2: terms[2], color: 'bg-orange-400' },
                    { id: 'AD', x: 0, y: h1, w: w1, h: h2, term1: terms[0], term2: terms[3], color: 'bg-emerald-400' },
                    { id: 'BD', x: w1, y: h1, w: w2, h: h2, term1: terms[1], term2: terms[3], color: 'bg-purple-400' }
                ].filter(s => s.w > 0 && s.h > 0);

                document.getElementById('baseEquation').innerHTML = `(${vals[0]} + ${vals[1]})(${vals[2]} + ${vals[3]})`;
                
                const activeRes = slots.map(s => multiplyTerms(s.term1, s.term2)).filter(r => r !== null);
                const sumMap = {};
                const order = [];
                const varDisplayMap = {};
                activeRes.forEach(r => {
                    if (!(r.rawVar in sumMap)) { order.push(r.rawVar); varDisplayMap[r.rawVar] = r.variable; }
                    sumMap[r.rawVar] = (sumMap[r.rawVar] || 0) + r.coeff;
                });
                let expandedHtml = '';
                let first = true;
                order.forEach(key => {
                    if (sumMap[key] !== 0) {
                        expandedHtml += formatTerm(sumMap[key], varDisplayMap[key], first);
                        first = false;
                    }
                });
                document.getElementById('expandedResult').innerHTML = expandedHtml || '0';

                // 겹치지 않게 배치하기 위한 고정 시작 구역 설정
                const spawnZones = [
                    { x: 60, y: 60 },   // 왼쪽 위
                    { x: 60, y: 350 },  // 왼쪽 중간
                    { x: 320, y: 480 }, // 아래쪽 중간
                    { x: 60, y: 550 }   // 왼쪽 아래
                ];

                slots.forEach((slot, index) => {
                    const sDiv = document.createElement('div');
                    sDiv.className = 'target-slot math-text';
                    sDiv.style.width = `${slot.w}px`;
                    sDiv.style.height = `${slot.h}px`;
                    sDiv.style.left = `${slot.x}px`;
                    sDiv.style.top = `${slot.y}px`;
                    sDiv.innerText = `${slot.term1.raw}×${slot.term2.raw}`;
                    targetOutline.appendChild(sDiv);

                    const res = multiplyTerms(slot.term1, slot.term2);
                    if (res) {
                        const pDiv = document.createElement('div');
                        pDiv.className = `draggable-piece ${slot.color} math-text`;
                        pDiv.style.width = `${slot.w}px`;
                        pDiv.style.height = `${slot.h}px`;
                        
                        // 지수(2) 가림 방지를 위해 수식 박스 여백 최적화
                        pDiv.innerHTML = `<span class="piece-label">${slot.term1.raw}×${slot.term2.raw}</span>` + 
                                         `<div style="margin-top: 18px; padding: 0 10px;">${formatTerm(res.coeff, res.variable, true)}</div>`;
                        
                        // 구역별 고정 위치에 배치 (겹침 방지)
                        const zone = spawnZones[index % spawnZones.length];
                        pDiv.style.left = `${zone.x}px`;
                        pDiv.style.top = `${zone.y}px`;
                        
                        pDiv.dataset.slotId = slot.id;
                        pDiv.addEventListener('mousedown', startDrag);
                        pDiv.addEventListener('touchstart', startDrag, {passive: false});
                        gameCanvas.appendChild(pDiv);
                    }
                });
            }

            function startDrag(e) {
                isDragging = true;
                currentPiece = e.currentTarget;
                const rect = currentPiece.getBoundingClientRect();
                const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
                const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
                offset.x = clientX - rect.left;
                offset.y = clientY - rect.top;
                currentPiece.style.transition = 'none';
                currentPiece.style.opacity = '0.9';
                currentPiece.style.zIndex = '1000';
                currentPiece.style.boxShadow = '0 40px 60px -15px rgba(0, 0, 0, 0.4)';
            }

            function onDrag(e) {
                if (!isDragging || !currentPiece) return;
                e.preventDefault();
                const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
                const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
                const canvasRect = gameCanvas.getBoundingClientRect();
                let newX = clientX - canvasRect.left - offset.x;
                let newY = clientY - canvasRect.top - offset.y;
                newX = Math.max(0, Math.min(newX, canvasRect.width - currentPiece.offsetWidth));
                newY = Math.max(0, Math.min(newY, canvasRect.height - currentPiece.offsetHeight));
                currentPiece.style.left = `${newX}px`;
                currentPiece.style.top = `${newY}px`;
            }

            function endDrag() {
                if (!isDragging || !currentPiece) return;
                isDragging = false;
                const pieceRect = currentPiece.getBoundingClientRect();
                const targetRect = targetOutline.getBoundingClientRect();
                const slotId = currentPiece.dataset.slotId;
                const slot = slots.find(s => s.id === slotId);
                const relX = pieceRect.left - targetRect.left;
                const relY = pieceRect.top - targetRect.top;
                const threshold = 60; 

                if (Math.abs(relX - slot.x) < threshold && Math.abs(relY - slot.y) < threshold) {
                    currentPiece.style.transition = 'all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                    currentPiece.style.left = `${targetOutline.offsetLeft + slot.x}px`;
                    currentPiece.style.top = `${targetOutline.offsetTop + slot.y}px`;
                    currentPiece.dataset.snapped = "true";
                } else {
                    currentPiece.dataset.snapped = "false";
                }
                currentPiece.style.opacity = '1';
                currentPiece.style.zIndex = '10';
                currentPiece.style.boxShadow = '0 15px 25px -5px rgba(0, 0, 0, 0.15)';
                checkWin();
                currentPiece = null;
            }

            function checkWin() {
                const pieces = document.querySelectorAll('.draggable-piece');
                const allSnapped = Array.from(pieces).every(p => p.dataset.snapped === "true");
                
                if (allSnapped && pieces.length > 0) {
                    targetOutline.classList.add('is-complete');
                    winMessage.classList.remove('hidden');
                    
                    const vals = inputs.map(id => document.getElementById(id).value);
                    const exp = document.getElementById('expandedResult').innerText;

                    labelWidth.innerText = `${vals[0]} + ${vals[1]}`;
                    labelHeight.innerText = `${vals[2]} + ${vals[3]}`;
                    labelWidth.classList.add('show');
                    labelHeight.classList.add('show');
                    
                    const formulaText = `(${vals[0]} + ${vals[1]})(${vals[2]} + ${vals[3]}) = ${exp}`;
                    document.getElementById('finalFormula').innerHTML = formulaText;
                }
            }

            window.addEventListener('mousemove', onDrag);
            window.addEventListener('touchmove', onDrag, {passive: false});
            window.addEventListener('mouseup', endDrag);
            window.addEventListener('touchend', endDrag);
            inputs.forEach(id => document.getElementById(id).addEventListener('change', initPuzzle));
            document.getElementById('resetPuzzle').addEventListener('click', initPuzzle);
            initPuzzle();
            window.addEventListener('resize', initPuzzle);
        });
    </script>
</body>
</html>
