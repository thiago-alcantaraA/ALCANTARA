<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다항식 곱셈 시각화 도구 Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8fafc;
        }

        .rect-box {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            border: 2px solid rgba(255,255,255,0.2);
        }

        .math-text {
            font-family: 'Times New Roman', serif;
            font-style: italic;
        }

        sup {
            font-size: 0.55em;
            line-height: 0;
            vertical-align: 0.4em;
            margin-left: 1px;
            font-style: normal;
        }

        .grid-container {
            display: grid;
            transition: all 0.5s ease;
        }

        .model-layout {
            display: inline-grid;
            grid-template-columns: auto 1fr;
            grid-template-rows: auto 1fr;
            gap: 0.5rem;
        }

        .equation-step {
            transition: all 0.4s ease;
            opacity: 0;
            transform: translateY(10px);
        }

        .equation-step.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .input-focus-effect:focus {
            box-shadow: 0 4px 0 -1px #6366f1;
        }

        .square-symbol {
            display: inline-block;
            background: #e0e7ff;
            color: #4338ca;
            padding: 0 0.4rem;
            border-radius: 0.4rem;
            font-style: normal;
            border: 1px solid #c7d2fe;
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-100">
        <!-- 헤더 -->
        <div class="bg-indigo-600 p-8 text-center">
            <h1 class="text-3xl md:text-4xl font-black text-white mb-2">다항식 곱셈 시각화 도구</h1>
            <p class="text-indigo-100 opacity-80">사각형의 면적과 교환법칙($ab=ba$)을 시각적으로 체험하세요.</p>
        </div>

        <!-- 입력 섹션 -->
        <div class="p-6 md:p-10 border-b border-gray-100 bg-gray-50/50">
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-6">
                <div class="space-y-2 text-center">
                    <label class="text-xs font-bold text-red-500 uppercase tracking-widest">가로 항 1 (A)</label>
                    <input type="text" id="charA" value="a" placeholder="예: x" class="w-full text-2xl font-bold text-center p-3 rounded-xl border-2 border-red-100 bg-white input-focus-effect math-text outline-none">
                </div>
                <div class="space-y-2 text-center">
                    <label class="text-xs font-bold text-orange-500 uppercase tracking-widest">가로 항 2 (B)</label>
                    <input type="text" id="charB" value="0" placeholder="예: a" class="w-full text-2xl font-bold text-center p-3 rounded-xl border-2 border-orange-100 bg-white input-focus-effect math-text outline-none">
                </div>
                <div class="space-y-2 text-center">
                    <label class="text-xs font-bold text-emerald-500 uppercase tracking-widest">세로 항 1 (C)</label>
                    <input type="text" id="charC" value="b" placeholder="예: x" class="w-full text-2xl font-bold text-center p-3 rounded-xl border-2 border-emerald-100 bg-white input-focus-effect math-text outline-none">
                </div>
                <div class="space-y-2 text-center">
                    <label class="text-xs font-bold text-purple-500 uppercase tracking-widest">세로 항 2 (D)</label>
                    <input type="text" id="charD" value="0" placeholder="예: b" class="w-full text-2xl font-bold text-center p-3 rounded-xl border-2 border-purple-100 bg-white input-focus-effect math-text outline-none">
                </div>
            </div>
        </div>

        <!-- 메인 콘텐츠 영역 -->
        <div class="flex flex-col lg:flex-row p-6 md:p-10 gap-10">
            
            <!-- 왼쪽: 시각화 모델 -->
            <div class="w-full lg:w-1/2 flex flex-col items-center">
                <div class="model-layout w-full max-w-[400px]">
                    <div></div>
                    <div id="topLabelRow" class="grid items-end pb-2">
                        <div id="labA" class="text-center font-bold text-red-600 math-text text-2xl"></div>
                        <div id="labB" class="text-center font-bold text-orange-600 math-text text-2xl border-l-2 border-gray-200"></div>
                    </div>
                    <div id="leftLabelCol" class="grid items-stretch pr-2">
                        <div id="labC" class="flex items-center justify-end font-bold text-emerald-600 math-text text-2xl"></div>
                        <div id="labD" class="flex items-center justify-end font-bold text-purple-600 math-text text-2xl border-t-2 border-gray-200"></div>
                    </div>
                    <div class="aspect-square bg-gray-100 rounded-2xl overflow-hidden border-4 border-gray-200 shadow-inner">
                        <div id="rectGrid" class="grid-container w-full h-full">
                            <div id="rectAC" class="rect-box bg-red-400 text-xl md:text-3xl"><span></span></div>
                            <div id="rectBC" class="rect-box bg-orange-400 text-xl md:text-3xl"><span></span></div>
                            <div id="rectAD" class="rect-box bg-emerald-400 text-xl md:text-3xl"><span></span></div>
                            <div id="rectBD" class="rect-box bg-purple-400 text-xl md:text-3xl"><span></span></div>
                        </div>
                    </div>
                </div>
                <div class="mt-8 p-4 bg-blue-50 rounded-2xl border border-blue-100 text-center w-full max-w-[400px]">
                    <p class="text-blue-800 text-sm font-bold">💡 시각화 안내</p>
                    <p class="text-blue-600 text-xs mt-1">입력된 각 항이 사각형의 가로와 세로 길이가 됩니다.</p>
                </div>
            </div>

            <!-- 오른쪽: 수식 전개 -->
            <div class="w-full lg:w-1/2 flex flex-col">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-bold text-gray-700">전개 과정</h3>
                    <button id="subToggle" class="px-4 py-2 bg-white border-2 border-indigo-100 text-indigo-600 rounded-xl text-sm font-bold hover:bg-indigo-50 transition-colors shadow-sm">
                        치환 모드 (□) ON/OFF
                    </button>
                </div>

                <div class="space-y-8 bg-slate-50 p-6 md:p-8 rounded-3xl border border-gray-100 min-h-[350px] flex flex-col justify-center text-center lg:text-left">
                    <!-- 기본 수식 -->
                    <div class="math-text text-3xl md:text-4xl text-gray-800 font-bold flex items-center justify-center lg:justify-start flex-wrap gap-2">
                        <span id="baseEquation"></span>
                        <span id="subLegend" class="hidden text-base font-normal bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full not-italic">
                            (□ = <span id="subTarget"></span>)
                        </span>
                    </div>

                    <!-- 1단계: 분배법칙 -->
                    <div id="step1Row" class="equation-step flex items-start justify-center lg:justify-start gap-4">
                        <span class="text-gray-400 text-3xl">=</span>
                        <div id="step1Content" class="math-text text-2xl md:text-3xl text-indigo-600 font-semibold leading-relaxed"></div>
                    </div>

                    <!-- 2단계: 곱셈 결과 -->
                    <div id="step2Row" class="equation-step flex items-start justify-center lg:justify-start gap-4 border-t border-gray-200 pt-6">
                        <span class="text-gray-400 text-3xl">=</span>
                        <div id="step2Content" class="math-text text-2xl md:text-3xl text-gray-700 font-semibold flex flex-wrap gap-x-4"></div>
                    </div>

                    <!-- 3단계: 최종 정리 -->
                    <div id="step3Row" class="equation-step flex items-center justify-center lg:justify-start gap-4 bg-indigo-600 p-6 rounded-2xl shadow-lg shadow-indigo-200">
                        <span class="text-white text-3xl font-black">∴</span>
                        <div id="step3Content" class="math-text text-3xl md:text-4xl text-white font-black tracking-tight"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = ['charA', 'charB', 'charC', 'charD'];
            let subMode = false;

            const subToggle = document.getElementById('subToggle');
            subToggle.addEventListener('click', () => {
                subMode = !subMode;
                subToggle.classList.toggle('bg-indigo-600', subMode);
                subToggle.classList.toggle('text-white', subMode);
                update();
            });

            function parseTerm(s) {
                s = s.trim().replace(/\s+/g, '');
                if (!s || s === '0') return { coeff: 0, vars: {} };
                
                const match = s.match(/^([-+]?\d*\.?\d*)(.*)$/);
                let coeffStr = match[1];
                let varStr = match[2];

                let coeff = 1;
                if (coeffStr === '-') coeff = -1;
                else if (coeffStr === '+') coeff = 1;
                else if (coeffStr !== '') coeff = parseFloat(coeffStr);

                const vars = {};
                if (varStr) {
                    const tokens = varStr.match(/[a-z][0-9]*/g) || [varStr];
                    tokens.forEach(t => {
                        const vMatch = t.match(/([a-z])([0-9]*)/);
                        if (vMatch) {
                            const vName = vMatch[1];
                            const vExp = vMatch[2] ? parseInt(vMatch[2]) : 1;
                            vars[vName] = (vars[vName] || 0) + vExp;
                        }
                    });
                }
                return { coeff, vars };
            }

            function getVarStr(vars) {
                const sorted = Object.keys(vars).sort();
                return sorted.map(v => v + (vars[v] > 1 ? `<sup>${vars[v]}</sup>` : "")).join("");
            }

            function multiply(t1Raw, t2Raw) {
                const t1 = parseTerm(t1Raw);
                const t2 = parseTerm(t2Raw);
                const resCoeff = t1.coeff * t2.coeff;
                
                if (resCoeff === 0) return null;

                const stdVars = { ...t1.vars };
                for (let v in t2.vars) {
                    stdVars[v] = (stdVars[v] || 0) + t2.vars[v];
                }

                let rawVarStr = "";
                const v1Keys = Object.keys(t1.vars);
                const v2Keys = Object.keys(t2.vars);
                
                if (v1Keys.length === 1 && v2Keys.length === 1 && v1Keys[0] === v2Keys[0]) {
                    const vName = v1Keys[0];
                    const totalExp = t1.vars[vName] + t2.vars[vName];
                    rawVarStr = vName + `<sup>${totalExp}</sup>`;
                } else {
                    rawVarStr = getVarStr(t1.vars) + getVarStr(t2.vars);
                }

                return { coeff: resCoeff, vars: stdVars, rawVar: rawVarStr };
            }

            function formatTerm(term, isFirst = false, useRaw = false) {
                if (!term || term.coeff === 0) return "";
                let s = "";
                
                if (term.coeff > 0 && !isFirst) s += " + ";
                if (term.coeff < 0) s += isFirst ? "-" : " - ";
                
                const absCoeff = Math.abs(term.coeff);
                const varPart = useRaw ? term.rawVar : getVarStr(term.vars);
                const hasVars = varPart.length > 0;
                
                if (absCoeff !== 1 || !hasVars) s += absCoeff;
                s += varPart;

                return s;
            }

            function update() {
                const v = {
                    a: document.getElementById('charA').value,
                    b: document.getElementById('charB').value,
                    c: document.getElementById('charC').value,
                    d: document.getElementById('charD').value
                };

                const p = {
                    a: parseTerm(v.a), b: parseTerm(v.b),
                    c: parseTerm(v.c), d: parseTerm(v.d)
                };

                // 그리드 비율 조정 (0인 항은 숨김)
                const colStyle = `${p.a.coeff === 0 ? '0' : '1'}fr ${p.b.coeff === 0 ? '0' : '1'}fr`;
                const rowStyle = `${p.c.coeff === 0 ? '0' : '1'}fr ${p.d.coeff === 0 ? '0' : '1'}fr`;
                document.getElementById('rectGrid').style.gridTemplateColumns = colStyle;
                document.getElementById('rectGrid').style.gridTemplateRows = rowStyle;
                document.getElementById('topLabelRow').style.gridTemplateColumns = colStyle;
                document.getElementById('leftLabelCol').style.gridTemplateRows = rowStyle;

                document.getElementById('labA').innerText = p.a.coeff !== 0 ? v.a : "";
                document.getElementById('labB').innerText = p.b.coeff !== 0 ? v.b : "";
                document.getElementById('labC').innerText = p.c.coeff !== 0 ? v.c : "";
                document.getElementById('labD').innerText = p.d.coeff !== 0 ? v.d : "";

                const rectConfigs = [
                    { id: 'AC', t1: v.a, t2: v.c },
                    { id: 'BC', t1: v.b, t2: v.c },
                    { id: 'AD', t1: v.a, t2: v.d },
                    { id: 'BD', t1: v.b, t2: v.d }
                ];

                const activeResults = [];
                rectConfigs.forEach(r => {
                    const res = multiply(r.t1, r.t2);
                    const el = document.querySelector(`#rect${r.id} span`);
                    if (res) {
                        el.innerHTML = formatTerm(res, true, true);
                        activeResults.push(res);
                    } else {
                        el.innerHTML = "";
                    }
                });

                const formatGroup = (term1, term2, raw1, raw2) => {
                    if (term1.coeff !== 0 && term2.coeff !== 0) return `(${raw1} + ${raw2})`;
                    if (term1.coeff !== 0) return raw1;
                    if (term2.coeff !== 0) return raw2;
                    return '0';
                };

                const groupAB = formatGroup(p.a, p.b, v.a, v.b);
                const groupCD = formatGroup(p.c, p.d, v.c, v.d);
                const displayCD = subMode ? `<span class="square-symbol">□</span>` : groupCD;

                // 수식 표시
                const isBothMonomial = (p.a.coeff !== 0 && p.b.coeff === 0 || p.a.coeff === 0 && p.b.coeff !== 0) && (p.c.coeff !== 0 && p.d.coeff === 0 || p.c.coeff === 0 && p.d.coeff !== 0);
                const equationHtml = isBothMonomial ? `${groupAB} × ${displayCD}` : `${groupAB}${displayCD}`;
                document.getElementById('baseEquation').innerHTML = equationHtml;
                
                const subLegend = document.getElementById('subLegend');
                if (subMode) {
                    subLegend.classList.remove('hidden');
                    document.getElementById('subTarget').innerText = groupCD;
                } else {
                    subLegend.classList.add('hidden');
                }

                // 1단계
                const step1 = document.getElementById('step1Content');
                let step1Html = "";
                if (p.a.coeff !== 0) step1Html += `${v.a}${displayCD}`;
                if (p.a.coeff !== 0 && p.b.coeff !== 0) step1Html += " + ";
                if (p.b.coeff !== 0) step1Html += `${v.b}${displayCD}`;
                step1.innerHTML = step1Html || "0";
                
                const isComplex = (p.a.coeff !== 0 && p.b.coeff !== 0) || (p.c.coeff !== 0 && p.d.coeff !== 0);
                document.getElementById('step1Row').style.display = isComplex ? 'flex' : 'none';
                if (isComplex) setTimeout(() => document.getElementById('step1Row').classList.add('visible'), 50);

                // 2단계
                const step2 = document.getElementById('step2Content');
                step2.innerHTML = "";
                activeResults.forEach((res, idx) => {
                    const span = document.createElement('span');
                    span.innerHTML = formatTerm(res, idx === 0, true);
                    step2.appendChild(span);
                });
                if (activeResults.length > 0) setTimeout(() => document.getElementById('step2Row').classList.add('visible'), 150);
                else document.getElementById('step2Row').classList.remove('visible');

                // 3단계 (동류항 정리)
                const allVars = [...Object.keys(p.a.vars), ...Object.keys(p.b.vars), ...Object.keys(p.c.vars), ...Object.keys(p.d.vars)];
                const mainVar = allVars.includes('x') ? 'x' : (allVars[0] || '');
                const expGroups = {};
                activeResults.forEach(res => {
                    const exp = res.vars[mainVar] || 0;
                    const otherVars = { ...res.vars };
                    delete otherVars[mainVar];
                    if (!expGroups[exp]) expGroups[exp] = [];
                    expGroups[exp].push({ coeff: res.coeff, otherVars });
                });

                const sortedExponents = Object.keys(expGroups).map(Number).sort((a, b) => b - a);
                let finalHtml = "";
                let isOverallFirst = true;

                sortedExponents.forEach(exp => {
                    const components = expGroups[exp];
                    let numberSum = 0;
                    
                    // 같은 변수 구성(otherVar)을 가진 항들의 계수를 합산하여 동류항 처리
                    const consolidatedVariableCoeffs = {}; 
                    components.forEach(comp => {
                        const varPart = getVarStr(comp.otherVars);
                        if (varPart === "") {
                            numberSum += comp.coeff;
                        } else {
                            consolidatedVariableCoeffs[varPart] = (consolidatedVariableCoeffs[varPart] || 0) + comp.coeff;
                        }
                    });

                    let innerParts = [];
                    if (numberSum !== 0) innerParts.push(numberSum.toString());
                    
                    // 합산된 변수 계수들을 문자열로 변환
                    Object.keys(consolidatedVariableCoeffs).sort().forEach(varPart => {
                        const coeff = consolidatedVariableCoeffs[varPart];
                        if (coeff === 0) return;
                        let part = (coeff === 1) ? varPart : (coeff === -1 ? "-" + varPart : coeff + varPart);
                        innerParts.push(part);
                    });

                    if (innerParts.length === 0) return;
                    if (!isOverallFirst) finalHtml += " + ";

                    let termHtml = "";
                    const mainVarPart = exp === 0 ? "" : (mainVar + (exp > 1 ? `<sup>${exp}</sup>` : ""));
                    if (innerParts.length > 1) {
                        let innerJoined = innerParts[0];
                        for(let i=1; i<innerParts.length; i++) {
                            const p = innerParts[i];
                            innerJoined += p.startsWith('-') ? ` - ${p.substring(1)}` : ` + ${p}`;
                        }
                        termHtml = `(${innerJoined})${mainVarPart}`;
                    } else {
                        const single = innerParts[0];
                        if (mainVarPart === "") termHtml = single;
                        else if (single === "1") termHtml = mainVarPart;
                        else if (single === "-1") termHtml = "-" + mainVarPart;
                        else termHtml = single + mainVarPart;
                    }
                    finalHtml += termHtml;
                    isOverallFirst = false;
                });

                finalHtml = finalHtml.replace(/\+ -/g, "- ");
                const step3 = document.getElementById('step3Content');
                step3.innerHTML = finalHtml || "0";
                if (finalHtml) setTimeout(() => document.getElementById('step3Row').classList.add('visible'), 250);
                else document.getElementById('step3Row').classList.remove('visible');
            }

            inputs.forEach(id => document.getElementById(id).addEventListener('input', update));
            update();
        });
    </script>
</body>
</html>
