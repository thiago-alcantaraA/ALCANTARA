<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다항식 곱셈 시각화 도구</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .rect-box {
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 3rem; /* 사각형 내부 문자: 매우 크게 */
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.2);
        }
        .math-text {
            font-family: 'Times New Roman', serif;
            font-style: italic;
        }
        sup {
            font-size: 0.6em;
            vertical-align: super;
            line-height: 0;
        }
        /* 입력창 포커스 효과 */
        input:focus {
            outline: none;
            border-bottom-width: 6px;
        }
        /* 홈페이지 본문 폭이 좁아도 옆으로 유지하기 위한 설정 */
        .main-container {
            display: flex;
            flex-direction: column;
        }
        @media (min-width: 640px) { /* 태블릿 이상의 폭에서 가로 배치 강제 */
            .main-container {
                flex-direction: row;
                align-items: stretch;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center p-2 md:p-6">
    <div class="max-w-[1400px] w-full bg-white rounded-[2rem] shadow-2xl p-6 md:p-12 mt-2">
        <!-- 제목 -->
        <h1 class="text-3xl md:text-5xl font-black text-center mb-12 text-gray-800">다항식 곱셈: 동류항 계산 모드</h1>
        
        <!-- 입력 영역 (이미지 스타일 적용) -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-16 px-4">
            <div class="text-center">
                <label class="block text-sm font-bold text-red-500 mb-2">가로 항 1</label>
                <input type="text" id="charA" value="a" maxlength="8" class="w-full border-b-4 border-red-200 p-2 text-center text-4xl font-bold math-text bg-transparent transition-all">
            </div>
            <div class="text-center">
                <label class="block text-sm font-bold text-orange-500 mb-2">가로 항 2</label>
                <input type="text" id="charB" value="b" maxlength="8" class="w-full border-b-4 border-orange-200 p-2 text-center text-4xl font-bold math-text bg-transparent transition-all">
            </div>
            <div class="text-center">
                <label class="block text-sm font-bold text-green-500 mb-2">세로 항 1</label>
                <input type="text" id="charC" value="c" maxlength="8" class="w-full border-b-4 border-green-200 p-2 text-center text-4xl font-bold math-text bg-transparent transition-all">
            </div>
            <div class="text-center">
                <label class="block text-sm font-bold text-purple-500 mb-2">세로 항 2</label>
                <input type="text" id="charD" value="d" maxlength="8" class="w-full border-b-4 border-purple-200 p-2 text-center text-4xl font-bold math-text bg-transparent transition-all">
            </div>
        </div>

        <!-- 메인 콘텐츠: 좌(사각형) 우(수식) -->
        <div class="main-container gap-12 lg:gap-20">
            
            <!-- 왼쪽: 사각형 모델 (폭 조절) -->
            <div class="w-full sm:w-[45%] flex flex-col items-center justify-center py-6">
                <div class="relative inline-flex flex-col items-center">
                    <!-- 가로 라벨 -->
                    <div class="flex w-80 md:w-96 mb-4 border-b-4 border-gray-300 pb-2">
                        <div id="labA" class="w-1/2 text-center font-bold text-red-600 math-text text-4xl border-r-2 border-gray-100"></div>
                        <div id="labB" class="w-1/2 text-center font-bold text-orange-600 math-text text-4xl"></div>
                    </div>

                    <div class="flex items-center">
                        <!-- 세로 라벨 -->
                        <div class="flex flex-col h-80 md:h-96 mr-4 border-r-4 border-gray-300 pr-2">
                            <div id="labC" class="h-1/2 flex items-center justify-end font-bold text-green-600 math-text text-4xl border-b-2 border-gray-100 pr-2"></div>
                            <div id="labD" class="h-1/2 flex items-center justify-end font-bold text-purple-600 math-text text-4xl pr-2"></div>
                        </div>

                        <!-- 사각형 박스 -->
                        <div class="relative w-80 h-80 md:w-96 md:h-96 border-4 border-gray-200 rounded-2xl overflow-hidden shadow-xl bg-gray-50">
                            <div class="grid grid-cols-2 grid-rows-2 w-full h-full">
                                <div id="rectAC" class="rect-box bg-red-400"></div>
                                <div id="rectBC" class="rect-box bg-orange-400"></div>
                                <div id="rectAD" class="rect-box bg-green-400"></div>
                                <div id="rectBD" class="rect-box bg-purple-400"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 오른쪽: 수식 전개 (글자 크기 제목 수준) -->
            <div class="w-full sm:w-[55%] bg-blue-50/50 p-8 md:p-12 rounded-[3rem] border-2 border-blue-100 flex flex-col justify-center shadow-inner">
                <div class="space-y-12">
                    <!-- 기본 식 -->
                    <div class="math-text text-4xl md:text-5xl text-gray-800 font-bold leading-tight">
                        (<span class="tA"></span> + <span class="tB"></span>)(<span class="tC"></span> + <span class="tD"></span>)
                    </div>

                    <!-- 1단계: 분배법칙 -->
                    <div class="flex items-center gap-6">
                        <span class="text-gray-300 text-5xl font-light">=</span>
                        <div id="step1" class="math-text text-4xl md:text-5xl font-bold text-blue-600 leading-tight"></div>
                    </div>
                    
                    <!-- 2단계: 전개 완료 -->
                    <div class="flex items-start gap-6 border-t-2 border-blue-100 pt-10">
                        <span class="text-gray-300 text-5xl font-light">=</span>
                        <div id="expandedResult" class="math-text text-4xl md:text-5xl font-bold tracking-tight flex flex-wrap gap-x-6 gap-y-4">
                            <!-- JS 입력 -->
                        </div>
                    </div>

                    <!-- 3단계: 동류항 정리 (최종) -->
                    <div id="simplifiedSection" class="hidden flex items-center gap-8 mt-4 text-5xl md:text-7xl text-indigo-700 border-t-4 border-indigo-200 pt-8">
                        <span class="text-gray-400 text-4xl font-bold">∴</span>
                        <div id="finalResult" class="math-text font-black tracking-tighter leading-none">
                            <!-- JS 입력 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const inputs = ['charA', 'charB', 'charC', 'charD'];

            function parseTerm(s) {
                s = s.trim();
                if (!s) return { coeff: 0, variable: '' };
                const match = s.match(/^([-+]?\d*\.?\d*)(.*)$/);
                let coeffStr = match[1];
                let variable = match[2];

                let coeff = 1;
                if (coeffStr === '-') coeff = -1;
                else if (coeffStr === '+') coeff = 1;
                else if (coeffStr !== '') coeff = parseFloat(coeffStr);

                return { coeff, variable };
            }

            function multiplyTerms(t1Str, t2Str) {
                const t1 = parseTerm(t1Str);
                const t2 = parseTerm(t2Str);
                const resCoeff = t1.coeff * t2.coeff;
                
                let varMap = {};
                let vars = (t1.variable + t2.variable).split('').sort();
                vars.forEach(v => {
                    if (v.trim()) varMap[v] = (varMap[v] || 0) + 1;
                });

                let resVar = '';
                for (let v in varMap) {
                    resVar += v + (varMap[v] > 1 ? `<sup>${varMap[v]}</sup>` : '');
                }

                const rawVarKey = Object.keys(varMap).sort().map(v => v + varMap[v]).join('');
                return { coeff: resCoeff, variable: resVar, rawVar: rawVarKey };
            }

            function formatTerm(coeff, variable, isFirst = false) {
                if (coeff === 0) return '';
                let s = '';
                if (coeff > 0 && !isFirst) s += ' + ';
                if (coeff < 0) s += isFirst ? '-' : ' - ';
                let absCoeff = Math.abs(coeff);
                if (absCoeff !== 1 || variable === '') s += absCoeff;
                s += variable;
                return s;
            }

            function update() {
                const a = document.getElementById('charA').value || 'a';
                const b = document.getElementById('charB').value || 'b';
                const c = document.getElementById('charC').value || 'c';
                const d = document.getElementById('charD').value || 'd';

                const terms = [
                    { id: 'AC', color: 'text-red-500', val: multiplyTerms(a, c) },
                    { id: 'BC', color: 'text-orange-500', val: multiplyTerms(b, c) },
                    { id: 'AD', color: 'text-green-500', val: multiplyTerms(a, d) },
                    { id: 'BD', color: 'text-purple-500', val: multiplyTerms(b, d) }
                ];

                terms.forEach(t => {
                    const html = formatTerm(t.val.coeff, t.val.variable, true);
                    document.getElementById('rect' + t.id).innerHTML = html || '0';
                });

                document.getElementById('labA').innerText = a;
                document.getElementById('labB').innerText = b;
                document.getElementById('labC').innerText = c;
                document.getElementById('labD').innerText = d;
                document.querySelectorAll('.tA').forEach(el => el.innerText = a);
                document.querySelectorAll('.tB').forEach(el => el.innerText = b);
                document.querySelectorAll('.tC').forEach(el => el.innerText = c);
                document.querySelectorAll('.tD').forEach(el => el.innerText = d);

                document.getElementById('step1').innerHTML = `${a}(${c} + ${d}) + ${b}(${c} + ${d})`;

                const expandedEl = document.getElementById('expandedResult');
                expandedEl.innerHTML = '';
                terms.forEach((t, idx) => {
                    const span = document.createElement('span');
                    span.className = t.color;
                    span.innerHTML = formatTerm(t.val.coeff, t.val.variable, idx === 0);
                    expandedEl.appendChild(span);
                });

                const sumMap = {};
                const order = [];
                const varDisplayMap = {};

                terms.forEach(t => {
                    const key = t.val.rawVar;
                    if (!(key in sumMap)) {
                        order.push(key);
                        varDisplayMap[key] = t.val.variable;
                    }
                    sumMap[key] = (sumMap[key] || 0) + t.val.coeff;
                });

                let finalHtml = '';
                let first = true;
                let visibleTermsCount = 0;
                
                order.forEach(key => {
                    if (sumMap[key] !== 0) {
                        finalHtml += formatTerm(sumMap[key], varDisplayMap[key], first);
                        first = false;
                        visibleTermsCount++;
                    }
                });

                const simplifiedSection = document.getElementById('simplifiedSection');
                if (visibleTermsCount < 4 && finalHtml) {
                    simplifiedSection.classList.remove('hidden');
                    document.getElementById('finalResult').innerHTML = finalHtml;
                } else {
                    simplifiedSection.classList.add('hidden');
                }
            }

            inputs.forEach(id => {
                document.getElementById(id).addEventListener('input', update);
            });

            update();
        });
    </script>
</body>
</html>
