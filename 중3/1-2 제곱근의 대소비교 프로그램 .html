<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제곱근 시각화 탐구</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 및 Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            overflow: hidden; /* 스크롤 방지 */
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const App = () => {
            const [area1, setArea1] = useState(4);
            const [area2, setArea2] = useState(9);

            const side1 = Math.sqrt(area1);
            const side2 = Math.sqrt(area2);
            const scale = 80; 

            const onAreaInputChange = (setter, value) => {
                const num = parseFloat(value);
                if (!isNaN(num) && num >= 0) setter(num);
                else if (value === "") setter(0);
            };

            const onSideInputChange = (setter, value) => {
                const num = parseFloat(value);
                if (!isNaN(num) && num >= 0) setter(num * num);
                else if (value === "") setter(0);
            };

            return (
                <div className="flex items-center justify-center min-h-screen p-2 md:p-4">
                    {/* 전체 컨테이너 높이를 95vh로 설정하여 화면에 꽉 차게 배치 */}
                    <div className="max-w-7xl w-full bg-white rounded-[2rem] shadow-2xl overflow-hidden border border-slate-200 flex h-[95vh]">
                        
                        {/* 왼쪽 패널: 수치 입력 + 비교 결과 */}
                        <div className="w-full lg:w-[380px] p-6 bg-slate-50 border-r border-slate-200 flex flex-col justify-between overflow-y-auto shrink-0 z-20 text-left">
                            <section className="space-y-6">
                                <h2 className="text-sm font-black text-slate-400 uppercase tracking-[0.2em] border-b-2 pb-2">수치 입력 및 제어</h2>
                                
                                {/* 사각형 A */}
                                <div className="p-5 bg-blue-50 rounded-3xl border-2 border-blue-100 shadow-sm space-y-4">
                                    <div className="flex items-center gap-3">
                                        <div className="w-4 h-4 bg-blue-600 rounded-md"></div>
                                        <h3 className="font-extrabold text-blue-900 text-lg">정사각형 A</h3>
                                    </div>
                                    <div className="flex items-center justify-between gap-4">
                                        <span className="text-md font-black text-slate-700">변의 길이</span>
                                        <input type="number" step="0.1" value={side1 === 0 ? "" : Number(side1.toFixed(3))} onChange={(e) => onSideInputChange(setArea1, e.target.value)} className="w-24 p-2 bg-white border-2 border-blue-200 rounded-xl focus:outline-none font-mono text-blue-700 font-black text-lg text-center" />
                                    </div>
                                    <div className="flex items-center justify-between gap-4">
                                        <span className="text-md font-black text-slate-700">넓이 (a)</span>
                                        <input type="number" step="0.1" value={area1 === 0 ? "" : area1} onChange={(e) => onAreaInputChange(setArea1, e.target.value)} className="w-24 p-2 bg-white border-2 border-blue-200 rounded-xl focus:outline-none font-mono text-blue-800 font-black text-lg text-center" />
                                    </div>
                                </div>

                                {/* 사각형 B */}
                                <div className="p-5 bg-orange-50 rounded-3xl border-2 border-orange-100 shadow-sm space-y-4">
                                    <div className="flex items-center gap-3">
                                        <div className="w-4 h-4 bg-orange-600 rounded-md"></div>
                                        <h3 className="font-extrabold text-orange-900 text-lg">정사각형 B</h3>
                                    </div>
                                    <div className="flex items-center justify-between gap-4">
                                        <span className="text-md font-black text-slate-700">변의 길이</span>
                                        <input type="number" step="0.1" value={side2 === 0 ? "" : Number(side2.toFixed(3))} onChange={(e) => onSideInputChange(setArea2, e.target.value)} className="w-24 p-2 bg-white border-2 border-orange-200 rounded-xl focus:outline-none font-mono text-orange-700 font-black text-lg text-center" />
                                    </div>
                                    <div className="flex items-center justify-between gap-4">
                                        <span className="text-md font-black text-slate-700">넓이 (b)</span>
                                        <input type="number" step="0.1" value={area2 === 0 ? "" : area2} onChange={(e) => onAreaInputChange(setArea2, e.target.value)} className="w-24 p-2 bg-white border-2 border-orange-200 rounded-xl focus:outline-none font-mono text-orange-800 font-black text-lg text-center" />
                                    </div>
                                </div>
                            </section>

                            {/* 왼쪽 하단: 실시간 비교 결과 */}
                            <section className="mt-6 p-5 bg-slate-900 rounded-[2rem] text-white shadow-xl space-y-4">
                                <h2 className="text-[10px] font-black text-slate-500 uppercase tracking-[0.3em] text-center">비교 결과 분석</h2>
                                <div className="space-y-3">
                                    <div className="flex flex-col items-center">
                                        <span className="text-[10px] text-slate-400 font-bold mb-1 uppercase">넓이 비교</span>
                                        <div className="flex items-center gap-3 text-2xl font-mono font-black">
                                            <span className="text-blue-400">{area1}</span>
                                            <span className="text-yellow-400">{area1 > area2 ? '>' : area1 < area2 ? '<' : '='}</span>
                                            <span className="text-orange-400">{area2}</span>
                                        </div>
                                    </div>
                                    <div className="h-px bg-slate-800 w-full"></div>
                                    <div className="flex flex-col items-center">
                                        <span className="text-[10px] text-slate-400 font-bold mb-1 uppercase">제곱근 비교</span>
                                        <div className="flex items-center gap-3 text-2xl font-mono font-black">
                                            <span className="text-blue-400">√{area1}</span>
                                            <span className="text-yellow-400">{side1 > side2 ? '>' : side1 < side2 ? '<' : '='}</span>
                                            <span className="text-orange-400">√{area2}</span>
                                        </div>
                                    </div>
                                </div>
                            </section>
                        </div>

                        {/* 오른쪽: 시각화 영역 */}
                        <div className="flex-1 flex flex-col items-center justify-center p-4 bg-white relative overflow-visible">
                            {/* 메인 캔버스 영역 */}
                            <div className="relative translate-x-12" style={{ width: '500px', height: '500px' }}>
                                {/* 축 가이드 */}
                                <div className="absolute left-0 bottom-0 w-[580px] h-[580px] border-l-[6px] border-b-[6px] border-slate-100 pointer-events-none"></div>
                                
                                {/* 큰 사각형 */}
                                <div className={`absolute bottom-0 left-0 transition-all duration-700 ease-in-out border-[3px] shadow-sm ${side1 >= side2 ? 'bg-blue-100/40 border-blue-200' : 'bg-orange-100/40 border-orange-200'}`}
                                    style={{ width: `${Math.max(side1, side2) * scale}px`, height: `${Math.max(side1, side2) * scale}px`, zIndex: 1 }}>
                                    <div className="absolute top-4 right-4 text-xs font-black text-slate-400 bg-white/90 px-3 py-1 rounded-full shadow-sm border border-slate-100">
                                        전체 넓이: {Math.max(area1, area2).toFixed(2)}
                                    </div>
                                </div>

                                {/* 작은 사각형 */}
                                <div className={`absolute bottom-0 left-0 transition-all duration-700 ease-in-out border-[3px] shadow-2xl flex items-center justify-center ${side1 >= side2 ? 'bg-orange-500 border-orange-700' : 'bg-blue-500 border-blue-700'}`}
                                    style={{ width: `${Math.min(side1, side2) * scale}px`, height: `${Math.min(side1, side2) * scale}px`, zIndex: 2 }}>
                                    <div className="text-white font-black text-6xl drop-shadow-2xl">{Math.min(area1, area2).toFixed(1)}</div>
                                </div>

                                {/* Y축 표시기 (A) */}
                                <div className="absolute bottom-0 left-[-40px] w-6 bg-blue-600 rounded-t-lg transition-all duration-700 border-x-2 border-t-2 border-white shadow-md"
                                    style={{ height: `${side1 * scale}px` }}>
                                    <div className="absolute left-1/2 bottom-full mb-3 -translate-x-1/2 text-sm font-black text-blue-700 bg-blue-50 px-3 py-1.5 rounded-xl border-2 border-blue-200 shadow-sm flex flex-col items-center min-w-[60px]">
                                        <span className="text-[10px] bg-blue-600 text-white px-1.5 rounded mb-0.5 font-bold">A</span>
                                        {side1.toFixed(2)}
                                    </div>
                                </div>

                                {/* Y축 표시기 (B) */}
                                <div className="absolute bottom-0 left-[-80px] w-6 bg-orange-600 rounded-t-lg transition-all duration-700 border-x-2 border-t-2 border-white shadow-md"
                                    style={{ height: `${side2 * scale}px` }}>
                                    <div className="absolute left-1/2 bottom-full mb-3 -translate-x-1/2 text-sm font-black text-orange-700 bg-orange-50 px-3 py-1.5 rounded-xl border-2 border-orange-200 shadow-sm flex flex-col items-center min-w-[60px]">
                                        <span className="text-[10px] bg-orange-600 text-white px-1.5 rounded mb-0.5 font-bold">B</span>
                                        {side2.toFixed(2)}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
