<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>랜덤 숫자 추출기 - 제외 기능 포함</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f1f5f9;
        }

        .number-node {
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); opacity: 1; }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }

        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        @media (min-width: 768px) {
            .main-container {
                min-height: 500px;
            }
        }
    </style>
</head>
<body class="p-4 md:p-8 flex justify-center items-center min-h-screen">

    <div class="max-w-6xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-100 flex flex-col">
        <!-- 상단 헤더 -->
        <div class="bg-gradient-to-r from-indigo-600 to-blue-500 p-5 text-white flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">랜덤 숫자 추출기</h1>
                <p class="text-indigo-100 text-xs mt-0.5">제외할 숫자를 설정하고 무작위로 추출하세요</p>
            </div>
            <div class="text-right">
                <span id="poolStatus" class="text-xs bg-white/20 px-3 py-1 rounded-full font-bold">남은 숫자: -</span>
            </div>
        </div>

        <!-- 메인 컨텐츠 영역 -->
        <div class="flex flex-col md:flex-row main-container">
            
            <!-- 왼쪽: 설정 영역 -->
            <div class="w-full md:w-1/3 p-6 border-b md:border-b-0 md:border-r border-gray-100 space-y-5 bg-gray-50/50">
                <h3 class="font-bold text-gray-700 flex items-center mb-2">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                    추출 설정
                </h3>
                
                <div class="grid grid-cols-2 gap-3">
                    <div class="space-y-1">
                        <label class="text-[11px] font-semibold text-gray-500 uppercase ml-1">시작 숫자</label>
                        <input type="number" id="minRange" value="1" onchange="resetPool()" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[11px] font-semibold text-gray-500 uppercase ml-1">끝 숫자</label>
                        <input type="number" id="maxRange" value="45" onchange="resetPool()" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-[11px] font-semibold text-gray-500 uppercase ml-1">한 번에 뽑을 개수</label>
                    <input type="number" id="pickCount" value="6" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                </div>

                <!-- 제외할 숫자 입력 칸 추가 -->
                <div class="space-y-1">
                    <label class="text-[11px] font-semibold text-gray-500 uppercase ml-1">제외할 숫자 (쉼표로 구분)</label>
                    <input type="text" id="excludeNumbers" placeholder="예: 4, 7, 12" oninput="resetPool()" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2 focus:ring-2 focus:ring-red-400 outline-none transition-all text-red-500 font-medium placeholder:text-gray-300">
                </div>

                <div class="flex items-center justify-between bg-white p-3 rounded-xl border border-gray-100">
                    <span class="text-sm font-medium text-gray-700">중복 허용 (매번 전체 범위)</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="allowDuplicates" class="sr-only peer" onchange="toggleMode()">
                        <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
                    </label>
                </div>

                <div class="pt-2 space-y-2">
                    <button onclick="generateNumbers()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow-lg shadow-indigo-100 transition-all transform active:scale-[0.98] flex justify-center items-center">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        숫자 추출하기
                    </button>
                    <button onclick="resetPool()" id="resetBtn" class="w-full py-3 bg-white border-2 border-gray-200 text-gray-500 hover:text-indigo-600 hover:border-indigo-200 font-bold rounded-2xl transition-all flex justify-center items-center">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        범위 및 제외 초기화
                    </button>
                </div>
            </div>

            <!-- 오른쪽: 결과 영역 -->
            <div class="w-full md:w-2/3 p-6 flex flex-col space-y-6 bg-white">
                <div>
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="font-bold text-gray-800 flex items-center text-lg">
                            <span class="w-3 h-3 bg-indigo-500 rounded-full mr-2"></span>
                            추출 결과
                        </h3>
                        <button onclick="clearCurrent()" class="text-xs text-gray-400 hover:text-indigo-600 flex items-center">
                            <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            화면 지우기
                        </button>
                    </div>
                    <div id="currentDisplay" class="min-h-[120px] bg-indigo-50/50 rounded-2xl p-6 flex flex-wrap justify-center items-center gap-4 border border-indigo-100 border-dashed">
                        <p id="placeholderText" class="text-indigo-300 text-lg font-medium text-center">추출 버튼을 눌러 숫자를 확인하세요<br><span class="text-sm font-normal">제외된 숫자는 절대 나오지 않습니다.</span></p>
                    </div>
                </div>

                <div class="pt-4 border-t border-gray-100 flex-1">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="font-bold text-gray-800 flex items-center">
                            <span class="w-3 h-3 bg-gray-400 rounded-full mr-2"></span>
                            누적 기록
                        </h3>
                        <button onclick="clearHistory()" class="text-xs font-bold text-red-400 hover:text-red-600 border border-red-100 px-3 py-1.5 rounded-xl hover:bg-red-50 transition-colors">
                            전체 초기화
                        </button>
                    </div>
                    <div id="historyList" class="max-h-64 overflow-y-auto custom-scroll space-y-2 pr-2">
                        <p id="historyPlaceholder" class="text-center py-8 text-gray-400 text-sm italic">아직 기록된 숫자가 없습니다</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 에러 알림 -->
        <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-gray-800 text-white px-8 py-4 rounded-2xl text-base shadow-2xl opacity-0 transition-opacity pointer-events-none z-50">
            에러 메시지
        </div>
    </div>

    <script>
        // 전역 상태: 남은 숫자 풀
        let currentPool = [];

        window.onload = function() {
            resetPool();
        };

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 3000);
        }

        // 제외할 숫자 리스트 파싱
        function getExcludedNumbers() {
            const input = document.getElementById('excludeNumbers').value;
            // 쉼표, 공백, 세미콜론 등으로 구분하여 숫자 배열로 변환
            return input.split(/[,\s;]+/)
                        .map(n => parseInt(n.trim()))
                        .filter(n => !isNaN(n));
        }

        // 숫자 풀 초기화 함수
        function resetPool() {
            const min = parseInt(document.getElementById('minRange').value);
            const max = parseInt(document.getElementById('maxRange').value);
            
            if (isNaN(min) || isNaN(max)) return;
            if (min > max) return;

            const excluded = getExcludedNumbers();
            
            // 제외할 숫자를 뺀 풀 생성
            currentPool = Array.from({length: max - min + 1}, (_, i) => i + min)
                               .filter(num => !excluded.includes(num));
            
            updatePoolStatus();
        }

        function updatePoolStatus() {
            const statusEl = document.getElementById('poolStatus');
            const allowDup = document.getElementById('allowDuplicates').checked;
            
            if (allowDup) {
                statusEl.innerText = "무제한 모드 (중복 허용)";
                statusEl.classList.replace('bg-white/20', 'bg-amber-400/80');
            } else {
                statusEl.innerText = `남은 숫자: ${currentPool.length}개`;
                statusEl.classList.replace('bg-amber-400/80', 'bg-white/20');
            }
        }

        function toggleMode() {
            resetPool();
            updatePoolStatus();
        }

        function generateNumbers() {
            const min = parseInt(document.getElementById('minRange').value);
            const max = parseInt(document.getElementById('maxRange').value);
            const count = parseInt(document.getElementById('pickCount').value);
            const allowDup = document.getElementById('allowDuplicates').checked;
            const display = document.getElementById('currentDisplay');
            
            if (isNaN(min) || isNaN(max) || isNaN(count)) return showToast("모든 값을 숫자로 입력해주세요.");
            if (min > max) return showToast("시작 숫자가 끝 숫자보다 큽니다.");
            if (count <= 0) return showToast("추출 개수는 1개 이상이어야 합니다.");
            
            const excluded = getExcludedNumbers();
            let results = [];

            if (allowDup) {
                // 중복 허용 모드: 제외할 숫자를 뺀 나머지 중에서 랜덤 추출
                const availableRange = Array.from({length: max - min + 1}, (_, i) => i + min)
                                            .filter(num => !excluded.includes(num));
                
                if (availableRange.length === 0) {
                    return showToast("제외된 숫자를 제외하면 뽑을 수 있는 숫자가 없습니다.");
                }

                for (let i = 0; i < count; i++) {
                    const randomIndex = Math.floor(Math.random() * availableRange.length);
                    results.push(availableRange[randomIndex]);
                }
            } else {
                // 중복 방지 모드: 전역 currentPool에서 추출
                if (currentPool.length === 0) {
                    return showToast("남은 숫자가 없습니다! 범위를 재설정하거나 초기화해주세요.");
                }
                
                if (count > currentPool.length) {
                    showToast(`남은 숫자가 부족하여 ${currentPool.length}개만 추출합니다.`);
                }

                const actualPickCount = Math.min(count, currentPool.length);
                
                // 피셔-예이츠 셔플로 풀에서 뽑기
                for (let i = 0; i < actualPickCount; i++) {
                    const randomIndex = Math.floor(Math.random() * currentPool.length);
                    results.push(currentPool.splice(randomIndex, 1)[0]);
                }
                
                updatePoolStatus();
            }

            // 결과 화면 업데이트
            display.innerHTML = '';
            results.sort((a, b) => a - b);
            
            results.forEach((num, idx) => {
                const node = document.createElement('div');
                node.className = "number-node w-14 h-14 md:w-16 md:h-16 rounded-full bg-white border-4 border-indigo-500 text-indigo-700 flex items-center justify-center font-black shadow-md text-xl md:text-2xl";
                node.innerText = num;
                node.style.animationDelay = `${idx * 0.05}s`;
                display.appendChild(node);
            });

            addToHistory(results);
        }

        function addToHistory(nums) {
            const historyList = document.getElementById('historyList');
            const placeholder = document.getElementById('historyPlaceholder');
            if (placeholder) placeholder.remove();

            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
            
            const item = document.createElement('div');
            item.className = "flex items-center bg-gray-50 p-4 rounded-2xl border border-gray-100 hover:bg-gray-100 transition-colors";
            
            const numsHtml = nums.map(n => `<span class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-lg text-sm font-bold border border-indigo-200">${n}</span>`).join('');

            item.innerHTML = `
                <div class="flex-shrink-0 text-xs font-mono text-gray-400 w-20 font-bold">${timeStr}</div>
                <div class="flex flex-wrap gap-2">${numsHtml}</div>
            `;
            
            historyList.prepend(item);
        }

        function clearCurrent() {
            document.getElementById('currentDisplay').innerHTML = '<p id="placeholderText" class="text-indigo-300 text-lg font-medium text-center">추출 버튼을 눌러 숫자를 확인하세요</p>';
        }

        function clearHistory() {
            document.getElementById('historyList').innerHTML = '<p id="historyPlaceholder" class="text-center py-8 text-gray-400 text-sm italic">아직 기록된 숫자가 없습니다</p>';
            resetPool();
        }
    </script>

</body>
</html>
