<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>랜덤 숫자 추출기 - 가로형 레이아웃</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f1f5f9;
        }

        /* 숫자 카드 나타나기 애니메이션 */
        .number-node {
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); opacity: 1; }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 스크롤바 디자인 */
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* 가로 배치시 균형을 위한 높이 설정 */
        @media (min-width: 768px) {
            .main-container {
                min-height: 500px;
            }
        }
    </style>
</head>
<body class="p-4 md:p-8 flex justify-center items-center min-h-screen">

    <div class="max-w-6xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-100 flex flex-col">
        <!-- 상단 헤더 (전체 너비) -->
        <div class="bg-gradient-to-r from-indigo-600 to-blue-500 p-5 text-white flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">랜덤 숫자 추출기</h1>
                <p class="text-indigo-100 text-xs mt-0.5">범위를 설정하고 숫자를 무작위로 뽑으세요</p>
            </div>
            <div class="hidden md:block text-right">
                <span class="text-xs bg-white/20 px-3 py-1 rounded-full">Chalkboard Mode</span>
            </div>
        </div>

        <!-- 메인 컨텐츠 영역 (가로 분할) -->
        <div class="flex flex-col md:flex-row main-container">
            
            <!-- 왼쪽: 설정 영역 (좁게) -->
            <div class="w-full md:w-1/3 p-6 border-b md:border-b-0 md:border-r border-gray-100 space-y-5 bg-gray-50/50">
                <h3 class="font-bold text-gray-700 flex items-center mb-2">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                    추출 설정
                </h3>
                
                <div class="grid grid-cols-2 gap-3">
                    <div class="space-y-1">
                        <label class="text-[11px] font-semibold text-gray-500 uppercase ml-1">시작 숫자</label>
                        <input type="number" id="minRange" value="1" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[11px] font-semibold text-gray-500 uppercase ml-1">끝 숫자</label>
                        <input type="number" id="maxRange" value="45" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-[11px] font-semibold text-gray-500 uppercase ml-1">추출할 개수</label>
                    <input type="number" id="pickCount" value="6" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                </div>

                <div class="flex items-center justify-between bg-white p-3 rounded-xl border border-gray-100">
                    <span class="text-sm font-medium text-gray-700">중복 허용</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="allowDuplicates" class="sr-only peer">
                        <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
                    </label>
                </div>

                <button onclick="generateNumbers()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow-lg shadow-indigo-100 transition-all transform active:scale-[0.98] mt-4 flex justify-center items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    숫자 추출하기
                </button>
            </div>

            <!-- 오른쪽: 결과 및 기록 영역 (넓게) -->
            <div class="w-full md:w-2/3 p-6 flex flex-col space-y-6 bg-white">
                
                <!-- 이번 추출 결과 -->
                <div class="flex-1 min-h-[150px]">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="font-bold text-gray-800 flex items-center text-lg">
                            <span class="w-3 h-3 bg-indigo-500 rounded-full mr-2"></span>
                            추출 결과
                        </h3>
                        <button onclick="clearCurrent()" class="text-xs text-gray-400 hover:text-indigo-600 flex items-center">
                            <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            화면 지우기
                        </button>
                    </div>
                    <div id="currentDisplay" class="h-full min-h-[100px] bg-indigo-50/50 rounded-2xl p-6 flex flex-wrap justify-center items-center gap-4 border border-indigo-100 border-dashed">
                        <p id="placeholderText" class="text-indigo-300 text-lg font-medium">추출 버튼을 눌러 숫자를 확인하세요</p>
                    </div>
                </div>

                <!-- 누적 기록 -->
                <div class="pt-4 border-t border-gray-100">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="font-bold text-gray-800 flex items-center">
                            <span class="w-3 h-3 bg-gray-400 rounded-full mr-2"></span>
                            누적 기록 (최근순)
                        </h3>
                        <button onclick="clearHistory()" class="text-xs font-bold text-red-400 hover:text-red-600 border border-red-100 px-3 py-1.5 rounded-xl hover:bg-red-50 transition-colors">
                            전체 초기화
                        </button>
                    </div>
                    <div id="historyList" class="max-h-56 overflow-y-auto custom-scroll space-y-2 pr-2">
                        <p id="historyPlaceholder" class="text-center py-8 text-gray-400 text-sm italic">아직 기록된 숫자가 없습니다</p>
                    </div>
                </div>
            </div>

        </div>

        <!-- 에러 알림 (토스트) -->
        <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-gray-800 text-white px-8 py-4 rounded-2xl text-base shadow-2xl opacity-0 transition-opacity pointer-events-none z-50">
            에러 메시지
        </div>
    </div>

    <script>
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 3000);
        }

        function generateNumbers() {
            const min = parseInt(document.getElementById('minRange').value);
            const max = parseInt(document.getElementById('maxRange').value);
            const count = parseInt(document.getElementById('pickCount').value);
            const allowDup = document.getElementById('allowDuplicates').checked;
            
            const display = document.getElementById('currentDisplay');
            
            if (isNaN(min) || isNaN(max) || isNaN(count)) return showToast("모든 값을 숫자로 입력해주세요.");
            if (min > max) return showToast("시작 숫자가 끝 숫자보다 큽니다.");
            if (count <= 0) return showToast("추출 개수는 1개 이상이어야 합니다.");
            
            const rangeSize = max - min + 1;
            if (!allowDup && count > rangeSize) {
                return showToast(`중복 없이 뽑을 수 있는 최대 개수는 ${rangeSize}개입니다.`);
            }

            let results = [];
            if (allowDup) {
                for (let i = 0; i < count; i++) {
                    results.push(Math.floor(Math.random() * (max - min + 1)) + min);
                }
            } else {
                let pool = Array.from({length: max - min + 1}, (_, i) => i + min);
                for (let i = pool.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [pool[i], pool[j]] = [pool[j], pool[i]];
                }
                results = pool.slice(0, count);
            }

            display.innerHTML = '';
            results.forEach((num, idx) => {
                const node = document.createElement('div');
                // 칠판 가시성을 위해 숫자를 조금 더 크게 조정
                node.className = "number-node w-14 h-14 md:w-16 md:h-16 rounded-full bg-white border-4 border-indigo-500 text-indigo-700 flex items-center justify-center font-black shadow-md text-xl md:text-2xl";
                node.innerText = num;
                node.style.animationDelay = `${idx * 0.05}s`;
                display.appendChild(node);
            });

            addToHistory(results);
        }

        function addToHistory(nums) {
            const historyList = document.getElementById('historyList');
            const placeholder = document.getElementById('historyPlaceholder');
            if (placeholder) placeholder.remove();

            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
            
            const item = document.createElement('div');
            item.className = "flex items-center bg-gray-50 p-4 rounded-2xl border border-gray-100 hover:bg-gray-100 transition-colors";
            
            const numsHtml = nums.map(n => `<span class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-lg text-sm font-bold border border-indigo-200">${n}</span>`).join('');

            item.innerHTML = `
                <div class="flex-shrink-0 text-xs font-mono text-gray-400 w-20 font-bold">${timeStr}</div>
                <div class="flex flex-wrap gap-2">${numsHtml}</div>
            `;
            
            historyList.prepend(item);
        }

        function clearCurrent() {
            document.getElementById('currentDisplay').innerHTML = '<p id="placeholderText" class="text-indigo-300 text-lg font-medium">추출 버튼을 눌러 숫자를 확인하세요</p>';
        }

        function clearHistory() {
            document.getElementById('historyList').innerHTML = '<p id="historyPlaceholder" class="text-center py-8 text-gray-400 text-sm italic">아직 기록된 숫자가 없습니다</p>';
        }
    </script>

</body>
</html>
