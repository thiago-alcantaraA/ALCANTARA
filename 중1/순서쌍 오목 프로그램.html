<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>전자칠판용 좌표 스크롤 오목</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        body {
            background-color: #0f172a;
            font-family: 'Pretendard', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        /* 피커 스타일 */
        .picker-container {
            height: 120px;
            width: 70px;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            -ms-overflow-style: none;
            scrollbar-width: none;
            z-index: 5;
        }
        .picker-container::-webkit-scrollbar {
            display: none;
        }
        .picker-item {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            scroll-snap-align: center;
            font-size: 1.1rem;
            font-weight: 700;
            transition: all 0.2s;
            color: #475569;
        }
        .picker-item.active {
            color: #3b82f6;
            font-size: 1.5rem;
            transform: scale(1.1);
        }
        
        .picker-highlight {
            position: absolute;
            top: 40px;
            left: 0;
            right: 0;
            height: 40px;
            border-top: 2px solid #3b82f6;
            border-bottom: 2px solid #3b82f6;
            pointer-events: none;
            background: rgba(59, 130, 246, 0.15);
            z-index: 2;
            border-radius: 4px;
        }

        canvas {
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            background-color: #dcb35c;
            touch-action: none;
        }

        .player-panel {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 220px;
            padding: 1.5rem;
            border-radius: 2rem;
            border: 4px solid transparent;
        }
        .active-player {
            transform: scale(1.05);
            border-color: #3b82f6 !important;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.4);
            opacity: 1 !important;
        }
        .inactive-player {
            opacity: 0.2;
            pointer-events: none;
            filter: grayscale(0.8);
            transform: scale(0.95);
        }

        .action-btn {
            background: #3b82f6;
            color: white;
            padding: 1rem;
            border-radius: 1rem;
            font-weight: 900;
            font-size: 1.2rem;
            width: 100%;
            transition: all 0.2s;
        }
        .action-btn:active {
            transform: scale(0.95);
            background: #2563eb;
        }
    </style>
</head>
<body>

    <div class="flex items-center gap-4 mb-6">
        <div id="turn-indicator" class="px-10 py-3 rounded-full font-black text-2xl bg-white shadow-xl transition-all text-slate-900 min-w-[240px] text-center">
            흑색 차례
        </div>
        <div class="flex gap-2">
            <!-- 무르기 버튼 -->
            <button onclick="undoMove()" title="무르기" class="bg-slate-700 text-white p-3 rounded-full hover:bg-amber-600 transition-colors shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
            </button>
            <!-- 초기화 버튼 -->
            <button onclick="resetGame()" title="초기화" class="bg-slate-700 text-white p-3 rounded-full hover:bg-red-600 transition-colors shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            </button>
        </div>
    </div>

    <div class="flex flex-row items-center justify-center gap-6 w-full max-w-full px-4">
        
        <!-- 왼쪽: 흑색 패널 -->
        <div id="panel-black" class="player-panel bg-slate-800 text-white">
            <div class="text-center mb-6">
                <div class="w-14 h-14 bg-black border-2 border-slate-600 rounded-full mx-auto mb-2 shadow-lg"></div>
                <span class="text-xl font-black tracking-tighter text-blue-400">흑색</span>
            </div>
            
            <div class="flex justify-center gap-4 mb-6">
                <div class="text-center">
                    <span class="text-[12px] font-bold text-slate-500 block mb-1 tracking-wider">X축</span>
                    <div class="relative">
                        <div class="picker-highlight"></div>
                        <div class="picker-container" id="picker-black-x" onscroll="handleScroll('black', 'x')">
                            <div class="picker-spacer" style="height: 40px;"></div>
                            <div class="picker-spacer" style="height: 40px;"></div>
                        </div>
                    </div>
                </div>
                <div class="text-center">
                    <span class="text-[12px] font-bold text-slate-500 block mb-1 tracking-wider">Y축</span>
                    <div class="relative">
                        <div class="picker-highlight"></div>
                        <div class="picker-container" id="picker-black-y" onscroll="handleScroll('black', 'y')">
                            <div class="picker-spacer" style="height: 40px;"></div>
                            <div class="picker-spacer" style="height: 40px;"></div>
                        </div>
                    </div>
                </div>
            </div>
            <button onclick="placeStone('black')" class="action-btn">착수</button>
        </div>

        <!-- 중앙: 바둑판 -->
        <div class="relative">
            <canvas id="omokCanvas" width="540" height="540"></canvas>
            <div id="last-move" class="absolute -bottom-10 left-0 right-0 text-center text-slate-400 font-bold text-sm">
                마지막 수: 없음
            </div>
        </div>

        <!-- 오른쪽: 백색 패널 -->
        <div id="panel-white" class="player-panel bg-white text-slate-900 border-2 border-slate-100 shadow-xl">
            <div class="text-center mb-6">
                <div class="w-14 h-14 bg-white border-2 border-slate-200 rounded-full mx-auto mb-2 shadow-md"></div>
                <span class="text-xl font-black tracking-tighter text-blue-600">백색</span>
            </div>
            
            <div class="flex justify-center gap-4 mb-6">
                <div class="text-center">
                    <span class="text-[12px] font-bold text-slate-400 block mb-1 tracking-wider">X축</span>
                    <div class="relative">
                        <div class="picker-highlight"></div>
                        <div class="picker-container" id="picker-white-x" onscroll="handleScroll('white', 'x')">
                            <div class="picker-spacer" style="height: 40px;"></div>
                            <div class="picker-spacer" style="height: 40px;"></div>
                        </div>
                    </div>
                </div>
                <div class="text-center">
                    <span class="text-[12px] font-bold text-slate-400 block mb-1 tracking-wider">Y축</span>
                    <div class="relative">
                        <div class="picker-highlight"></div>
                        <div class="picker-container" id="picker-white-y" onscroll="handleScroll('white', 'y')">
                            <div class="picker-spacer" style="height: 40px;"></div>
                            <div class="picker-spacer" style="height: 40px;"></div>
                        </div>
                    </div>
                </div>
            </div>
            <button onclick="placeStone('white')" class="action-btn">착수</button>
        </div>

    </div>

    <!-- 승리 모달 -->
    <div id="winModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-lg hidden flex items-center justify-center z-[100]">
        <div class="bg-white p-10 rounded-[40px] text-center shadow-2xl max-w-sm w-full mx-4">
            <div class="text-6xl mb-4">🏆</div>
            <h2 id="winTitle" class="text-4xl font-black mb-2 text-slate-900">승리!</h2>
            <p class="text-slate-500 font-bold mb-8">환상적인 전략이었습니다.</p>
            <button onclick="closeModal()" class="w-full bg-blue-600 text-white py-5 rounded-3xl font-black text-xl hover:bg-blue-700 active:scale-95 shadow-xl shadow-blue-200 transition-all">
                한 판 더 하기
            </button>
        </div>
    </div>

    <div id="toast" class="fixed bottom-10 bg-red-600 text-white px-8 py-3 rounded-2xl shadow-2xl opacity-0 transition-opacity pointer-events-none font-black z-50">
        이미 돌이 있는 자리입니다.
    </div>

    <script>
        const canvas = document.getElementById('omokCanvas');
        const ctx = canvas.getContext('2d');
        const winModal = document.getElementById('winModal');
        const turnIndicator = document.getElementById('turn-indicator');
        const lastMoveLabel = document.getElementById('last-move');
        const toast = document.getElementById('toast');

        const GRID_SIZE = 15;
        const PADDING = 50; 
        const CELL_SIZE = (canvas.width - PADDING * 2) / (GRID_SIZE - 1);
        const STONE_RADIUS = CELL_SIZE * 0.44;

        let board = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(0));
        let currentPlayer = 1; 
        let gameOver = false;
        let moveHistory = []; // 착수 기록 저장용

        let selections = {
            black: { x: 0, y: 0 },
            white: { x: 0, y: 0 }
        };

        function init() {
            createPickerItems();
            drawBoard();
            updateUI();
            
            setTimeout(() => {
                ['black', 'white'].forEach(p => {
                    ['x', 'y'].forEach(a => {
                        const container = document.getElementById(`picker-${p}-${a}`);
                        container.scrollTop = 7 * 40; 
                    });
                });
            }, 100);
        }

        function createPickerItems() {
            ['black', 'white'].forEach(p => {
                ['x', 'y'].forEach(a => {
                    const container = document.getElementById(`picker-${p}-${a}`);
                    const spacerEnd = container.lastElementChild;
                    for (let i = -7; i <= 7; i++) {
                        const item = document.createElement('div');
                        item.className = 'picker-item';
                        item.textContent = (i > 0 ? '+' : '') + i;
                        if (i === 0) item.textContent = '0';
                        container.insertBefore(item, spacerEnd);
                    }
                });
            });
        }

        function handleScroll(player, axis) {
            const container = document.getElementById(`picker-${player}-${axis}`);
            const index = Math.round(container.scrollTop / 40);
            const value = index - 7;
            
            if (value >= -7 && value <= 7) {
                selections[player][axis] = value;
                const items = container.querySelectorAll('.picker-item');
                items.forEach((item, idx) => {
                    if (idx === index) item.classList.add('active');
                    else item.classList.remove('active');
                });
            }
        }

        function drawArrow(fromx, fromy, tox, toy) {
            const headlen = 12;
            const angle = Math.atan2(toy - fromy, tox - fromx);
            ctx.beginPath();
            ctx.moveTo(fromx, fromy);
            ctx.lineTo(tox, toy);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(tox, toy);
            ctx.lineTo(tox - headlen * Math.cos(angle - Math.PI / 6), toy - headlen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(tox - headlen * Math.cos(angle + Math.PI / 6), toy - headlen * Math.sin(angle + Math.PI / 6));
            ctx.closePath();
            ctx.fill();
        }

        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#dcb35c';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 보조 그리드 선
            ctx.strokeStyle = '#4b3621';
            ctx.lineWidth = 1;
            ctx.globalAlpha = 0.2;
            for (let i = 0; i < GRID_SIZE; i++) {
                const pos = PADDING + i * CELL_SIZE;
                ctx.beginPath();
                ctx.moveTo(pos, PADDING); ctx.lineTo(pos, canvas.height - PADDING);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(PADDING, pos); ctx.lineTo(canvas.width - PADDING, pos);
                ctx.stroke();
            }
            ctx.globalAlpha = 1.0;

            const centerX = PADDING + 7 * CELL_SIZE;
            const centerY = PADDING + 7 * CELL_SIZE;

            // X축, Y축 메인 라인
            ctx.strokeStyle = '#1a0d00';
            ctx.fillStyle = '#1a0d00';
            ctx.lineWidth = 2.5;
            
            // X축 화살표
            drawArrow(PADDING - 15, centerY, canvas.width - PADDING + 25, centerY);
            // Y축 화살표
            drawArrow(centerX, canvas.height - PADDING + 15, centerX, PADDING - 25);

            // 축 라벨 및 눈금
            ctx.font = 'bold 13px Pretendard';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            for (let i = 0; i < GRID_SIZE; i++) {
                const val = i - 7;
                const pos = PADDING + i * CELL_SIZE;

                if (val !== 0) {
                    // X축 눈금
                    ctx.beginPath();
                    ctx.moveTo(pos, centerY - 5);
                    ctx.lineTo(pos, centerY + 5);
                    ctx.stroke();

                    // Y축 눈금
                    ctx.beginPath();
                    ctx.moveTo(centerX - 5, pos);
                    ctx.lineTo(centerX + 5, pos);
                    ctx.stroke();
                } else {
                    // 원점 '0' 표기
                    ctx.fillText('0', centerX - 12, centerY + 12);
                }
            }

            // 축 이름 표시
            ctx.font = 'bold 16px Pretendard';
            ctx.fillText('x', canvas.width - PADDING + 40, centerY);
            ctx.fillText('y', centerX, PADDING - 45);

            // 화점
            const dots = [3, 7, 11];
            ctx.fillStyle = '#2d1e12';
            dots.forEach(r => dots.forEach(c => {
                ctx.beginPath();
                ctx.arc(PADDING + c * CELL_SIZE, PADDING + r * CELL_SIZE, 4, 0, Math.PI * 2);
                ctx.fill();
            }));

            // 돌 그리기
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (board[r][c] !== 0) drawStone(c, r, board[r][c]);
                }
            }
        }

        function drawStone(col, row, player) {
            const px = PADDING + col * CELL_SIZE;
            const py = PADDING + row * CELL_SIZE;
            ctx.save();
            ctx.shadowBlur = 8;
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowOffsetY = 4;
            ctx.beginPath();
            ctx.arc(px, py, STONE_RADIUS, 0, Math.PI * 2);
            const grad = ctx.createRadialGradient(px - STONE_RADIUS/2, py - STONE_RADIUS/2, 2, px, py, STONE_RADIUS);
            if (player === 1) {
                grad.addColorStop(0, '#555'); grad.addColorStop(1, '#000');
            } else {
                grad.addColorStop(0, '#fff'); grad.addColorStop(1, '#ccc');
            }
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.restore();
        }

        function placeStone(side) {
            if (gameOver) return;
            const isBlack = side === 'black';
            if ((isBlack && currentPlayer !== 1) || (!isBlack && currentPlayer !== 2)) return;

            const ux = selections[side].x;
            const uy = selections[side].y;
            const col = ux + 7;
            const row = 7 - uy;

            if (board[row][col] !== 0) {
                showToast(`(${ux}, ${uy})는 이미 돌이 있습니다.`);
                return;
            }

            // 착수 기록 저장
            moveHistory.push({ row, col, ux, uy, player: currentPlayer });
            
            board[row][col] = currentPlayer;
            lastMoveLabel.textContent = `마지막 수: ${isBlack ? '흑' : '백'} (${ux}, ${uy})`;
            drawBoard();

            if (checkWin(col, row)) {
                announceWin();
            } else {
                currentPlayer = currentPlayer === 1 ? 2 : 1;
                updateUI();
            }
        }

        function undoMove() {
            if (moveHistory.length === 0 || gameOver) return;

            // 마지막 수 가져오기
            const lastMove = moveHistory.pop();
            board[lastMove.row][lastMove.col] = 0;
            
            // 현재 플레이어를 무른 플레이어로 변경
            currentPlayer = lastMove.player;
            
            // UI 업데이트
            if (moveHistory.length > 0) {
                const prevMove = moveHistory[moveHistory.length - 1];
                lastMoveLabel.textContent = `마지막 수: ${prevMove.player === 1 ? '흑' : '백'} (${prevMove.ux}, ${prevMove.uy})`;
            } else {
                lastMoveLabel.textContent = "마지막 수: 없음";
            }
            
            drawBoard();
            updateUI();
        }

        function updateUI() {
            const blackP = document.getElementById('panel-black');
            const whiteP = document.getElementById('panel-white');
            if (currentPlayer === 1) {
                blackP.className = 'player-panel bg-slate-800 text-white active-player';
                whiteP.className = 'player-panel bg-white text-slate-900 border-2 border-slate-100 inactive-player shadow-xl';
                turnIndicator.textContent = "흑색 차례";
                turnIndicator.style.color = "#1e293b";
            } else {
                whiteP.className = 'player-panel bg-white text-slate-900 border-2 border-slate-100 active-player shadow-xl';
                blackP.className = 'player-panel bg-slate-800 text-white inactive-player';
                turnIndicator.textContent = "백색 차례";
                turnIndicator.style.color = "#2563eb";
            }
        }

        function checkWin(c, r) {
            const p = board[r][c];
            const dirs = [[0,1],[1,0],[1,1],[1,-1]];
            for (let [dc, dr] of dirs) {
                let cnt = 1;
                for (let sign of [1, -1]) {
                    let nc = c + dc * sign; let nr = r + dr * sign;
                    while (nc>=0 && nc<15 && nr>=0 && nr<15 && board[nr][nc] === p) {
                        cnt++; nc += dc * sign; nr += dr * sign;
                    }
                }
                if (cnt >= 5) return true;
            }
            return false;
        }

        function announceWin() {
            gameOver = true;
            const winner = currentPlayer === 1 ? "흑색" : "백색";
            document.getElementById('winTitle').textContent = `${winner} 승리!`;
            winModal.classList.remove('hidden');
        }

        function showToast(msg) {
            toast.textContent = msg;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 2000);
        }

        function resetGame() {
            board = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(0));
            moveHistory = [];
            currentPlayer = 1;
            gameOver = false;
            lastMoveLabel.textContent = "마지막 수: 없음";
            drawBoard();
            updateUI();
        }

        function closeModal() {
            winModal.classList.add('hidden');
            resetGame();
        }

        window.onload = init;
    </script>
</body>
</html>
