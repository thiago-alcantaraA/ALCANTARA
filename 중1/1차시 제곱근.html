<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제곱근 정밀 시각화 시뮬레이터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f9fafb; }
        canvas { background-color: #f8fafc; cursor: crosshair; }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { opacity: 1; }
        /* 입력창 placeholder 크기 축소 */
        ::placeholder { font-size: 1rem; font-weight: normal; color: #fdba74; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 gap-4 py-4">

    <!-- 메인 컨테이너 -->
    <div class="bg-white p-6 md:p-8 rounded-2xl shadow-xl w-full max-w-5xl border border-gray-100 mb-2">
        <div class="flex items-center gap-3 mb-6">
            <div class="bg-blue-600 p-2 rounded-lg text-white">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/></svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">제곱근 단계별 정밀 추적</h1>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <!-- 왼쪽 제어판 -->
            <div class="lg:col-span-1 space-y-6">
                <div class="space-y-2">
                    <label class="block text-sm font-semibold text-gray-700">정사각형의 넓이 입력</label>
                    <div class="relative">
                        <input
                            type="number"
                            id="areaInput"
                            value="1"
                            step="0.1"
                            min="0.1"
                            max="100"
                            class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none transition-all text-xl font-bold"
                        />
                    </div>
                </div>

                <div class="bg-blue-50 p-6 rounded-2xl border border-blue-100 shadow-sm text-center">
                    <p class="text-[10px] font-bold text-blue-400 uppercase tracking-widest mb-2">현재 정밀도</p>
                    <div id="precisionDisplay" class="text-2xl font-mono font-black text-blue-700">
                        단위: 1.0
                    </div>
                    <p class="text-[10px] text-blue-500 mt-3 leading-tight italic">확대(+) 버튼을 누르면 소수점 단위가 세밀해집니다.</p>
                </div>

                <div class="py-4 space-y-4">
                    <div class="text-center">
                        <div class="text-gray-400 text-xs font-bold mb-1 uppercase tracking-widest">관계식</div>
                        <div class="text-2xl font-serif italic text-gray-700">
                            x² = <span id="formulaX" class="font-bold text-gray-900">1</span>
                        </div>
                    </div>
                </div>
                
                <button 
                    id="resetBtn"
                    class="flex items-center justify-center gap-2 w-full py-3 bg-gray-100 hover:bg-gray-200 transition-colors rounded-xl text-gray-700 text-sm font-semibold"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>
                    초기화
                </button>
            </div>

            <!-- 오른쪽 시각화 (캔버스) -->
            <div class="lg:col-span-3 bg-slate-50 rounded-2xl border-2 border-gray-200 overflow-hidden relative shadow-inner h-[450px]">
                <div class="absolute top-4 right-4 flex flex-col gap-2 z-10">
                    <button id="zoomIn" class="w-12 h-12 bg-blue-600 text-white rounded-full shadow-lg hover:bg-blue-700 font-bold flex items-center justify-center text-2xl transition-transform active:scale-90">+</button>
                    <button id="zoomOut" class="w-12 h-12 bg-white border-2 border-gray-200 text-gray-600 rounded-full shadow-lg hover:bg-gray-50 font-bold flex items-center justify-center text-2xl transition-transform active:scale-90">-</button>
                </div>
                <canvas id="mainCanvas" class="w-full h-full"></canvas>
            </div>
        </div>
    </div>

    <!-- 하단 부등호 비교 영역 -->
    <div class="bg-orange-50 p-6 rounded-2xl border border-orange-200 w-full max-w-5xl shadow-lg">
        <div class="flex flex-col md:flex-row items-center justify-center gap-6 md:gap-12">
            <!-- 계산기 1 -->
            <div class="flex-1 space-y-1 text-center w-full">
                <label class="text-[10px] font-bold text-orange-400 uppercase tracking-widest">값 1 (x₁)</label>
                <input type="text" id="manualInput1" placeholder="예: 0.9" class="w-full px-4 py-5 border-2 border-orange-200 rounded-xl text-center font-mono text-4xl font-black focus:outline-none focus:border-orange-500 shadow-sm transition-all">
                <div id="manualResult1" class="font-mono text-lg font-bold text-orange-700 bg-white/60 py-2 rounded-lg mt-2 border border-orange-100 overflow-hidden text-ellipsis whitespace-nowrap">0.000...</div>
            </div>

            <!-- 중앙 타겟 -->
            <div class="flex flex-col items-center gap-2">
                <div class="flex items-center justify-center gap-6">
                    <span id="inequalityLeft" class="text-5xl font-bold text-orange-300">?</span>
                    <div class="flex flex-col items-center">
                        <div class="text-[10px] text-orange-400 font-bold mb-1 uppercase tracking-widest">목표 넓이</div>
                        <div id="targetArea" class="text-5xl font-black text-orange-800 bg-white px-8 py-4 rounded-3xl border-4 border-orange-200 shadow-sm">1</div>
                    </div>
                    <span id="inequalityRight" class="text-5xl font-bold text-orange-300">?</span>
                </div>
            </div>

            <!-- 계산기 2 -->
            <div class="flex-1 space-y-1 text-center w-full">
                <label class="text-[10px] font-bold text-orange-400 uppercase tracking-widest">값 2 (x₂)</label>
                <input type="text" id="manualInput2" placeholder="예: 1.1" class="w-full px-4 py-5 border-2 border-orange-200 rounded-xl text-center font-mono text-4xl font-black focus:outline-none focus:border-orange-500 shadow-sm transition-all">
                <div id="manualResult2" class="font-mono text-lg font-bold text-orange-700 bg-white/60 py-2 rounded-lg mt-2 border border-orange-100 overflow-hidden text-ellipsis whitespace-nowrap">0.000...</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const areaInput = document.getElementById('areaInput');
        const precisionDisplay = document.getElementById('precisionDisplay');
        const formulaX = document.getElementById('formulaX');
        const targetAreaDisplay = document.getElementById('targetArea');
        const manualInput1 = document.getElementById('manualInput1');
        const manualInput2 = document.getElementById('manualInput2');
        const manualResult1 = document.getElementById('manualResult1');
        const manualResult2 = document.getElementById('manualResult2');
        const inequalityLeft = document.getElementById('inequalityLeft');
        const inequalityRight = document.getElementById('inequalityRight');
        const resetBtn = document.getElementById('resetBtn');
        const zoomInBtn = document.getElementById('zoomIn');
        const zoomOutBtn = document.getElementById('zoomOut');

        let area = 1;
        let zoomLevel = 0;

        function initCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            draw();
        }

        function getPrecisionStep() {
            return Math.pow(10, -Math.min(zoomLevel, 4));
        }

        function calculateValue(str) {
            str = str.trim();
            if (!str || isNaN(str)) return null;
            const num = parseFloat(str);
            const sq = num * num;
            // 결과값 표시 정밀도를 높임
            return { string: sq.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 10}), numeric: sq };
        }

        function updateManual() {
            const res1 = calculateValue(manualInput1.value);
            const res2 = calculateValue(manualInput2.value);
            
            if (res1) {
                manualResult1.textContent = res1.string;
                inequalityLeft.textContent = res1.numeric < area ? "<" : (res1.numeric > area ? ">" : "=");
                inequalityLeft.className = `text-5xl font-bold ${res1.numeric < area ? 'text-green-500' : 'text-red-500'}`;
            } else {
                manualResult1.textContent = "0.000...";
                inequalityLeft.textContent = "?";
                inequalityLeft.className = "text-5xl font-bold text-orange-300";
            }

            if (res2) {
                manualResult2.textContent = res2.string;
                inequalityRight.textContent = area < res2.numeric ? "<" : (area > res2.numeric ? ">" : "=");
                inequalityRight.className = `text-5xl font-bold ${area < res2.numeric ? 'text-green-500' : 'text-red-500'}`;
            } else {
                manualResult2.textContent = "0.000...";
                inequalityRight.textContent = "?";
                inequalityRight.className = "text-5xl font-bold text-orange-300";
            }
        }

        function draw() {
            const w = canvas.width;
            const h = canvas.height;
            const side = Math.sqrt(area);
            const step = getPrecisionStep();
            const displayZoom = Math.min(zoomLevel, 4);
            
            ctx.clearRect(0, 0, w, h);

            const pixelScale = 80 * Math.pow(10, zoomLevel);
            const originX = w / 3 - (side * pixelScale);
            const centerY = h - 45;

            precisionDisplay.textContent = `단위: ${step.toFixed(displayZoom)}`;
            formulaX.textContent = area;
            targetAreaDisplay.textContent = area;

            ctx.beginPath();
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 2;
            ctx.moveTo(0, centerY);
            ctx.lineTo(w, centerY);
            ctx.stroke();

            if (zoomLevel < 2) {
                ctx.save();
                ctx.setLineDash([5, 5]);
                ctx.strokeStyle = '#e2e8f0';
                [1, 4, 9, 16].forEach(ga => {
                    const gs = Math.sqrt(ga) * pixelScale;
                    ctx.strokeRect(originX, centerY - gs, gs, gs);
                    ctx.fillStyle = '#cbd5e1';
                    ctx.font = '10px sans-serif';
                    ctx.fillText(`넓이: ${ga}`, originX + 5, centerY - gs + 12);
                });
                ctx.restore();
            }

            const startVal = Math.floor((-originX) / (pixelScale * step)) * step;
            const endVal = Math.ceil((w - originX) / (pixelScale * step)) * step;

            for (let v = startVal; v <= endVal; v += step) {
                const x = originX + (v * pixelScale);
                if (x < 0 || x > w) continue;
                const isMajor = Math.abs(v % (step * 10)) < (step / 10) || zoomLevel === 0;
                ctx.beginPath();
                ctx.strokeStyle = isMajor ? '#475569' : '#f1f5f9';
                ctx.lineWidth = isMajor ? 2 : 1;
                ctx.moveTo(x, centerY);
                ctx.lineTo(x, centerY + (isMajor ? 10 : 5));
                ctx.stroke();
                if (isMajor || zoomLevel > 0) {
                    ctx.fillStyle = isMajor ? '#1e293b' : '#94a3b8';
                    ctx.font = isMajor ? 'bold 12px monospace' : '10px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText(v.toFixed(displayZoom), x, centerY + 24);
                }
            }

            const sqSize = side * pixelScale;
            ctx.save();
            ctx.fillStyle = 'rgba(37, 99, 235, 0.08)';
            ctx.fillRect(originX, centerY - sqSize, sqSize, sqSize);
            ctx.strokeStyle = '#2563eb';
            ctx.lineWidth = 2.5;
            ctx.strokeRect(originX, centerY - sqSize, sqSize, sqSize);
            ctx.beginPath();
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.moveTo(originX, centerY);
            ctx.lineTo(originX + sqSize, centerY);
            ctx.stroke();
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(originX + sqSize, centerY, 6, 0, Math.PI * 2);
            ctx.fill();
            if (sqSize > 30) {
                ctx.fillStyle = '#1e40af';
                ctx.font = 'bold 20px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(area, originX + sqSize / 2, centerY - sqSize / 2 + 8);
            }
            ctx.restore();
            updateManual();
        }

        zoomInBtn.addEventListener('click', () => { if (zoomLevel < 5) { zoomLevel++; draw(); } });
        zoomOutBtn.addEventListener('click', () => { if (zoomLevel > 0) { zoomLevel--; draw(); } });
        areaInput.addEventListener('input', (e) => { const v = parseFloat(e.target.value); if (!isNaN(v) && v > 0) { area = v; draw(); } });
        manualInput1.addEventListener('input', updateManual);
        manualInput2.addEventListener('input', updateManual);
        resetBtn.addEventListener('click', () => { area = 1; areaInput.value = 1; zoomLevel = 0; manualInput1.value = ''; manualInput2.value = ''; draw(); });
        window.addEventListener('resize', initCanvas);
        window.onload = initCanvas;
    </script>
</body>
</html>
